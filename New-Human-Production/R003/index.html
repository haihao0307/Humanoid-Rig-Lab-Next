<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>新人物全表面采样重建 R003</title>
<style>
:root{color-scheme:dark;--bg:#06080b;--panel:#0d1218;--line:#27313c;--muted:#8e9aa7;--text:#edf3f6;--accent:#8ec7b7;--warn:#d6b46c}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit;color:inherit}button{border:1px solid #35414d;background:#151c24;border-radius:7px;padding:7px 10px;cursor:pointer}button.active{border-color:var(--accent);background:#17312b}#app{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr)}header{display:flex;gap:9px;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:#0a0f14}h1{font-size:14px;margin:0 auto 0 0}h1 small{display:block;color:#74828d;font:9px ui-monospace,monospace;margin-top:2px}#status{font-size:10px;color:var(--warn);max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#status.ready{color:var(--accent)}#status.error{color:#ef9299}main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 35%,#1c252d 0,#0a0e13 46%,#05070a 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}aside{min-height:0;border-left:1px solid var(--line);background:var(--panel);overflow:auto}.section{padding:10px;border-bottom:1px solid var(--line)}.section h2{font-size:11px;margin:0 0 8px}.controls{display:flex;gap:6px;flex-wrap:wrap}.check{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:10px;color:#b8c2ca}.note{font-size:10px;line-height:1.55;color:#9daab4;border-left:2px solid var(--accent);padding-left:8px}.warn{border-left-color:var(--warn)}#metrics{white-space:pre-wrap;font:9px/1.55 ui-monospace,monospace;color:#9facb7}#drop{position:absolute;inset:14px;display:grid;place-items:center;border:2px dashed #5e756f;border-radius:16px;background:#07100de8;color:#bad8d0;text-align:center;padding:24px;z-index:5}#drop.hidden{display:none}#labels{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:space-around;pointer-events:none}#labels span{padding:5px 9px;border:1px solid #34414d;border-radius:99px;background:#071019d9;font:10px ui-monospace,monospace}.teacher{color:#9eb8ff}.replay{color:#8fe0bd}@media(max-width:850px){main{grid-template-columns:1fr}aside{position:absolute;right:0;top:54px;bottom:0;width:min(320px,90vw);z-index:8;transform:translateX(calc(100% - 42px));transition:.2s}aside:hover,aside:focus-within{transform:translateX(0)}}
</style>
</head>
<body>
<div id="app"><header><h1>新人物全表面采样重建 R003<small>TEACHER → SURFACE SCORE → INDEPENDENT REPLAY · SHORTS PRESERVED</small></h1><span id="status">等待原始 USDZ</span><button id="fullscreen">全屏</button></header><main><section id="stage"><canvas id="canvas"></canvas><div id="labels"><span class="teacher">老师原表面</span><span class="replay">采样重放</span></div><label id="drop"><span>正在查找同目录的 <b>source-original-preserved.usdz</b><br><br>文件尚未上传时，也可以把用户原始 USDZ 拖到这里，或点击选择。<br><br><input id="file" type="file" accept=".usd,.usda,.usdc,.usdz"></span></label></section><aside><div class="section"><h2>对照</h2><div class="controls"><button data-mode="pair" class="active">双栏</button><button data-mode="teacher">老师</button><button data-mode="replay">重放</button><button data-mode="overlap">重叠</button></div><div class="controls" style="margin-top:7px"><button data-view="front">正面</button><button data-view="back">背面</button><button data-view="left">左侧</button><button data-view="right">右侧</button><button data-view="perspective" class="active">透视</button></div><label class="check"><input id="wireframe" type="checkbox">重放线框</label><label class="check"><input id="points" type="checkbox">采样顶点</label><label class="check"><input id="grid" type="checkbox" checked>观察地面</label></div><div class="section"><h2>边界</h2><div class="note"><b>本轮保留短裤。</b> 人物不是用基础几何体拼装；重放读取老师模型的全部网格属性、索引、分组、形变属性和相对变换。</div><div class="note warn" style="margin-top:8px">这是信息不丢失基线，不是最终轻量函数谱。下一阶段才进入身体区域、中心线、截面和曲面参数化。</div></div><div class="section"><h2>数据</h2><div id="metrics">尚未载入。</div></div></aside></main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@r184/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@r184/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {USDLoader} from 'three/addons/loaders/USDLoader.js';
import {buildHumanSurfaceReplay,createSurfaceSamplePoints} from './surface-score.js';
const $=id=>document.getElementById(id),canvas=$('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e13);const camera=new THREE.PerspectiveCamera(32,1,.001,1000),controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=.1;controls.maxDistance=50;scene.add(new THREE.HemisphereLight(0xe8f2ff,0x332a22,2.5));const key=new THREE.DirectionalLight(0xffffff,4);key.position.set(4,6,5);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight(0x9fc4ff,1.7);fill.position.set(-4,2,3);scene.add(fill);const grid=new THREE.GridHelper(10,40,0x41515c,0x202a31);grid.material.opacity=.55;grid.material.transparent=true;scene.add(grid);
let teacher=null,replay=null,points=null,mode='pair',view='perspective',teacherBase=new THREE.Vector3(),replayBase=new THREE.Vector3(),gap=.5,score=null;const box=new THREE.Box3(),sphere=new THREE.Sphere();function status(text,state=''){$('status').textContent=text;$('status').className=state}function dispose(root){if(!root)return;scene.remove(root);root.traverse(o=>{o.geometry?.dispose?.();if(o.material){for(const m of(Array.isArray(o.material)?o.material:[o.material]))m.dispose?.()}})}function fitTeacher(root){root.updateMatrixWorld(true);box.setFromObject(root);const center=box.getCenter(new THREE.Vector3());root.position.sub(center);root.updateMatrixWorld(true);box.setFromObject(root);root.position.y-=box.min.y;root.updateMatrixWorld(true);box.setFromObject(root);return box.getSize(new THREE.Vector3())}function fitCamera(){box.makeEmpty();if(teacher?.visible)box.expandByObject(teacher);if(replay?.visible)box.expandByObject(replay);if(box.isEmpty())return;box.getBoundingSphere(sphere);const target=box.getCenter(new THREE.Vector3());target.y=box.min.y+(box.max.y-box.min.y)*.48;controls.target.copy(target);const d=Math.max(sphere.radius*2.9,.5),map={front:[0,0,d],back:[0,0,-d],left:[-d,0,0],right:[d,0,0],perspective:[d*.72,d*.24,d*.78]},v=map[view];camera.position.set(target.x+v[0],target.y+v[1],target.z+v[2]);camera.lookAt(target);camera.near=Math.max(sphere.radius/1200,.001);camera.far=Math.max(sphere.radius*120,100);camera.updateProjectionMatrix();controls.update()}function layout(){if(!teacher||!replay)return;teacher.position.copy(teacherBase);replay.position.copy(replayBase);teacher.visible=mode!=='replay';replay.visible=mode!=='teacher';$('labels').style.display=mode==='pair'?'flex':'none';if(mode==='pair'){teacher.position.x-=gap;replay.position.x+=gap}else if(mode==='overlap'){teacher.visible=replay.visible=true;replay.position.copy(teacher.position);replay.traverse(o=>{if(o.isMesh){for(const m of(Array.isArray(o.material)?o.material:[o.material])){m.transparent=true;m.opacity=.42;m.depthWrite=false}}})}else replay.traverse(o=>{if(o.isMesh){for(const m of(Array.isArray(o.material)?o.material:[o.material])){m.transparent=false;m.opacity=1;m.depthWrite=true}}});if(points){points.position.copy(replay.position);points.visible=$('points').checked&&replay.visible}fitCamera()}async function load(buffer,label){try{status('解析 '+label+'…');dispose(teacher);dispose(replay);dispose(points);const loader=new USDLoader();teacher=loader.parse(buffer);teacher.name='SourceTeacher';scene.add(teacher);const size=fitTeacher(teacher);teacherBase.copy(teacher.position);const built=buildHumanSurfaceReplay(teacher,{filename:label,shorts:'preserved'});replay=built.replay;score=built.score;replay.position.copy(teacher.position);replayBase.copy(replay.position);scene.add(replay);points=createSurfaceSamplePoints(replay);points.position.copy(replay.position);points.visible=false;scene.add(points);gap=Math.max(size.x*.72,.45);$('metrics').textContent=`网格：${score.meshes.length.toLocaleString()}\n顶点：${score.vertices.toLocaleString()}\n三角面：${Math.round(score.triangles).toLocaleString()}\n属性流：${score.attributeStreams.toLocaleString()}\n几何字节：${score.geometryBytes.toLocaleString()}\n材质对象：${score.materials}\n纹理对象：${score.textures}\n属性字节匹配：${score.geometryByteExact?'YES':'REVIEW'}\n数据哈希：${score.hashFNV32}\n短裤：保留\n人体基础几何体拼装：否`;layout();$('drop').classList.add('hidden');status('R003 全表面采样重放完成','ready')}catch(error){console.error(error);status(error.message||String(error),'error');$('drop').classList.remove('hidden')}}async function tryDefault(){try{const response=await fetch('./source-original-preserved.usdz',{cache:'no-store'});if(!response.ok)throw new Error('source not committed');await load(await response.arrayBuffer(),'source-original-preserved.usdz')}catch{status('请选择或拖入用户原始 USDZ')}}
$('file').onchange=async e=>{const file=e.target.files[0];if(file)await load(await file.arrayBuffer(),file.name)};for(const type of['dragenter','dragover'])document.addEventListener(type,e=>{e.preventDefault();$('drop').classList.remove('hidden')});document.addEventListener('drop',async e=>{e.preventDefault();const file=e.dataTransfer.files[0];if(file)await load(await file.arrayBuffer(),file.name)});document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===button));layout()});document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===button));fitCamera()});$('wireframe').onchange=e=>replay?.traverse(o=>{if(o.isMesh)for(const m of(Array.isArray(o.material)?o.material:[o.material]))m.wireframe=e.target.checked});$('points').onchange=e=>{if(points)points.visible=e.target.checked&&replay?.visible};$('grid').onchange=e=>grid.visible=e.target.checked;$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}resize();animate();tryDefault();
</script>
</body>
</html>
