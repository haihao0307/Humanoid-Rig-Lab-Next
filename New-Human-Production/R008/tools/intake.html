<!doctype html><html><head><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script><style>body{margin:0;background:#121920}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),scale=1.8/size.y;model.position.sub(center);model.scale.setScalar(scale);model.position.multiplyScalar(scale);model.position.y+=.9;

</script></body></html>
