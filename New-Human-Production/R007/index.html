</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script></head><body><aside><h1>新人物 · 参数生成</h1><small>R007 / 曲面函数 · 61 骨骼 · 原生动作</small><p>用新模型采集的参数生成三维表面。拖动旋转，滚轮缩放。</p><label>动作<select id="action"><option value="rest">参考姿势</option><option value="walk">行走</option><option value="run">奔跑</option><option value="jump">跳跃</option><option value="look_around">环顾</option></select></label><div class="row"><button id="pause">暂停</button><button id="front">正面</button><button id="side">侧面</button></div><label><input type="checkbox" id="bones"> 显示实际骨架</label><label><input type="checkbox" id="regions"> 查看骨骼组织分区</label><label>身高 <span id="heightValue">1.80 m</span><input type="range" id="height" min="1.5" max="2.1" step=".01" value="1.8"></label><label>表面采样密度<select id="density"><option value=".012">交互</option><option value=".006">精细</option><option value=".020">轻量</option></select></label><label>任务<input id="command" type="text" placeholder="例如：向前走、跑起来、跳一下"><button id="execute">执行</button></label><p id="status">正在解码参数并生成曲面…</p></aside><div id="badge">运行时生成几何 / 无 FBX、ZIP 和原始贴图</div><script type="module" src="./app.mjs"></script></body></html>
