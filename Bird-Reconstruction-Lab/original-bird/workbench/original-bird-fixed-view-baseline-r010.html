<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Original Bird R0.10｜固定视角基线与误差对照</title>
<style>
:root{color-scheme:dark;--panel:#10212a;--line:#31505f;--text:#edf5f8;--muted:#9fb2bb;--good:#73d9ae;--warn:#f0cd75;--bad:#ef9890;--accent:#83cef4;--studio:#d0d8dc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--studio);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{border:1px solid var(--line);background:#16303c;color:var(--text);border-radius:7px;padding:7px 9px}button:hover{border-color:#7ba6b9}button:disabled{opacity:.48}.app{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr) 30px}.top{display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid var(--line);background:#0d1d25}.top b{font-size:14px}.top small{color:var(--muted)}.tag{font-size:10px;border:1px solid #3f6576;border-radius:999px;padding:4px 8px;color:var(--good)}.main{min-height:0;display:grid;grid-template-columns:minmax(360px,44%) minmax(0,1fr)}.viewer-zone{position:relative;background:var(--studio);border-right:1px solid var(--line)}.viewer-zone iframe{width:100%;height:100%;border:0;display:block;background:var(--studio)}.viewer-label{position:absolute;left:11px;top:11px;z-index:3;padding:8px 10px;border:1px solid #426171;border-radius:8px;background:#0b1820dd;backdrop-filter:blur(6px);font-size:10px;line-height:1.45}.viewer-label b{display:block;color:#fff}.viewer-label span{color:#bad0da}.loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:var(--studio);color:#263741;font-size:12px;pointer-events:none}.ready .loading{display:none}.review{min-width:0;background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.controls{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center;flex-wrap:wrap}.controls .grow{flex:1}.controls label{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}.controls input[type=range]{width:110px;accent-color:var(--accent)}.cards{min-height:0;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid #345360;border-radius:10px;overflow:hidden;background:#0b1920}.card-head{display:flex;align-items:center;justify-content:space-between;padding:7px 8px;border-bottom:1px solid #294653;font-size:10px}.card-head b{color:#e4eef2}.card-head span{color:var(--muted)}.images{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#294653}.image-slot{position:relative;aspect-ratio:1;background:#d0d8dc;display:grid;place-items:center;overflow:hidden}.image-slot img{width:100%;height:100%;object-fit:contain;display:block}.placeholder{color:#34444d;font-size:10px;text-align:center;padding:10px}.badge{position:absolute;left:6px;top:6px;padding:3px 5px;border-radius:5px;background:#0b1820d9;color:#dbe8ed;font-size:9px}.metrics{padding:7px 8px;font-size:9px;line-height:1.5;color:var(--muted);min-height:58px}.metrics b{color:#dbe8ed}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px 8px}.card-actions button{font-size:9px;padding:5px}.foot{display:flex;align-items:center;gap:14px;padding:0 10px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);background:#0d1d25}.foot b{color:var(--good)}.fatal{display:none;position:fixed;inset:0;z-index:20;background:#081015;place-items:center;padding:24px}.fatal.show{display:grid}.fatal div{max-width:620px;padding:20px;border:1px solid #5e3939;border-radius:12px;background:#1c1111;color:#f3c6c0}@media(max-width:980px){.main{grid-template-columns:1fr;grid-template-rows:45% 55%}.viewer-zone{border-right:0;border-bottom:1px solid var(--line)}.cards{grid-template-columns:1fr}.tag{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><b>Original Bird R0.10</b><small>固定视角源基线与候选误差对照</small><span class="tag">1024×1024 · 明亮灰白 · 正面/侧面/顶部/三分之四 · 同镜头同背景</span></header>
<main class="main">
<section class="viewer-zone" id="viewerZone"><div class="viewer-label"><b>BIRD-REF-002｜源模型基线</b><span>高细节鸽类源模型 · HD · PBR · 明亮摄影棚</span></div><div class="loading" id="loading">正在载入源模型并准备四视角捕获…</div><iframe id="frame" title="BIRD-REF-002 fixed view baseline" allow="autoplay; fullscreen; xr-spatial-tracking" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads" allowfullscreen></iframe></section>
<section class="review">
<div class="controls"><button id="captureAll">捕获四视角</button><button id="export">导出基线 JSON</button><button id="downloadAll">下载四张源图</button><span class="grow"></span><label>前景阈值 <output id="thresholdO">24</output><input id="threshold" type="range" min="8" max="70" value="24" step="1"></label><label>候选图 <input id="candidateFiles" type="file" accept="image/png,image/jpeg" multiple></label><button id="clearCandidate">清除候选</button></div>
<div class="cards" id="cards"></div>
</section>
</main>
<footer class="foot"><b>● fixed-view baseline runtime</b><span id="readyState">viewer loading</span><span id="captureState">0/4 source views</span><span id="candidateState">0/4 candidate views</span><span id="errorState">comparison pending</span></footer>
</div>
<div class="fatal" id="fatal"><div><b>工作台启动失败</b><p id="fatalText"></p></div></div>
<script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
<script>
(()=>{'use strict';
const UID='821135a09d3f48909b977a416d99c93b',BG=[.72,.77,.79],CAPTURE=1024;
const VIEWS=[{id:'front',label:'正面'},{id:'side',label:'侧面'},{id:'top',label:'顶部'},{id:'three_quarter',label:'三分之四'}];
const state={api:null,defaultCamera:null,source:{},candidate:{},busy:false,threshold:24};
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function viewCamera(id){const c=state.defaultCamera,t=c.target.slice(),p=c.position.slice(),d=Math.max(.001,Math.hypot(p[0]-t[0],p[1]-t[1],p[2]-t[2]));let pos=p.slice();if(id==='front')pos=[t[0],t[1]-d,t[2]+d*.06];if(id==='side')pos=[t[0]+d,t[1],t[2]+d*.06];if(id==='top')pos=[t[0],t[1],t[2]+d];if(id==='three_quarter')pos=[t[0]+d*.66,t[1]-d*.66,t[2]+d*.34];return {position:pos,target:t,distance:d};}
function setCamera(cam){return new Promise(resolve=>state.api.setCameraLookAt(cam.position,cam.target,.25,()=>resolve()));}
function screenshot(){return new Promise((resolve,reject)=>state.api.getScreenShot(CAPTURE,CAPTURE,'image/png',(err,data)=>err?reject(err):resolve(data)));}
function imageData(url,size=512){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,size,size);resolve(x.getImageData(0,0,size,size));};im.onerror=reject;im.src=url;});}
function maskMetrics(data){const w=data.width,h=data.height,d=data.data,bg=BG.map(v=>v*255),thr=state.threshold;let minX=w,minY=h,maxX=-1,maxY=-1,count=0,sx=0,sy=0;const mask=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,delta=Math.hypot(d[i]-bg[0],d[i+1]-bg[1],d[i+2]-bg[2]);if(d[i+3]>20&&delta>thr){const k=y*w+x;mask[k]=1;count++;sx+=x;sy+=y;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}}if(!count)return {mask,w,h,bbox:null,coverage:0,centroid:null,aspect:null};const bw=maxX-minX+1,bh=maxY-minY+1;return {mask,w,h,bbox:[minX/w,minY/h,(maxX+1)/w,(maxY+1)/h],coverage:count/(w*h),centroid:[sx/count/w,sy/count/h],aspect:bw/bh};}
async function analyze(url){const data=await imageData(url);return maskMetrics(data);}
function compare(a,b){if(!a||!b||!a.mask||!b.mask)return null;const n=Math.min(a.mask.length,b.mask.length);let inter=0,union=0;for(let i=0;i<n;i++){if(a.mask[i]&&b.mask[i])inter++;if(a.mask[i]||b.mask[i])union++;}const bboxErr=a.bbox&&b.bbox?a.bbox.reduce((s,v,i)=>s+Math.abs(v-b.bbox[i]),0)/4:null;const centroidErr=a.centroid&&b.centroid?Math.hypot(a.centroid[0]-b.centroid[0],a.centroid[1]-b.centroid[1]):null;return {iou:union?inter/union:0,bboxMeanAbsError:bboxErr,centroidOffset:centroidErr,coverageError:Math.abs(a.coverage-b.coverage),aspectError:a.aspect!=null&&b.aspect!=null?Math.abs(a.aspect-b.aspect):null};}
function fmt(v,n=4){return v==null?'—':Number(v).toFixed(n);}
function render(){const html=VIEWS.map(v=>{const s=state.source[v.id],c=state.candidate[v.id],cmp=compare(s?.metrics,c?.metrics);return '<article class="card"><div class="card-head"><b>'+v.label+'</b><span>'+v.id+'</span></div><div class="images"><div class="image-slot">'+(s?'<img src="'+s.url+'" alt="source '+v.id+'">':'<div class="placeholder">等待源模型捕获</div>')+'<i class="badge">源模型</i></div><div class="image-slot">'+(c?'<img src="'+c.url+'" alt="candidate '+v.id+'">':'<div class="placeholder">候选图尚未加入<br>文件名包含 '+v.id+'</div>')+'<i class="badge">候选</i></div></div><div class="metrics"><b>源：</b> coverage '+fmt(s?.metrics.coverage)+' · aspect '+fmt(s?.metrics.aspect)+'<br><b>候选：</b> coverage '+fmt(c?.metrics.coverage)+' · aspect '+fmt(c?.metrics.aspect)+'<br><b>误差：</b> IoU '+fmt(cmp?.iou)+' · bbox '+fmt(cmp?.bboxMeanAbsError)+' · centroid '+fmt(cmp?.centroidOffset)+'</div><div class="card-actions"><button data-capture="'+v.id+'">重捕源图</button><button data-download="'+v.id+'" '+(s?'':'disabled')+'>下载源图</button></div></article>';}).join('');$('cards').innerHTML=html;document.querySelectorAll('[data-capture]').forEach(b=>b.onclick=()=>captureView(b.dataset.capture));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadView(b.dataset.download));const sn=Object.keys(state.source).length,cn=Object.keys(state.candidate).length;$('captureState').textContent=sn+'/4 source views';$('candidateState').textContent=cn+'/4 candidate views';const comparisons=VIEWS.map(v=>compare(state.source[v.id]?.metrics,state.candidate[v.id]?.metrics)).filter(Boolean);$('errorState').textContent=comparisons.length?comparisons.length+'/4 comparisons':'comparison pending';}
async function captureView(id){if(!state.api||!state.defaultCamera||state.busy)return;state.busy=true;$('readyState').textContent='capturing '+id;try{const cam=viewCamera(id);await setCamera(cam);await sleep(320);const url=await screenshot();const metrics=await analyze(url);state.source[id]={url,metrics,camera:cam,capturedAt:new Date().toISOString()};render();}catch(e){console.error(e);$('readyState').textContent='capture failed';}finally{state.busy=false;$('readyState').textContent='viewer ready';}}
async function captureAll(){for(const v of VIEWS)await captureView(v.id);}
function downloadData(name,url){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}
function downloadView(id){const x=state.source[id];if(x)downloadData('original-bird-source-'+id+'.png',x.url);}
async function downloadAll(){for(const v of VIEWS){downloadView(v.id);await sleep(180);}}
function exportJson(){const record={schema:'bird/fixed-view-source-baseline@0.0.10',date:new Date().toISOString(),source:'BIRD-REF-002',viewerUid:UID,capture:{width:CAPTURE,height:CAPTURE,background:BG,threshold:state.threshold},views:{},candidateComparisons:{}};for(const v of VIEWS){const s=state.source[v.id],c=state.candidate[v.id];record.views[v.id]=s?{capturedAt:s.capturedAt,camera:s.camera,metrics:{bbox:s.metrics.bbox,coverage:s.metrics.coverage,centroid:s.metrics.centroid,aspect:s.metrics.aspect}}:null;record.candidateComparisons[v.id]=compare(s?.metrics,c?.metrics);}const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);downloadData('original-bird-r010-fixed-view-baseline.json',url);setTimeout(()=>URL.revokeObjectURL(url),500);}
function identifyView(name,index){const n=name.toLowerCase();if(n.includes('three')||n.includes('quarter')||n.includes('34'))return 'three_quarter';if(n.includes('front')||n.includes('正面'))return 'front';if(n.includes('side')||n.includes('侧面'))return 'side';if(n.includes('top')||n.includes('顶部')||n.includes('俯视'))return 'top';return VIEWS[index]?.id||null;}
async function loadCandidates(files){const arr=Array.from(files).slice(0,4);for(let i=0;i<arr.length;i++){const id=identifyView(arr[i].name,i);if(!id)continue;const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(arr[i]);});state.candidate[id]={url,metrics:await analyze(url),fileName:arr[i].name};}render();}
function reanalyze(){Promise.all([...Object.entries(state.source).map(async([k,v])=>v.metrics=await analyze(v.url)),...Object.entries(state.candidate).map(async([k,v])=>v.metrics=await analyze(v.url))]).then(render);}
function init(){if(!window.Sketchfab){$('fatalText').textContent='Sketchfab Viewer API 未载入';$('fatal').classList.add('show');return;}const client=new Sketchfab('1.12.1',$('frame'));client.init(UID,{autostart:1,camera:0,animation_autoplay:0,dnt:1,preload:0,ui_theme:'dark',success(api){state.api=api;api.start();api.addEventListener('viewerready',()=>{$('viewerZone').classList.add('ready');$('readyState').textContent='viewer ready';api.pause(()=>{});if(api.setTextureQuality)api.setTextureQuality('hd',()=>{});if(api.setShadingStyle)api.setShadingStyle('pbr',{type:'lit'},()=>{});if(api.setBackground)api.setBackground({color:BG},()=>{});if(api.setFov)api.setFov(30,()=>{});api.getEnvironment((err,env)=>{if(!err&&env){env.exposure=.24;env.lightIntensity=1.22;env.rotation=.54;env.shadowEnabled=true;api.setEnvironment(env,()=>{});}});api.getCameraLookAt((err,c)=>{if(!err&&c){state.defaultCamera=clone(c);setTimeout(captureAll,400);}});});},error(){$('loading').textContent='源模型加载失败';}});}
$('captureAll').onclick=captureAll;$('export').onclick=exportJson;$('downloadAll').onclick=downloadAll;$('candidateFiles').onchange=e=>loadCandidates(e.target.files);$('clearCandidate').onclick=()=>{state.candidate={};$('candidateFiles').value='';render();};$('threshold').oninput=e=>{state.threshold=Number(e.target.value);$('thresholdO').textContent=state.threshold;reanalyze();};render();init();
})();
</script>
</body>
</html>
