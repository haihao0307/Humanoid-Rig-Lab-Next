<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="bird-runtime" content="single-entry-mobile-first">
<title>Original Bird R0.13.1｜自动动作基线入口</title>
<style>
:root{color-scheme:dark;--bg:#d0d8dc;--panel:#10212a;--line:#31505f;--text:#edf5f8;--muted:#9fb2bb;--good:#73d9ae;--warn:#f0cd75;--bad:#ef9890;--head:50px;--dock:58px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;touch-action:manipulation;border:1px solid var(--line);background:#16303c;color:var(--text);border-radius:10px;padding:8px 10px;min-height:44px}button.active{border-color:var(--good);color:var(--good);background:#12342c}.app{height:100dvh;display:grid;grid-template-rows:calc(var(--head) + env(safe-area-inset-top)) minmax(0,1fr) calc(var(--dock) + env(safe-area-inset-bottom))}.top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:end;gap:6px;padding:env(safe-area-inset-top) 8px 6px;background:#0d1d25;border-bottom:1px solid var(--line)}.top button{height:36px;min-height:36px;padding:0}.title{text-align:center;min-width:0}.title b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{display:block;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{position:relative;min-height:0;background:var(--bg)}.frame-wrap{position:absolute;inset:0;background:var(--bg)}.frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:#263741;font-size:12px;z-index:2;text-align:center;padding:24px}.frame-ready .loading{display:none}.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px 6px calc(5px + env(safe-area-inset-bottom));background:#0d1d25;border-top:1px solid var(--line)}.dock button{min-height:46px;padding:4px 2px;font-size:10px}.drawer{position:fixed;z-index:30;top:calc(var(--head) + env(safe-area-inset-top));bottom:calc(var(--dock) + env(safe-area-inset-bottom));width:min(88vw,380px);background:var(--panel);box-shadow:0 20px 55px #000a;overflow:auto;transition:transform .22s ease;padding:12px}.drawer.left{left:0;transform:translateX(-105%);border-right:1px solid var(--line)}.drawer.right{right:0;transform:translateX(105%);border-left:1px solid var(--line)}.drawer.show{transform:translateX(0)}.drawer-head{position:sticky;top:-12px;z-index:2;display:flex;align-items:center;justify-content:space-between;margin:-12px -12px 10px;padding:10px 12px;background:#0d1d25;border-bottom:1px solid var(--line)}.drawer-head b{font-size:13px}.drawer-head button{min-height:36px;height:36px}.backdrop{display:none;position:fixed;z-index:25;inset:calc(var(--head) + env(safe-area-inset-top)) 0 calc(var(--dock) + env(safe-area-inset-bottom));background:#0007}.backdrop.show{display:block}h3{font-size:11px;letter-spacing:.08em;margin:7px 0 9px}.stage-button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;width:100%;text-align:left;margin:7px 0;padding:10px}.stage-button i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#1c3a47;font-size:10px}.stage-button b{display:block;font-size:12px}.stage-button span{display:block;font-size:9px;color:var(--muted);margin-top:3px;line-height:1.35}.stage-button.deferred{border-color:#6d5c33}.stage-button.deferred i{background:#4d4023;color:var(--warn)}.stage-button.locked{opacity:.5}.status{padding:10px;border:1px solid #42616f;border-radius:9px;background:#0c1b22;color:var(--muted);font-size:10px;line-height:1.55}.status b{color:#fff}.gate{font-size:10px;color:var(--muted);margin:8px 0}.gate:before{content:"●";color:var(--bad);margin-right:6px}.gate.ok:before{color:var(--good)}.gate.warn:before{color:var(--warn)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.desktop-side{display:none}
@media(min-width:1000px){.app{grid-template-rows:58px minmax(0,1fr) 30px}.top{display:flex;padding:0 14px;align-items:center}.top button{display:none}.title{text-align:left}.title b{font-size:15px}.title small{font-size:10px}.dock{display:none}.main{display:grid;grid-template-columns:280px minmax(0,1fr) 285px}.desktop-side{display:block;position:relative;background:var(--panel);padding:12px;overflow:auto}.desktop-left{border-right:1px solid var(--line)}.desktop-right{border-left:1px solid var(--line)}.frame-wrap{position:relative}.drawer,.backdrop{display:none!important}.app:after{content:"● R0.13.1 automatic pigeon baseline · 40 source records · measured ≠ accepted";grid-row:3;padding:7px 10px;background:#0d1d25;border-top:1px solid var(--line);font-size:10px;color:var(--good)}}
</style>
</head>
<body>
<div class="app"><header class="top"><button id="menuTop">☰</button><div class="title"><b>Original Bird R0.13.1</b><small id="stageTitle">鸽类五组八相位自动基线｜手机模式</small></div><button id="infoTop">i</button></header>
<main class="main"><aside class="desktop-side desktop-left" id="desktopStages"></aside><section class="frame-wrap" id="wrap"><div class="loading" id="loading">正在打开鸽类自动动作基线；Viewer 就绪后自动采样 40 条记录…</div><iframe id="frame" title="Original Bird production stage" allow="autoplay; fullscreen; xr-spatial-tracking" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads" allowfullscreen></iframe></section><aside class="desktop-side desktop-right"><h3>当前状态</h3><div class="status" id="desktopStatus"><b>读取中</b></div><h3>本轮推进</h3><div class="gate ok">五语义组 × 八相位自动执行</div><div class="gate ok">循环闭合与相邻位移自动计算</div><div class="gate ok">报告持久化并支持 .kaopu 导出</div><div class="gate warn">Alpha 错位明日大屏处理</div><div class="gate warn">家麻雀是下一物种，不覆盖 R17</div></aside></main>
<nav class="dock"><button id="stagesBtn">阶段</button><button id="statusBtn">状态</button><button id="reloadBtn">重载</button><button id="openBtn">新窗</button><button id="autoBtn" class="active">自动</button></nav></div>
<div class="backdrop" id="backdrop"></div><aside class="drawer left" id="stageDrawer"><div class="drawer-head"><b>生产阶段</b><button data-close>完成</button></div><div id="mobileStages"></div><h3>操作</h3><div class="tools"><button id="drawerReload">重载当前</button><button id="drawerOpen">新窗口</button></div></aside><aside class="drawer right" id="statusDrawer"><div class="drawer-head"><b>当前状态</b><button data-close>完成</button></div><div class="status" id="mobileStatus"><b>读取中</b><br>正在读取 CURRENT_STATUS.json…</div><h3>边界</h3><div class="gate ok">自动测量完成不等于视觉验收</div><div class="gate ok">持续拍翼只升级为源证据候选</div><div class="gate warn">起飞、滑翔、着陆、步行继续阻断</div><div class="gate warn">Alpha 错位不在手机端继续修改</div></aside>
<script>
(()=>{'use strict';
const STAGES={measure:{order:1,name:'形体测量与动作采样',path:'original-bird-source-measure-r006.html'},semantic:{order:2,name:'源节点语义映射',path:'original-bird-semantic-map-r007.html'},material:{order:3,name:'材质角色校准',path:'original-bird-material-audit-r008.html'},baseline:{order:4,name:'固定视角基线与误差',path:'original-bird-fixed-view-baseline-r010.html'},alpha:{order:5,name:'羽毛 Alpha（明日大屏）',path:'original-bird-feather-alpha-r0122.html',mobilePath:'original-bird-feather-alpha-mobile-r0123.html',deferred:true},motion:{order:6,name:'鸽类动作手动审查',path:'original-bird-pigeon-motion-r013.html'},auto:{order:7,name:'鸽类自动动作基线',path:'original-bird-pigeon-motion-auto-r0131.html'},quality:{order:8,name:'3A 游戏资产质量门',path:'original-bird-3a-quality-gate-r011.html'}};
const $=id=>document.getElementById(id),mobile=matchMedia('(max-width:999px)');let active='auto';
function desc(k){return {measure:'双点测量、归一化动作相位',semantic:'节点、矩阵、候选控制器',material:'羽毛、眼、喙、足部分开',baseline:'四视角截图和轮廓误差',alpha:'只处理翅尖、后缘和翼底羽毛尾端；暂缓',motion:'手动分组采样与 .kaopu 导出',auto:'五组 × 八相位，自动 40 条记录与循环闭合',quality:'形体、羽层、材质、变形、动作、性能'}[k]||''}
function stageHtml(){return Object.entries(STAGES).map(([k,s])=>'<button class="stage-button '+(k===active?'active ':'')+(s.deferred?'deferred':'')+'" data-stage="'+k+'"><i>'+s.order+'</i><span><b>'+s.name+'</b><span>'+desc(k)+'</span></span></button>').join('')+'<button class="stage-button locked" disabled><i>9</i><span><b>独立 Original Bird</b><span>许可安全连续表面、羽层、绑定和动作</span></span></button>'}
function renderStages(){$('mobileStages').innerHTML=stageHtml();$('desktopStages').innerHTML='<h3>生产阶段</h3>'+stageHtml();document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>setStage(b.dataset.stage))}function resolvePath(k){const s=STAGES[k];return mobile.matches&&s.mobilePath?s.mobilePath:s.path}
function setStage(k){if(!STAGES[k])return;active=k;renderStages();$('wrap').classList.remove('frame-ready');$('loading').textContent='正在打开'+STAGES[k].name+'…';$('frame').src=resolvePath(k);$('stageTitle').textContent=STAGES[k].name+(mobile.matches?'｜手机模式':'');$('autoBtn').classList.toggle('active',k==='auto');try{localStorage.setItem('original-bird-r0131-stage',k)}catch(e){}closeDrawers()}
function openDrawer(id){closeDrawers();$(id).classList.add('show');$('backdrop').classList.add('show')}function closeDrawers(){document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('show'));$('backdrop').classList.remove('show')}function reload(){setStage(active)}function openNew(){window.open(resolvePath(active),'_blank','noopener')}
function loadStatus(){fetch('../CURRENT_STATUS.json',{cache:'no-store'}).then(r=>r.json()).then(s=>{const html='<b>'+String(s.revision||'UNKNOWN')+'</b><br>自动工作台：'+Boolean(s.pigeonMotionAutorun?.generated)+'<br>自动运行门：'+Boolean(s.openGates?.pigeonAutoFortyRecordsCaptured)+'<br>鸽类视觉验收：'+Boolean(s.openGates?.pigeonMotionVisualAcceptance)+'<br>Alpha：'+String(s.alphaIssue?.status||'unknown')+'<br>下一物种：'+String(s.nextSpecies?.commonNameZh||'unknown')+'<br>生产就绪：'+Boolean(s.openGates?.productionReady);$('mobileStatus').innerHTML=html;$('desktopStatus').innerHTML=html}).catch(e=>{$('mobileStatus').innerHTML='<b>状态读取失败</b><br>'+e.message;$('desktopStatus').innerHTML='<b>状态读取失败</b>'})}
$('frame').addEventListener('load',()=>$('wrap').classList.add('frame-ready'));$('menuTop').onclick=()=>openDrawer('stageDrawer');$('infoTop').onclick=()=>openDrawer('statusDrawer');$('stagesBtn').onclick=()=>openDrawer('stageDrawer');$('statusBtn').onclick=()=>openDrawer('statusDrawer');$('reloadBtn').onclick=reload;$('openBtn').onclick=openNew;$('autoBtn').onclick=()=>setStage('auto');$('drawerReload').onclick=reload;$('drawerOpen').onclick=openNew;$('backdrop').onclick=closeDrawers;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawers);mobile.addEventListener&&mobile.addEventListener('change',()=>setStage(active));try{const saved=localStorage.getItem('original-bird-r0131-stage');if(STAGES[saved])active=saved}catch(e){}renderStages();setStage(active);loadStatus();
})();
</script></body></html>
