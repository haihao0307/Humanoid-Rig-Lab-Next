<dialog id="rehearsal-dialog" aria-labelledby="rehearsal-title">
 <header class="rehearsal-header"><h2 id="rehearsal-title">排练台</h2><span id="rehearsal-clock">0.0 s</span><button class="quiet" id="rehearsal-close">返回工作台 ×</button></header>
 <div class="rehearsal-body"><div class="rehearsal-scene"><div id="rehearsal-viewport"></div><div class="rehearsal-toolbar"><button id="rehearsal-play">▶ 播放</button><button id="rehearsal-reset">复位</button><button id="rehearsal-fit">查看全体</button><span>拖动旋转 · 滚轮缩放 · 右键平移</span></div></div>
 <aside class="rehearsal-panel"><section class="section"><h3>参演对象</h3><div class="rehearsal-add-row"><select id="rehearsal-animal" aria-label="选择参演动物"></select><button id="rehearsal-add">＋ 放入</button></div><div id="rehearsal-actors"></div><p id="rehearsal-status" role="status">选择目录中的任意动物，可多次放入。读取当前参数下的形态。</p></section>
 <section class="section" id="rehearsal-controls" hidden><h3>位置与编排</h3>
 <div class="field"><label for="actor-x">左右 <output id="actor-x-value"></output></label><input id="actor-x" type="range" min="-12" max="12" step="0.1"></div>
 <div class="field"><label for="actor-z">前后 <output id="actor-z-value"></output></label><input id="actor-z" type="range" min="-12" max="12" step="0.1"></div>
 <div class="field"><label for="actor-y">高度 <output id="actor-y-value"></output></label><input id="actor-y" type="range" min="0" max="8" step="0.1"></div>
 <div class="field"><label for="actor-scale">展示大小 <output id="actor-scale-value"></output></label><input id="actor-scale" type="range" min="0.1" max="5" step="0.05"></div>
 <div class="field"><label for="actor-yaw">朝向偏角 <output id="actor-yaw-value"></output></label><input id="actor-yaw" type="range" min="-180" max="180" step="1"></div>
 <div class="field"><label for="actor-mode">演示关系</label><select id="actor-mode"><option value="still">静置</option><option value="face">朝向对象</option><option value="approach">接近对象</option><option value="follow">跟随对象</option><option value="avoid">避让对象</option><option value="orbit">围绕对象</option></select></div>
 <div class="field"><label for="actor-target">关系对象</label><select id="actor-target"></select></div>
 <div class="field"><label for="actor-speed">编排速度 <output id="actor-speed-value"></output></label><input id="actor-speed" type="range" min="0" max="3" step="0.05"></div>
 <button id="rehearsal-remove" class="remove-import">移出排练台</button></section>
 <details class="section"><summary>展示与光线</summary><div class="field"><label for="rehearsal-light-ambient">环境光</label><input id="rehearsal-light-ambient" type="range" min="0" max="3" step="0.05" value="1.3"></div><div class="field"><label for="rehearsal-light-key">主光</label><input id="rehearsal-light-key" type="range" min="0" max="5" step="0.1" value="3"></div><div class="field"><label for="rehearsal-light-exposure">曝光</label><input id="rehearsal-light-exposure" type="range" min="0.2" max="2" step="0.05" value="1.05"></div><div class="field"><label for="rehearsal-light-angle">光线方向</label><input id="rehearsal-light-angle" type="range" min="-180" max="180" step="1" value="35"></div><div class="field colorfield"><label for="rehearsal-light-background">背景颜色</label><input id="rehearsal-light-background" type="color" value="#15252d"></div></details>
 <details class="section" open><summary>关系观察</summary><div id="rehearsal-relations"></div><p class="hint">展示大小未做真实体长标定。关系是人工编排，重叠提示是粗略包围范围，不代表接触或生态结论。当前为烘焙姿态的整体运动；原有骨骼动作在单动物工作台演示。</p></details>
 <section class="section"><div class="rehearsal-add-row"><button id="rehearsal-load">导入排练谱</button><input type="file" accept=".json" id="rehearsal-file" hidden><select id="rehearsal-format" aria-label="排练导出格式"><option value="html">独立演示 HTML</option><option value="json">完整排练谱 JSON</option></select></div><button id="rehearsal-export" class="export-button">↓ 导出排练</button><p class="hint">包含烘焙形态、当前编排与光线。排练谱可再次导入；独立页面可直接放入其他网站。</p></section></aside></div>
</dialog>
