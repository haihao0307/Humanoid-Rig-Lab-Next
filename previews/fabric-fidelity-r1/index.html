<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fabric Lab · 材质保真与风碰撞 R1</title><style>body{margin:0;background:#151c20;color:#dfe9e5;font:16px/1.8 system-ui}main{max-width:680px;margin:16vh auto;padding:30px}small{color:#a5b6ad}progress{width:100%;accent-color:#bad4bd}</style><main><h1>Fabric Lab · 材质保真与风碰撞</h1><p id="status">正在加载固定版本的布料工作台…</p><progress id="progress" max="18" value="0"></progress><p><small>原麻布 / 腈纶保留。Adobe 原版材质尚未接入；本页不宣称 Adobe 一比一复现。导入贴图仅在本机使用。</small></p></main><script>(async()=>{try{let done=0;const parts=await Promise.all(Array.from({length:18},async(_,i)=>{let response=await fetch(new URL('chunks/'+String(i).padStart(2,'0')+'.b64',location.href));if(!response.ok)throw Error('文件加载失败 '+i+' / HTTP '+response.status);let s=await response.text();document.getElementById('progress').value=++done;return s.trim()}));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const data=await new Response(stream).arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),b=>b.toString(16).padStart(2,'0')).join('');if(hash!=='6c700e5fd7bd659380b17b06e370b42d536e54abfb6387fc5ea2ebecae7f2fb6')throw Error('版本完整性校验失败');const html=new TextDecoder().decode(data);document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='加载未完成：'+e.message+'。请使用支持 WebGL2 的近期桌面浏览器。';console.error(e)}})();</script></html>
