<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Human Core V5 · Procedural Deform</title>
  <link rel="stylesheet" href="./apps/human-core-v5-procedural-deform/styles.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}
  </script>
</head>
<body>
  <header><div><b>Human Core V5</b><span>Procedural Deform QA · code complete / browser acceptance pending</span></div><a href="./index.html">返回项目</a></header>
  <main>
    <aside class="panel left-panel">
      <h1>BodyDNA</h1><p>程序化规范体场，不依赖人体 GLB。</p>
      <section><h2>预设</h2><div id="preset-list" class="button-grid"></div></section>
      <section id="dna-controls"></section>
      <section><h2>显示</h2><div id="display-list" class="button-grid"></div></section>
      <section><h2>压力姿势</h2><div id="pose-list" class="button-grid"></div></section>
    </aside>
    <section class="viewport-shell">
      <div id="viewport"></div>
      <div id="loading" class="loading">正在生成规范人体表面…</div>
      <div class="camera-bar" id="camera-list"></div>
    </section>
    <aside class="panel diagnostics-panel">
      <h1>实时诊断</h1>
      <div class="overlay-legend" aria-label="Rig overlay legend">
        <span><i class="legend-rig"></i>独立 SimulationRig FK</span>
        <span><i class="legend-anchor"></i>Procedural Region Anchor</span>
      </div>
      <div id="rig-surface-gate" class="gate pending" data-qa-gate="rig-surface">等待运行时数据</div>
      <dl id="diagnostics"></dl>
      <section class="qa-section">
        <h2>验收操作</h2>
        <div id="qa-actions" class="qa-actions">
          <button type="button" data-qa-action="run-full-qa">Run Full QA</button>
          <button type="button" data-qa-action="capture-current-view">Capture Current View</button>
          <button type="button" data-qa-action="mark-pass">Mark Pass</button>
          <button type="button" data-qa-action="mark-fail">Mark Fail</button>
          <button type="button" data-qa-action="export-qa-json">Export QA JSON</button>
        </div>
        <p id="qa-output" class="qa-output" data-status="pending">尚未执行浏览器视觉验收。</p>
      </section>
      <p class="warning">本页提供可复现的浏览器验收入口，但当前正式标志固定为 visualAcceptance=false、productionReady=false。</p>
    </aside>
  </main>
  <script type="module" src="./apps/human-core-v5-procedural-deform/index.js"></script>
</body>
</html>
