 float height=fine*(warp*.0055+fill*.0030)+twill*.0035;vec3 N=normalize(vNormal);vec3 dpdx=dFdx(vWorld),dpdy=dFdy(vWorld);float hx=dFdx(height),hy=dFdy(height);vec3 r1=cross(dpdy,N),r2=cross(N,dpdx);float det=dot(dpdx,r1);vec3 grad=sign(det)*(hx*r1+hy*r2);N=normalize(abs(det)*N-grad*.18);
