<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAOPU EB1 · 统一布光校准台</title><style>*{box-sizing:border-box}body{margin:0;background:#11171b;color:#edf0f1;font:14px/1.6 system-ui}header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #44515c;background:#161e24}header b{letter-spacing:3px}header small{color:#aebdc8}main{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 60px)}aside{padding:24px;background:#1b242c;overflow:auto;border-right:1px solid #44515c}h1{font-size:27px;font-weight:500;line-height:1.35;margin:0 0 20px}p{color:#b8c5d0}button,select{font:inherit;color:inherit;background:#2c3a45;border:1px solid #748897;border-radius:5px;padding:7px 9px;cursor:pointer}button{margin:3px}#view{position:relative;min-width:0}canvas{width:100%;height:100%;display:block;touch-action:none}#caption{position:absolute;bottom:22px;left:24px;color:#d5e0e8;background:#111a22bb;padding:8px 13px;border-radius:4px;pointer-events:none}#error{position:absolute;left:20%;top:35%;max-width:60%;white-space:pre-wrap;background:#482c2c;padding:20px}#badge{font-size:11px;color:#aabdca;margin-top:22px}a{color:#c8d9e8}hr{border:0;border-top:1px solid #455563;margin:25px 0}@media(max-width:700px){header{padding:0 12px}header small{display:none}main{grid-template-columns:1fr;grid-template-rows:160px 1fr}aside{padding:12px;display:flex;gap:15px;border-bottom:1px solid #44515c}h1{font-size:20px;min-width:130px}aside .about{display:none}#badge{margin:0}#caption{font-size:11px;left:10px;bottom:8px}#eb1-panel{top:64px!important}}</style><header><b>KAOPU / EB1</b><small>统一照明 · 自有程序化摄影棚 · 保留材料本性</small></header><main><aside><section><h1>一套布光，<br>看清材料。</h1><p>先调光，再判断表面。<br>右上角展开 EB1 参数面板。</p><button id="reset-view">恢复视角</button><button id="rotation">自动转台</button></section><section class="about"><hr><p>白色主光与暖色轮廓光，结合程序化高动态环境照明和中性色调映射。</p><p>拖动旋转，滚 import * as T from './three.mjs';
const errors=[];function fail(e){errors.push(String(e.stack||e));const el=document.getElementById('error');el.hidden=false;el.textContent=errors.at(-1);}addEventListener('error',e=>fail(e.error||e.message));addEventListener('unhandledrejection',e=>fail(e.reason));
try{
const host=document.getElementById('view'),renderer=new T.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(34,1,.01,50),stage=new T.Group();scene.add(stage);let dirty=true,turning=false,az=.38,el=.27,distance=5.8,serial=0;
const floor=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:0x343a3f,roughness:.93}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;floor.receiveShadow=true;scene.add(floor);

for(let i=0;i<4;i++){const m=new T.MeshPhysicalMaterial({color:i===3?0xd0d0d0:0x935f41,metalness:i===3?1:0,roughness:[.18,.38,.75,.12][i]});const sp=new T.Mesh(new T.SphereGeometry(.245,48,32),m);sp.position.set(.85,.26+i*.53,.17);sp.castShadow=true;sp.receiveShadow=true;stage.add(sp);}
const gray=new T.Mesh(new T.BoxGeometry(.65,.055,.48),new T.MeshStandardMaterial({color:new T.Color(.18,.18,.18),roughness:1}));gray.position.set(-.54,.015,.61);gray.receiveShadow=true;stage.add(gray);

const resize=()=>{renderer.setSize(host.clientWidth,host.clientHeight,false);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();dirty=true;};new ResizeObserver(resize).observe(host);resize();

globalThis.EB1_LAB={renderer,scene,store,eb1,ready:true,audit:()=>({serial,errors:[...errors],...eb1.audit(),triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures}),render:()=>{dirty=true;}};draw();
