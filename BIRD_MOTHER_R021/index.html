<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bird Mother R0.21｜Seagull Workbench</title>
  <style>
    html,body{height:100%;margin:0;background:#0c1114;color:#e8f0f1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:720px;border:1px solid #3b4d55;background:#121a1e;padding:24px;border-radius:12px;box-shadow:0 14px 48px #0008}
    h1{font-size:22px;margin:0 0 12px}.bar{height:6px;background:#27343a;border-radius:9px;overflow:hidden}.bar i{display:block;width:18%;height:100%;background:#d7e4e5;animation:p 1.1s ease-in-out infinite alternate}
    p{line-height:1.65;color:#b9c8cc}pre{white-space:pre-wrap;color:#ffb7aa}
    @keyframes p{to{transform:translateX(455%)}}
  </style>
</head>
<body><main><section class="card"><h1>Bird Mother R0.21 · 海鸥工作台</h1><div class="bar"><i></i></div><p id="status">正在校验并展开单文件工作台……</p><pre id="error" hidden></pre></section></main>
<script>
(async()=>{
  const status=document.getElementById('status'), error=document.getElementById('error');
  try{
    if(!('DecompressionStream' in window)) throw new Error('当前浏览器不支持 DecompressionStream，请使用新版 Chrome 或 Edge。');
    let b64='';
    for(let i=0;i<9;i++){
      status.textContent=`正在读取工作台数据 ${i+1}/9……`;
      const r=await fetch(`parts/part-${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});
      if(!r.ok) throw new Error(`工作台数据缺失：part-${String(i).padStart(2,'0')}.txt (${r.status})`);
      b64+=await r.text();
    }
    const raw=atob(b64.trim()), bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(v=>v.toString(16).padStart(2,'0')).join('');
    const expected='c0765667e1701d0d9a8021f49de8626fb12fd09bfdc480cb6067a7c805dcfeff';
    if(digest!==expected) throw new Error(`工作台数据校验失败。\nexpected ${expected}\nreceived ${digest}`);
    status.textContent='校验通过，正在启动 WebGL 工作台……';
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){status.textContent='工作台启动失败';error.hidden=false;error.textContent=e&&e.stack?e.stack:String(e);}
})();
</script></body></html>
