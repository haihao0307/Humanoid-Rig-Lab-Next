<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoe R11 Human Foot Fit Preview</title><style>body{font-family:system-ui;margin:0;padding:32px;background:#111;color:#eee}button{padding:8px;margin:4px}</style></head><body><h1>Shoe R11 Human Foot Fit Preview</h1><p>Human Foot Fit validation scene.</p><p id="state">Loading adapter...</p><div><button>Standard Foot</button><button>Wide Foot</button><button>High Instep</button></div><script type="module">
import {createFootProfile,solveShoeFit} from '../src/HumanFitAdapter.mjs';
const profiles=['standard','wide','highInstep'];
const state=document.querySelector('#state');

</script></body></html>
