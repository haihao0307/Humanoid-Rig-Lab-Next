<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HRL-M04 程序化服装实验室 V0.1.0</title>
<style>
:root{color-scheme:dark;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#060910;color:#eaf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 65% 20%,#16263e 0,#090d15 44%,#05070b 100%)}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 22px;border-bottom:1px solid #243249;background:#090e17e8;position:sticky;top:0;z-index:3}h1{font-size:17px;margin:0;letter-spacing:.02em}.sub{font-size:11px;color:#8fa5c2;margin-top:4px}.badge{font-size:11px;color:#87e8be;border:1px solid #25664d;background:#0b2c22;padding:6px 9px;border-radius:999px}.layout{display:grid;grid-template-columns:286px minmax(0,1fr) 260px;gap:12px;padding:12px;min-height:calc(100vh - 76px)}.panel,.viewport{border:1px solid #26344a;background:#0b111ced;border-radius:14px;overflow:hidden}.panel{padding:15px}.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#8ba3c3;margin:0 0 14px}.control{margin:0 0 13px}.row{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:5px}.row output{color:#81c7ff;font-variant-numeric:tabular-nums}input[type=range],select{width:100%;accent-color:#58aef6}select,button{border:1px solid #31445f;background:#111c2c;color:#eaf2ff;border-radius:8px;padding:8px}button{cursor:pointer}.viewport{position:relative;min-height:620px}canvas{display:block;width:100%;height:100%;min-height:620px;touch-action:none}.tools{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px}.tools button{font-size:11px;padding:7px 9px;background:#08111edb}.status{position:absolute;left:12px;bottom:12px;padding:8px 10px;border:1px solid #2b425f;background:#07111dde;border-radius:9px;font-size:11px;color:#9cc9ed}.stats{display:grid;gap:8px}.stat{padding:10px;border:1px solid #263850;border-radius:9px;background:#0b1624}.stat label{display:block;font-size:10px;color:#7890ae;margin-bottom:4px}.stat strong{font-size:14px;font-variant-numeric:tabular-nums}.hash{word-break:break-all;color:#84d9b2}.action{width:100%;margin-top:9px}.note{font-size:11px;line-height:1.6;color:#91a2b8;margin-top:13px}@media(max-width:900px){header{position:static}.layout{grid-template-columns:1fr}.viewport{order:-1;min-height:430px}canvas{min-height:430px}.panel{padding:13px}}@media(max-width:440px){header{padding:14px}.layout{padding:8px;gap:8px}.viewport,canvas{min-height:390px}}
</style>
</head>
<body>
<header><div><h1>HRL-M04 程序化服装实验室</h1><div class="sub">GarmentDNA · PatternGraph · MaterialDNA · HRLG Binary</div></div><div class="badge">V0.1.0 FOUNDATION</div></header>
<main class="layout">
<section class="panel"><h2>人物与衣版</h2>
<div class="control"><div class="row"><span>身高</span><output id="heightOut"></output></div><input id="height" type="range" min="1.45" max="2.05" step="0.01" value="1.72"></div>
<div class="control"><div class="row"><span>肩宽</span><output id="shoulderOut"></output></div><input id="shoulder" type="range" min="0.32" max="0.58" step="0.005" value="0.405"></div>
<div class="control"><div class="row"><span>胸围</span><output id="chestOut"></output></div><input id="chest" type="range" min="0.72" max="1.28" step="0.01" value="0.91"></div>
<div class="control"><div class="row"><span>腰围</span><output id="waistOut"></output></div><input id="waist" type="range" min="0.58" max="1.18" step="0.01" value="0.76"></div>
<div class="control"><div class="row"><span>衣长比例</span><output id="lengthOut"></output></div><input id="length" type="range" min="0.25" max="0.40" step="0.005" value="0.315"></div>
<div class="control"><div class="row"><span>袖长比例</span><output id="sleeveOut"></output></div><input id="sleeve" type="range" min="0.08" max="0.25" step="0.005" value="0.145"></div>
<div class="control"><div class="row"><span>版型</span></div><select id="fit"><option value="close">贴身</option><option value="regular" selected>常规</option><option value="relaxed">宽松</option></select></div>
<div class="control"><div class="row"><span>函数材质</span></div><select id="material"><option value="cotton_jersey">棉针织</option><option value="wool_twill">羊毛斜纹</option><option value="silk_satin">丝绸缎面</option></select></div>
</section>
<section class="viewport"><canvas id="canvas"></canvas><div class="tools"><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button id="rotate">停止旋转</button><button id="wire">显示线框</button></div><div class="status" id="statusText">初始化</div></section>
<section class="panel"><h2>编译结果</h2><div class="stats">
<div class="stat"><label>人物比例 revision</label><strong id="revisionStat">0</strong></div><div class="stat"><label>顶点 / 三角形</label><strong><span id="vertexStat">0</span> / <span id="triangleStat">0</span></strong></div><div class="stat"><label>缝合配对</label><strong id="seamStat">0</strong></div><div class="stat"><label>HRLG 二进制</label><strong id="binaryStat">0 KB</strong></div><div class="stat"><label>拓扑签名</label><strong class="hash" id="topologyStat"></strong></div><div class="stat"><label>内容哈希</label><strong class="hash" id="hashStat"></strong></div></div>
<button class="action" id="downloadBinary">导出 HRLG</button><button class="action" id="downloadDNA">导出 GarmentDNA</button><p class="note">调节人物与衣版参数会重新编译同一件标准圆领上衣。人物比例发生变化时，拓扑签名保持稳定，尺寸与内容哈希同步更新。</p></section>
</main>
<script type="module" src="./apps/procedural-clothing-lab/main.js"></script>
</body></html>
