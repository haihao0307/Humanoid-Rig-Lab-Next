name: Face eye integration R5 candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-eye-integration-r5-candidate.yml

permissions:
  contents: read

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply compact lid and orbit candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          replace('body/EyeAnatomy.js',
          """const COMPACT_EYE_ANATOMY={revision:'r12-neutral-fissure-orbital-continuity',recess:.0002,blinkRetractionM:.0010,segments:96,rings:24,
            fissure:{halfWidth:.0128,upperHeight:.00415,lowerHeight:.00315,lateralCanthusLift:.00070,upperTemporalBias:.08,lowerTemporalBias:.04,verticalRoundness:.16,lowerSulcusM:.00030},
            left:{centre:[.029181616,1.518095373,.152055491],radius:.012623681},
            right:{centre:[-.030466569,1.518094244,.151979130],radius:.012591195}};
          function compactEyeNeutralFissure(angle,side){
          """,
          """const COMPACT_EYE_ANATOMY={revision:'r13-compact-lid-orbit-blend',recess:.0002,blinkRetractionM:.0010,segments:96,rings:24,
            fissure:{halfWidth:.0126,upperHeight:.00405,lowerHeight:.00305,lateralCanthusLift:.00070,upperTemporalBias:.08,lowerTemporalBias:.04,verticalRoundness:.26,upperFoldM:.00042,lowerSulcusM:.00018},
            outerBand:{canthus:.00220,upper:.00335,lower:.00265,marginRadial:.022,marginOffset:.000045},
            left:{centre:[.029181616,1.518095373,.152055491],radius:.012623681},
            right:{centre:[-.030466569,1.518094244,.151979130],radius:.012591195}};
          function compactEyeOuterOverlap(angle){
            const p=COMPACT_EYE_ANATOMY.outerBand,s=Math.sin(angle),vertical=Math.abs(s),pole=s>=0?p.upper:p.lower;
            return p.canthus+(pole-p.canthus)*vertical*vertical;
          }
          function compactEyeNeutralFissure(angle,side){
          """,'eye anatomy header')

          replace('body/EyeAnatomy.js',
          """  const p=COMPACT_EYE_ANATOMY.fissure,envelope=16*t2*(1-t)*(1-t),upperFold=-.00065*Math.max(0,s)*Math.exp(-(((t-.58)/.12)**2))*envelope*(1-state[2])**2;
            const lowerSulcus=-p.lowerSulcusM*Math.max(0,-s)*Math.exp(-(((t-.58)/.17)**2))*envelope*(1-.55*state[2]),fold=upperFold+lowerSulcus;
          """,
          """  const p=COMPACT_EYE_ANATOMY.fissure,envelope=16*t2*(1-t)*(1-t),upperFold=-p.upperFoldM*Math.max(0,s)*Math.exp(-(((t-.58)/.12)**2))*envelope*(1-state[2])**2;
            const lowerSulcus=-p.lowerSulcusM*Math.max(0,-s)*Math.exp(-(((t-.58)/.17)**2))*envelope*(1-.55*state[2]),fold=upperFold+lowerSulcus;
          """,'CPU fold amplitudes')

          replace('body/EyeAnatomy.js',
          """      const r=Math.hypot(x,y),ox=x*(1+.0055/r),oy=y*(1+.0055/r),z=sample(ox,oy);
          """,
          """      const r=Math.hypot(x,y),overlap=compactEyeOuterOverlap(angle),ox=x*(1+overlap/r),oy=y*(1+overlap/r),z=sample(ox,oy);
          """,'outer tissue band')

          replace('body/EyeAnatomy.js',
          """    const localPoint=(angle,t,margin=false)=>{const o=interpolate(outer,angle);return compactEyePatchPoint(angle,t,side,o,o.slice(3),globe,cornerDepth,[0,0,0],margin?.00007:0);};
          """,
          """    const localPoint=(angle,t,margin=false)=>{const o=interpolate(outer,angle);return compactEyePatchPoint(angle,t,side,o,o.slice(3),globe,cornerDepth,[0,0,0],margin?COMPACT_EYE_ANATOMY.outerBand.marginOffset:0);};
          """,'wet margin offset')

          replace('body/EyeAnatomy.js',
          """    meshPart('eyeLidSkin',0,1,rings);meshPart('eyeLidMargin',0,.035,2);
          """,
          """    meshPart('eyeLidSkin',0,1,rings);meshPart('eyeLidMargin',0,COMPACT_EYE_ANATOMY.outerBand.marginRadial,2);
          """,'wet margin radial span')

          replace('body/EyeAnatomy.js',
          """  float envelope=16.*t2*(1.-t)*(1.-t),upperFold=-.00065*max(0.,s)*exp(-pow((t-.58)/.12,2.))*envelope*(1.-blink)*(1.-blink);
          """,
          """  float envelope=16.*t2*(1.-t)*(1.-t),upperFold=-${COMPACT_EYE_ANATOMY.fissure.upperFoldM.toFixed(6)}*max(0.,s)*exp(-pow((t-.58)/.12,2.))*envelope*(1.-blink)*(1.-blink);
          """,'GLSL upper fold')

          text=Path('body/EyeAnatomy.js').read_text(encoding='utf-8')
          text=text.replace("(compactEyeLid>1.5?.00007:0.)", "(compactEyeLid>1.5?${COMPACT_EYE_ANATOMY.outerBand.marginOffset.toFixed(6)}:0.)")
          text=text.replace("float da=6.28318530718/${COMPACT_EYE_ANATOMY.segments}.,dr=compactEyeLid>1.5?.0175:1./${COMPACT_EYE_ANATOMY.rings}.;", "float da=6.28318530718/${COMPACT_EYE_ANATOMY.segments}.,dr=compactEyeLid>1.5?${(COMPACT_EYE_ANATOMY.outerBand.marginRadial/2).toFixed(6)}:1./${COMPACT_EYE_ANATOMY.rings}.;")
          text=text.replace("float limit=compactEyeLid>1.5?.035:1.;", "float limit=compactEyeLid>1.5?${COMPACT_EYE_ANATOMY.outerBand.marginRadial.toFixed(6)}:1.;")
          if text.count("COMPACT_EYE_ANATOMY.outerBand.marginOffset.toFixed(6)") != 2:
              raise SystemExit('expected two GLSL wet-margin offsets')
          if "outerBand.marginRadial/2" not in text or "outerBand.marginRadial.toFixed(6)" not in text:
              raise SystemExit('GLSL wet-margin derivative span missing')
          Path('body/EyeAnatomy.js').write_text(text,encoding='utf-8',newline='\n')

          replace('body/FaceAnatomy.js',
          "const COMPACT_FACE_ANATOMY={revision:'r8-orbital-continuity',columns:160,rows:152,",
          "const COMPACT_FACE_ANATOMY={revision:'r9-eyelid-orbit-integration',columns:160,rows:152,",'face revision')

          replace('body/FaceAnatomy.js',
          """      {id:'orbitalTransition',x:side*.030,y:1.532,rx:.028,ry:.017,z:-.00095},
                {id:'upperLidSulcus',x:side*.030,y:1.536,rx:.022,ry:.009,z:-.00035},
                {id:'infraorbitalTransition',x:side*.030,y:1.505,rx:.027,ry:.016,z:-.00070},
                {id:'lowerLidTransition',x:side*.030,y:1.502,rx:.024,ry:.009,z:-.00025},
                {id:'malarVolume',x:side*.037,y:1.493,rx:.022,ry:.015,z:.00075},
          """,
          """      {id:'orbitalTransition',x:side*.030,y:1.532,rx:.029,ry:.018,z:-.00052},
                {id:'upperLidSulcus',x:side*.030,y:1.538,rx:.021,ry:.0075,z:-.00018},
                {id:'infraorbitalTransition',x:side*.030,y:1.505,rx:.028,ry:.017,z:-.00036},
                {id:'lowerLidTransition',x:side*.030,y:1.500,rx:.023,ry:.0075,z:-.00010},
                {id:'malarVolume',x:side*.037,y:1.493,rx:.023,ry:.016,z:.00060},
          """,'orbital forms')

          replace('tools/check-eye-anatomy.mjs',
          """  check(source.includes("revision:'r12-neutral-fissure-orbital-continuity'")&&source.includes('function compactEyeNeutralFissure')&&source.includes('lateralCanthusLift:.00070'),'neutral fissure has an explicit versioned canthus-aware model');
            check(source.includes('lowerSulcus=-p.lowerSulcusM')&&source.includes('lowerSulcus=-${COMPACT_EYE_ANATOMY.fissure.lowerSulcusM.toFixed(6)}'),'CPU and shader include the same bounded lower-lid transition');
          """,
          """  check(source.includes("revision:'r13-compact-lid-orbit-blend'")&&source.includes('function compactEyeNeutralFissure')&&source.includes('lateralCanthusLift:.00070'),'neutral fissure has an explicit versioned canthus-aware model');
            check(source.includes('function compactEyeOuterOverlap')&&source.includes('outerBand:{canthus:.00220,upper:.00335,lower:.00265'),'outer lid tissue uses a bounded angular overlap instead of a uniform broad ring');
            check(source.includes('upperFold=-p.upperFoldM')&&source.includes('lowerSulcus=-p.lowerSulcusM')&&source.includes('upperFold=-${COMPACT_EYE_ANATOMY.fissure.upperFoldM.toFixed(6)}')&&source.includes('lowerSulcus=-${COMPACT_EYE_ANATOMY.fissure.lowerSulcusM.toFixed(6)}'),'CPU and shader share bounded upper and lower lid transitions');
          """,'eye source contracts')

          replace('tools/check-eye-anatomy.mjs',
          """  new vm.Script(read('body/EyeAnatomy.js')+'\\n;globalThis.eyeFixtureAPI={create:compactCreateEyeLids,sampler:compactEyeSkinSampler,patch:compactEyePatchPoint,contact:compactEyeContactDepth,fissure:compactEyeNeutralFissure,anatomy:COMPACT_EYE_ANATOMY,shader:COMPACT_EYE_LID_GLSL};',{filename:'isolated-eye-parameter-functions'}).runInContext(context,{timeout:1000});
          """,
          """  new vm.Script(read('body/EyeAnatomy.js')+'\\n;globalThis.eyeFixtureAPI={create:compactCreateEyeLids,sampler:compactEyeSkinSampler,patch:compactEyePatchPoint,contact:compactEyeContactDepth,fissure:compactEyeNeutralFissure,overlap:compactEyeOuterOverlap,anatomy:COMPACT_EYE_ANATOMY,shader:COMPACT_EYE_LID_GLSL};',{filename:'isolated-eye-parameter-functions'}).runInContext(context,{timeout:1000});
          """,'fixture overlap API')

          replace('tools/check-eye-anatomy.mjs',
          """  check(Math.abs(leftTemporal[1]-rightTemporal[1])<1e-12&&Math.abs(leftMedial[1]-rightMedial[1])<1e-12,'left and right neutral fissures remain mirrored');
            const contactGlobe=[0,0,-.00925,api.anatomy.left.radius];
          """,
          """  check(Math.abs(leftTemporal[1]-rightTemporal[1])<1e-12&&Math.abs(leftMedial[1]-rightMedial[1])<1e-12,'left and right neutral fissures remain mirrored');
            check(Math.abs(api.overlap(0)-api.anatomy.outerBand.canthus)<1e-12&&Math.abs(api.overlap(Math.PI)-api.anatomy.outerBand.canthus)<1e-12,'outer tissue overlap is narrow at both canthi');
            check(Math.abs(api.overlap(Math.PI/2)-api.anatomy.outerBand.upper)<1e-12&&Math.abs(api.overlap(Math.PI*1.5)-api.anatomy.outerBand.lower)<1e-12,'upper and lower outer tissue overlap retain separate bounded spans');
            check(api.anatomy.outerBand.marginRadial<.025&&api.anatomy.outerBand.marginOffset<.00006,'wet margin remains a narrow surface detail');
            const contactGlobe=[0,0,-.00925,api.anatomy.left.radius];
          """,'outer band parameter checks')

          replace('tools/check-face-anatomy.mjs',
          """ check(source.includes("revision:'r8-orbital-continuity'")&&source.includes("id:'upperLidSulcus'")&&source.includes("id:'lowerLidTransition'"),'versioned orbital transition separates broad socket depth from local lid sulci');
          """,
          """ check(source.includes("revision:'r9-eyelid-orbit-integration'")&&source.includes("id:'upperLidSulcus'")&&source.includes("id:'lowerLidTransition'"),'versioned orbital transition separates broad socket depth from local lid sulci');
          """,'face source revision contract')
          PY
      - name: Build and validate candidate
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hrl-face-r5-server.log 2>&1 &
          echo $! > /tmp/hrl-face-r5-server.pid
      - name: Capture candidate views
        shell: bash
        run: |
          mkdir -p visual-review-r5
          cat > capture-face-r5.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1600,height:1200},deviceScaleFactor:1});
          const page=await context.newPage(),consoleMessages=[],pageErrors=[];
          page.on('console',message=>consoleMessages.push({type:message.type(),text:message.text()}));
          page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
          await page.goto('http://127.0.0.1:4173/index.html?review=face',{waitUntil:'domcontentloaded',timeout:120000});
          let frame=null;const deadline=Date.now()+420000;
          while(!frame&&Date.now()<deadline){for(const candidate of page.frames()){if(await candidate.evaluate(()=>Boolean(window.HumanLab?.face?.closeup)).catch(()=>false)){frame=candidate;break;}}if(!frame)await page.waitForTimeout(1000);}
          if(!frame)throw Error('Face review frame unavailable');
          await frame.waitForFunction(()=>window.__compactLoading?.state==='ready',null,{timeout:420000});
          await frame.waitForTimeout(5000);
          const canvas=frame.locator('canvas').first();await canvas.waitFor({state:'visible',timeout:30000});
          for(const view of ['front','side','lips']){await frame.evaluate(v=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup(v);},view);await frame.waitForTimeout(1500);await canvas.screenshot({path:`visual-review-r5/face-r5-${view}.png`});}
          const diagnostics=await frame.evaluate(()=>{const report=window.HumanLab.face.report(),compact=window.HumanLab.compact?.report,gl=document.querySelector('canvas')?.getContext('webgl2');return {review:window.HumanLab.review,compactLoading:window.__compactLoading,startup:window.__humanStartup,eyeAnatomy:compact?.eyeAnatomy,faceAnatomy:compact?.faceAnatomy,expression:report.expression,identity:report.identity,separation:report.separation,limitedNodes:report.limitedNodes,renderer:{canvasWidth:document.querySelector('canvas')?.width,canvasHeight:document.querySelector('canvas')?.height,webglError:gl?gl.getError():null}};});
          await writeFile('visual-review-r5/face-r5-diagnostics.json',JSON.stringify({diagnostics,consoleMessages,pageErrors},null,2));
          await browser.close();
          JS
          node capture-face-r5.mjs
      - name: Upload candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-eye-integration-r5-candidate
          path: visual-review-r5
          if-no-files-found: warn
          retention-days: 7
