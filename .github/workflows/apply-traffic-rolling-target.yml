name: Apply Traffic Rolling Target

on:
  push:
    branches:
      - feature/human-task-workbench-adjustment-v2-fullbase
    paths:
      - .github/workflows/apply-traffic-rolling-target.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-task-workbench-adjustment-v2-fullbase
      - name: Apply bounded source edits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('body/NaturalLocomotion.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
            ("slotPoint:null,slotIndex:null};this.sync();", "slotPoint:null,slotIndex:null,advancePoint:null,advanceRouteIndex:-1};this.sync();"),
            ("Object.assign(locomotion.traffic,{slotKey:key,slotTaskKey:taskKey,slotPoint:[...point],slotIndex:index});", "Object.assign(locomotion.traffic,{slotKey:key,slotTaskKey:taskKey,slotPoint:[...point],slotIndex:index,advancePoint:null,advanceRouteIndex:-1});"),
            ("originalTarget:[...goal],lastPlanAtS:a.time,nextPlanAtS:a.time+TRAFFIC_AVOIDANCE.planCooldownS,lastError:null});this.traffic.replans++;", "originalTarget:[...goal],lastPlanAtS:a.time,nextPlanAtS:a.time+TRAFFIC_AVOIDANCE.planCooldownS,lastError:null,advancePoint:null,advanceRouteIndex:-1});this.traffic.replans++;"),
            ("originalTarget:[...current],lastPlanAtS:a.time,nextPlanAtS:a.time+TRAFFIC_AVOIDANCE.planCooldownS,lastError:null});this.traffic.detours++;", "originalTarget:[...current],lastPlanAtS:a.time,nextPlanAtS:a.time+TRAFFIC_AVOIDANCE.planCooldownS,lastError:null,advancePoint:null,advanceRouteIndex:-1});this.traffic.detours++;"),
            ("originalTarget:[...target],lastPlanAtS:a.time,nextPlanAtS:a.time+TRAFFIC_AVOIDANCE.planCooldownS,lastError:null});this.traffic.retreats++;", "originalTarget:[...target],lastPlanAtS:a.time,nextPlanAtS:a.time+TRAFFIC_AVOIDANCE.planCooldownS,lastError:null,advancePoint:null,advanceRouteIndex:-1});this.traffic.retreats++;"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one source site: {old[:70]}')
              text = text.replace(old, new)
          marker = " }\n prepareTrafficTarget(speed=.48,{force=false}={}){"
          method = """ }
 rollingTrafficTarget(target,context){
  const a=this.a,t=this.traffic,root=this.engine.state.root;
  if(t.advancePoint&&t.advanceRouteIndex===a.routeIndex&&horizontal(root,t.advancePoint)>.025&&this.world.free(t.advancePoint,.23))return [...t.advancePoint];
  t.advancePoint=null;t.advanceRouteIndex=-1;
  if(this.world.free(target,.23))return target;
  let direction=sub(target,root);direction[1]=0;const distance=len(direction);if(distance<.08)return null;direction=norm(direction);
  for(const lookahead of [Math.min(.72,distance-.04),Math.min(.52,distance-.04),Math.min(.34,distance-.04),Math.min(.20,distance-.04)]){
   if(lookahead<.12)continue;const point=add(root,mul(direction,lookahead));point[1]=0;
   if(!trafficSegmentClear(a,root,point,context)||!this.world.free(point,.23))continue;
   t.advancePoint=[...point];t.advanceRouteIndex=a.routeIndex;t.mode='advance';t.reason='occupied-distant-route-target';return point;
  }
  return null;
 }
 prepareTrafficTarget(speed=.48,{force=false}={}){"""
          if text.count(marker) != 1:
              raise SystemExit('expected one prepareTrafficTarget insertion marker')
          text = text.replace(marker, method)
          old = """  if(!a.w.population)return target;
  if(this.traffic.active&&a.routeIndex<=this.traffic.detourEndIndex&&!force)return target;
  if(!force&&a.time<this.traffic.nextPlanAtS)return target;
  this.traffic.nextPlanAtS=a.time+.10;
  const conflict=predictTrafficConflict(a,speed,context);"""
          new = """  if(!a.w.population)return target;
  const rolling=this.rollingTrafficTarget(target,context);if(rolling&&rolling!==target)return rolling;
  if(this.traffic.active&&a.routeIndex<=this.traffic.detourEndIndex&&!force&&this.world.free(target,.23))return target;
  if(!force&&a.time<this.traffic.nextPlanAtS&&this.world.free(target,.23))return target;
  this.traffic.nextPlanAtS=a.time+.10;
  const conflict=predictTrafficConflict(a,speed,context)||[...a.w.population.values()].filter(other=>other.agent!==a&&other.id!==a.npcId&&!other.disposed).map(other=>{const threshold=context.radius+bodyPhysicalProfile(other.human).bodyRadiusM+TRAFFIC_AVOIDANCE.sideMarginM,separation=horizontal(target,other.agent.pos);return{actor:other,timeS:0,selfPoint:target,otherPoint:[...other.agent.pos],separation,threshold,score:separation};}).filter(row=>row.separation<row.threshold).sort((x,y)=>x.score-y.score)[0]||null;"""
          if text.count(old) != 1:
              raise SystemExit('expected one traffic planning sequence')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          Path('.github/workflows/apply-traffic-rolling-target.yml').unlink()
          PY
      - name: Commit rolling target fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add body/NaturalLocomotion.js .github/workflows/apply-traffic-rolling-target.yml
          git commit -m "fix(traffic): use rolling safe targets for occupied dynamic goals"
          git push origin HEAD:feature/human-task-workbench-adjustment-v2-fullbase
