name: Denim R05 Fiber Studio Public QA
on:
  push:
    branches: [feature/denim-r05-fiber-studio-20261010]
    paths:
      - 'denim-workshop/r05/*.js'
      - 'denim-workshop/r05/*.glsl'
      - 'denim-workshop/r05/*.py'
      - 'denim-workshop/r05/*.cjs'
      - 'denim-workshop/r05/template.html'
      - '.github/workflows/denim-r05-studio-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: denim-r05-fiber-studio-qa
  cancel-in-progress: false
jobs:
  studio-public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inherit frozen source and build canonical R05
        run: |
          if [ ! -f denim-workshop/r05/app.js ]; then
            python3 denim-workshop/r05/prepare.py
            python3 denim-workshop/r05/upgrade.py
          fi
          python3 denim-workshop/r05/build.py
          node --check denim-workshop/r05/app.js
          node --check denim-workshop/r05/natural-yarn.js
          node denim-workshop/r05/test-fiber.cjs
          python3 - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('denim-workshop/r05')
          h=hashlib.sha256((p/'index.html').read_bytes()).hexdigest()
          assert h=='477ff3f561f626a5ffb333056f33e6823ca3e516816a6e2d14f369519cb9c782',h
          assert hashlib.sha256(pathlib.Path('denim-workshop/r04/index.html').read_bytes()).hexdigest()=='1535f35e53c75091dad619489cc352cd5a9b8647618225043d08f0f458aea515'
          assert json.loads((p/'BUILD_MANIFEST.json').read_text())['sha256']==h
          print('VERIFIED_R05_STANDALONE',h)
          PY
      - name: Publish only R05 source and standalone with normal fast-forward push
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denim-workshop/r05/core.js denim-workshop/r05/natural-yarn.js denim-workshop/r05/app.js denim-workshop/r05/template.html denim-workshop/r05/cotton.glsl denim-workshop/r05/studio.js denim-workshop/r05/upgrade.py denim-workshop/r05/index.html denim-workshop/r05/BUILD_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build R05.0 cotton fiber studio with gray backdrop and background haze'
            git push origin HEAD:feature/denim-r05-fiber-studio-20261010
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/$SHA/denim-workshop/r05/index.html" >> "$GITHUB_ENV"
          echo "R05_TESTED_BUILD=$SHA"
      - name: Install browser verification runtime
        run: |
          python3 -m pip install playwright==1.55.0 pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Actual file and fixed public browser regression
        run: xvfb-run -a python3 -u denim-workshop/r05/qa.py --public "$PUBLIC_URL"
      - name: Upload actual rendered and numeric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denim-r05-fiber-studio-evidence
          path: |
            denim-workshop/r05/evidence/**
            denim-workshop/r05/fiber-qa.json
            denim-workshop/r05/index.html
            denim-workshop/r05/BUILD_MANIFEST.json
          retention-days: 30
          if-no-files-found: warn
      - name: Receipt
        if: success()
        run: |
          echo '## Denim R05.0 fiber studio candidate' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tested build: ${{ steps.publish.outputs.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual file://, fixed public HTTPS and mobile viewport verified. Film-grade, real-phone performance and measured cotton scattering remain unverified.' >> "$GITHUB_STEP_SUMMARY"
