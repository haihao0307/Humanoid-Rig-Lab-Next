name: ET04 TalkingHead integration review
on:
  push:
    branches: [feature/emily-talkinghead-et04-20261009]
    paths: ['.github/workflows/et04-integration-review.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: et04-reviewed-integration
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            skin-quality-lab/r01
            skin-quality-lab/r02
            skin-quality-lab/emily-transfer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: et04-pinned-inputs
          run-id: 37876552883
          github-token: ${{ github.token }}
          path: /tmp/et04-inputs
      - name: Prepare the pinned build and browser tools
        run: |
          mkdir -p /tmp/et04-tools
          tar -xzf /tmp/et04-inputs/build-tools.tgz -C /tmp/et04-tools
          chmod +x /tmp/et04-tools/node_modules/@esbuild/linux-x64/bin/esbuild
          node /tmp/et04-tools/node_modules/playwright/cli.js install chromium
          timeout 60s sudo apt-get install --no-install-recommends -y fonts-wqy-zenhei || true
      - name: Extract unchanged upstream code and integrate with ET03
        env:
          NODE_PATH: /tmp/et04-tools/node_modules
          ASSET_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p skin-quality-lab/emily-transfer/talkinghead/vendor
          cp -r /tmp/et04-inputs/vendor/. skin-quality-lab/emily-transfer/talkinghead/vendor/
          node skin-quality-lab/emily-transfer/talkinghead/extract-upstream.cjs
          node skin-quality-lab/emily-transfer/talkinghead/install.cjs
          node skin-quality-lab/emily-transfer/talkinghead/test-kernel.mjs
          node skin-quality-lab/emily-transfer/talkinghead/bundle.cjs
      - name: Real rendering and integration checks
        env:
          NODE_PATH: /tmp/et04-tools/node_modules
          EVIDENCE_DIR: /tmp/et04-review/visual
        run: node skin-quality-lab/emily-transfer/talkinghead/qa.cjs
      - name: Preserve the actual candidate and evidence
        if: always()
        run: |
          mkdir -p /tmp/et04-review/candidate
          cp -r skin-quality-lab/emily-transfer/. /tmp/et04-review/candidate/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: et04-integration-review
          path: /tmp/et04-review
          retention-days: 14
