name: Face nose midface R7 candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-nose-midface-r7-candidate.yml

permissions:
  contents: read

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply R6 optical base and R7 nasal candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          # Reproduce the accepted R6 candidate exactly before changing the nose.
          workflow=Path('.github/workflows/face-eye-optics-r6-candidate.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"; start=workflow.index(marker)+len(marker); end=workflow.index("\n          PY",start)
          exec(compile(textwrap.dedent(workflow[start:end]),'r6-candidate-patch','exec'),{})

          face=Path('body/FaceAnatomy.js')
          text=face.read_text(encoding='utf-8')
          replacements={
            "revision:'r10-procedural-optical-integration'":"revision:'r11-nasal-subunit-continuity'",
            "smoothingRadiusM:.0045,nostrils:{x:.0093,y:1.4793,rx:.0036,ry:.00165,tilt:.10,depth:.0050},":"smoothingRadiusM:.0045,nostrils:{x:.0090,y:1.4778,rx:.00345,ry:.00205,tilt:.16,depth:.0052},",
          }
          for old,new in replacements.items():
              if text.count(old)!=1: raise SystemExit('R7 header anchor mismatch: '+old)
              text=text.replace(old,new,1)

          old_nose="""  nose:{knots:[[1.465,.191,.015],[1.471,.190,.014],[1.475,.189,.0105],[1.480,.197,.010],[1.487,.203,.0115],[1.494,.200,.0105],[1.505,.193,.011],[1.518,.187,.012],[1.530,.181,.015],[1.538,.178,.019]],
    underturn:[[1.465,0],[1.471,0],[1.475,.0020],[1.480,-.0035],[1.487,-.0004],[1.494,0]],underturnWidth:.023,underturnCentreWeight:.40,columellaDrop:.0013,alarHeight:.0040,columellaHeight:.0012},
"""
          new_nose="""  nose:{knots:[[1.465,.1900,.0135],[1.471,.1905,.0125],[1.476,.1930,.0100],[1.481,.1990,.0088],[1.486,.2035,.0088],[1.490,.2025,.0092],[1.496,.1985,.0102],[1.506,.1930,.0115],[1.518,.1870,.0125],[1.530,.1810,.0150],[1.538,.1780,.0190]],
    underturn:[[1.465,0],[1.471,.0004],[1.476,.0014],[1.480,-.0021],[1.486,-.0008],[1.494,0]],underturnWidth:.0225,underturnCentreWeight:.30,columellaDrop:.0016,
    tipY:1.486,tipRx:.0105,tipRy:.0072,tipHeight:.00035,domeX:.0046,domeRx:.0048,domeRy:.0058,domeHeight:.00125,
    alarX:.0140,alarY:1.4805,alarRx:.0058,alarRy:.0056,alarHeight:.0018,alarGrooveX:.0170,alarGrooveY:1.4870,alarGrooveRx:.0048,alarGrooveRy:.0085,alarGrooveDepth:.00072,
    sidewallX:.0145,sidewallY:1.503,sidewallRx:.0090,sidewallRy:.0180,sidewallHeight:.00030,columellaHeight:.00155},
"""
          if text.count(old_nose)!=1: raise SystemExit('R7 nose parameter anchor mismatch')
          text=text.replace(old_nose,new_nose,1)

          old_loop="""      const ridge=(center-baseline)*Math.exp(-.5*(x/width)**2),alar=nose.alarHeight*Math.exp(-(((Math.abs(x)-.0125)/.0045)**2)-((y-1.4815)/.0045)**2),columella=nose.columellaHeight*Math.exp(-((x/.003)**2)-((y-1.477)/.004)**2);
      height[at(i,j)]+=(baseline+ridge+alar+columella-height[at(i,j)])*blend;}}
"""
          new_loop="""      const ax=Math.abs(x),ridge=(center-baseline)*Math.exp(-.5*(x/width)**2);
      const tip=nose.tipHeight*Math.exp(-((x/nose.tipRx)**2)-(((y-nose.tipY)/nose.tipRy)**2));
      const domes=nose.domeHeight*(Math.exp(-(((x-nose.domeX)/nose.domeRx)**2)-(((y-nose.tipY)/nose.domeRy)**2))+Math.exp(-(((x+nose.domeX)/nose.domeRx)**2)-(((y-nose.tipY)/nose.domeRy)**2)));
      const alar=nose.alarHeight*Math.exp(-(((ax-nose.alarX)/nose.alarRx)**2)-(((y-nose.alarY)/nose.alarRy)**2));
      const groove=-nose.alarGrooveDepth*Math.exp(-(((ax-nose.alarGrooveX)/nose.alarGrooveRx)**2)-(((y-nose.alarGrooveY)/nose.alarGrooveRy)**2));
      const sidewall=nose.sidewallHeight*Math.exp(-(((ax-nose.sidewallX)/nose.sidewallRx)**2)-(((y-nose.sidewallY)/nose.sidewallRy)**2));
      const columella=nose.columellaHeight*Math.exp(-((x/.0032)**2)-(((y-1.4775)/.0042)**2));
      height[at(i,j)]+=(baseline+ridge+tip+domes+alar+groove+sidewall+columella-height[at(i,j)])*blend;}}
"""
          if text.count(old_loop)!=1: raise SystemExit('R7 nasal surface anchor mismatch')
          text=text.replace(old_loop,new_loop,1)
          face.write_text(text,encoding='utf-8',newline='\n')

          check=Path('tools/check-face-anatomy.mjs')
          value=check.read_text(encoding='utf-8')
          if value.count("revision:'r10-procedural-optical-integration'")!=1: raise SystemExit('R7 face check revision anchor mismatch')
          value=value.replace("revision:'r10-procedural-optical-integration'","revision:'r11-nasal-subunit-continuity'",1)
          source_anchor=" check(source.includes(\"revision:'r11-nasal-subunit-continuity'\")&&source.includes(\"id:'upperLidSulcus'\")&&source.includes(\"id:'lowerLidTransition'\"),'versioned orbital transition separates broad socket depth from local lid sulci');"
          if value.count(source_anchor)!=1: raise SystemExit('R7 source contract anchor mismatch')
          value=value.replace(source_anchor,source_anchor+"\n check(source.includes('domeX:.0046')&&source.includes('alarGrooveDepth:.00072')&&source.includes('sidewallHeight:.00030'),'nasal tip domes, alar lobules, grooves and sidewalls are explicit bounded subunits');",1)
          parameter_anchor=" const cavity=full.meshes.find(m=>m.name==='noseInterior'),n=api.parameters.nostrils;"
          if value.count(parameter_anchor)!=1: raise SystemExit('R7 parameter contract anchor mismatch')
          value=value.replace(parameter_anchor,parameter_anchor+"\n const nose=api.parameters.nose;check(n.ry>n.rx*.5&&n.ry<n.rx*.7,'nostril aperture is oval rather than a horizontal slit');\n check(nose.domeHeight>nose.tipHeight&&nose.alarGrooveDepth>0&&nose.alarHeight>nose.alarGrooveDepth,'tip, ala and alar groove retain ordered bounded amplitudes');\n check(nose.knots.every((row,i,all)=>i===0||row[0]>all[i-1][0])&&nose.knots.every(row=>row[2]>.008&&row[2]<.020),'nasal profile rails are ordered and bounded');",1)
          check.write_text(value,encoding='utf-8',newline='\n')
          PY
      - name: Build and validate candidate
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hrl-face-r7-server.log 2>&1 &
      - name: Capture candidate views
        shell: bash
        run: |
          mkdir -p visual-review-r7
          cat > capture-face-r7.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1600,height:1200},deviceScaleFactor:1});
          const page=await context.newPage(),consoleMessages=[],pageErrors=[];
          page.on('console',message=>consoleMessages.push({type:message.type(),text:message.text()}));page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
          await page.goto('http://127.0.0.1:4173/index.html?review=face',{waitUntil:'domcontentloaded',timeout:120000});
          let frame=null;const deadline=Date.now()+420000;while(!frame&&Date.now()<deadline){for(const candidate of page.frames()){if(await candidate.evaluate(()=>Boolean(window.HumanLab?.face?.closeup)).catch(()=>false)){frame=candidate;break;}}if(!frame)await page.waitForTimeout(1000);}if(!frame)throw Error('Face review frame unavailable');
          await frame.waitForFunction(()=>window.__compactLoading?.state==='ready',null,{timeout:420000});await frame.waitForTimeout(5000);const canvas=frame.locator('canvas').first();await canvas.waitFor({state:'visible',timeout:30000});
          for(const view of ['front','side','lips']){await frame.evaluate(v=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup(v);},view);await frame.waitForTimeout(1500);await canvas.screenshot({path:`visual-review-r7/face-r7-${view}.png`});}
          const diagnostics=await frame.evaluate(()=>{const report=window.HumanLab.face.report(),compact=window.HumanLab.compact?.report,gl=document.querySelector('canvas')?.getContext('webgl2');return {review:window.HumanLab.review,compactLoading:window.__compactLoading,startup:window.__humanStartup,eyeAnatomy:compact?.eyeAnatomy,faceAnatomy:compact?.faceAnatomy,separation:report.separation,limitedNodes:report.limitedNodes,renderer:{webglError:gl?gl.getError():null}};});
          await writeFile('visual-review-r7/face-r7-diagnostics.json',JSON.stringify({diagnostics,consoleMessages,pageErrors},null,2));await browser.close();
          JS
          node capture-face-r7.mjs
      - name: Upload candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-nose-midface-r7-candidate
          path: visual-review-r7
          if-no-files-found: warn
          retention-days: 7
