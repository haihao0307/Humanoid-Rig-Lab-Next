name: Chicken R10.0 Single Agent Behavior

on:
  push:
    branches:
      - chat/chicken-phase1-continuation-20260916
    paths:
      - .github/workflows/chicken-r100-single-agent.yml
      - tools/build_chicken_r100.py
      - tools/chicken_r100_motion_patch.js
      - tools/chicken_r100_peck_patch.js
      - tools/chicken_r100_manual_step_patch.js
      - tools/capture_chicken_r100.mjs
      - tools/capture_chicken_r100_mesh_diagnostic.mjs
      - tools/build_chicken_r991.py
      - tools/chicken_r991_override.js
      - runtime/chicken_phase1_npc_controller.mjs
      - runtime/chicken_phase1_articulated_skin.mjs
      - runtime/chicken_phase1_peck_adapter.mjs
      - tests/chicken_phase1_articulated_skin.test.mjs
      - CHICKEN_V46_R9_1.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicken-r100-single-agent
  cancel-in-progress: true

jobs:
  unit-browser-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source and runtime modules
        shell: bash
        run: |
          python -m py_compile tools/build_chicken_r991.py tools/build_chicken_r100.py
          node --check tools/chicken_r991_override.js
          node --check tools/chicken_r100_motion_patch.js
          node --check tools/chicken_r100_peck_patch.js
          node --check tools/chicken_r100_manual_step_patch.js
          node --check tools/capture_chicken_r100.mjs
          node --check tools/capture_chicken_r100_mesh_diagnostic.mjs
          node --check runtime/chicken_phase1_npc_controller.mjs
          node --check runtime/chicken_phase1_articulated_skin.mjs
          node --check runtime/chicken_phase1_peck_adapter.mjs
          node --test tests/chicken_phase1_npc_controller.test.mjs
          node --test tests/chicken_phase1_articulated_skin.test.mjs

      - name: Build deterministic single-agent workbench
        run: python tools/build_chicken_r100.py

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.55.0

      - name: Run browser motion QA and capture states
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHICKEN_R100_URL: http://127.0.0.1:8765/CHICKEN_V46_R10_0_SINGLE_AGENT.html
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/chicken-r100-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          timeout --signal=TERM --kill-after=15s 240s node tools/capture_chicken_r100.mjs
          timeout --signal=TERM --kill-after=15s 180s node tools/capture_chicken_r100_mesh_diagnostic.mjs

      - name: Refresh manifest after browser QA
        run: python tools/build_chicken_r100.py

      - name: Verify technical gates and truth boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=[
            Path('CHICKEN_V46_R10_0_SINGLE_AGENT.html'),
            Path('data/CHICKEN_R100_SINGLE_AGENT_PARAMETERS.json'),
            Path('qa/CHICKEN_R100_STATIC_QA.json'),
            Path('qa/CHICKEN_R100_BROWSER_QA.json'),
            Path('BUILD_MANIFEST_R100.json'),
            Path('evidence/r100/R100_BEHAVIOR_REVIEW_BOARD.html'),
            Path('evidence/r100/R100_PECK_ISO_BODY.png'),
            Path('evidence/r100/R100_PECK_ISO_COAT.png')
          ]
          missing=[str(path) for path in required if not path.exists() or path.stat().st_size==0]
          if missing: raise SystemExit(f'Missing R10.0 files: {missing}')
          for path in [Path('qa/CHICKEN_R100_STATIC_QA.json'),Path('qa/CHICKEN_R100_BROWSER_QA.json')]:
            data=json.loads(path.read_text(encoding='utf-8'))
            if not data.get('passed'): raise SystemExit(f'QA failed: {path}')
          browser=json.loads(Path('qa/CHICKEN_R100_BROWSER_QA.json').read_text(encoding='utf-8'))
          boundary=browser.get('truthBoundary',{})
          if boundary.get('groupTestAuthorized') is not False:
            raise SystemExit('Group testing must remain closed')
          skin=browser.get('runtime',{}).get('motion',{}).get('skin',{})
          if skin.get('peckKinematicsRevision')!='six-link-volume-preserving-s-curve-v2':
            raise SystemExit('Distributed six-link peck rig was not active in browser QA')
          print('R10.0 technical single-agent gate passed with distributed cervical rig. Manual naturalness, collision and group gates remain open.')
          PY

      - name: Upload R10.0 single-agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicken-r100-single-agent-${{ github.run_number }}
          path: |
            CHICKEN_V46_R10_0_SINGLE_AGENT.html
            CHICKEN_V46_R9_9_1_GAMEPLAY_HEAD.html
            data/CHICKEN_R100_SINGLE_AGENT_PARAMETERS.json
            qa/CHICKEN_R100_STATIC_QA.json
            qa/CHICKEN_R100_BROWSER_QA.json
            evidence/r100
            BUILD_MANIFEST_R100.json
            runtime/chicken_phase1_npc_controller.mjs
            runtime/chicken_phase1_articulated_skin.mjs
            runtime/chicken_phase1_peck_adapter.mjs
            tools/build_chicken_r100.py
            tools/chicken_r100_motion_patch.js
            tools/chicken_r100_peck_patch.js
            tools/chicken_r100_manual_step_patch.js
            tools/capture_chicken_r100.mjs
            tools/capture_chicken_r100_mesh_diagnostic.mjs
            /tmp/chicken-r100-http.log
          if-no-files-found: warn
          retention-days: 7
