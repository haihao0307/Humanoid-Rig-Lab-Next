name: Chicken R10.0 Segmented Neck V8.2 Single Agent

on:
  push:
    branches:
      - chat/chicken-phase1-continuation-20260916
    paths:
      - .github/workflows/chicken-r100-single-agent.yml
      - README.md
      - 01_CURRENT_STATE.json
      - R100_SEGMENTED_NECK_V8_2_IMPLEMENTATION.md
      - tools/build_chicken_r100.py
      - tools/chicken_r100_motion_patch.js
      - tools/chicken_r100_peck_patch.js
      - tools/chicken_r100_centerline_patch.js
      - tools/chicken_r100_manual_step_patch.js
      - tools/capture_chicken_r100.mjs
      - tools/verify_chicken_r100_segmented_v8_2.mjs
      - tools/run_chicken_r100_segmented_v8_2_static.py
      - runtime/chicken_phase1_npc_controller.mjs
      - runtime/chicken_phase1_articulated_skin.mjs
      - runtime/chicken_phase1_peck_adapter.mjs
      - runtime/chicken_phase1_ring_coherent_adapter.mjs
      - runtime/chicken_phase1_segmented_neck_adapter.mjs
      - tests/chicken_phase1_segmented_neck_adapter.test.mjs
      - CHICKEN_V46_R9_9_1_GAMEPLAY_HEAD.html
      - evidence/r100_v8_2_prebrowser/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicken-r100-segmented-neck-v8-2-single-agent
  cancel-in-progress: true

jobs:
  unit-browser-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run reproducible V8.2 static gate
        run: python tools/run_chicken_r100_segmented_v8_2_static.py

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.55.0

      - name: Run V8.2 browser motion and topology QA
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHICKEN_R100_URL: http://127.0.0.1:8765/CHICKEN_V46_R10_0_SINGLE_AGENT.html
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/chicken-r100-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          timeout --signal=TERM --kill-after=15s 300s node tools/capture_chicken_r100.mjs

      - name: Refresh manifest after browser QA
        run: python tools/build_chicken_r100.py

      - name: Verify V8.2 technical gates and truth boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=[
            Path('CHICKEN_V46_R10_0_SINGLE_AGENT.html'),
            Path('data/CHICKEN_R100_SINGLE_AGENT_PARAMETERS.json'),
            Path('qa/CHICKEN_R100_STATIC_QA.json'),
            Path('qa/CHICKEN_R100_SEGMENTED_V8_2_GEOMETRY_QA.json'),
            Path('qa/CHICKEN_R100_BROWSER_QA.json'),
            Path('BUILD_MANIFEST_R100.json'),
            Path('evidence/r100/R100_BEHAVIOR_REVIEW_BOARD.html')
          ]
          missing=[str(p) for p in required if not p.exists() or p.stat().st_size==0]
          if missing: raise SystemExit(f'Missing R10.0 V8.2 files: {missing}')
          for p in [Path('qa/CHICKEN_R100_STATIC_QA.json'),Path('qa/CHICKEN_R100_SEGMENTED_V8_2_GEOMETRY_QA.json'),Path('qa/CHICKEN_R100_BROWSER_QA.json')]:
            data=json.loads(p.read_text(encoding='utf-8'))
            if not data.get('passed'): raise SystemExit(f'QA failed: {p}')
          browser=json.loads(Path('qa/CHICKEN_R100_BROWSER_QA.json').read_text(encoding='utf-8'))
          skin=browser.get('runtime',{}).get('motion',{}).get('skin',{})
          expected={
            'weightingRevision':'segmented-rigid-head-and-buried-root-neck-v8-2',
            'topologyRevision':'torso-buried-neck-rigid-head-v8-2',
            'centerlineCurveRevision':'bone-centerline-parallel-transport-with-buried-root-v4'
          }
          for key,value in expected.items():
            if skin.get(key)!=value: raise SystemExit(f'Unexpected {key}: {skin.get(key)!r}')
          tube=skin.get('neckTube') or {}
          if tube.get('startMode')!='buried-root' or abs((tube.get('rootBurial') or 0)-0.09)>1e-6 or tube.get('endpointBone')!='head_base' or tube.get('ringCount')!=34 or tube.get('ringSize')!=28:
            raise SystemExit('V8.2 neck tube contract failed')
          boundary=browser.get('truthBoundary',{})
          if boundary.get('groupTestAuthorized') is not False: raise SystemExit('Group testing must remain closed')
          if boundary.get('manualVisualAcceptance') is not False: raise SystemExit('Browser QA must not self-approve visual quality')
          print('R10.0 V8.2 technical gate passed. Manual visual, collision and group gates remain closed.')
          PY

      - name: Upload R10.0 V8.2 single-agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicken-r100-segmented-v8-2-${{ github.run_number }}
          path: |
            CHICKEN_V46_R10_0_SINGLE_AGENT.html
            CHICKEN_V46_R9_9_1_GAMEPLAY_HEAD.html
            README.md
            01_CURRENT_STATE.json
            R100_SEGMENTED_NECK_V8_2_IMPLEMENTATION.md
            data/CHICKEN_R100_SINGLE_AGENT_PARAMETERS.json
            qa/CHICKEN_R100_STATIC_QA.json
            qa/CHICKEN_R100_SEGMENTED_V8_2_GEOMETRY_QA.json
            qa/CHICKEN_R100_SEGMENTED_V8_2_LOCAL_TESTS.json
            qa/CHICKEN_R100_BROWSER_QA.json
            evidence/r100
            evidence/r100_v8_2_prebrowser
            BUILD_MANIFEST_R100.json
            runtime/chicken_phase1_npc_controller.mjs
            runtime/chicken_phase1_articulated_skin.mjs
            runtime/chicken_phase1_peck_adapter.mjs
            runtime/chicken_phase1_ring_coherent_adapter.mjs
            runtime/chicken_phase1_segmented_neck_adapter.mjs
            tests/chicken_phase1_segmented_neck_adapter.test.mjs
            tools/build_chicken_r100.py
            tools/chicken_r100_motion_patch.js
            tools/chicken_r100_peck_patch.js
            tools/chicken_r100_centerline_patch.js
            tools/chicken_r100_manual_step_patch.js
            tools/capture_chicken_r100.mjs
            tools/verify_chicken_r100_segmented_v8_2.mjs
            tools/run_chicken_r100_segmented_v8_2_static.py
            /tmp/chicken-r100-http.log
          if-no-files-found: warn
          retention-days: 7
