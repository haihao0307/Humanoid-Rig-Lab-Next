name: Chicken R10.0 V8.3 Bootstrap Integration

on:
  push:
    branches:
      - chat/chicken-phase1-continuation-20260916
    paths:
      - .github/workflows/chicken-r100-single-agent.yml
      - tools/chicken_v8_3_payload.tar.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chicken-r100-v8-3-bootstrap
  cancel-in-progress: true

jobs:
  integrate-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode sealed-collar V8.3 payload
        shell: bash
        run: |
          base64 --decode tools/chicken_v8_3_payload.tar.gz.b64 > /tmp/chicken-v83-payload.tar.gz
          echo "d9a4301f200feec21fb9f6c358c0b66c163a843b66a9f75ccfb561b7595e1b86  /tmp/chicken-v83-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/chicken-v83-payload.tar.gz
          test -f runtime/chicken_phase1_segmented_neck_adapter.mjs
          test -f tests/chicken_phase1_segmented_neck_v8_3_adapter.test.mjs
          test -f R100_SEALED_COLLAR_V8_3_IMPLEMENTATION.md

      - name: Run reproducible V8.3 static gate
        run: python tools/run_chicken_r100_segmented_v8_3_static.py

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.55.0

      - name: Run V8.3 browser motion and topology QA
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHICKEN_R100_URL: http://127.0.0.1:8765/CHICKEN_V46_R10_0_SINGLE_AGENT.html
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/chicken-r100-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          timeout --signal=TERM --kill-after=15s 300s node tools/capture_chicken_r100.mjs

      - name: Refresh manifest after browser QA
        run: python tools/build_chicken_r100.py

      - name: Verify V8.3 technical gates and truth boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              Path('CHICKEN_V46_R10_0_SINGLE_AGENT.html'),
              Path('data/CHICKEN_R100_SINGLE_AGENT_PARAMETERS.json'),
              Path('qa/CHICKEN_R100_STATIC_QA.json'),
              Path('qa/CHICKEN_R100_SEGMENTED_V8_3_GEOMETRY_QA.json'),
              Path('qa/CHICKEN_R100_BROWSER_QA.json'),
              Path('BUILD_MANIFEST_R100.json'),
              Path('evidence/r100/R100_BEHAVIOR_REVIEW_BOARD.html'),
          ]
          missing = [str(path) for path in required if not path.exists() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f'Missing R10.0 V8.3 files: {missing}')
          for path in [
              Path('qa/CHICKEN_R100_STATIC_QA.json'),
              Path('qa/CHICKEN_R100_SEGMENTED_V8_3_GEOMETRY_QA.json'),
              Path('qa/CHICKEN_R100_BROWSER_QA.json'),
          ]:
              data = json.loads(path.read_text(encoding='utf-8'))
              if not data.get('passed'):
                  raise SystemExit(f'QA failed: {path}')
          browser = json.loads(Path('qa/CHICKEN_R100_BROWSER_QA.json').read_text(encoding='utf-8'))
          skin = browser.get('runtime', {}).get('motion', {}).get('skin', {})
          expected = {
              'weightingRevision': 'sealed-collar-filtered-coat-and-support-stance-v8-3',
              'topologyRevision': 'torso-overlap-sealed-neck-rigid-head-v8-3',
              'centerlineCurveRevision': 'bone-centerline-parallel-transport-with-sealed-collar-v5',
              'peckKinematicsRevision': 'six-link-supported-peck-stance-v5',
          }
          for key, value in expected.items():
              if skin.get(key) != value:
                  raise SystemExit(f'Unexpected {key}: {skin.get(key)!r}')
          coat = skin.get('coat') or {}
          if coat.get('removedElementCount', 0) <= 0 or coat.get('keptElementCount', 0) <= 0:
              raise SystemExit('V8.3 filtered coat contract failed')
          boundary = browser.get('truthBoundary', {})
          if boundary.get('groupTestAuthorized') is not False:
              raise SystemExit('Group testing must remain closed')
          if boundary.get('manualVisualAcceptance') is not False:
              raise SystemExit('Browser QA must not self-approve visual quality')
          print('R10.0 V8.3 technical gate passed. Manual visual, collision and group gates remain closed.')
          PY

      - name: Commit integrated V8.3 sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/chicken-r100-single-agent.yml \
            R100_SEALED_COLLAR_V8_3_IMPLEMENTATION.md \
            runtime/chicken_phase1_segmented_neck_adapter.mjs \
            runtime/chicken_phase1_peck_adapter.mjs \
            runtime/chicken_phase1_ring_coherent_adapter.mjs \
            tools/chicken_r100_centerline_patch.js \
            tools/build_chicken_r100.py \
            tools/capture_chicken_r100.mjs \
            tests/chicken_phase1_segmented_neck_v8_3_adapter.test.mjs \
            tools/verify_chicken_r100_segmented_v8_3.mjs \
            tools/run_chicken_r100_segmented_v8_3_static.py
          git rm tools/chicken_v8_3_payload.tar.gz.b64
          if ! git diff --cached --quiet; then
            git commit -m "Integrate Chicken sealed-collar V8.3 candidate"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload R10.0 V8.3 single-agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicken-r100-sealed-collar-v8-3-${{ github.run_number }}
          path: |
            CHICKEN_V46_R10_0_SINGLE_AGENT.html
            CHICKEN_V46_R9_9_1_GAMEPLAY_HEAD.html
            R100_SEALED_COLLAR_V8_3_IMPLEMENTATION.md
            data/CHICKEN_R100_SINGLE_AGENT_PARAMETERS.json
            qa/CHICKEN_R100_STATIC_QA.json
            qa/CHICKEN_R100_SEGMENTED_V8_3_GEOMETRY_QA.json
            qa/CHICKEN_R100_SEGMENTED_V8_3_LOCAL_TESTS.json
            qa/CHICKEN_R100_BROWSER_QA.json
            evidence/r100
            BUILD_MANIFEST_R100.json
            runtime/chicken_phase1_npc_controller.mjs
            runtime/chicken_phase1_articulated_skin.mjs
            runtime/chicken_phase1_peck_adapter.mjs
            runtime/chicken_phase1_ring_coherent_adapter.mjs
            runtime/chicken_phase1_centerline_sweep_adapter.mjs
            runtime/chicken_phase1_segmented_neck_adapter.mjs
            tests/chicken_phase1_segmented_neck_v8_3_adapter.test.mjs
            tools/build_chicken_r100.py
            tools/chicken_r100_motion_patch.js
            tools/chicken_r100_peck_patch.js
            tools/chicken_r100_centerline_patch.js
            tools/chicken_r100_manual_step_patch.js
            tools/capture_chicken_r100.mjs
            tools/verify_chicken_r100_segmented_v8_3.mjs
            tools/run_chicken_r100_segmented_v8_3_static.py
            /tmp/chicken-r100-http.log
          if-no-files-found: warn
          retention-days: 7
