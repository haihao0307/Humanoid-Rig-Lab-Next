name: Chicken R10.0 Centerline Sweep V7.1 Single Agent

on:
  push:
    branches:
      - chat/chicken-phase1-continuation-20260916
    paths:
      - .github/workflows/chicken-r100-single-agent.yml
      - README.md
      - 01_CURRENT_STATE.json
      - R100_CENTERLINE_V7_IMPLEMENTATION.md
      - tools/build_chicken_r100.py
      - tools/chicken_r100_motion_patch.js
      - tools/chicken_r100_peck_patch.js
      - tools/chicken_r100_centerline_patch.js
      - tools/chicken_r100_manual_step_patch.js
      - tools/capture_chicken_r100.mjs
      - tools/capture_chicken_r100_mesh_diagnostic.mjs
      - tools/verify_chicken_r100_centerline_v7.mjs
      - tools/verify_chicken_r100_centerline_v7_gate.py
      - tools/run_chicken_r100_centerline_v7_static.sh
      - tools/run_chicken_r100_centerline_v7_browser.sh
      - tools/build_chicken_r991.py
      - tools/chicken_r991_override.js
      - runtime/chicken_phase1_npc_controller.mjs
      - runtime/chicken_phase1_articulated_skin.mjs
      - runtime/chicken_phase1_peck_adapter.mjs
      - runtime/chicken_phase1_ring_coherent_adapter.mjs
      - runtime/chicken_phase1_centerline_sweep_adapter.mjs
      - runtime/chicken_phase1_centerline_sweep_v71_adapter.mjs
      - tests/chicken_phase1_articulated_skin.test.mjs
      - tests/chicken_phase1_centerline_sweep_adapter.test.mjs
      - CHICKEN_V46_R9_1.html
      - evidence/r100/centerline_v7_prebrowser/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicken-r100-centerline-v71-single-agent
  cancel-in-progress: true

jobs:
  unit-browser-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate, test, audit and build V7.1
        run: bash tools/run_chicken_r100_centerline_v7_static.sh

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.55.0

      - name: Run V7.1 browser motion and topology QA
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHICKEN_R100_URL: http://127.0.0.1:8765/CHICKEN_V46_R10_0_SINGLE_AGENT.html
        run: bash tools/run_chicken_r100_centerline_v7_browser.sh

      - name: Upload R10.0 V7.1 single-agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicken-r100-centerline-v71-${{ github.run_number }}
          path: |
            CHICKEN_V46_R10_0_SINGLE_AGENT.html
            CHICKEN_V46_R9_9_1_GAMEPLAY_HEAD.html
            README.md
            01_CURRENT_STATE.json
            R100_CENTERLINE_V7_IMPLEMENTATION.md
            data/CHICKEN_R100_SINGLE_AGENT_PARAMETERS.json
            qa/CHICKEN_R100_STATIC_QA.json
            qa/CHICKEN_R100_CENTERLINE_V7_QA.json
            qa/CHICKEN_R100_CENTERLINE_V7_LOCAL_TESTS.json
            qa/CHICKEN_R100_BROWSER_QA.json
            evidence/r100
            BUILD_MANIFEST_R100.json
            runtime/chicken_phase1_npc_controller.mjs
            runtime/chicken_phase1_articulated_skin.mjs
            runtime/chicken_phase1_peck_adapter.mjs
            runtime/chicken_phase1_ring_coherent_adapter.mjs
            runtime/chicken_phase1_centerline_sweep_adapter.mjs
            runtime/chicken_phase1_centerline_sweep_v71_adapter.mjs
            tests/chicken_phase1_centerline_sweep_adapter.test.mjs
            tools/build_chicken_r100.py
            tools/chicken_r100_motion_patch.js
            tools/chicken_r100_peck_patch.js
            tools/chicken_r100_centerline_patch.js
            tools/chicken_r100_manual_step_patch.js
            tools/capture_chicken_r100.mjs
            tools/capture_chicken_r100_mesh_diagnostic.mjs
            tools/verify_chicken_r100_centerline_v7.mjs
            tools/verify_chicken_r100_centerline_v7_gate.py
            tools/run_chicken_r100_centerline_v7_static.sh
            tools/run_chicken_r100_centerline_v7_browser.sh
            /tmp/chicken-r100-http.log
          if-no-files-found: warn
          retention-days: 7
