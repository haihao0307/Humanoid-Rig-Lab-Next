name: Apply Corridor Yield Counter Fix

on:
  push:
    branches:
      - feature/human-task-workbench-adjustment-v2-fullbase

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-task-workbench-adjustment-v2-fullbase
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch first circulation transition
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('body/NaturalLocomotion.js')
          text = path.read_text(encoding='utf-8')
          old = "const first=this.traffic.corridorKey!==descriptor.key||this.traffic.corridorOwner!==lease.ownerId;"
          new = "const first=this.traffic.mode!=='corridor-circulation'||this.traffic.corridorKey!==descriptor.key||this.traffic.corridorOwner!==lease.ownerId;"
          if text.count(old) != 1:
              raise SystemExit(f'expected one patch site, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
      - name: Verify traffic suite
        run: |
          node --check body/NaturalLocomotion.js
          node tools/test-npc-corridor-active-yield.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add body/NaturalLocomotion.js
          git commit -m "fix(traffic): record first active corridor circulation"
          git push origin HEAD:feature/human-task-workbench-adjustment-v2-fullbase
