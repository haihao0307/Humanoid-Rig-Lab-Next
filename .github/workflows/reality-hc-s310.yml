name: Reality S3.10 walking contact448
on:
  push:
    branches: [feature/reality-hc-s310-walk-contact-20261021]
    paths: [.github/workflows/reality-hc-s310.yml, reality-lab/hc-s3-10/RUN_REQUEST.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: platform
          sparse-checkout: reality-lab
      - uses: actions/checkout@v4
        with:
          repository: haihao0307/guilin-dem-pipeline
          ref: c5c0bedbc35f24cbb35426ab9c14b74ca7fc5f49
          path: host
          sparse-checkout: kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
      - name: Check bounded source and syntax
        run: |
          git fetch --filter=blob:none --depth=1 origin 00490a73be8ea08cb8063bdc0b8e6c7a39e5da69
          python - <<'PY'
          from pathlib import Path
          import ast,subprocess
          changed=subprocess.check_output(['git','diff','--name-only','00490a73be8ea08cb8063bdc0b8e6c7a39e5da69','HEAD'],text=True).splitlines()
          assert changed and all(p.startswith('reality-lab/hc-s3-10/') or p=='.github/workflows/reality-hc-s310.yml' for p in changed)
          for p in Path('reality-lab/hc-s3-10').glob('*.py'):ast.parse(p.read_text())
          PY
          node --check reality-lab/hc-s3-10/trace.mjs
      - name: Install fixed Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Trace original candidate without changing arithmetic
        env:
          GARMENT_HOST: ${{ github.workspace }}/host/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
        run: python reality-lab/hc-s3-10/run_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf310-native-trace
          path: platform/reality-lab/hc-s3-10/qa/native/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf310-source-inspection
          path: |
            platform/reality-lab/hc-s3-10/*.py
            platform/reality-lab/hc-s3-10/*.mjs
            platform/reality-lab/hc-s3-10/TASK_ANCHOR.json
          retention-days: 7
