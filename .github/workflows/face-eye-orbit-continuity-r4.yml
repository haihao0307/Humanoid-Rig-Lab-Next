name: Face eye orbit continuity R4

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face-eye-orbit-continuity-r4
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply neutral eyelid and orbital continuity changes
        run: python3 tools/apply-face-eye-orbit-r4.py
      - name: Align scalar shader and preserve canthus attachment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('body/EyeAnatomy.js')
          text=path.read_text(encoding='utf-8')
          pattern=r"float ex=\$\{COMPACT_EYE_ANATOMY\.fissure\.halfWidth\.toFixed\(6\)\}\*c,restY=\(s>=0\.\?1\.:-1\.\)\*height\*vertical\*\$\{\(1-COMPACT_EYE_ANATOMY\.fissure\.verticalRoundness\)\.toFixed\(6\)\}\+cornerLift;\s*restY\+=\(s>=0\.\?1\.:-1\.\)\*height\*vertical\*\$\{COMPACT_EYE_ANATOMY\.fissure\.verticalRoundness\.toFixed\(6\)\}\*vertical;"
          replacement="float ex=${COMPACT_EYE_ANATOMY.fissure.halfWidth.toFixed(6)}*c,restY=(s>=0.?1.:-1.)*height*vertical*(${(1-COMPACT_EYE_ANATOMY.fissure.verticalRoundness).toFixed(6)}+${COMPACT_EYE_ANATOMY.fissure.verticalRoundness.toFixed(6)}*vertical)+cornerLift;"
          text,count=re.subn(pattern,replacement,text,count=1)
          if count!=1:
              raise SystemExit(f'GLSL fissure scalar anchor mismatch: {count}')
          cpu_old="  const ey=(restY+dy)*(1-state[2])+(.00035*lateral-.0024)*canthus*canthus*state[2];"
          cpu_new="  const blinkY=COMPACT_EYE_ANATOMY.fissure.lateralCanthusLift*lateral*(1-canthus)+(.00035*lateral-.0024)*canthus*canthus;\n  const ey=(restY+dy)*(1-state[2])+blinkY*state[2];"
          if text.count(cpu_old)!=1:
              raise SystemExit('CPU canthus attachment anchor mismatch')
          text=text.replace(cpu_old,cpu_new,1)
          glsl_old="  float ey=mix(restY+dy,(.00035*lateral-.0024)*canthus*canthus,blink);"
          glsl_new="  float blinkY=cornerLift+(.00035*lateral-.0024)*canthus*canthus;\n  float ey=mix(restY+dy,blinkY,blink);"
          if text.count(glsl_old)!=1:
              raise SystemExit('GLSL canthus attachment anchor mismatch')
          text=text.replace(glsl_old,glsl_new,1)
          path.write_text(text,encoding='utf-8',newline='\n')
          PY
      - name: Build and run file-only validation
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Final audit and commit
        shell: bash
        run: |
          rm -f .github/workflows/face-eye-orbit-continuity-r4.yml tools/apply-face-eye-orbit-r4.py
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
          python3 tools/audit-files.py
          node tools/check-pure.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "face: improve neutral eyelid and orbital continuity"
          git push origin HEAD:feature/human-face-workbench-v1-20260915
