name: Cat Kaopu V4.41 Eyelid Cornea Build

on:
  push:
    branches:
      - codex/cat-kaopu-v440-mainline-20260915
    paths:
      - .github/workflows/cat-kaopu-v441-build.yml
      - cat-kaopu/tools/build_cat_v441_eyelid_cornea.py
      - cat-kaopu/tools/patch_cat_v441_builder_full_close.py
      - cat-kaopu/tools/capture_cat_v441_browser_qa.mjs
      - cat-kaopu/tools/verify_cat_kaopu_module.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cat-kaopu-v441-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze V4.40 source exactly once
        shell: bash
        run: |
          set -euo pipefail
          baseline='cat-kaopu/baselines/v4.40/CAT_KAOPU_V440_EYE_EAR_SHORT_FUR_WORKBENCH_2026-09-15.html'
          if [ ! -f "$baseline" ]; then
            mkdir -p "$(dirname "$baseline")"
            cp cat-kaopu/workbench/CAT_KAOPU_CURRENT.html "$baseline"
          fi

      - name: Enforce complete eyelid closure in V4.41 builder
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/patch_cat_v441_builder_full_close.py

      - name: Generate V4.41 workbench and technical audit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/build_cat_v441_eyelid_cornea.py

      - name: Verify payload, rig and module invariants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/verify_cat_kaopu_module.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned browser dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run WebGL2 visual regression capture
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > "${RUNNER_TEMP}/cat-v441-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/cat-kaopu/workbench/CAT_KAOPU_CURRENT.html; then
              break
            fi
            sleep 1
          done
          CAT_V441_URL='http://127.0.0.1:4173/cat-kaopu/workbench/CAT_KAOPU_CURRENT.html' \
            node cat-kaopu/tools/capture_cat_v441_browser_qa.mjs

      - name: Refresh manifest after browser evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python cat-kaopu/tools/build_cat_v441_eyelid_cornea.py
          python cat-kaopu/tools/verify_cat_kaopu_module.py

      - name: Upload V4.41 QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: cat-kaopu-v441-qa-${{ github.run_number }}
          path: |
            cat-kaopu/CURRENT.json
            cat-kaopu/BUILD_MANIFEST.json
            cat-kaopu/workbench/CAT_KAOPU_CURRENT.html
            cat-kaopu/docs/CAT_KAOPU_V441_*.md
            cat-kaopu/qa/CAT_KAOPU_V441_*.json
            cat-kaopu/qa/CAT_KAOPU_V441_*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated V4.41 baseline, workbench and QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cat-kaopu-build-bot'
          git config user.email 'cat-kaopu-build-bot@users.noreply.github.com'
          git add cat-kaopu
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'build(cat): generate V4.41 eyelid and cornea evidence [cat-v441 generated]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
