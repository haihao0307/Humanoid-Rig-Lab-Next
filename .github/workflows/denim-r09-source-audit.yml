name: Denim R09.1 canonical source audit
on:
  push:
    branches: [fix/denim-r09-live-motion-20261011]
    paths: [.github/workflows/denim-r09-source-audit.yml]
permissions:
  contents: write
jobs:
  reproduce-tested-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            denim-workshop
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover missing source template only and reproduce the delivered bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile,shutil,subprocess,hashlib,json
          p=Path('denim-workshop/r09');parent=p.parent/'r08'
          before=(p/'index.html').read_bytes()
          manifest=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert hashlib.sha256(before).hexdigest()==manifest['sha256']
          with tempfile.TemporaryDirectory() as folder:
              root=Path(folder);q=root/'r09';q.mkdir();shutil.copytree(parent,root/'r08')
              for pattern in ['transfer-*.txt','source-*.txt']:
                  for f in p.glob(pattern):shutil.copy2(f,q/f.name)
              for name in ['restore-source.py','finalize-source.py']:shutil.copy2(p/name,q/name)
              for name in ['restore-source.py','finalize-source.py']:subprocess.run(['python',str(q/name)],check=True)
              for name,wanted in manifest['sourceHashes'].items():
                  assert hashlib.sha256((q/name).read_bytes()).hexdigest()==wanted,name
                  assert (q/name).read_bytes()==(p/name).read_bytes(),name
              assert (q/'build.py').read_bytes()==(p/'build.py').read_bytes()
              template=q/'template.html'
              if (p/'template.html').exists():assert (p/'template.html').read_bytes()==template.read_bytes()
              else:shutil.copy2(template,p/'template.html')
          subprocess.run(['python',str(p/'build.py')],check=True)
          assert (p/'index.html').read_bytes()==before,'Rebuild changed the tested runtime'
          report={'passed':True,'version':'R09.1','htmlSha256':manifest['sha256'],'htmlBytes':len(before),'templateSha256':hashlib.sha256((p/'template.html').read_bytes()).hexdigest(),'runtimeChanged':False,'test':'Canonical source reconstruction and exact Python3.12 rebuild; no new visual claim'}
          (p/'SOURCE_REBUILD_RECEIPT.json').write_text(json.dumps(report,indent=2))
          PY
          git diff --exit-code HEAD -- denim-workshop/r08 denim-workshop/r09/index.html denim-workshop/r09/BUILD_MANIFEST.json
      - name: Commit only source completeness and reproducibility receipt
        run: |
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denim-workshop/r09/template.html denim-workshop/r09/SOURCE_REBUILD_RECEIPT.json
          git commit -m 'build(denim): preserve canonical template and byte-identical rebuild receipt [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
