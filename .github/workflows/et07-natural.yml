name: ET07 natural periocular skin
on:
  push:
    branches: [fix/eye-envelope-takeover-et06-20261009]
    paths: ['.github/workflows/et07-natural.yml', 'skin-quality-lab/emily-transfer/natural/**']
permissions:
  contents: write
concurrency:
  group: et072-natural-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            skin-quality-lab/r01
            skin-quality-lab/r02
            skin-quality-lab/emily-transfer
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser, bundler and reproducible image tools
        run: |
          npm install --prefix /tmp/et07-tools --no-audit --no-fund esbuild@0.25.11 playwright@1.56.1 pngjs@7.0.0
          /tmp/et07-tools/node_modules/.bin/playwright install chromium
          python3 -m pip install --target /tmp/et07-python numpy==2.2.6 pillow==11.3.0 opencv-python-headless==4.11.0.86
          timeout 60s sudo apt-get install --no-install-recommends -y fonts-wqy-zenhei || true
      - name: Build same-subject repair and natural tissue candidate
        env:
          NODE_PATH: /tmp/et07-tools/node_modules
          PYTHONPATH: /tmp/et07-python
          ASSET_COMMIT: ${{ github.sha }}
        run: |
          if ! grep -q "VERSION='emily-transfer/7\." skin-quality-lab/emily-transfer/app.js; then
            node skin-quality-lab/emily-transfer/natural/install.cjs
          fi
          if grep -q "VERSION='emily-transfer/7.0.0'" skin-quality-lab/emily-transfer/app.js; then
            node skin-quality-lab/emily-transfer/natural/polish.cjs
          fi
          python3 skin-quality-lab/emily-transfer/natural/repair_atlas.py
          node skin-quality-lab/emily-transfer/natural/install-repair.cjs
          node skin-quality-lab/emily-transfer/anatomy/bundle.cjs
          git diff --exit-code -- skin-quality-lab/r01 skin-quality-lab/r02
          node skin-quality-lab/emily-transfer/talkinghead/test-kernel.mjs
      - name: Actual macro views and source-mark comparison
        env:
          NODE_PATH: /tmp/et07-tools/node_modules
          EVIDENCE_DIR: /tmp/et07/visual
        run: node skin-quality-lab/emily-transfer/natural/visual.cjs
      - name: Preserve candidate and early evidence
        if: always()
        run: |
          mkdir -p /tmp/et07/candidate
          cp skin-quality-lab/emily-transfer/BUILD_MANIFEST.json /tmp/et07/candidate/
          tar -czf /tmp/et07/candidate/source.tgz skin-quality-lab/emily-transfer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: et072-early-visual-review
          path: /tmp/et07
          retention-days: 14
      - name: 45 poses, tissue contacts and actual held-comparison pixels
        env:
          NODE_PATH: /tmp/et07-tools/node_modules
          EVIDENCE_DIR: /tmp/et07/local
        run: node skin-quality-lab/emily-transfer/natural/qa.cjs
      - name: Publish tested isolated candidate
        if: success()
        run: |
          git config user.name 'et07-eye-validation'
          git config user.email 'et07-eye-validation@users.noreply.github.com'
          cp /tmp/et07/local/report.json skin-quality-lab/emily-transfer/natural/qa-report.json
          git add skin-quality-lab/emily-transfer
          if ! git diff --cached --quiet; then
            git commit -m 'build(eyes): ET07.2 capture-mark repair and tested natural tissue [skip ci]'
            git push origin HEAD:fix/eye-envelope-takeover-et06-20261009
          fi
          git rev-parse HEAD | tee /tmp/et07/PUBLISHED_COMMIT.txt
      - name: Independent immutable public HTTPS verification
        if: success()
        env:
          NODE_PATH: /tmp/et07-tools/node_modules
          EVIDENCE_DIR: /tmp/et07/public
        run: |
          export PUBLIC_COMMIT=$(git rev-parse HEAD)
          node skin-quality-lab/emily-transfer/natural/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: et072-complete-browser-evidence
          path: /tmp/et07
          retention-days: 14
