name: Build source-backed turn motion R1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/human-turn-motion-r1-20260930

permissions:
  contents: write

concurrency:
  group: human-turn-motion-r1
  cancel-in-progress: false

jobs:
  derive-test-and-commit:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[turn-reference-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install derivation dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.1.3

      - name: Wire isolated turn module
        run: python tools/apply-turn-motion-r1.py

      - name: Download official CMU subject 69 sources
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/cmu69
          mkdir -p "$target"
          valid_file(){
            local name="$1" path="$target/$1"
            [[ -s "$path" ]] || return 1
            if [[ "$name" == *.asf ]]; then grep -q '^:version' "$path"; else grep -q '^:FULLY-SPECIFIED' "$path"; fi
          }
          download_one(){
            local name="$1" url
            for url in \
              "http://mocap.cs.cmu.edu/subjects/69/$name" \
              "http://mocap.cs.cmu.edu:8080/subjects/69/$name" \
              "https://mocap.cs.cmu.edu/subjects/69/$name"; do
              rm -f "$target/$name"
              if curl -fL --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 720 \
                -A 'Mozilla/5.0 (compatible; KAOPU-Human-Turn-R1/1.0)' -H 'Accept-Encoding: identity' \
                "$url" -o "$target/$name" && valid_file "$name"; then
                echo "downloaded $name from $url"
                return 0
              fi
            done
            return 1
          }
          missing=0
          for name in 69.asf 69_16.amc 69_18.amc 69_20.amc; do
            if ! download_one "$name"; then missing=1; fi
          done
          if [[ "$missing" == 1 ]]; then
            archive=/tmp/allasfamc.zip
            rm -f "$archive"
            obtained=0
            for url in \
              'http://mocap.cs.cmu.edu/allasfamc.zip' \
              'http://mocap.cs.cmu.edu:8080/allasfamc.zip' \
              'https://mocap.cs.cmu.edu/allasfamc.zip'; do
              if curl -fL --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 25 --max-time 2400 \
                -A 'Mozilla/5.0 (compatible; KAOPU-Human-Turn-R1/1.0)' -H 'Accept-Encoding: identity' \
                "$url" -o "$archive" && unzip -tq "$archive" >/dev/null; then
                obtained=1
                echo "downloaded official archive from $url"
                break
              fi
            done
            [[ "$obtained" == 1 ]] || { echo 'Unable to download official CMU ASF/AMC sources.' >&2; exit 1; }
            for name in 69.asf 69_16.amc 69_18.amc 69_20.amc; do
              entry="$(unzip -Z1 "$archive" | awk -v n="$name" '$0 ~ "(^|/)69/" n "$" || $0 == n {print; exit}')"
              [[ -n "$entry" ]] || { echo "Missing $name in official archive" >&2; exit 1; }
              unzip -p "$archive" "$entry" > "$target/$name"
              valid_file "$name" || { echo "Invalid extracted $name" >&2; exit 1; }
            done
          fi
          sha256sum "$target"/* | tee turn-source-sha256.txt
          wc -c "$target"/* | tee turn-source-bytes.txt

      - name: Derive and validate turn score
        shell: bash
        run: |
          set -euo pipefail
          python tools/derive-turn-reference.py /tmp/cmu69 reconstruction/turn-reference.json | tee turn-derive-report.json
          python tools/test-turn-reference.py reconstruction/turn-reference.json | tee turn-reference-validation.json

      - name: Run turn runtime and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node tools/test-turn-motion-r1.mjs | tee turn-runtime-test.json
          node tools/test-turn-command-continuity.mjs | tee turn-controller-regression.json
          node tools/build-pure.mjs | tee turn-build-report.json
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs

      - name: Upload derivation evidence
        uses: actions/upload-artifact@v4
        with:
          name: human-turn-motion-r1-${{ github.sha }}
          path: |
            reconstruction/turn-reference.json
            turn-source-sha256.txt
            turn-source-bytes.txt
            turn-derive-report.json
            turn-reference-validation.json
            turn-runtime-test.json
            turn-controller-regression.json
            turn-build-report.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Commit generated source score and pure entrypoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reconstruction/turn-reference.json \
            source/runtime.template.js \
            source/assembly.json \
            .github/workflows/motion-visual-qa-v2.yml \
            index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat(turn): generate CMU69 turn score R1 [turn-reference-generated] [visual-qa-v2]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summarize
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json, os
          lines=['## Human turn motion R1']
          path=Path('reconstruction/turn-reference.json')
          if path.exists():
              data=json.loads(path.read_text(encoding='utf-8'))
              lines.append(f"- revision: `{data.get('revision')}`")
              for key,clip in data.get('clips',{}).items():
                  seq=clip.get('sequence',{})
                  lines.append(f"- {key}: `{clip.get('sourceTrial')}`, {clip.get('sourceTurnAngleDegrees')}°, {clip.get('durationS')} s, head lead {seq.get('headLeadS')} s")
          lines += ['- runtimeVerified: `false`','- visualAcceptance: `false`','- productionReady: `false`','- The generated commit requests the real-browser visual QA workflow.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as handle:
              handle.write('\n'.join(lines)+'\n')
