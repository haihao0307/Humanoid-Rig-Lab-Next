name: Chicken R9.3 Local Head Candidate Build

on:
  push:
    branches:
      - codex/chicken-r9-2-head-restore
    paths:
      - .github/workflows/chicken-r93-build.yml
      - tools/.build_chicken_r93.py.gz.b64
      - tools/.capture_chicken_r93.mjs.gz.b64
      - tools/build_chicken_r93.py
      - tools/capture_chicken_r93.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chicken-r93-local-head-candidate
  cancel-in-progress: true

jobs:
  build-audit-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize R9.3 source tools
        shell: bash
        run: |
          git show ccc9563e71bf085172234099ff3880a84c9571f8:tools/.build_chicken_r93.py.gz.b64 > /tmp/build_chicken_r93.py.gz.b64
          python - <<'PY'
          import base64, gzip
          from pathlib import Path

          verified = Path('/tmp/build_chicken_r93.py.gz.b64')
          capture = Path('tools/.capture_chicken_r93.mjs.gz.b64')
          Path('tools/build_chicken_r93.py').write_bytes(
              gzip.decompress(base64.b64decode(verified.read_text(encoding='utf-8').strip()))
          )
          Path('tools/capture_chicken_r93.mjs').write_bytes(
              gzip.decompress(base64.b64decode(capture.read_text(encoding='utf-8').strip()))
          )

          path = Path('tools/build_chicken_r93.py')
          text = path.read_text(encoding='utf-8')
          old = " window.__CHICKEN_R93_LAST_HEAD_AUDIT__={movedVertices:moved,maxDisplacement,nonFinite,nonHeadMoved,stationXMonotonic:monotonic,bounds:{min:[minX,minY,minZ],max:[maxX,maxY,maxZ]}};\n return p;"
          new = " const audit={amount:a,movedVertices:moved,maxDisplacement,nonFinite,nonHeadMoved,stationXMonotonic:monotonic,bounds:{min:[minX,minY,minZ],max:[maxX,maxY,maxZ]}};\n // Preserve the active candidate audit; rollback builds must not overwrite it.\n if(a>.5)window.__CHICKEN_R93_LAST_HEAD_AUDIT__=audit;\n else window.__CHICKEN_R93_LAST_ROLLBACK_AUDIT__=audit;\n return p;"
          if old not in text:
              raise SystemExit('Unable to locate R9.3 audit assignment')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tools/build_chicken_r93.py
          node --check tools/capture_chicken_r93.mjs

      - name: Build deterministic R9.3 executable
        run: python tools/build_chicken_r93.py

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.55.0

      - name: Run browser and shape QA
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHICKEN_R93_URL: http://127.0.0.1:8765/CHICKEN_V46_R9_3_HEAD_SHAPE.html
          CHICKEN_R91_URL: http://127.0.0.1:8765/CHICKEN_V46_R9_1.html
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/chicken-r93-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tools/capture_chicken_r93.mjs

      - name: Finalize state, review board and manifest
        run: python tools/build_chicken_r93.py --finalize

      - name: Verify generated gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              Path('CHICKEN_V46_R9_3_HEAD_SHAPE.html'),
              Path('data/CHICKEN_R93_HEAD_SHAPE_PARAMETERS.json'),
              Path('qa/CHICKEN_R93_STATIC_QA.json'),
              Path('qa/CHICKEN_R93_BROWSER_QA.json'),
              Path('evidence/r93/R93_REVIEW_BOARD.html'),
              Path('BUILD_MANIFEST_R93.json'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing generated files: {missing}')
          for path in [Path('qa/CHICKEN_R93_STATIC_QA.json'), Path('qa/CHICKEN_R93_BROWSER_QA.json')]:
              data = json.loads(path.read_text(encoding='utf-8'))
              if not data.get('passed'):
                  raise SystemExit(f'QA failed: {path}')
          print('R9.3 source, browser and bounded-shape gates passed. Manual visual gate remains open.')
          PY

      - name: Upload R9.3 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: chicken-r93-visual-evidence-${{ github.run_number }}
          path: |
            CHICKEN_V46_R9_3_HEAD_SHAPE.html
            data/CHICKEN_R93_HEAD_SHAPE_PARAMETERS.json
            qa/CHICKEN_R93_STATIC_QA.json
            qa/CHICKEN_R93_BROWSER_QA.json
            evidence/r93
            reference/head/APPROVED_HEAD_SHAPE_REFERENCE_2026-09-15.png
            reference/head/previous_user_review
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated R9.3 candidate and evidence
        shell: bash
        run: |
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          rm -f tools/.build_chicken_r93.py.gz.b64 tools/.capture_chicken_r93.mjs.gz.b64
          git add -A \
            tools/.build_chicken_r93.py.gz.b64 \
            tools/.capture_chicken_r93.mjs.gz.b64 \
            tools/build_chicken_r93.py \
            tools/capture_chicken_r93.mjs \
            CHICKEN_V46_R9_3_HEAD_SHAPE.html \
            data/CHICKEN_R93_HEAD_SHAPE_PARAMETERS.json \
            qa/CHICKEN_R93_STATIC_QA.json \
            qa/CHICKEN_R93_BROWSER_QA.json \
            evidence/r93 \
            BUILD_MANIFEST_R93.json \
            01_CURRENT_STATE.json \
            README.md \
            CURRENT_HANDOFF.md \
            CURRENT_FULL_HANDOFF.md \
            06_NEXT_STAGE_PLAN.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build Chicken V4.6 R9.3 local head candidate [skip ci]"
            git push origin HEAD:codex/chicken-r9-2-head-restore
          fi
