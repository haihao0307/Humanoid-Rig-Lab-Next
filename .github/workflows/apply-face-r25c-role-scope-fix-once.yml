name: Apply face R25C role-scope fix once

on:
  push:
    branches:
      - feature/face-features-r25-20260919
    paths:
      - tools/apply-face-r25c-role-scope-fix.mjs
      - .github/workflows/apply-face-r25c-role-scope-fix-once.yml

permissions:
  contents: write

jobs:
  apply-role-scope-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact face branch
        uses: actions/checkout@v4
        with:
          ref: feature/face-features-r25-20260919
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply role-scoped face data correction
        run: node tools/apply-face-r25c-role-scope-fix.mjs

      - name: Rebuild generated workbench entry
        run: node tools/build-pure.mjs

      - name: Validate source, skin and face boundaries
        run: |
          node tools/check-pure.mjs
          node tools/check-face-r25-baseline.mjs
          node tools/check-skin-appearance.mjs
          node tools/test-beard-anatomy.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-identity-warp.mjs
          node tools/test-npc-face-uniforms.mjs

      - name: Commit production files and generated entry
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No role-scope changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add body/SkinAppearance.js tools/check-skin-appearance.mjs .github/workflows/face-r25c-framebuffer-preview.yml docs/face-knowledge/R25C_CLEAN_SHAVEN_NEUTRAL_SKIN_20260920.md index.html FILE_AUDIT.json SHA256SUMS.txt
          git commit -m "face R25C: scope clean skin to current character"
          git push origin HEAD:feature/face-features-r25-20260919
