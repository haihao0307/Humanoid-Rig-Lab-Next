name: Cat surface shortlist direct download

on:
  push:
    branches:
      - experiment/cat-authoritative-reference-intake-v1-20260911
    paths:
      - .github/workflows/cat-surface-shortlist-direct-download.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download two additional CC BY cat candidates
        run: |
          set -euo pipefail
          mkdir -p shortlist
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 \
            --output shortlist/cat-v1-7239efeec7104dc3af46a8842a66aec0.glb \
            'https://huggingface.co/datasets/allenai/objaverse/resolve/main/glbs/000-047/7239efeec7104dc3af46a8842a66aec0.glb'
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 \
            --output shortlist/smoothie-cat-fc89fe933afe448084682263a5d0f10e.glb \
            'https://huggingface.co/datasets/allenai/objaverse/resolve/main/glbs/000-044/fc89fe933afe448084682263a5d0f10e.glb'
          sha256sum shortlist/*.glb | tee shortlist/SHA256SUMS.txt
          test -s shortlist/cat-v1-7239efeec7104dc3af46a8842a66aec0.glb
          test -s shortlist/smoothie-cat-fc89fe933afe448084682263a5d0f10e.glb
      - uses: actions/upload-artifact@v4
        with:
          name: cat-living-surface-shortlist
          path: shortlist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
