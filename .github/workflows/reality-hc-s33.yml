name: Reality HC S3.3 garment relations
on:
  push:
    branches: [feature/reality-hc-s33-garment-relations-20261020]
    paths: [.github/workflows/reality-hc-s33.yml, reality-lab/hc-s3-3/RUN_REQUEST.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
          sparse-checkout: |
            reality-lab/hc-s3-3
            reality-lab/hc-s3-2
            reality-lab/hc-s2-1
      - uses: actions/checkout@v4
        with:
          repository: haihao0307/guilin-dem-pipeline
          ref: c5c0bedbc35f24cbb35426ab9c14b74ca7fc5f49
          path: host
          sparse-checkout: kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
      - name: Install fixed browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Read actual D03 without changing original runtime
        env:
          GARMENT_HOST: ${{ github.workspace }}/host/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
        run: python platform/reality-lab/hc-s3-3/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-s33-native-observation
          path: |
            platform/reality-lab/hc-s3-3/qa/native/
            platform/reality-lab/hc-s3-3/runtime-observation.json
          retention-days: 30
