name: Export Bird R006 Source Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-bird-r006-source-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact R006 source directory
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r006-source
          path: BIRD_SEAGULL_A_FLIGHT_CYCLE_R006
          if-no-files-found: error
          retention-days: 7
