name: Bird Seagull A R0.04 GitHub Pages Preview

on:
  push:
    branches:
      - handoff/bird-seagull-a-direct-open-r001-20260923
    paths:
      - 'BIRD_SEAGULL_A_DIRECT_OPEN_R004/**'
      - 'BIRD_SEAGULL_A_DIRECT_OPEN_R003/data/**'
      - '.github/workflows/bird-seagull-a-r004-pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  hosted-browser-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIRD_SEAGULL_A_R004_QA_URL: https://haihao0307.github.io/Humanoid-Rig-Lab-Next/BIRD_SEAGULL_A_DIRECT_OPEN_R004/index.html?qa=pages
      BIRD_SEAGULL_A_R004_QA_ROOT: artifacts/bird-seagull-a-r004-pages-qa
    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Wait for the deployed one-click page
        run: |
          curl -L --fail --retry 12 --retry-all-errors --retry-delay 5 --max-time 180 "$BIRD_SEAGULL_A_R004_QA_URL" >/dev/null

      - name: Audit exact GitHub Pages URL on desktop and mobile
        run: node BIRD_SEAGULL_A_DIRECT_OPEN_R004/qa.mjs

      - name: Upload hosted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-a-r004-github-pages-evidence
          path: artifacts/bird-seagull-a-r004-pages-qa
          if-no-files-found: warn
          retention-days: 30
