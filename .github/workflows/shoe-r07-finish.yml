name: Shoe R07 finishing verification
on:
  push:
    branches: [fix/shoe-r07-seam-sole-finish-20261011]
    paths: ['shoe-workshop/r07/**', '.github/workflows/shoe-r07-finish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shoe-r07-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shoe-workshop
          fetch-depth: 1
      - name: Initialize only absent readable source adapters
        run: python shoe-workshop/r07/tools/init-scaffold.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned geometry and browser dependencies
        run: |
          npm install --prefix shoe-workshop --no-save --package-lock=false three@0.179.1 esbuild@0.25.10 playwright@1.56.0
          cd shoe-workshop && npx playwright install --with-deps chromium
      - name: Build current standalone runtime
        run: node shoe-workshop/r07/tools/build.mjs
      - name: Current early render diagnosis
        continue-on-error: true
        run: node shoe-workshop/r07/tests/early-render.mjs
      - name: Preserve current early visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoe-r07-early-${{ github.run_id }}
          path: shoe-workshop/r07/evidence/early/
          retention-days: 14
      - name: Verify actual geometry, metric holes and skin attachment
        id: numeric
        continue-on-error: true
        run: node shoe-workshop/r07/tests/kernel.mjs
      - name: Actual standalone file browser and interactions
        id: browser
        continue-on-error: true
        run: node shoe-workshop/r07/tests/browser.mjs
      - name: Require both verification gates
        run: |
          test '${{ steps.numeric.outcome }}' = 'success'
          test '${{ steps.browser.outcome }}' = 'success'
      - name: Fast-forward publish only verified R07 source and build
        id: publish
        run: |
          git config user.name 'Shoe R07 Build'
          git config user.email 'shoe-r07@users.noreply.github.com'
          git add shoe-workshop/r07
          if git diff --cached --name-only | grep -v '^shoe-workshop/r07/'; then exit 1; fi
          git commit -m 'build(shoes): verified R07 readable source and standalone candidate [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Exact immutable public browser and complete byte comparison
        env:
          PUBLIC_BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          node shoe-workshop/r07/tests/browser.mjs --public
          git add shoe-workshop/r07/evidence/public shoe-workshop/r07/PUBLIC_URL.txt
          git commit -m 'test(shoes): R07 immutable public browser and byte receipt [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Preserve current source and real browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoe-r07-candidate-${{ github.run_id }}
          path: shoe-workshop/r07/
          include-hidden-files: true
          retention-days: 14
