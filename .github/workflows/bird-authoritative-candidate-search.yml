name: Bird R57 Authoritative Species Model Search

on:
  push:
    branches:
      - experiment/bird-r57-authoritative-reference-reconstruction-v1
    paths:
      - '.github/workflows/bird-authoritative-candidate-search.yml'

permissions:
  contents: read

jobs:
  search-authoritative-models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search museum and research repositories
        shell: python
        run: |
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          OUT = pathlib.Path('bird-authoritative-search')
          RAW = OUT / 'raw'
          RAW.mkdir(parents=True, exist_ok=True)

          headers = {
              'Accept': 'application/json',
              'User-Agent': 'Humanoid-Rig-Lab-Next-Bird-R57/1.0 (+https://github.com/haihao0307/Humanoid-Rig-Lab-Next)'
          }

          def fetch_json(url, label):
              last = None
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=45) as response:
                          data = response.read()
                      (RAW / f'{label}.json').write_bytes(data)
                      return json.loads(data.decode('utf-8'))
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              (RAW / f'{label}.error.txt').write_text(repr(last) + '\n', encoding='utf-8')
              return {'_error': repr(last), '_url': url}

          def sketchfab_models(payload):
              results = payload.get('results', {}) if isinstance(payload, dict) else {}
              if isinstance(results, dict):
                  models = results.get('models', [])
              elif isinstance(results, list):
                  models = results
              else:
                  models = []
              return models if isinstance(models, list) else []

          def text_of(value):
              if value is None:
                  return ''
              if isinstance(value, str):
                  return value
              return json.dumps(value, ensure_ascii=False, sort_keys=True)

          def model_score(model):
              name = text_of(model.get('name')).lower()
              description = text_of(model.get('description')).lower()
              user = model.get('user') or {}
              username = text_of(user.get('username')).lower()
              display_name = text_of(user.get('displayName')).lower()
              hay = ' '.join([name, description, username, display_name])
              score = 0
              if 'spilopelia chinensis' in hay: score += 120
              if 'streptopelia chinensis' in hay: score += 110
              if 'spotted dove' in hay: score += 90
              if 'moorelab' in hay or 'moore lab' in hay: score += 80
              if model.get('isDownloadable'): score += 30
              license_value = text_of(model.get('license')).lower()
              if 'cc-by' in license_value or 'attribution' in license_value: score += 20
              if any(x in hay for x in ['museum', 'specimen', 'mlz:bird', 'photogrammetry']): score += 30
              return score

          sketchfab_queries = [
              ('sketchfab_exact_current', {'type': 'models', 'q': 'Spilopelia chinensis', 'downloadable': 'true', 'count': 100}),
              ('sketchfab_exact_synonym', {'type': 'models', 'q': 'Streptopelia chinensis', 'downloadable': 'true', 'count': 100}),
              ('sketchfab_common_name', {'type': 'models', 'q': 'Spotted Dove', 'downloadable': 'true', 'count': 100}),
              ('sketchfab_moorelab_exact', {'type': 'models', 'q': 'Spilopelia chinensis', 'user': 'MooreLab', 'count': 100}),
              ('sketchfab_moorelab_common', {'type': 'models', 'q': 'Spotted Dove', 'user': 'MooreLab', 'count': 100}),
          ]

          collected = {}
          query_records = []
          for label, params in sketchfab_queries:
              url = 'https://api.sketchfab.com/v3/search?' + urllib.parse.urlencode(params)
              payload = fetch_json(url, label)
              models = sketchfab_models(payload)
              query_records.append({'label': label, 'url': url, 'result_count': len(models), 'error': payload.get('_error') if isinstance(payload, dict) else None})
              for model in models:
                  uid = model.get('uid')
                  if uid:
                      collected[uid] = model

          ranked = sorted(collected.values(), key=model_score, reverse=True)
          details = []
          for model in ranked[:30]:
              uid = model.get('uid')
              detail = fetch_json(f'https://api.sketchfab.com/v3/models/{uid}', f'sketchfab_model_{uid}')
              if isinstance(detail, dict) and '_error' not in detail:
                  details.append(detail)
              else:
                  details.append(model)

          gbif_names = ['Spilopelia chinensis', 'Streptopelia chinensis']
          gbif = []
          for index, name in enumerate(gbif_names):
              url = 'https://api.gbif.org/v1/species/match?' + urllib.parse.urlencode({'name': name})
              gbif.append(fetch_json(url, f'gbif_match_{index}'))

          morpho_queries = []
          for index, name in enumerate(gbif_names):
              for endpoint in ['media', 'physical-objects']:
                  params = {'search_field': 'all_fields', 'q': name, 'per_page': 100}
                  url = f'https://www.morphosource.org/api/{endpoint}?' + urllib.parse.urlencode(params)
                  payload = fetch_json(url, f'morphosource_{endpoint}_{index}')
                  response = payload.get('response', {}) if isinstance(payload, dict) else {}
                  items = []
                  if isinstance(response, dict):
                      for key in ['media', 'physical_objects', 'physical-objects', 'objects']:
                          value = response.get(key)
                          if isinstance(value, list):
                              items = value
                              break
                  morpho_queries.append({
                      'name': name,
                      'endpoint': endpoint,
                      'url': url,
                      'result_count': len(items),
                      'items': items,
                      'error': payload.get('_error') if isinstance(payload, dict) else None,
                  })

          def compact_model(model):
              user = model.get('user') or {}
              license_value = model.get('license')
              return {
                  'uid': model.get('uid'),
                  'name': model.get('name'),
                  'description': model.get('description'),
                  'viewerUrl': model.get('viewerUrl'),
                  'uri': model.get('uri'),
                  'user': {
                      'username': user.get('username'),
                      'displayName': user.get('displayName'),
                      'profileUrl': user.get('profileUrl'),
                  },
                  'isDownloadable': model.get('isDownloadable'),
                  'isPublished': model.get('isPublished'),
                  'license': license_value,
                  'faceCount': model.get('faceCount'),
                  'vertexCount': model.get('vertexCount'),
                  'publishedAt': model.get('publishedAt'),
                  'createdAt': model.get('createdAt'),
                  'archives': model.get('archives'),
                  'score': model_score(model),
              }

          compact = sorted([compact_model(m) for m in details], key=lambda m: m['score'], reverse=True)
          exact = [m for m in compact if any(token in (' '.join([text_of(m.get('name')), text_of(m.get('description'))])).lower() for token in ['spilopelia chinensis', 'streptopelia chinensis', 'spotted dove'])]

          recommendation = {
              'primary_species_surface': None,
              'canonical_topology': {
                  'project': 'AVES',
                  'repository': 'yufu-wang/aves',
                  'asset': 'bird_meshes/template.ply',
                  'role': 'canonical topology and cross-species shape basis'
              },
              'articulated_rig': {
                  'project': '3D Bird Reconstruction',
                  'repository': 'marcbadger/avian-mesh',
                  'asset': 'models/bird_eccv.json',
                  'role': 'skeleton, skin weights and keypoint regressor'
              },
              'status': 'no exact downloadable species model confirmed'
          }
          if exact:
              recommendation['primary_species_surface'] = exact[0]
              recommendation['status'] = 'exact species candidate found; license and download route require final verification'

          report = {
              'schema': 'humanoid-rig-lab-next/bird-authoritative-model-search@1.0',
              'searched_at_utc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'target_species': {
                  'accepted_name': 'Spilopelia chinensis',
                  'legacy_synonym': 'Streptopelia chinensis',
                  'common_name': 'Spotted Dove'
              },
              'sketchfab_queries': query_records,
              'sketchfab_ranked_candidates': compact,
              'sketchfab_exact_candidates': exact,
              'gbif_name_resolution': gbif,
              'morphosource_queries': morpho_queries,
              'recommendation': recommendation,
              'download_policy': {
                  'sketchfab': 'metadata search is public; model archive download requires authenticated Sketchfab access',
                  'morphosource': 'metadata search is public; file download may require API key, use statement and terms acceptance',
                  'do_not_bypass_access_controls': True
              }
          }
          (OUT / 'AUTHORITATIVE_MODEL_SEARCH_REPORT.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lines = [
              '# Bird R57 Authoritative Species Model Search',
              '',
              'Target: Spilopelia chinensis, legacy synonym Streptopelia chinensis, common name Spotted Dove.',
              '',
              f'Sketchfab unique candidates: {len(compact)}',
              f'Sketchfab exact candidates: {len(exact)}',
              '',
              'Top candidates:'
          ]
          for item in compact[:12]:
              lines.append(f"* {item.get('name')} | {item.get('uid')} | user={item.get('user',{}).get('username')} | downloadable={item.get('isDownloadable')} | faces={item.get('faceCount')} | score={item.get('score')}")
          lines += ['', 'Recommendation status:', recommendation['status'], '']
          (OUT / 'SUMMARY.md').write_text('\n'.join(lines), encoding='utf-8')

      - name: Package search evidence
        run: zip -r BIRD_R57_AUTHORITATIVE_SPECIES_MODEL_SEARCH.zip bird-authoritative-search

      - uses: actions/upload-artifact@v4
        with:
          name: BIRD_R57_AUTHORITATIVE_SPECIES_MODEL_SEARCH
          path: |
            bird-authoritative-search/
            BIRD_R57_AUTHORITATIVE_SPECIES_MODEL_SEARCH.zip
          retention-days: 30
