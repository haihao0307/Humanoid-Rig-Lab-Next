name: Apply face R25B once

on:
  push:
    branches:
      - feature/face-features-r25-20260919
    paths:
      - tools/apply-face-r25b.mjs
      - tools/apply-face-r25b-v2.mjs
      - .github/workflows/apply-face-r25b-once.yml

permissions:
  contents: write

jobs:
  apply-r25b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout R25 branch
        uses: actions/checkout@v4
        with:
          ref: feature/face-features-r25-20260919
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply R25B source patch
        run: |
          node tools/apply-face-r25b.mjs
          node tools/apply-face-r25b-v2.mjs

      - name: Build generated workbench entry
        run: node tools/build-pure.mjs

      - name: Check source assembly
        run: node tools/check-pure.mjs

      - name: Check frozen face baseline
        run: node tools/check-face-r25-baseline.mjs

      - name: Check eye source and parameter fixtures
        run: node tools/check-eye-anatomy.mjs --parameter-fixtures

      - name: Check aperture family
        run: node tools/test-eye-aperture-family.mjs

      - name: Check identity and NPC regressions
        run: |
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-identity-warp.mjs
          node tools/test-npc-face-uniforms.mjs

      - name: Commit R25B production changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No R25B changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add body/EyeAnatomy.js README.md docs/face-knowledge/R25B_EYE_APERTURE_FAMILY_20260919.md tools/check-eye-anatomy.mjs tools/check-face-r25-baseline.mjs tools/test-eye-aperture-family.mjs .github/workflows/face-r25-source-check.yml index.html FILE_AUDIT.json SHA256SUMS.txt
          git commit -m "face R25B: unify canthus-owned eyelid aperture family"
          git push origin HEAD:feature/face-features-r25-20260919
