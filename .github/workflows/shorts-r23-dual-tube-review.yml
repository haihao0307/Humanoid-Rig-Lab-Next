name: Shorts R2.3b dual-tube review
on:
  push:
    branches: [fix/shorts-two-leg-assembly-r2-20260919]
    paths:
      - 'clothing/ShortsDualTubeR2.js'
      - 'tools/apply-shorts-r23-dual-tube.mjs'
      - 'tools/apply-shorts-r23-dual-separation-fix.mjs'
      - 'tools/test-shorts-dual-tube-r2.mjs'
      - 'tools/review-shorts-dual-tube-r23.mjs'
      - '.github/workflows/shorts-r23-dual-tube-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shorts-r23-dual-tube-review
  cancel-in-progress: true
jobs:
  actual-browser-dual-tube:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Separate the two open rise workspaces
        run: node tools/apply-shorts-r23-dual-separation-fix.mjs
      - name: Wire canonical R2.3b dual-tube source
        run: node tools/apply-shorts-r23-dual-tube.mjs
      - name: Build and test canonical source
        shell: bash
        run: |
          mkdir -p /tmp/shorts-r23-dual-tube
          set -o pipefail
          {
            node tools/apply-shorts-r23-left-tube.mjs
            node tools/build-pure.mjs
            node tools/build-shorts-preview.mjs
            node tools/check-pure.mjs
            node --test tools/test-shorts-*.mjs
          } 2>&1 | tee /tmp/shorts-r23-dual-tube/build-and-test.log
      - name: Retain validated canonical source
        run: |
          test "$GITHUB_REF_NAME" = "fix/shorts-two-leg-assembly-r2-20260919"
          git add source/assembly.json source/runtime.template.js clothing/ClothShorts.js clothing/ShortsDualTubeR2.js index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(shorts): form separated left and right R2.3b tubes'
            git push origin HEAD:fix/shorts-two-leg-assembly-r2-20260919
          fi
      - name: Install isolated browser dependency
        run: |
          mkdir -p /tmp/shorts-browser
          npm install --prefix /tmp/shorts-browser --no-audit --no-fund playwright@1.55.0
          /tmp/shorts-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture actual R2.3b progress views
        run: |
          python3 -m http.server 8793 --bind 127.0.0.1 >/tmp/shorts-r23-dual-http.log 2>&1 &
          node tools/review-shorts-dual-tube-r23.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-r2-3-dual-tube-progress
          path: /tmp/shorts-r23-dual-tube
          if-no-files-found: error
          retention-days: 14
