name: Hat R03 Measured Mothers Build and Public QA
on:
  push:
    branches: [fix/hat-r02-takeover-20261011]
    paths:
      - hat-workshop/r03/*.mjs
      - hat-workshop/r03/*.py
      - hat-workshop/r03/fit/*.mjs
      - .github/workflows/hat-r03-build.yml
permissions:
  contents: write
concurrency:
  group: hat-r03-measured-mothers
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRANCH: fix/hat-r02-takeover-20261011
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            hat-workshop/r01
            hat-workshop/r02
            hat-workshop/r03
            docs/workbench-build-system
      - name: Fixed tools and inspectable production sources
        run: |
          npm install --no-save three@0.179.1 esbuild@0.25.9
          python3 -m pip install numpy pillow playwright
          python3 -m playwright install --with-deps chromium
          python3 hat-workshop/r03/upgrade.py
          python3 hat-workshop/r03/record.py
          python3 -m py_compile hat-workshop/r03/*.py
          node --check hat-workshop/r03/app.js
          node --check hat-workshop/r03/mother.mjs
          node --check hat-workshop/r03/surface.mjs
          node --check hat-workshop/r03/fit/field.mjs
          cp hat-workshop/r02/THREE_LICENSE.txt hat-workshop/r03/THREE_LICENSE.txt
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Regenerable source control nets with original licensed textures
        run: python3 -u hat-workshop/r03/build.py --assets
      - name: Reference fidelity, dimensions, continuity and eleven by three measured fits
        run: node hat-workshop/r03/verify.mjs
      - name: Commit immutable sources and mother data
        run: |
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'KAOPU Hat Workbench'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hat-workshop/r03/app.js hat-workshop/r03/shell.html hat-workshop/r03/assets hat-workshop/r03/ASSET_MANIFEST.json hat-workshop/r03/MOTHER_REPRESENTATION.json hat-workshop/r03/README.md hat-workshop/r03/SESSION_LOG.md hat-workshop/r03/THREE_LICENSE.txt hat-workshop/r03/qa/numeric WORKBENCH_BUILD_SYSTEM.md docs/workbench-build-system/RUNBOOK.md docs/workbench-build-system/HAT_R03_MEASURED_MOTHERS.md
          if ! git diff --cached --quiet; then git commit -m 'hat: freeze R03.1 smooth measured mother source and numeric gates [skip ci]'; git push origin HEAD:$BRANCH; fi
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "DATA_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_HEAD=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Build identical-quality public and standalone pages
        run: |
          python3 -u hat-workshop/r03/build.py --pages --data-sha "$DATA_SHA" --source-sha "$SOURCE_SHA"
          python3 -c "import json; assert json.load(open('hat-workshop/r03/BUILD_MANIFEST.json'))['version']=='HAT-R03.1'"
      - name: Real standalone Chromium regression
        run: python3 -u hat-workshop/r03/qa.py
      - name: Publish tested fixed browser candidate
        run: |
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git add hat-workshop/r03/index.html hat-workshop/r03/standalone.html hat-workshop/r03/app.bundle.js hat-workshop/r03/BUILD_MANIFEST.json hat-workshop/r03/qa/local
          find hat-workshop/r03/qa/local -type f \( -name '*.png' -o -name '*.jpg' \) -print0 | xargs -0 -r git add -f --
          git commit -m 'hat: publish tested R03.1 smooth fit candidate and local evidence [skip ci]'
          git push origin HEAD:$BRANCH
          BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_HEAD=$BUILD_SHA" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/$BUILD_SHA/hat-workshop/r03/index.html" >> "$GITHUB_ENV"
      - name: Real immutable HTTPS Chromium regression and byte verification
        run: |
          python3 -u hat-workshop/r03/qa.py --url "$PUBLIC_URL"
          python3 - <<'PY'
          import os,json,hashlib,urllib.request,pathlib
          root=pathlib.Path('hat-workshop/r03')
          m=json.loads((root/'BUILD_MANIFEST.json').read_text())
          reports={k:json.loads((root/'qa'/k/'report.json').read_text()) for k in ['numeric','local','public']}
          assert all(r['passed'] for r in reports.values()) and m['version']=='HAT-R03.1'
          raw='https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/'+os.environ['BUILD_SHA']+'/hat-workshop/r03/index.html'
          actual=urllib.request.urlopen(raw,timeout=120).read()
          assert hashlib.sha256(actual).hexdigest()==m['htmlSHA256']
          receipt={'version':m['version'],'baselineSha':m['baselineSha'],'sourceSha':os.environ['SOURCE_SHA'],'dataSha':os.environ['DATA_SHA'],'buildSha':os.environ['BUILD_SHA'],'publicURL':os.environ['PUBLIC_URL'],'publicHTMLSHA256':m['htmlSHA256'],'publicBytes':m['publicBytes'],'standaloneSHA256':m['standaloneSHA256'],'standaloneBytes':m['standaloneBytes'],'numericChecks':len(reports['numeric']['checks']),'localChecks':len(reports['local']['checks']),'publicChecks':len(reports['public']['checks']),'fileVerified':True,'publicVerified':True,'acceptedBaseline':'R02 replication appearance only','R03UserAccepted':False,'pureAnalyticReconstruction':False,'sourceControlNetRegeneration':True,'dynamicCollisionVerified':False,'materialCalibrated':False,'physicalPhoneTested':False,'reviewType':'same-assistant self-review; final image observations recorded separately','rejectedIntermediateBuild':'f531d067613feecf6a367788299870e05235b037','workflowRun':os.environ['GITHUB_RUN_ID']}
          (root/'DELIVERY.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2))
          print('DELIVERY',json.dumps(receipt),flush=True)
          PY
      - name: Preserve real public evidence and actual receipt
        run: |
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git add hat-workshop/r03/qa/public hat-workshop/r03/DELIVERY.json
          find hat-workshop/r03/qa/public -type f \( -name '*.png' -o -name '*.jpg' \) -print0 | xargs -0 -r git add -f --
          git commit -m 'hat: preserve actual R03.1 fixed-public checks, failures and limits [skip ci]'
          git push origin HEAD:$BRANCH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hat-r03-measured-mothers-evidence
          path: |
            hat-workshop/r03/qa
            hat-workshop/r03/*.js
            hat-workshop/r03/*.mjs
            hat-workshop/r03/*.py
            hat-workshop/r03/*.html
            hat-workshop/r03/*.json
            hat-workshop/r03/*.md
            hat-workshop/r03/THREE_LICENSE.txt
            hat-workshop/r03/fit
            hat-workshop/r03/assets
            docs/workbench-build-system/HAT_R03_MEASURED_MOTHERS.md
            docs/workbench-build-system/HAT_R03_GEOMETRY_GATE.md
          retention-days: 14
