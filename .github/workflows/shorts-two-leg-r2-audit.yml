name: Shorts two-leg R2 audit
on:
  push:
    branches: [fix/shorts-two-leg-assembly-r2-20260919]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shorts-two-leg-r2-audit
  cancel-in-progress: true
jobs:
  source-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble canonical source
        run: |
          node tools/build-pure.mjs
          node tools/build-shorts-preview.mjs
          node tools/check-pure.mjs
      - name: Run all shorts tests
        run: node --test tools/test-shorts-*.mjs
      - name: Archive exact staged source
        if: always()
        run: |
          mkdir -p /tmp/shorts-two-leg-r2
          git rev-parse HEAD > /tmp/shorts-two-leg-r2/SOURCE_COMMIT.txt
          tar --exclude=.git --exclude=node_modules -czf /tmp/shorts-two-leg-r2/working-tree.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-two-leg-r2-source
          path: /tmp/shorts-two-leg-r2
          retention-days: 7
