name: Deploy Bird Seagull R006 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'BIRD_SEAGULL_A_FLIGHT_CYCLE_R006/**'
      - '.github/workflows/bird-seagull-r006-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate source geometry and animation payloads
        shell: bash
        run: |
          set -euo pipefail
          dir=BIRD_SEAGULL_A_FLIGHT_CYCLE_R006
          test -f "$dir/index.html"
          test -f "$dir/runtime/viewer-00.js"
          test -f "$dir/runtime/bootstrap.js"
          test -f "$dir/manifest.json"
          test "$(find "$dir/data" -name 'form-*.js' | wc -l)" -eq 5
          test "$(find "$dir/data" -name 'anim-*.js' | wc -l)" -eq 1
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),zlib=require('zlib'),crypto=require('crypto');
          const dir='BIRD_SEAGULL_A_FLIGHT_CYCLE_R006';global.window={};
          for(const f of fs.readdirSync(`${dir}/data`).filter(x=>x.startsWith('form-')).sort())vm.runInThisContext(fs.readFileSync(`${dir}/data/${f}`,'utf8'));
          for(const f of fs.readdirSync(`${dir}/data`).filter(x=>x.startsWith('anim-')).sort())vm.runInThisContext(fs.readFileSync(`${dir}/data/${f}`,'utf8'));
          const m=JSON.parse(fs.readFileSync(`${dir}/manifest.json`,'utf8'));
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const g64=window.__BIRD_FORM,a64=window.__BIRD_R006_ANIM;
          if(g64.length!==39900||sha(Buffer.from(g64))!==m.geometryBase64Sha256)throw new Error('geometry Base64 mismatch');
          const gg=Buffer.from(g64,'base64'),gr=zlib.gunzipSync(gg);if(sha(gg)!==m.geometryGzipSha256||sha(gr)!==m.geometryRawSha256)throw new Error('geometry payload SHA mismatch');
          if(gr.readUInt32LE(0)!==4416||gr.readUInt32LE(4)!==16872)throw new Error('geometry counts mismatch');
          if(a64.length!==m.animationPayloadChars||sha(Buffer.from(a64))!==m.animationBase64Sha256)throw new Error('animation Base64 mismatch');
          const ag=Buffer.from(a64,'base64'),ar=zlib.gunzipSync(ag);if(sha(ag)!==m.animationGzipSha256||sha(ar)!==m.animationRawSha256)throw new Error('animation payload SHA mismatch');
          if(ar.subarray(0,8).toString()!=='BANIM006'||ar.readUInt32LE(8)!==6||ar.readUInt32LE(12)!==4416||ar.readUInt32LE(16)!==50||ar.readUInt32LE(20)!==20)throw new Error('animation header mismatch');
          console.log({geometryBytes:gr.length,animationBytes:ar.length,manifest:m});
          NODE

      - name: Prepare minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a BIRD_SEAGULL_A_FLIGHT_CYCLE_R006/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  live-browser-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BIRD_R006_QA_URL: ${{ needs.deploy.outputs.page_url }}?qa=${{ github.run_id }}
      BIRD_R006_QA_ROOT: artifacts/bird-r006-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify exact deployed page, visible source bird, pose change, controls and mobile panels
        run: node BIRD_SEAGULL_A_FLIGHT_CYCLE_R006/qa.mjs
      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r006-live
          path: artifacts/bird-r006-live
          if-no-files-found: warn
          retention-days: 90
