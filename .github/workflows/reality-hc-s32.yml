name: Reality HC S3.2 source installation acceptance
on:
  push:
    branches: [feature/reality-hc-s32-source-install-20261020]
    paths: [.github/workflows/reality-hc-s32.yml, reality-lab/hc-s3-2/RUN_REQUEST.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.portal.outputs.sha }}
      url: ${{ steps.portal.outputs.url }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_url: ${{ steps.source.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            reality-lab/hc-s3-2
            reality-lab/hc-s3-1-c
            reality-lab/hc-s3-1-b
            reality-lab/hc-s3-1
            reality-lab/hc-s2-1
      - uses: actions/checkout@v4
        with:
          ref: feature/denim-r17-reality-s32-trial-20261020
          path: source-native
          sparse-checkout: denim-workshop/r17-scale
      - name: Lock current source and bounded platform changes
        id: baseline
        run: |
          git fetch --filter=blob:none --depth=1 origin c2eeb3b5c43395db34a36eee7c48b8a2b05fabfe
          git -C source-native fetch --filter=blob:none --depth=1 origin feature/denim-r17-garment-scale-20261015
          test "$(git -C source-native rev-parse FETCH_HEAD)" = "22cdb3f4c3bfd101bd86f0ffa246d255b561d915"
          echo "source_before=$(git -C source-native rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          import ast,json,subprocess
          r=Path('reality-lab/hc-s3-2');changed=subprocess.check_output(['git','diff','--name-only','c2eeb3b5c43395db34a36eee7c48b8a2b05fabfe','HEAD'],text=True).splitlines()
          assert changed and all(p.startswith('reality-lab/hc-s3-2/') or p=='.github/workflows/reality-hc-s32.yml' for p in changed),changed
          for p in r.rglob('*.py'):ast.parse(p.read_text(),filename=str(p))
          q=r/'qa/source';q.mkdir(parents=True,exist_ok=True);(q/'SCOPE.json').write_text(json.dumps({'passed':True,'platformPaths':changed,'productionSourceChanged':False,'otherDomainsTouched':[]},indent=2))
          PY
      - name: Prepare reversible native-source trial and protocol checks
        run: |
          python reality-lab/hc-s3-2/build.py prepare --source-root source-native
          node reality-lab/hc-s3-2/tests/protocol.cjs
      - name: Install pinned browser
        run: |
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Independent installed source and original pixel test
        env:
          RF32_KIND: source
          RF32_QA: ${{ github.workspace }}/reality-lab/hc-s3-2/qa/source-file
        run: python reality-lab/hc-s3-2/tests/browser.py
      - name: Freeze the tested source on its own trial branch
        id: source
        env:
          EXPECTED_SOURCE_HEAD: ${{ steps.baseline.outputs.source_before }}
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=Path('reality-lab/hc-s3-2')
          for name in ['qa/source/SCOPE.json','qa/source/INSTALL_TEST.json','qa/source/PROTOCOL.json','qa/source-file/BROWSER.json']:assert json.loads((r/name).read_text())['passed'],name
          subprocess.run(['git','-C','source-native','add','denim-workshop/r17-scale/preview-v3.html','denim-workshop/r17-scale/reality-s32'],check=True)
          paths=subprocess.check_output(['git','-C','source-native','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(p=='denim-workshop/r17-scale/preview-v3.html' or p.startswith('denim-workshop/r17-scale/reality-s32/') for p in paths),paths
          (r/'qa/source/SOURCE_SCOPE.json').write_text(json.dumps({'passed':True,'paths':paths,'sourceTrialOnly':True,'productionBranchChanged':False},indent=2))
          PY
          git -C source-native fetch --filter=blob:none --depth=1 origin feature/denim-r17-reality-s32-trial-20261020
          test "$(git -C source-native rev-parse FETCH_HEAD)" = "$EXPECTED_SOURCE_HEAD"
          git -C source-native config user.name github-actions[bot]
          git -C source-native config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C source-native commit -m 'feat(denim): install reversible RF01 reader in isolated R17 source trial'
          git -C source-native push origin HEAD:refs/heads/feature/denim-r17-reality-s32-trial-20261020
          SHA=$(git -C source-native rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/$SHA/denim-workshop/r17-scale/preview-v3.html" >> "$GITHUB_OUTPUT"
      - name: Verify published native source independently
        env:
          RF32_KIND: source
          RF32_INSTALL_COMMIT: ${{ steps.source.outputs.sha }}
          RF32_URL: ${{ steps.source.outputs.url }}
          RF32_QA: ${{ github.workspace }}/reality-lab/hc-s3-2/qa/source-public
        run: python reality-lab/hc-s3-2/tests/browser.py
      - name: Build registry only from verified source receipt
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python reality-lab/hc-s3-2/build.py portal --source-commit "$SOURCE_SHA"
      - name: Standalone three-material portal and installation states
        env:
          RF32_KIND: portal
          RF32_QA: ${{ github.workspace }}/reality-lab/hc-s3-2/qa/portal-file
        run: python reality-lab/hc-s3-2/tests/browser.py
      - name: Freeze tested portal without changing prior versions
        id: portal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('reality-lab/hc-s3-2')
          for name in ['qa/source-public/BROWSER.json','qa/portal-file/BROWSER.json']:assert json.loads((r/name).read_text())['passed'],name
          PY
          EXPECTED=$(git rev-parse HEAD)
          git fetch --filter=blob:none --depth=1 origin feature/reality-hc-s32-source-install-20261020
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f reality-lab/hc-s3-2/preview.html reality-lab/hc-s3-2/BUILD_MANIFEST.json reality-lab/hc-s3-2/SOURCE_PREPARED.json reality-lab/hc-s3-2/connection-registry.json reality-lab/hc-s3-2/qa
          git commit -m 'build(reality): freeze S3.2 source registration and standalone integration evidence'
          git push origin HEAD:refs/heads/feature/reality-hc-s32-source-install-20261020
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/$SHA/reality-lab/hc-s3-2/preview.html" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-s32-build-evidence
          path: reality-lab/hc-s3-2/qa/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-s32-source-inspection
          path: |
            reality-lab/hc-s3-2/*.js
            reality-lab/hc-s3-2/*.py
            reality-lab/hc-s3-2/*.json
            reality-lab/hc-s3-2/tests/
            source-native/denim-workshop/r17-scale/reality-s32/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reality-s32-standalone
          path: |
            reality-lab/hc-s3-2/preview.html
            reality-lab/hc-s3-2/BUILD_MANIFEST.json
          retention-days: 30
  public:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          sparse-checkout: reality-lab/hc-s3-2
      - name: Exact public portal byte verification
        env:
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: |
          python - <<'PY'
          import json,os,hashlib,urllib.request
          from pathlib import Path
          r=Path('reality-lab/hc-s3-2');m=json.loads((r/'BUILD_MANIFEST.json').read_text());u='https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/'+os.environ['BUILD_SHA']+'/reality-lab/hc-s3-2/preview.html';b=urllib.request.urlopen(u,timeout=120).read();assert len(b)==m['html']['bytes'] and hashlib.sha256(b).hexdigest()==m['html']['sha256'];q=r/'qa/portal-public';q.mkdir(parents=True,exist_ok=True);(q/'PUBLIC_BYTES.json').write_text(json.dumps({'passed':True,'publicCommit':os.environ['BUILD_SHA'],'html':m['html']},indent=2))
          PY
      - name: Install independent pinned browser
        run: |
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real public source connection and stale-byte rejection
        env:
          RF32_KIND: portal
          RF32_URL: ${{ needs.build.outputs.url }}
          RF32_QA: ${{ github.workspace }}/reality-lab/hc-s3-2/qa/portal-public
        run: python reality-lab/hc-s3-2/tests/browser.py
      - name: Persist exact source and portal delivery
        env:
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SOURCE_URL: ${{ needs.build.outputs.source_url }}
          PORTAL_URL: ${{ needs.build.outputs.url }}
        run: |
          git fetch --filter=blob:none --depth=1 origin feature/denim-r17-garment-scale-20261015
          test "$(git rev-parse FETCH_HEAD)" = "22cdb3f4c3bfd101bd86f0ffa246d255b561d915"
          git fetch --filter=blob:none --depth=1 origin feature/denim-r17-reality-s32-trial-20261020
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import json,os,datetime
          r=Path('reality-lab/hc-s3-2');m=json.loads((r/'BUILD_MANIFEST.json').read_text());reports={}
          for key in ['source-file','source-public','portal-file','portal-public']:
            x=json.loads((r/'qa'/key/'BROWSER.json').read_text());assert x['passed'];reports[key]={'checks':len(x['checks']),'unexpectedPageErrors':len(x['pageErrors']),'consoleErrors':len(x['consoleErrors']),'unexpectedNetworkFailures':len(x['requestFailures'])}
          p=json.loads((r/'qa/source/PROTOCOL.json').read_text());assert p['passed']
          d={'version':'REALITY-HC-S3.2','status':'SOURCE_TRIAL_AND_PORTAL_VERIFIED_AWAITING_USER','fixedURL':os.environ['PORTAL_URL'],'sourceTrialURL':os.environ['SOURCE_URL'],'sourceCommit':m['sourceCommit'],'publicCommit':os.environ['BUILD_SHA'],'sourceTrialCommit':os.environ['SOURCE_SHA'],'workflowRun':os.environ['GITHUB_RUN_ID'],'html':m['html'],'sourceHTML':m['sourceInstalledHTML'],'protocolChecks':p['count'],'browserReports':reports,'sourceTrialInstalled':True,'sourceTrialVerified':True,'productionInstalled':False,'productionBranchUnchanged':True,'productionBranchHead':'22cdb3f4c3bfd101bd86f0ffa246d255b561d915','originalRenderingPreserved':True,'rollbackRoundTripVerified':True,'sourceByteMismatchRejected':True,'legacyCandidatesRetained':['knit','leather'],'physicalCertification':False,'manufacturingCertification':False,'physicalDeviceTested':False,'userVisualAcceptance':False,'productionReady':False,'next':'Review the single source trial. Production branch promotion requires explicit merge approval and a refreshed source baseline. The next independent development slice can read garment/material-axis/person-version references without changing rendering or inventing missing metrology.','verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (r/'DELIVERY.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));(r/'TASK_STATE.json').write_text(json.dumps({'taskId':'RF01-S3.2-SOURCE-INSTALL-20261020','frameworkId':'RF01','status':d['status'],'fixedURL':d['fixedURL'],'sourceTrialURL':d['sourceTrialURL'],'sourceCommit':d['sourceCommit'],'publicCommit':d['publicCommit'],'sourceTrialCommit':d['sourceTrialCommit'],'lastActuallyCompletedStep':'One independently published reversible source installation and pinned source-to-platform connection, with explicit trial/production/history separation.','nextAction':d['next'],'productionInstalled':False,'userAccepted':False},ensure_ascii=False,indent=2));print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --filter=blob:none --depth=1 origin feature/reality-hc-s32-source-install-20261020
          test "$(git rev-parse FETCH_HEAD)" = "$BUILD_SHA"
          git add -f reality-lab/hc-s3-2/DELIVERY.json reality-lab/hc-s3-2/TASK_STATE.json reality-lab/hc-s3-2/qa/portal-public
          git commit -m 'docs(reality): record S3.2 source trial and public portal evidence without production promotion'
          git push origin HEAD:refs/heads/feature/reality-hc-s32-source-install-20261020
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-s32-public-evidence
          path: reality-lab/hc-s3-2/qa/portal-public/
          retention-days: 30
