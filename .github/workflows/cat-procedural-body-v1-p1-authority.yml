name: Cat Procedural Body V1 P1 Authority

on:
  push:
    branches:
      - codex/cat-procedural-body-v1-p1-authority-20260917
    paths:
      - .github/workflows/cat-procedural-body-v1-p1-authority.yml
      - cat-kaopu/tools/bootstrap_cat_procedural_v1_p1_sources.py
      - cat-kaopu/tools/bootstrap/p1_authority_sources.part*.b64
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cat-procedural-body-v1-p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode P1 source archive
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/bootstrap_cat_procedural_v1_p1_sources.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate authority-calibrated CatDNA and geometry core
        run: node cat-kaopu/tools/validate_cat_procedural_v1_p1.mjs

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run P1 WebGL2 fixed-view QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > "${RUNNER_TEMP}/cat-procedural-p1-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/cat-kaopu/procedural-cat-v1/index.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "${RUNNER_TEMP}/cat-procedural-p1-http.log" || true
            exit 1
          fi
          CAT_PROCEDURAL_URL='http://127.0.0.1:4173/cat-kaopu/procedural-cat-v1/index.html' \
            node cat-kaopu/tools/capture_cat_procedural_v1_p1.mjs

      - name: Upload P1 sources and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-procedural-body-v1-p1-authority-${{ github.run_number }}
          path: |
            cat-kaopu/procedural-cat-v1/**
            cat-kaopu/docs/CAT_PROCEDURAL_BODY_V1_P1_AUTHORITY_CALIBRATION_2026-09-17.md
            cat-kaopu/tools/validate_cat_procedural_v1_p1.mjs
            cat-kaopu/tools/capture_cat_procedural_v1_p1.mjs
            cat-kaopu/qa/procedural-cat-v1-p1/*.json
            cat-kaopu/qa/procedural-cat-v1-p1/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit P1 sources and browser evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cat-procedural-build-bot'
          git config user.email 'cat-procedural-build-bot@users.noreply.github.com'
          git add \
            cat-kaopu/procedural-cat-v1 \
            cat-kaopu/docs/CAT_PROCEDURAL_BODY_V1_P1_AUTHORITY_CALIBRATION_2026-09-17.md \
            cat-kaopu/tools/validate_cat_procedural_v1_p1.mjs \
            cat-kaopu/tools/capture_cat_procedural_v1_p1.mjs \
            cat-kaopu/qa/procedural-cat-v1-p1
          if git diff --cached --quiet; then
            echo 'No P1 generated changes to commit.'
            exit 0
          fi
          git commit -m 'build(cat): generate P1 authority-calibrated procedural cat [generated]'
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase --autostash "origin/${GITHUB_REF_NAME}"
          done
          exit 1
