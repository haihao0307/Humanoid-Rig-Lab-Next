name: Apply face R25B fragment fix once

on:
  push:
    branches:
      - feature/face-features-r25-20260919
    paths:
      - tools/apply-face-r25b-fragment-dependency-fix.mjs
      - .github/workflows/apply-face-r25b-fragment-fix-once.yml

permissions:
  contents: write

jobs:
  apply-fragment-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout R25 branch
        uses: actions/checkout@v4
        with:
          ref: feature/face-features-r25-20260919
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply shared shader dependency repair
        run: node tools/apply-face-r25b-fragment-dependency-fix.mjs

      - name: Rebuild generated workbench
        run: node tools/build-pure.mjs

      - name: Run source and geometry gates
        run: |
          node tools/check-pure.mjs
          node tools/check-face-r25-baseline.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/test-eye-aperture-family.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-identity-warp.mjs
          node tools/test-npc-face-uniforms.mjs

      - name: Commit repaired production shader
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No fragment repair changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add body/EyeAnatomy.js tools/check-eye-anatomy.mjs docs/face-knowledge/R25B_EYE_APERTURE_FAMILY_20260919.md index.html FILE_AUDIT.json SHA256SUMS.txt
          git commit -m "face R25B: share aperture helpers with fragment occlusion"
          git push origin HEAD:feature/face-features-r25-20260919
