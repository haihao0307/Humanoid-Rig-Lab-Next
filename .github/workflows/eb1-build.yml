name: EB1 native lighting verification
on:
  push:
    branches: [feature/eb1-unified-lighting-20261013]
    paths: [.github/workflows/eb1-build.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eb1-unified-lighting-20261013
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            lighting/eb1
      - name: Restore hash-locked owned readable implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,urllib.request,base64,hashlib,gzip,pathlib
          ids=['e41cf970046d0c7b7200a96da90142c48afa64c7','7e377409fbad57421b7e582c6bd378e2de970f11','6c31d2da70b56880ccb57a76f130631c503c6529'];parts=[]
          import os
          for i,s in enumerate(ids):
            u='https://api.github.com/repos/haihao0307/Humanoid-Rig-Lab-Next/git/blobs/'+s
            q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'KAOPU-EB1-source'})
            j=json.load(urllib.request.urlopen(q));t=''.join(j['content'].split())
            if i==1:
              t=t.replace('uL9XGq5','uL9Xq5').replace('AInJSYY9TJ','AInJSY9TJ')
              t=t[:11940]+'OjlARZpxkZiVn3KlpQSvax6qPL/URDGhHGTDDY/QP2as0j9oqgHuEDazCqzJ'
            if i==2:t=t.replace('bpcV2ytteY7','bpcV2Y7')
            parts.append(base64.b64decode(t,validate=True))
          data=b''.join(parts)
          assert len(data)==26225 and hashlib.sha256(data).hexdigest()=='a2f3cc42d0425677b22e30e7d81b5aa60e72b44eef5c448443eb3a661d2af597','Transport digest mismatch'
          files=json.loads(gzip.decompress(data));allowed={'eb1.js','lab.html','prepare.py','qa.py','test-core.cjs','README.md','THIRD_PARTY_NOTICES.md','licenses/Apache-2.0.txt','licenses/THREE-MIT.txt'}
          assert set(files)==allowed
          for rel,item in files.items():
            b=item['text'].encode();assert hashlib.sha256(b).hexdigest()==item['sha256'],rel
            p=pathlib.Path('lighting/eb1')/rel;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          print('Verified 9 owned readable sources and notices, no third-party head bundle or private knit source.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lighting/eb1
          if ! git diff --cached --quiet; then git commit -m 'feat(eb1): owned common lighting core, native adapters, lab and exact-source tests'; git push origin HEAD:feature/eb1-unified-lighting-20261013; fi
          echo "EB1_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: eb1-source-audit
          run-id: 38367737094
          github-token: ${{ github.token }}
          path: /tmp/eb1-audit
      - uses: actions/download-artifact@v4
        with:
          name: eb1-complete-inputs
          run-id: 38368562825
          github-token: ${{ github.token }}
          path: /tmp/eb1-inputs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build and browser test dependencies
        run: |
          mkdir -p /tmp/eb1-tools
          cd /tmp/eb1-tools
          npm init -y >/dev/null
          npm install --save-exact three@0.179.1 esbuild@0.25.0
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Build additive snapshots without changing native assets or physics
        env:
          EB1_INPUTS: /tmp/eb1-inputs
          EB1_AUDIT: /tmp/eb1-audit
          EB1_NODE_MODULES: /tmp/eb1-tools/node_modules
        run: |
          node lighting/eb1/test-core.cjs
          node --check lighting/eb1/eb1.js
          python lighting/eb1/prepare.py
      - name: Real Chromium surfaces, native interaction and reload persistence
        run: |
          python -m http.server 8791 --directory lighting/eb1/v1 >/tmp/eb1-http.log 2>&1 &
          python lighting/eb1/qa.py
      - name: Save verified candidate and evidence without publishing or replacing legacy entries
        if: success()
        run: |
          git add lighting/eb1/v1 lighting/eb1/qa lighting/eb1/SOURCE_PATCH_RECEIPT.json
          git commit -m 'build(eb1): browser-tested native lighting candidates and actual surface evidence'
          git push origin HEAD:feature/eb1-unified-lighting-20261013
          echo "EB1_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p lighting/eb1/qa
          test ! -f /tmp/eb1-http.log || cp /tmp/eb1-http.log lighting/eb1/qa/server.log
          git rev-parse HEAD > lighting/eb1/qa/BRANCH_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eb1-browser-candidate
          path: |
            lighting/eb1/v1
            lighting/eb1/qa
            lighting/eb1/SOURCE_PATCH_RECEIPT.json
            lighting/eb1/*.js
            lighting/eb1/*.py
            lighting/eb1/*.cjs
            lighting/eb1/*.md
          retention-days: 14
