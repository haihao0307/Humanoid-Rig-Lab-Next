name: Reality HC S3.8 contact propagation
on:
  push:
    branches: [feature/reality-hc-s38-contact-propagation-20261021]
    paths: [.github/workflows/reality-hc-s38.yml, reality-lab/hc-s3-8/RUN_REQUEST.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        case: [static, walk]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: platform
          sparse-checkout: |
            reality-lab/hc-s3-8
            reality-lab/hc-s3-7
            reality-lab/hc-s3-6
      - uses: actions/checkout@v4
        with:
          repository: haihao0307/guilin-dem-pipeline
          ref: c5c0bedbc35f24cbb35426ab9c14b74ca7fc5f49
          path: host
          sparse-checkout: kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
      - name: Validate candidate syntax
        run: python -m py_compile reality-lab/hc-s3-8/run_candidate.py
      - name: Install pinned Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Record complete fine coverage outcome without certifying fit
        env:
          GARMENT_HOST: ${{ github.workspace }}/host/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
          CONTACT_CASE: ${{ matrix.case }}
        run: python reality-lab/hc-s3-8/run_candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf38-coverage-${{ matrix.case }}
          path: platform/reality-lab/hc-s3-8/qa/coverage-${{ matrix.case }}/
          retention-days: 30
