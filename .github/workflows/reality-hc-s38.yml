name: Reality HC S3.8 contact propagation
on:
  push:
    branches: [feature/reality-hc-s38-contact-propagation-20261021]
    paths: [.github/workflows/reality-hc-s38.yml, reality-lab/hc-s3-8/RUN_REQUEST.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: platform
          sparse-checkout: |
            reality-lab/hc-s3-8
            reality-lab/hc-s3-7
            reality-lab/hc-s3-6
      - uses: actions/checkout@v4
        with:
          repository: haihao0307/guilin-dem-pipeline
          ref: c5c0bedbc35f24cbb35426ab9c14b74ca7fc5f49
          path: host
          sparse-checkout: kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
      - name: Check syntax and reversible source insertions
        env:
          GARMENT_HOST: ${{ github.workspace }}/host/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast,os,sys,subprocess
          r=Path('reality-lab/hc-s3-8');sys.path.insert(0,str(r))
          for p in r.rglob('*.py'):ast.parse(p.read_text())
          from instrument import assemble
          responses,meta=assemble(Path(os.environ['GARMENT_HOST']),'static')
          out=r/'_generated';out.mkdir(exist_ok=True)
          for name,data in responses.items():
            p=out/name;p.write_bytes(data)
            subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Install pinned Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Trace actual static steps and compare exact endpoints
        env:
          GARMENT_HOST: ${{ github.workspace }}/host/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
        run: python reality-lab/hc-s3-8/run_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf38-native-trace
          path: platform/reality-lab/hc-s3-8/qa/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf38-code-review
          path: |
            platform/reality-lab/hc-s3-8/*.py
            platform/reality-lab/hc-s3-8/*.mjs
            platform/reality-lab/hc-s3-8/*.json
          retention-days: 7
