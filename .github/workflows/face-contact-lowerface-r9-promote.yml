name: Promote face neutral oral seal lower-face R9

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-contact-lowerface-r9-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face-contact-lowerface-r9-promotion
  cancel-in-progress: false

jobs:
  promote-verify-capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed R9 production sources and documentation
        run: python3 tools/promote-face-contact-lowerface-r9.py
      - name: Build and validate all source contracts
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install isolated browser harness
        run: |
          mkdir -p /tmp/face-r9-production
          cd /tmp/face-r9-production
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture production review and QA report
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hrl-face-r9-production-server.log 2>&1 &
          NODE_PATH=/tmp/face-r9-production/node_modules node tools/capture-face-r9.cjs
      - name: Upload final visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: face-contact-lowerface-r9-final
          path: visual-review-r9
          retention-days: 14
      - name: Remove staging files, audit, and commit
        shell: bash
        run: |
          rm -rf visual-review-r9
          rm -f \
            .github/workflows/face-contact-lowerface-r9-candidate.yml \
            .github/workflows/face-contact-lowerface-r9-candidate-v2.yml \
            .github/workflows/face-contact-lowerface-r9-promote.yml \
            tools/apply-face-contact-lowerface-r9-candidate.py \
            tools/apply-face-inner-return-normals-r9.py \
            tools/apply-face-r9-visual-corrections.py \
            tools/apply-face-lip-bed-smoothing-r9.py \
            tools/capture-face-r9.cjs \
            tools/promote-face-contact-lowerface-r9.py
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
          python3 tools/audit-files.py
          node tools/check-pure.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "face: integrate neutral oral seal and lower-face continuity"
          git push origin HEAD:feature/human-face-workbench-v1-20260915
