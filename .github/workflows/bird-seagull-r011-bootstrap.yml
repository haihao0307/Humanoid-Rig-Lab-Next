name: Bootstrap Bird Seagull R011

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bird-seagull-r011-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build R011 from verified R010 baseline
        shell: bash
        run: |
          set -euo pipefail
          src=BIRD_SEAGULL_A_CHANNEL_EXECUTOR_R010
          dst=BIRD_SEAGULL_A_PHASE_CLOCK_R011
          test -d "$src"
          rm -rf "$dst"
          cp -a "$src" "$dst"

          cat > "$dst/sampling-contract.json" <<'JSON'
          {
            "version": "R0.11",
            "title": "Seagull A phase clock and multi-rate deterministic sampling contract",
            "source": {
              "asset": "seagull (A).zip",
              "sourceGlbSha256": "175c61f65e3f2c8b561d422f9d0c61b23bfd85928dd3b66ad8547638d84a90aa",
              "license": "CC-BY-NC-SA-4.0",
              "sourceContractVersion": "R0.07",
              "controllerTransferVersion": "R0.08",
              "channelExecutorVersion": "R0.10",
              "commercialRuntimeEligible": false
            },
            "clock": {
              "sourceFrameCount": 50,
              "sourceIntervalsPerCycle": 49,
              "sourceFps": 24,
              "periodSecondsNumerator": 49,
              "periodSecondsDenominator": 24,
              "periodSeconds": 2.0416666666666665,
              "canonicalPhase": "phase01 in [0,1)",
              "boundaryEvent": "F50_TO_F01",
              "rateAdapterRule": "phase = fractional(timeSeconds * 24 / 49); refresh rate samples phase and never redefines motion"
            },
            "auditedRatesHz": [24, 30, 60, 90, 120],
            "auditedCycleCounts": [1, 10, 100, 1000, 10000],
            "activeOutputChannels": [
              "leftRootElevationDeg", "rightRootElevationDeg",
              "leftMidElevationDeg", "rightMidElevationDeg",
              "leftOuterElevationDeg", "rightOuterElevationDeg",
              "leftElbowFoldDeg", "rightElbowFoldDeg",
              "averageWingtipY", "tipSpan", "bodyY"
            ],
            "lockedReadOnlyChannels": ["leftWristFoldDeg", "rightWristFoldDeg"],
            "controlGroups": ["rootDrive", "elbowFold", "bodyCoupling", "asymmetryResidual", "periodicClosure"],
            "truthBoundary": {
              "mayUse": [
                "R0.07 source series and event anchors",
                "R0.09 source-derived channel envelopes",
                "R0.10 clipping, fallback, locked-write rejection and fail-closed rules",
                "rational phase clock based on 49/24 second period",
                "deterministic rate adapters and explicit boundary events"
              ],
              "mustNotClaim": [
                "biological or aerodynamic correctness",
                "natural glide, soar, turn, takeoff, landing or escape motion",
                "final feather articulation",
                "commercial eligibility of the source asset"
              ]
            },
            "visualAcceptance": false,
            "productionReady": false,
            "commercialRuntimeEligible": false,
            "externalRuntimeDependencies": 0,
            "controllerAffectsSourceMesh": false
          }
          JSON

          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('BIRD_SEAGULL_A_PHASE_CLOCK_R011')
          data=json.loads((root/'sampling-contract.json').read_text())
          (root/'data'/'sampling-contract.js').write_text('window.__BIRD_R011_SAMPLING='+json.dumps(data,ensure_ascii=False,separators=(',',':'))+';\n')
          PY

          cat > "$dst/runtime/sampler-ui.js" <<'JS'
          (()=>{
          'use strict';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
          const finite=(v,f)=>Number.isFinite(Number(v))?Number(v):f;
          const fmt=(v,d=4)=>Number(v).toFixed(d);
          const C=window.__BIRD_R007_CONTRACT;
          const E=window.__BIRD_R010_EXECUTION;
          const S=window.__BIRD_R011_SAMPLING;
          if(!C||!E||!S)throw new Error('R0.11 缺少来源合同链');
          const anchors=E.execution.sourceAnchorFramesZeroBased.slice();
          const active=E.interface.output.activeChannels.slice();
          const locked=E.interface.output.lockedReadOnlyChannels.slice();
          const env=E.sourceEnvelopes;
          for(const n of [...active,...locked])if(!Array.isArray(C.series[n]))throw new Error('R0.11 缺少来源通道：'+n);
          const pairNames=[
            ['leftRootElevationDeg','rightRootElevationDeg'],
            ['leftMidElevationDeg','rightMidElevationDeg'],
            ['leftOuterElevationDeg','rightOuterElevationDeg'],
            ['leftElbowFoldDeg','rightElbowFoldDeg']
          ];
          const state={rate:60,cycles:1000,interpolation:'smoothstep',controls:{rootDrive:1,elbowFold:1,bodyCoupling:1,asymmetryResidual:1,periodicClosure:0}};
          const lastValid={phase01:0,...state.controls,interpolation:state.interpolation};
          const stats={inputClipCount:0,inputFallbackCount:0,lockedWriteRejectCount:0,postClampViolationCount:0};
          function smooth(t){return t*t*(3-2*t)}
          function phase01(v){v=finite(v,lastValid.phase01);v=((v%1)+1)%1;lastValid.phase01=v;return v}
          function sanitize(input={}){
            const diag={clippedFields:[],fallbackFields:[],lockedWriteFields:[],postClampViolations:0};
            const out={};
            const rawPhase=Number(input.phase01);
            if(Number.isFinite(rawPhase)){out.phase01=((rawPhase%1)+1)%1;lastValid.phase01=out.phase01}else{out.phase01=lastValid.phase01;diag.fallbackFields.push('phase01')}
            const mode=(input.interpolation==='linear'||input.interpolation==='smoothstep')?input.interpolation:lastValid.interpolation;
            if(mode!==input.interpolation&&input.interpolation!==undefined)diag.fallbackFields.push('interpolation');
            out.interpolation=mode;lastValid.interpolation=mode;
            for(const id of Object.keys(state.controls)){
              const raw=Number(input[id]);
              if(!Number.isFinite(raw)){out[id]=lastValid[id];if(input[id]!==undefined)diag.fallbackFields.push(id);continue}
              const v=clamp(raw,0,1);if(v!==raw)diag.clippedFields.push(id);out[id]=v;lastValid[id]=v;
            }
            for(const id of locked)if(Object.prototype.hasOwnProperty.call(input,id))diag.lockedWriteFields.push(id);
            stats.inputClipCount+=diag.clippedFields.length;stats.inputFallbackCount+=diag.fallbackFields.length;stats.lockedWriteRejectCount+=diag.lockedWriteFields.length;
            return{out,diag};
          }
          function anchorValue(arr,x,mode){
            if(x<=anchors[0])return arr[anchors[0]];if(x>=anchors.at(-1))return arr[anchors.at(-1)];
            let k=0;while(x>anchors[k+1])k++;
            const a=anchors[k],b=anchors[k+1],raw=(x-a)/(b-a),t=mode==='linear'?raw:smooth(raw);
            return arr[a]+(arr[b]-arr[a])*t;
          }
          function closeTail(arr,g){
            if(g<=0)return arr.slice();
            const out=arr.slice(),s=40,e=49,L=e-s,D=arr[0]-arr[e],d0=arr[1]-arr[0],target48=arr[0]-d0,c48=target48-arr[e-1],t=(e-1-s)/L,t2=t*t,t3=t2*t,A=(c48-D*t3)/(t2-t3),B=D-A;
            for(let i=s;i<=e;i++){const u=(i-s)/L;out[i]+=g*(A*u*u+B*u*u*u)}
            return out;
          }
          function buildPacket(input={}){
            const {out:i,diag}=sanitize(input),series={};
            for(const name of [...active,...locked]){
              const src=C.series[name],a=Array.from({length:50},(_,f)=>anchorValue(src,f,i.interpolation));
              let gain=1;
              if(name.includes('RootElevation'))gain=i.rootDrive;
              else if(name.includes('MidElevation')||name.includes('OuterElevation')||name.includes('ElbowFold'))gain=i.elbowFold;
              else if(name==='bodyY')gain=i.bodyCoupling;
              const mean=env[name]?.mean??a.reduce((s,v)=>s+v,0)/a.length;
              series[name]=a.map(v=>mean+(v-mean)*gain);
            }
            for(const [l,r] of pairNames){for(let f=0;f<50;f++){const m=(series[l][f]+series[r][f])/2,d=(series[l][f]-series[r][f])/2* i.asymmetryResidual;series[l][f]=m+d;series[r][f]=m-d}}
            for(const name of active)series[name]=closeTail(series[name],i.periodicClosure);
            let post=0;
            for(const name of [...active,...locked]){const q=env[name];series[name]=series[name].map(v=>{const c=clamp(v,q.min,q.max);if(!Number.isFinite(c)||c<q.min-1e-9||c>q.max+1e-9)post++;return c})}
            diag.postClampViolations=post;stats.postClampViolationCount+=post;
            if(post)throw new Error('R0.11 post-clamp violation');
            const x=i.phase01*49,lo=Math.floor(x),hi=Math.min(49,lo+1),raw=x-lo,t=i.interpolation==='linear'?raw:smooth(raw),values={};
            for(const name of [...active,...locked])values[name]=series[name][lo]+(series[name][hi]-series[name][lo])*t;
            const seam={};
            for(const name of active){const q=env[name],range=Math.max(1e-12,q.max-q.min);seam[name]={position:Math.abs(series[name][49]-series[name][0])/range,velocity:Math.abs((series[name][49]-series[name][48])-(series[name][1]-series[name][0]))/range}}
            const maxPos=Math.max(...active.map(n=>seam[n].position)),maxVel=Math.max(...active.map(n=>seam[n].velocity));
            return{ok:true,version:'R0.11',phase01:i.phase01,sourceFrameFloat:x+1,interpolation:i.interpolation,controls:{rootDrive:i.rootDrive,elbowFold:i.elbowFold,bodyCoupling:i.bodyCoupling,asymmetryResidual:i.asymmetryResidual,periodicClosure:i.periodicClosure},values,series,seam,maxSeamPositionNormalized:maxPos,maxSeamVelocityNormalized:maxVel,diagnostics:diag,boundaryEvent:(i.phase01===0?'F50_TO_F01':null)};
          }
          function evaluateAtPhase(p,input={}){return buildPacket({phase01:p,interpolation:input.interpolation??state.interpolation,rootDrive:input.rootDrive??state.controls.rootDrive,elbowFold:input.elbowFold??state.controls.elbowFold,bodyCoupling:input.bodyCoupling??state.controls.bodyCoupling,asymmetryResidual:input.asymmetryResidual??state.controls.asymmetryResidual,periodicClosure:input.periodicClosure??state.controls.periodicClosure,...input})}
          function auditRate(rate=state.rate,cycles=state.cycles){
            rate=clamp(Math.round(finite(rate,state.rate)),1,1000);cycles=Math.max(1,Math.round(finite(cycles,state.cycles)));
            const exact=rate*49/24,rounded=Math.round(exact),naiveDriftFrames=(rounded-exact)*cycles*24/rate;
            const sampleCount=Math.ceil(exact)+1,phases=Array.from({length:sampleCount},(_,n)=>Math.min(1,n/exact));
            let sum=0,count=0,max=0;
            for(let f=0;f<50;f++){
              const p=f/49,idx=p*exact,lo=Math.floor(idx),hi=Math.min(sampleCount-1,lo+1),t=idx-lo;
              const a=evaluateAtPhase(phases[lo]%1),b=evaluateAtPhase(phases[hi]%1),truth=evaluateAtPhase(p%1);
              for(const name of active){const q=env[name],range=Math.max(1e-12,q.max-q.min),pred=a.values[name]+(b.values[name]-a.values[name])*t,d=(pred-truth.values[name])/range;sum+=d*d;count++;max=Math.max(max,Math.abs(d))}
            }
            return{rateHz:rate,cycles,periodSeconds:49/24,exactSamplesPerCycle:exact,roundedSamplesPerCycle:rounded,integerSamplesPerCycle:Number.isInteger(exact),naiveAccumulatedDriftFrames:naiveDriftFrames,naiveAccumulatedDriftCycles:naiveDriftFrames/49,rationalClockDriftFrames:0,normalizedRmse:Math.sqrt(sum/count),normalizedMaxError:max,boundaryEvent:'F50_TO_F01'};
          }
          function addStyle(){const s=document.createElement('style');s.textContent=`
          .r011-card{border:1px solid #28505f;background:#091820;border-radius:10px;padding:10px;margin-top:8px}.r011-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.r011-buttons button{padding:6px 2px;font-size:10px}.r011-output{display:grid;grid-template-columns:1fr auto;gap:5px 8px;font-size:10px}.r011-output span{color:#8fa8b4}.r011-output b{color:#e8f5f8;text-align:right}.r011-graph{width:100%;height:180px;display:block;border:1px solid #244554;border-radius:8px;background:#08151d}.r011-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.r011-grid>div{border:1px solid #244554;background:#0a1821;border-radius:8px;padding:8px}.r011-grid span{display:block;color:#819aa6;font-size:9px}.r011-grid b{display:block;color:#edf7fa;font-size:12px;margin-top:3px}.r011-good{color:#75d3aa!important}.r011-warn{color:#e3b968!important}.r011-status{font-size:10px;line-height:1.45;color:#a9c0ca;margin-top:7px}.r011-controls label{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:10px;color:#9fb6c1;margin-top:7px}.r011-controls input{grid-column:1/-1;width:100%;accent-color:#56cbe8}.r011-controls strong{color:#e8f5f8}.r011-fault{width:100%;margin-top:8px;border-color:#82514c;background:#2a1716}.r011-fault.pass{border-color:#34745a;background:#0d2923}`;document.head.appendChild(s)}
          function injectUi(){
            document.title='Bird Mother｜Seagull A 相位时钟与长周期稳定性台 R0.11';
            const tb=document.querySelector('.title-block b'),ts=document.querySelector('.title-block small'),pill=document.querySelector('header .pill');if(tb)tb.textContent='Bird Mother｜Seagull A 相位时钟与长周期稳定性台 R0.11';if(ts)ts.textContent='统一 phase01｜24–120Hz 采样｜F50→F01 边界事件｜1–10000 周期漂移审计';if(pill)pill.textContent='RATIONAL PHASE CLOCK · RATE ADAPTERS';
            const left=document.getElementById('controls'),right=document.getElementById('analysis');
            const l=document.createElement('section');l.id='r011ClockPanel';l.innerHTML=`<h3>R0.11 相位时钟</h3><div class="r011-card"><b>第七道门：刷新率只负责采样，不再定义动作。</b><div class="r011-status">唯一运动定义为 phase01∈[0,1)。来源周期固定为 49/24 秒；F50→F01 是显式边界事件。</div><h3>采样率 Hz</h3><div class="r011-buttons" id="r011Rates"></div><h3>长周期审计</h3><div class="r011-buttons" id="r011Cycles"></div><div class="r011-status" id="r011ClockStatus">读取中</div></div>`;left.prepend(l);
            const r=document.createElement('section');r.id='r011Analysis';r.innerHTML=`<h3>R0.11 速率重建</h3><canvas class="r011-graph" id="r011RateGraph"></canvas><h3>累计相位漂移</h3><canvas class="r011-graph" id="r011DriftGraph"></canvas><h3>当前速率审计</h3><div class="r011-grid" id="r011AuditGrid"></div><h3>当前输出包</h3><div class="r011-card r011-output" id="r011Output"></div><button id="r011FaultProbe" class="r011-fault" type="button">异常输入探针</button><div class="r011-status" id="r011FaultStatus">尚未执行</div>`;right.prepend(r);
            const rates=document.getElementById('r011Rates');for(const x of S.auditedRatesHz){const b=document.createElement('button');b.textContent=x;b.dataset.rate=x;b.onclick=()=>{state.rate=x;render()};rates.appendChild(b)}
            const cycles=document.getElementById('r011Cycles');for(const x of S.auditedCycleCounts){const b=document.createElement('button');b.textContent=x;b.dataset.cycles=x;b.onclick=()=>{state.cycles=x;render()};cycles.appendChild(b)}
            document.getElementById('r011FaultProbe').onclick=()=>{const q=evaluateAtPhase(NaN,{rootDrive:99,elbowFold:-3,bodyCoupling:Infinity,asymmetryResidual:NaN,periodicClosure:4,interpolation:'bad',leftWristFoldDeg:100});const ok=q.ok&&q.diagnostics.clippedFields.length>=3&&q.diagnostics.fallbackFields.length>=3&&q.diagnostics.lockedWriteFields.length===1&&q.diagnostics.postClampViolations===0;document.getElementById('r011FaultStatus').textContent=ok?'通过：裁剪、回退、锁定拒绝与后置包络均生效':'失败';document.getElementById('r011FaultProbe').classList.toggle('pass',ok);refreshQa({faultProbe:{ok,clipped:q.diagnostics.clippedFields.length,fallback:q.diagnostics.fallbackFields.length,lockedWrites:q.diagnostics.lockedWriteFields.length,postClampViolations:q.diagnostics.postClampViolations}})};
            const foot=document.querySelector('footer');if(foot&&!foot.textContent.includes('phaseClock=true')){const x=document.createElement('span');x.textContent='phaseClock=true';foot.appendChild(x)}
          }
          function canvasSize(c){const dpr=Math.min(devicePixelRatio||1,2),w=Math.max(280,Math.floor(c.clientWidth*dpr)),h=Math.max(150,Math.floor(c.clientHeight*dpr));if(c.width!==w||c.height!==h){c.width=w;c.height=h}return{ctx:c.getContext('2d'),w,h,dpr}}
          function graphBase(c){const z=canvasSize(c),{ctx,w,h,dpr}=z;ctx.fillStyle='#08151d';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#203b48';ctx.lineWidth=dpr;for(let i=0;i<=4;i++){const y=12*dpr+i/4*(h-34*dpr);ctx.beginPath();ctx.moveTo(34*dpr,y);ctx.lineTo(w-8*dpr,y);ctx.stroke()}return z}
          function drawRate(){const c=document.getElementById('r011RateGraph'),{ctx,w,h,dpr}=graphBase(c),packet=buildPacket({phase01:0,...state.controls,interpolation:state.interpolation}),src=packet.series.averageWingtipY,min=env.averageWingtipY.min,max=env.averageWingtipY.max,X=p=>34*dpr+p*(w-42*dpr),Y=v=>12*dpr+(max-v)/(max-min)*(h-34*dpr);ctx.strokeStyle='#42c9e8';ctx.lineWidth=2*dpr;ctx.beginPath();for(let i=0;i<50;i++){const x=X(i/49),y=Y(src[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();const exact=state.rate*49/24;ctx.fillStyle='#e9b963';for(let n=0;n<=Math.ceil(exact);n++){const p=Math.min(1,n/exact),v=evaluateAtPhase(p%1).values.averageWingtipY;ctx.beginPath();ctx.arc(X(p),Y(v),1.7*dpr,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#9bb1bb';ctx.font=`${9*dpr}px sans-serif`;ctx.fillText(`青：统一相位曲线  黄：${state.rate}Hz 采样`,38*dpr,h-8*dpr)}
          function drawDrift(){const c=document.getElementById('r011DriftGraph'),{ctx,w,h,dpr}=graphBase(c),rates=S.auditedRatesHz,cycles=S.auditedCycleCounts,max=Math.max(1,...rates.flatMap(r=>cycles.map(n=>Math.abs(auditRate(r,n).naiveAccumulatedDriftFrames)))),X=i=>34*dpr+i/(cycles.length-1)*(w-42*dpr),Y=v=>h/2-v/max*(h*.38),colors=['#42c9e8','#dd78c9','#e9b963','#6fd6a0','#ef7f75'];ctx.strokeStyle='#69818c';ctx.beginPath();ctx.moveTo(34*dpr,h/2);ctx.lineTo(w-8*dpr,h/2);ctx.stroke();rates.forEach((r,ri)=>{ctx.strokeStyle=colors[ri];ctx.lineWidth=1.5*dpr;ctx.beginPath();cycles.forEach((n,i)=>{const y=Y(auditRate(r,n).naiveAccumulatedDriftFrames),x=X(i);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});ctx.fillStyle='#9bb1bb';ctx.font=`${9*dpr}px sans-serif`;ctx.fillText('朴素整帧时钟漂移；事件感知有理相位时钟恒为 0',38*dpr,h-8*dpr)}
          function refreshQa(extra={}){const a=auditRate(state.rate,state.cycles),packet=evaluateAtPhase(0);window.__BIRD_R011_QA={ready:true,version:'R0.11',frameCount:50,sourceIntervalsPerCycle:49,sourceFps:24,periodSeconds:49/24,auditedRates:S.auditedRatesHz.slice(),activeChannelCount:active.length,lockedChannelCount:locked.length,controlGroupCount:S.controlGroups.length,rateHz:state.rate,cycles:state.cycles,exactSamplesPerCycle:a.exactSamplesPerCycle,roundedSamplesPerCycle:a.roundedSamplesPerCycle,integerSamplesPerCycle:a.integerSamplesPerCycle,naiveAccumulatedDriftFrames:a.naiveAccumulatedDriftFrames,rationalClockDriftFrames:0,normalizedRmse:a.normalizedRmse,normalizedMaxError:a.normalizedMaxError,maxSeamPositionNormalized:packet.maxSeamPositionNormalized,maxSeamVelocityNormalized:packet.maxSeamVelocityNormalized,postClampViolations:stats.postClampViolationCount,inputClipCount:stats.inputClipCount,inputFallbackCount:stats.inputFallbackCount,lockedWriteRejectCount:stats.lockedWriteRejectCount,externalRuntimeDependencies:0,controllerAffectsSourceMesh:false,visualAcceptance:false,productionReady:false,commercialRuntimeEligible:false,...(window.__BIRD_R011_QA||{}),...extra}}
          function render(){document.querySelectorAll('#r011Rates button').forEach(b=>b.classList.toggle('active',Number(b.dataset.rate)===state.rate));document.querySelectorAll('#r011Cycles button').forEach(b=>b.classList.toggle('active',Number(b.dataset.cycles)===state.cycles));const a=auditRate(),p=evaluateAtPhase(0);document.getElementById('r011ClockStatus').textContent=`周期 49/24s｜${state.rate}Hz 精确 ${fmt(a.exactSamplesPerCycle,4)} 样本/周期｜${state.cycles} 周期朴素漂移 ${fmt(a.naiveAccumulatedDriftFrames,4)} 来源帧｜有理时钟 0`;document.getElementById('r011AuditGrid').innerHTML=`<div><span>精确样本/周期</span><b>${fmt(a.exactSamplesPerCycle,4)}</b></div><div><span>整帧近似</span><b>${a.roundedSamplesPerCycle}</b></div><div><span>是否整数</span><b class="${a.integerSamplesPerCycle?'r011-good':'r011-warn'}">${a.integerSamplesPerCycle?'是':'否'}</b></div><div><span>朴素累计漂移</span><b>${fmt(a.naiveAccumulatedDriftFrames,4)} 帧</b></div><div><span>有理时钟漂移</span><b class="r011-good">0</b></div><div><span>归一化 RMSE</span><b>${fmt(a.normalizedRmse,6)}</b></div>`;const out=document.getElementById('r011Output');out.innerHTML='';for(const name of [...active,...locked]){const s=document.createElement('span');s.textContent=name;const b=document.createElement('b');b.textContent=fmt(p.values[name],4)+(locked.includes(name)?' 🔒':'');out.append(s,b)}drawRate();drawDrift();refreshQa()}
          window.__BIRD_R011_API={evaluateAtPhase,auditRate,setRate:r=>{state.rate=Number(r);render()},setCycles:n=>{state.cycles=Number(n);render()},setControl:(id,v)=>{if(id in state.controls){state.controls[id]=clamp(Number(v),0,1);render()}},getState:()=>JSON.parse(JSON.stringify(state))};
          addStyle();injectUi();render();document.body.dataset.r011Ready='true';const status=document.getElementById('status');if(status)status.textContent='R0.11 已载入：统一 phase01 时钟、多速率采样和长周期漂移审计均可用';
          window.addEventListener('resize',()=>{drawRate();drawDrift()});
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          p=Path('BIRD_SEAGULL_A_PHASE_CLOCK_R011/index.html')
          s=p.read_text()
          insert='  <script src="./data/sampling-contract.js"></script>\n  <script src="./runtime/sampler-ui.js"></script>\n'
          if 'sampling-contract.js' not in s:
              s=s.replace('</body>',insert+'</body>')
          p.write_text(s)
          PY

          cat > "$dst/README_ZH.md" <<'MD'
          # Bird Mother｜Seagull A 相位时钟与长周期稳定性台 R0.11

          R0.11 不制作新鸟，也不补造任何未提供的飞行姿态。本版承接 R0.10 的显式通道执行合同，把同一份来源拍翼循环改造成“统一相位定义、刷新率仅采样”的确定性时钟层。

          ## 本版完成内容

          - 唯一运动定义固定为 `phase01 ∈ [0,1)`；
          - 来源周期固定为 `49 / 24 s = 2.0416666667 s`；
          - `F50 → F01` 被登记为显式边界事件；
          - 建立 24、30、60、90、120 Hz 五种采样适配；
          - 建立 1、10、100、1000、10000 周期累计漂移审计；
          - 继续输出 R0.10 的 11 个活动通道，并保持左右腕部两个来源近似锁死通道为只读；
          - 沿用 R0.10 的输入裁剪、上次有效值回退、默认值回退、锁定写入拒绝、来源包络后置钳制和 fail-closed 规则；
          - 主三维视窗仍为来源鸟体，不被相位时钟或控制器改写。

          ## 关键发现

          24 Hz 每周期正好 49 个采样，120 Hz 每周期正好 245 个采样；30、60、90 Hz 的每周期样本数不是整数。如果每个周期都把样本数独立四舍五入，误差会随周期数确定性累积。R0.11 因此使用 `time × 24 / 49` 的有理相位时钟，避免把刷新率误写成动作定义。

          ## 不得误读

          - 多速率稳定只证明工程时钟不漂移，不证明来源动画在生物学或空气动力学上正确；
          - R0.11 没有解锁展向扭转、外翼扇面、初级飞羽展开、次级飞羽重叠或空气载荷响应；
          - 滑翔、翱翔、转弯、起飞、着陆和逃逸仍等待用户提供来源文件；
          - `visualAcceptance=false`；
          - `productionReady=false`；
          - `commercialRuntimeEligible=false`；
          - 来源许可为 `CC-BY-NC-SA-4.0`，不得直接进入商业运行时。

          ## 下一道门

          下一步只能继续整理来源已经证明的运行时交接包：通道单位、坐标约定、事件序列、序列化格式和确定性回放。不能用工程稳定性替代鸟体视觉批准，也不能在缺少来源时补造新的飞行姿态或羽毛自由度。
          MD

          python - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path('BIRD_SEAGULL_A_PHASE_CLOCK_R011')
          manifest={
            'version':'R0.11','entry':'index.html','mode':'hosted-direct-open-rational-phase-clock-and-multi-rate-audit',
            'sourceAsset':'seagull (A).zip / R0.07 contract / R0.10 channel executor',
            'sourceGlbSha256':'175c61f65e3f2c8b561d422f9d0c61b23bfd85928dd3b66ad8547638d84a90aa',
            'sourceContractVersion':'R0.07','channelExecutorVersion':'R0.10','frameCount':50,'sourceIntervalsPerCycle':49,'sourceFps':24,
            'periodSeconds':49/24,'auditedRatesHz':[24,30,60,90,120],'auditedCycleCounts':[1,10,100,1000,10000],
            'activeOutputChannelCount':11,'lockedReadOnlyChannelCount':2,'controlGroupCount':5,'boundaryEvent':'F50_TO_F01',
            'externalRuntimeDependencies':0,'controllerAffectsSourceMesh':False,'visualAcceptance':False,'productionReady':False,'commercialRuntimeEligible':False
          }
