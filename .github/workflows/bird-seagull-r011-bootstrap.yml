          cat > "$dst/qa.mjs" <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const root=path.resolve(process.env.BIRD_R011_QA_ROOT||'artifacts/bird-r011-live');await fs.mkdir(root,{recursive:true});
          const url=process.env.BIRD_R011_QA_URL||'http://127.0.0.1:4173/?qa=1';
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const pageErrors=[],failedRequests=[],consoleEntries=[];
          async function ready(page,label){let last;for(let i=0;i<12;i++){try{const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});assert.equal(r?.status(),200);await page.waitForFunction(()=>window.__BIRD_QA?.ready&&window.__BIRD_R010_QA?.ready&&window.__BIRD_R011_QA?.ready,null,{timeout:45000});await page.waitForTimeout(900);return}catch(e){last=e;await page.waitForTimeout(10000)}}throw last}
          async function webgl(page){return await page.evaluate(()=>{const c=document.getElementById('glcanvas'),gl=c?.getContext('webgl2')||c?.getContext('webgl');if(!c||!gl)return null;const p=new Uint8Array(4);let bright=0;for(let y=1;y<34;y++)for(let x=1;x<54;x++){gl.readPixels(Math.min(c.width-1,Math.floor(x/54*c.width)),Math.min(c.height-1,Math.floor(y/34*c.height)),1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);if(p[0]+p[1]+p[2]>80)bright++}return{bright,width:c.width,height:c.height}})}
          async function pixels(page,id){return await page.evaluate(id=>{const c=document.getElementById(id),x=c?.getContext('2d');if(!c||!x)return null;const d=x.getImageData(0,0,c.width,c.height).data,o=[];for(let y=0;y<c.height;y+=Math.max(1,Math.floor(c.height/34)))for(let z=0;z<c.width;z+=Math.max(1,Math.floor(c.width/52))){const i=(y*c.width+z)*4;o.push([d[i],d[i+1],d[i+2]])}return o},id)}
          function diff(a,b){let changed=0,total=0;for(let i=0;i<Math.min(a.length,b.length);i++){const d=Math.abs(a[i][0]-b[i][0])+Math.abs(a[i][1]-b[i][1])+Math.abs(a[i][2]-b[i][2]);total+=d;if(d>18)changed++}return{changed,total}}
          async function audit(label,opts){const context=await browser.newContext(opts),page=await context.newPage();page.on('pageerror',e=>pageErrors.push({label,message:e.message}));page.on('requestfailed',r=>failedRequests.push({label,url:r.url()}));page.on('console',m=>consoleEntries.push({label,type:m.type(),text:m.text()}));await ready(page,label);const q=await page.evaluate(()=>window.__BIRD_R011_QA);assert.equal(q.version,'R0.11');assert.equal(q.activeChannelCount,11);assert.equal(q.lockedChannelCount,2);assert.equal(q.controlGroupCount,5);assert.equal(q.externalRuntimeDependencies,0);assert.equal(q.controllerAffectsSourceMesh,false);assert.equal(q.postClampViolations,0);const a24=await page.evaluate(()=>window.__BIRD_R011_API.auditRate(24,10000));assert.equal(a24.exactSamplesPerCycle,49);assert.equal(a24.naiveAccumulatedDriftFrames,0);const a120=await page.evaluate(()=>window.__BIRD_R011_API.auditRate(120,10000));assert.equal(a120.exactSamplesPerCycle,245);assert.equal(a120.naiveAccumulatedDriftFrames,0);const a30=await page.evaluate(()=>window.__BIRD_R011_API.auditRate(30,10000));assert.equal(a30.exactSamplesPerCycle,61.25);assert(Math.abs(a30.naiveAccumulatedDriftFrames)>100);assert.equal(a30.rationalClockDriftFrames,0);for(const r of [24,30,60,90,120]){const a=await page.evaluate(r=>window.__BIRD_R011_API.auditRate(r,1000),r);assert(Number.isFinite(a.normalizedRmse));assert(Number.isFinite(a.normalizedMaxError))}const g=await webgl(page);assert(g&&g.bright>20,`${label}: source bird not visible ${JSON.stringify(g)}`);const before=await pixels(page,'r011RateGraph');await page.evaluate(()=>window.__BIRD_R011_API.setRate(30));await page.waitForTimeout(250);const after=await pixels(page,'r011RateGraph');const d=diff(before,after);assert(d.changed>0&&d.total>0);await page.locator('#r011FaultProbe').click();await page.waitForTimeout(250);const probe=await page.evaluate(()=>window.__BIRD_R011_QA.faultProbe);assert(probe?.ok);if(label==='mobile'){await page.locator('#leftMenu').click();await page.waitForTimeout(250);const b=await page.locator('#controls').boundingBox();assert(b&&b.x>=-1&&b.x+b.width<=391);await page.locator('#rightMenu').click();await page.waitForTimeout(250);const rb=await page.locator('#analysis').boundingBox();assert(rb&&rb.x>=-1&&rb.x+rb.width<=391)}await page.screenshot({path:path.join(root,`${label}-r011.png`),fullPage:true});await context.close();return{label,q,a24,a30,a120,g,d,probe}}
          let report;try{const desktop=await audit('desktop',{viewport:{width:1600,height:1000}}),mobile=await audit('mobile',{viewport:{width:390,height:844},isMobile:true,hasTouch:true});assert.equal(pageErrors.length,0,JSON.stringify(pageErrors));assert.equal(failedRequests.length,0,JSON.stringify(failedRequests));assert.equal(consoleEntries.filter(x=>x.type==='error').length,0,JSON.stringify(consoleEntries));report={url,desktop,mobile,pageErrors,failedRequests,consoleEntries,error:null}}catch(e){report={url,pageErrors,failedRequests,consoleEntries,error:e.stack||e.message}}finally{await browser.close()}await fs.writeFile(path.join(root,'qa-report.json'),JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));if(report.error)throw new Error(report.error);
          JS

