name: Deploy Bird Seagull R008 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'BIRD_SEAGULL_A_CONTROLLER_TRANSFER_R008/**'
      - '.github/workflows/bird-seagull-r008-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate source payloads and R008 controller transfer contract
        shell: bash
        run: |
          set -euo pipefail
          dir=BIRD_SEAGULL_A_CONTROLLER_TRANSFER_R008
          test -f "$dir/index.html"
          test -f "$dir/style.css"
          test -f "$dir/runtime/viewer-00.js"
          test "$(find "$dir/runtime" -name 'viewer-chunk-*.js' | wc -l)" -eq 4
          test -f "$dir/runtime/bootstrap.js"
          test -f "$dir/runtime/contract-ui-base.js"
          test -f "$dir/runtime/contract-ui.js"
          test -f "$dir/data/contract.js"
          test -f "$dir/controller.json"
          test -f "$dir/manifest.json"
          test "$(find "$dir/data" -name 'form-*.js' | wc -l)" -eq 5
          test "$(find "$dir/data" -name 'anim-*.js' | wc -l)" -eq 12
          node --check "$dir/runtime/contract-ui.js"
          node --check "$dir/qa.mjs"
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),zlib=require('zlib'),crypto=require('crypto');
          const dir='BIRD_SEAGULL_A_CONTROLLER_TRANSFER_R008';global.window={};
          for(const f of fs.readdirSync(`${dir}/data`).filter(x=>x.startsWith('form-')).sort())vm.runInThisContext(fs.readFileSync(`${dir}/data/${f}`,'utf8'));
          for(const f of fs.readdirSync(`${dir}/data`).filter(x=>x.startsWith('anim-')).sort())vm.runInThisContext(fs.readFileSync(`${dir}/data/${f}`,'utf8'));
          vm.runInThisContext(fs.readFileSync(`${dir}/data/contract.js`,'utf8'));
          for(const f of fs.readdirSync(`${dir}/runtime`).filter(x=>x.startsWith('viewer-chunk-')).sort())vm.runInThisContext(fs.readFileSync(`${dir}/runtime/${f}`,'utf8'));
          const m=JSON.parse(fs.readFileSync(`${dir}/manifest.json`,'utf8'));
          const p=JSON.parse(fs.readFileSync(`${dir}/controller.json`,'utf8'));
          const c=window.__BIRD_R007_CONTRACT;
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const g64=window.__BIRD_FORM,a64=window.__BIRD_R006_ANIM,v64=window.__BIRD_R007_VIEWER;
          const gg=Buffer.from(g64,'base64'),gr=zlib.gunzipSync(gg),ag=Buffer.from(a64,'base64'),ar=zlib.gunzipSync(ag),vg=Buffer.from(v64,'base64'),vr=zlib.gunzipSync(vg);
          if(gr.readUInt32LE(0)!==4416||gr.readUInt32LE(4)!==16872)throw new Error('geometry counts mismatch');
          if(ar.subarray(0,8).toString()!=='BANIM006'||ar.readUInt32LE(16)!==50)throw new Error('animation header mismatch');
          if(c.version!=='R0.07'||c.evidence.frameCount!==50)throw new Error('source contract mismatch');
          if(p.version!=='R0.08'||p.anchorFramesZeroBased.length!==8||p.controllerChannels.length!==9)throw new Error('controller contract mismatch');
          if(m.version!=='R0.08'||m.controllerAnchorCount!==8||m.controllerChannelCount!==9||m.sourceCurveSamples!==450||m.controllerAnchorSamples!==72)throw new Error('manifest counts mismatch');
          if(Math.abs(m.controllerSampleReduction-.84)>1e-12)throw new Error('sample reduction mismatch');
          if(sha(fs.readFileSync(`${dir}/controller.json`))!==m.controllerJsonSha256)throw new Error('controller JSON SHA mismatch');
          if(sha(fs.readFileSync(`${dir}/runtime/contract-ui.js`))!==m.runtimeBundleSha256)throw new Error('R008 runtime bundle SHA mismatch');
          if(fs.statSync(`${dir}/runtime/contract-ui.js`).size!==m.runtimeBundleBytes)throw new Error('R008 runtime bundle size mismatch');
          if(vr.length!==25878)throw new Error('viewer source length mismatch');
          const anchors=p.anchorFramesZeroBased,smooth=t=>t*t*(3-2*t),approx=(arr,i)=>{if(i<=anchors[0])return arr[anchors[0]];if(i>=anchors.at(-1))return arr[anchors.at(-1)];let k=0;while(i>anchors[k+1])k++;const a=anchors[k],b=anchors[k+1],t=smooth((i-a)/(b-a));return arr[a]+(arr[b]-arr[a])*t};
          const tip=c.series.averageWingtipY,pred=tip.map((_,i)=>approx(tip,i));
          const rmse=Math.sqrt(tip.reduce((s,v,i)=>s+(v-pred[i])**2,0)/tip.length);
          if(!Number.isFinite(rmse)||!anchors.every(i=>Math.abs(tip[i]-pred[i])<1e-12))throw new Error('controller interpolation audit failed');
          console.log({geometryBytes:gr.length,animationBytes:ar.length,viewerBytes:vr.length,controllerAnchors:anchors.map(x=>x+1),tipRmse:rmse,sampleReduction:m.controllerSampleReduction});
          NODE

      - name: Prepare minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a BIRD_SEAGULL_A_CONTROLLER_TRANSFER_R008/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  live-browser-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BIRD_R008_QA_URL: ${{ needs.deploy.outputs.page_url }}?qa=${{ github.run_id }}
      BIRD_R008_QA_ROOT: artifacts/bird-r008-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Chromium verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify exact deployed R008 page on desktop and mobile
        run: node BIRD_SEAGULL_A_CONTROLLER_TRANSFER_R008/qa.mjs
      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r008-live
          path: artifacts/bird-r008-live
          if-no-files-found: warn
          retention-days: 90
