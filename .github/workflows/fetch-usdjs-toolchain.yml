name: Fetch USDJS Toolchain

on:
  push:
    branches:
      - work/human-multi-character-foundation-20260930
    paths:
      - .github/workflows/fetch-usdjs-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public USDJS parser
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/cinevva-engine/usdjs.git usdjs
          cd usdjs
          git sparse-checkout set --skip-checks src package.json tsconfig.json README.md LICENSE
          npm install --no-audit --no-fund
          npm run build
          mkdir -p ../artifact
          npm pack --pack-destination ../artifact
          cd ..
          npm pack three@0.182.0 --pack-destination artifact
          npm pack fflate@0.8.2 --pack-destination artifact
          sha256sum artifact/*.tgz > artifact/SHA256SUMS.txt
          ls -lh artifact
      - name: Upload parser toolchain
        uses: actions/upload-artifact@v4
        with:
          name: usdjs-toolchain
          path: artifact/
          if-no-files-found: error
          retention-days: 7
