name: Apply Corridor Active Yield

on:
  push:
    branches:
      - feature/human-task-workbench-adjustment-v2-fullbase
    paths:
      - .github/workflows/apply-corridor-active-yield.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-task-workbench-adjustment-v2-fullbase
      - name: Apply bounded source patch
        run: python tools/apply-corridor-active-yield.py
      - name: Commit corridor active-yield runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-corridor-active-yield.yml tools/apply-corridor-active-yield.py
          git add body/NaturalLocomotion.js
          git commit -m "feat(traffic): add narrow-corridor direction ownership and active retreat"
          git push origin HEAD:feature/human-task-workbench-adjustment-v2-fullbase
