name: Shoe R08 layered seam verification
on:
  push:
    branches: [fix/shoe-r08-seam-contract-20261013]
    paths: ['shoe-workshop/r08/**', '.github/workflows/shoe-r08-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shoe-r08-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: shoe-workshop
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize only absent sources and remove stale candidate receipts
        run: |
          python shoe-workshop/r08/tools/initialize.py
          rm -rf shoe-workshop/r08/evidence
          rm -f shoe-workshop/r08/PUBLIC_URL.txt shoe-workshop/r08/RELEASE_RECEIPT.json
          node --check shoe-workshop/r08/src/main.mjs
          node --check shoe-workshop/r08/src/sole-contact.mjs
          node --check shoe-workshop/r08/tests/browser.mjs
      - name: Pinned geometry and browser dependencies
        run: |
          npm install --prefix shoe-workshop --no-save --package-lock=false three@0.179.1 esbuild@0.25.10 playwright@1.56.0
          cd shoe-workshop && npx playwright install --with-deps chromium
      - name: Build current R08 and fingerprint actual bundled sources
        run: node shoe-workshop/r08/tools/build.mjs
      - name: Early actual toe side and heel render review
        id: early
        continue-on-error: true
        run: node shoe-workshop/r08/tests/browser.mjs --early
      - name: Preserve early actual renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoe-r08-early-${{ github.run_id }}
          path: shoe-workshop/r08/evidence/early/
          retention-days: 14
      - name: Actual stack needle centres exposed spans and final sole wall
        id: numeric
        continue-on-error: true
        run: |
          node shoe-workshop/r08/tests/kernel.mjs
          node shoe-workshop/r08/tests/exposure.mjs
      - name: Actual file browser materials near far and inherited controls
        id: browser
        continue-on-error: true
        run: node shoe-workshop/r08/tests/browser.mjs
      - name: Require all current source gates
        run: |
          test '${{ steps.early.outcome }}' = 'success'
          test '${{ steps.numeric.outcome }}' = 'success'
          test '${{ steps.browser.outcome }}' = 'success'
      - name: Fast-forward current verified source without overwriting newer work
        id: publish
        run: |
          remote_sha=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo 'STALE_BUILD: branch advanced during validation. Keep evidence, rebuild newest source; never force push.'
            exit 1
          fi
          git config user.name 'Shoe R08 Verification'
          git config user.email 'shoe-r08@users.noreply.github.com'
          git add shoe-workshop/r08
          if git diff --cached --name-only | grep -v '^shoe-workshop/r08/'; then exit 1; fi
          git commit -m 'build(shoes): final checked R08 layers and sole-wall runtime [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Immutable public full bytes and actual browser
        env:
          PUBLIC_BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          node shoe-workshop/r08/tests/browser.mjs --public
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('shoe-workshop/r08')
          load=lambda f:json.loads((p/f).read_text())
          m=load('BUILD_MANIFEST.json'); q=load('evidence/public/QA.json'); b=load('evidence/browser/QA.json')
          n=load('evidence/numerics/QA.json'); e=load('evidence/numerics/EXPOSURE.json'); w=load('evidence/numerics/SOLE_CONTACT.json')
          assert all(x['sourceBuild']==m['sourceBuild'] for x in [q,b,n,e,w])
          assert n['success'] and not n['needleMisses'] and not e['occluded'] and not w['remainingSampledProtrusions']
          assert len(q['checks'])==18 and len(b['checks'])==19
          assert all(x['passed'] for x in q['checks']+b['checks'])
          assert not q['errors'] and not q['consoleErrors'] and not b['errors'] and not b['consoleErrors']
          r={'version':'R08.0','base':'5889ebd871aa34baad5e6094d4ccf29bc29f40f7','recoveredFrom':'e894ba8f56dc9864c4086531cff1b24221c75330','sourceBuild':m['sourceBuild'],'buildSha':os.environ['PUBLIC_BUILD_SHA'],'url':q['url'],'runtime':m['runtime'],'runId':os.environ['GITHUB_RUN_ID'],'numericChecks':len(n['checks']),'needleCentreTests':len(n['needleTests']),'needleCentreMisses':len(n['needleMisses']),'exposedSpanSamples':e['samples'],'occludedExposedSamples':len(e['occluded']),'soleWall':{k:w[k] for k in ['coreSamples','detectedOldProtrusions','remainingSampledProtrusions','maxMoveMm','scope']},'standaloneChecks':len(b['checks']),'publicChecks':len(q['checks']),'errors':q['errors'],'consoleErrors':q['consoleErrors'],'environment':q['environment'],'acceptance':{'publicRuntimeVerified':True,'producerRenderReview':False,'userVisual':False,'fullYarnCollision':False,'sewingPhysics':False,'manufacturing':False},'scope':'Owned lapped joints; signed contact; all receiving plies pierced; static needle/bobbin routes; per-panel R10 recipes; camera depth precision; continuous rear rails and final forefoot wall registration. No lace work.'}
          (p/'RELEASE_RECEIPT.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          remote_sha=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote_sha" = "$PUBLIC_BUILD_SHA"
          git add shoe-workshop/r08
          git commit -m 'test(shoes): final R08 immutable public verification receipt [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Preserve current source and actual evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoe-r08-candidate-${{ github.run_id }}
          path: shoe-workshop/r08/
          include-hidden-files: true
          retention-days: 14
