name: Leather R15 S2B main-thread delivery
on:
  push:
    branches: [perf/leather-r15-s2b-20261013]
    paths:
      - .github/workflows/leather-r15-s2b.yml
      - leather-workshop/r15/**
      - leather-workshop/s2b-delivery/**
permissions:
  contents: read
concurrency:
  group: leather-r15-s2b
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KAOPU_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            leather-workshop/r14
            leather-workshop/s2b-delivery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Measure frozen R14 without changing release source
        run: |
          pip --disable-pip-version-check install playwright==1.55.0
          xvfb-run -a python -u leather-workshop/s2b-delivery/qa-profile.py --reference leather-workshop/r14/public-lite.html --out /tmp/s2b-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leather-s2b-baseline-${{ github.run_id }}
          path: /tmp/s2b-profile/
          retention-days: 7
