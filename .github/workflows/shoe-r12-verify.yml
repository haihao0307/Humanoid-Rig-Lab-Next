name: Shoe R12 four independent constructions and real browser
on:
  push:
    branches: [feature/shoe-four-styles-r12-20261017]
    paths:
      - 'shoe-workshop/r12/src/**'
      - 'shoe-workshop/r12/tests/**'
      - 'shoe-workshop/r12/tools/**'
      - 'shoe-workshop/r12/index.html'
      - 'shoe-workshop/r12/style.css'
      - 'shoe-workshop/r12/package*.json'
      - '.github/workflows/shoe-r12-verify.yml'
permissions:
  contents: read
concurrency:
  group: shoe-r12-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shoe-workshop/r12
            shoe-workshop/r10
            shoe-workshop/r09/src
            shoe-workshop/r07/src
            shoe-workshop/r05/src
            shoe-workshop/r04/src
            shoe-workshop/r04/vendor
            shoe-workshop/r06/src
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shoe-workshop/r12/package-lock.json
      - name: Install pinned dependencies
        working-directory: shoe-workshop/r12
        run: npm ci --ignore-scripts
      - name: Build source-labelled standalone runtime
        working-directory: shoe-workshop/r12
        run: npm run build
      - name: Independent numerical structure and retained payload checks
        id: geometry
        continue-on-error: true
        working-directory: shoe-workshop/r12
        run: npm test
      - name: Chromium render environment
        working-directory: shoe-workshop/r12
        run: npx playwright install --with-deps chromium
      - name: Actual file URL first frame, four shapes and controls
        id: browser
        continue-on-error: true
        working-directory: shoe-workshop/r12
        run: node tests/browser.mjs
      - name: Preserve candidate and actual renders even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoe-r12-candidate-${{ github.run_id }}
          path: |
            shoe-workshop/r12/public-lite.html
            shoe-workshop/r12/BUILD_MANIFEST.json
            shoe-workshop/r12/evidence/
          retention-days: 14
      - name: Both independent gates must pass
        if: always()
        env:
          GEOMETRY_RESULT: ${{ steps.geometry.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          test "$GEOMETRY_RESULT" = success
          test "$BROWSER_RESULT" = success
