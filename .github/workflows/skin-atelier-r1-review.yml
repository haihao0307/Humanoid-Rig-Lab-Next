name: Skin Atelier R1 browser review
on:
  push:
    branches: [work/skin-atelier-r1-20261007]
    paths: ['studies/skin-atelier-r1/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: studies/skin-atelier-r1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright@1.55.0
      - name: Review deployed candidate and local fallback
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: node studies/skin-atelier-r1/review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-atelier-r1-browser-review
          path: |
            evidence
            studies/skin-atelier-r1
          retention-days: 14
