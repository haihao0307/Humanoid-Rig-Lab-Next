name: Apply Resource Circulation R2.4

on:
  push:
    branches:
      - feature/human-task-workbench-adjustment-v2-fullbase

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-task-workbench-adjustment-v2-fullbase
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve diversion retry state through TaskAgent completion
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('control/NPCPopulation.js')
          raw=path.read_bytes().decode('utf-8')
          newline='\r\n' if raw.count('\r\n') > raw.count('\n')/2 else '\n'
          text=raw.replace('\r\n','\n')
          old="const actor=this.actors.get(a.npcId);if(actor&&!preserveResource&&!a.held)actor.resource={mode:'clear',requestKey:null,attempts:0,diversions:actor.resource?.diversions||0,conflict:null,anchor:null};"
          new="const actor=this.actors.get(a.npcId),keepResource=preserveResource||actor?.running?.source==='resource-circulation';if(actor&&!keepResource&&!a.held)actor.resource={mode:'clear',requestKey:null,attempts:0,diversions:actor.resource?.diversions||0,conflict:null,anchor:null};"
          if text.count(old)!=1:
              raise SystemExit(f'expected one resource release site, found {text.count(old)}')
          path.write_bytes(text.replace(old,new,1).replace('\n',newline).encode('utf-8'))
          PY
      - name: Verify resource circulation and traffic regression
        run: |
          node --check control/NPCPopulation.js
          node tools/test-npc-resource-circulation.mjs
          node tools/test-npc-traffic-wait.mjs
          node tools/test-npc-target-reservations.mjs
          node tools/test-npc-four-way-crossing.mjs
          node tools/test-npc-corridor-active-yield.mjs
          node tools/test-grid-navigation-batch.mjs
      - name: Commit retry-state fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/NPCPopulation.js
          git commit -m "fix(task): keep resource diversion retries bounded"
          git push origin HEAD:feature/human-task-workbench-adjustment-v2-fullbase
