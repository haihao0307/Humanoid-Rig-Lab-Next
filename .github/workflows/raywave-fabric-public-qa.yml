name: Ray-wave fabric public browser QA
on:
  push:
    branches: ['experiment/hrl-m04-raywave-fabric-r01-20261007']
    paths:
      - 'previews/raywave-fabric-r01/**'
      - '.github/workflows/raywave-fabric-public-qa.yml'
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: previews/raywave-fabric-r01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: Verify immutable public HTTPS rendering and interactions
        run: python previews/raywave-fabric-r01/qa_public.py
      - name: Preserve actual browser screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raywave-fabric-public-browser-evidence
          path: previews/raywave-fabric-r01/qa-public/
          retention-days: 30
