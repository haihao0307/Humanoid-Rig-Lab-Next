name: Deploy Bird Seagull R005 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/**'
      - '.github/workflows/bird-seagull-r005-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate R005 source anatomy package
        shell: bash
        run: |
          set -euo pipefail
          test -f BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/index.html
          test -f BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/qa.mjs
          test "$(find BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/data -name 'form-*.js' | wc -l)" -eq 5
          test "$(find BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/runtime -name 'anatomy-*.js' | wc -l)" -eq 3
          test "$(find BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/runtime -name 'viewer-*.js' | wc -l)" -eq 3
          node --check BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/qa.mjs
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');
          const root = 'BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          const expected = { vertexCount:4416, triangleCount:5624, indexCount:16872, payloadChars:39900, regionCount:13, jointCount:21, profileSampleCount:64, connectedComponents:147 };
          for (const [key, value] of Object.entries(expected)) if (manifest[key] !== value) throw new Error(`${key} mismatch`);
          function joined(prefix) {
            return fs.readdirSync(path.join(root, 'runtime')).filter(name => name.startsWith(prefix)).sort().map(name => {
              const text = fs.readFileSync(path.join(root, 'runtime', name), 'utf8');
              const match = text.match(/\+'([^']*)';/);
              if (!match) throw new Error(`chunk parse failed: ${name}`);
              return match[1];
            }).join('');
          }
          const anatomy = JSON.parse(zlib.gunzipSync(Buffer.from(joined('anatomy-'), 'base64')).toString('utf8'));
          const viewer = zlib.gunzipSync(Buffer.from(joined('viewer-'), 'base64')).toString('utf8');
          if (anatomy.version !== 'R0.05' || anatomy.regions.length !== 13 || anatomy.joints.length !== 21 || anatomy.profile.samples.length !== 64) throw new Error('anatomy package mismatch');
          if (!viewer.includes("version:'R0.05'") || !viewer.includes('函数解剖载入完成')) throw new Error('viewer package mismatch');
          const form = fs.readdirSync(path.join(root, 'data')).filter(name => name.startsWith('form-')).sort().map(name => {
            const text = fs.readFileSync(path.join(root, 'data', name), 'utf8');
            const match = text.match(/\+'([^']*)';/);
            if (!match) throw new Error(`form parse failed: ${name}`);
            return match[1];
          }).join('');
          if (form.length !== 39900) throw new Error(`geometry payload length mismatch: ${form.length}`);
          const geometry = zlib.gunzipSync(Buffer.from(form, 'base64'));
          if (geometry.readUInt32LE(0) !== 4416 || geometry.readUInt32LE(4) !== 16872) throw new Error('geometry header mismatch');
          console.log({ manifest, anatomyRegions: anatomy.regions.length, anatomyJoints: anatomy.joints.length, geometryBytes: geometry.length });
          NODE

      - name: Prepare minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live-page:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIRD_R005_QA_URL: ${{ needs.deploy.outputs.page_url }}?qa=pages
      BIRD_R005_QA_ROOT: artifacts/bird-seagull-r005-pages-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify exact deployed R005 page
        run: node BIRD_SEAGULL_A_FUNCTION_ANATOMY_R005/qa.mjs
      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r005-pages-live
          path: artifacts/bird-seagull-r005-pages-live
          if-no-files-found: warn
          retention-days: 90
