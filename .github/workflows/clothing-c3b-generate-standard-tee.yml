name: Clothing C3B generate standard tee
on:
  push:
    branches: [experiment/clothing-c2-authoritative-3d-import-20260911]
    paths: [.github/workflows/clothing-c3b-generate-standard-tee.yml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pattern dependencies
        run: python -m pip install 'numpy<2' scipy pyyaml svgwrite svgpathtools psutil matplotlib CairoSVG
      - name: Fetch fixed GarmentCode
        run: |
          curl -L --fail https://github.com/maria-korosteleva/GarmentCode/archive/d449629979028123a5c4dc9e732a2ec19b7fce31.zip -o /tmp/GarmentCode.zip
          unzip -q /tmp/GarmentCode.zip -d /tmp
          mv /tmp/GarmentCode-d449629979028123a5c4dc9e732a2ec19b7fce31 /tmp/GarmentCode
      - name: Generate official T-shirt preset
        run: |
          cd /tmp/GarmentCode
          cp system.template.json system.json
          python test_garmentcode.py
          find Logs -type f -maxdepth 3 -print
      - uses: actions/upload-artifact@v4
        with:
          name: HRL-M04-C3B-standard-tee-pattern
          path: /tmp/GarmentCode/Logs
          retention-days: 30
