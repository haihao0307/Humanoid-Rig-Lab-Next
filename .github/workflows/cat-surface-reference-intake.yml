name: Cat surface reference intake

on:
  push:
    branches:
      - experiment/cat-authoritative-reference-intake-v1-20260911
    paths:
      - .github/workflows/cat-surface-reference-intake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reference tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install objaverse trimesh pygltflib numpy matplotlib pillow requests networkx scipy

      - name: Download and inspect locked CC BY body candidate
        run: |
          set -euo pipefail
          mkdir -p reference-intake/cat-surface-v3
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import requests
          import objaverse
          import trimesh
          import numpy as np
          import matplotlib.pyplot as plt
          from PIL import Image
          from io import BytesIO

          UID = 'b1ec7fdcf0874e64ada6dbd13e8a66b4'
          OUT = Path('reference-intake/cat-surface-v3')
          OUT.mkdir(parents=True, exist_ok=True)

          response = requests.get(f'https://api.sketchfab.com/v3/models/{UID}', timeout=45)
          response.raise_for_status()
          metadata = response.json()
          (OUT / 'SKETCHFAB_METADATA.json').write_text(
              json.dumps(metadata, indent=2, ensure_ascii=False), encoding='utf-8')

          thumbnail_images = ((metadata.get('thumbnails') or {}).get('images') or [])
          if thumbnail_images:
              best = max(thumbnail_images, key=lambda item: item.get('width', 0) * item.get('height', 0))
              thumb_response = requests.get(best['url'], timeout=45)
              thumb_response.raise_for_status()
              Image.open(BytesIO(thumb_response.content)).convert('RGB').save(
                  OUT / 'REFERENCE_OFFICIAL_THUMBNAIL.jpg', quality=94)

          downloaded = objaverse.load_objects(uids=[UID], download_processes=1)
          if UID not in downloaded:
              raise RuntimeError(f'Objaverse has no downloadable object for {UID}')
          source_path = Path(downloaded[UID])
          suffix = source_path.suffix.lower() or '.glb'
          preserved = OUT / f'cat-emma-reference-{UID}{suffix}'
          shutil.copy2(source_path, preserved)

          sha = hashlib.sha256(preserved.read_bytes()).hexdigest()
          loaded = trimesh.load(preserved, force='scene', process=False)
          scene = trimesh.Scene(loaded) if isinstance(loaded, trimesh.Trimesh) else loaded

          meshes = []
          names = []
          for node_name in scene.graph.nodes_geometry:
              transform, geom_name = scene.graph[node_name]
              geom = scene.geometry[geom_name].copy()
              geom.apply_transform(transform)
              meshes.append(geom)
              names.append({'node': str(node_name), 'geometry': str(geom_name)})
          if not meshes:
              raise RuntimeError('No mesh geometry found in downloaded reference')

          geometry_inventory = []
          for index, (geom, names_entry) in enumerate(zip(meshes, names)):
              geometry_inventory.append({
                  'index': index,
                  **names_entry,
                  'vertexCount': int(len(geom.vertices)),
                  'triangleCount': int(len(geom.faces)),
                  'bounds': geom.bounds.tolist(),
                  'watertight': bool(geom.is_watertight)
              })
          combined = trimesh.util.concatenate(meshes)
          vertices = np.asarray(combined.vertices, dtype=np.float64)
          centered = vertices - vertices.mean(axis=0)
          covariance = np.cov(centered.T)
          eigvals, eigvecs = np.linalg.eigh(covariance)
          order = np.argsort(eigvals)[::-1]
          basis = eigvecs[:, order]
          principal = centered @ basis
          extents = principal.max(axis=0) - principal.min(axis=0)

          views = [
              ('A/B', 0, 1, 2), ('A/C', 0, 2, 1), ('B/C', 1, 2, 0),
              ('B/A', 1, 0, 2), ('C/A', 2, 0, 1), ('C/B', 2, 1, 0)
          ]
          fig, axes = plt.subplots(2, 3, figsize=(15, 9), dpi=160)
          stride = max(1, len(principal) // 160000)
          pts = principal[::stride]
          for ax, (title, xi, yi, di) in zip(axes.flat, views):
              depth = pts[:, di]
              depth_order = np.argsort(depth)
              ax.scatter(pts[depth_order, xi], pts[depth_order, yi],
                         c=depth[depth_order], s=0.10, linewidths=0, cmap='viridis')
              ax.set_aspect('equal', adjustable='box')
              ax.set_title(title)
              ax.axis('off')
          fig.suptitle('Actual downloaded body candidate: The Cat / Emma A1', fontsize=16)
          fig.tight_layout()
          fig.savefig(OUT / 'REFERENCE_SURFACE_MULTIVIEW.png', bbox_inches='tight')
          plt.close(fig)

          components = combined.split(only_watertight=False)
          faces = np.asarray(combined.faces)
          receipt = {
              'schema': 'kaopu.cat.surface-reference-receipt/1.0',
              'uid': UID,
              'title': metadata.get('name'),
              'author': (metadata.get('user') or {}).get('displayName') or (metadata.get('user') or {}).get('username'),
              'sourcePage': f'https://sketchfab.com/3d-models/the-catemma-a1-{UID}',
              'license': metadata.get('license'),
              'isDownloadable': metadata.get('isDownloadable'),
              'publishedAt': metadata.get('publishedAt'),
              'sourceFile': preserved.name,
              'sourceBytes': preserved.stat().st_size,
              'sha256': sha,
              'geometryCount': len(meshes),
              'geometryInventory': geometry_inventory,
              'vertexCount': int(len(vertices)),
              'triangleCount': int(len(faces)),
              'connectedComponents': int(len(components)),
              'watertight': bool(combined.is_watertight),
              'eulerNumber': int(combined.euler_number),
              'bounds': combined.bounds.tolist(),
              'principalExtents': extents.tolist(),
              'principalBasis': basis.tolist(),
              'visualEvidence': ['REFERENCE_OFFICIAL_THUMBNAIL.jpg', 'REFERENCE_SURFACE_MULTIVIEW.png'],
              'role': 'candidate living-surface geometry for parameter recording and code reconstruction',
              'runtimeDependency': False,
              'oneToOneAccepted': False,
              'productionReady': False
          }
          (OUT / 'REFERENCE_SURFACE_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(receipt, indent=2, ensure_ascii=False))
          PY

      - name: Validate artifact contents
        run: |
          set -euo pipefail
          test -s reference-intake/cat-surface-v3/REFERENCE_SURFACE_RECEIPT.json
          test -s reference-intake/cat-surface-v3/REFERENCE_OFFICIAL_THUMBNAIL.jpg
          test -s reference-intake/cat-surface-v3/REFERENCE_SURFACE_MULTIVIEW.png
          find reference-intake/cat-surface-v3 -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload surface reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-emma-surface-reference-v3
          path: reference-intake/cat-surface-v3/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
