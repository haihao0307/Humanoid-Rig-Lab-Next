name: Shorts repair audit
on:
  push:
    branches: [fix/shorts-separated-legs-20260919]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shorts-repair-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply isolated source-only candidate and build canonical page
        run: |
          node tools/apply-shorts-separated-candidate.mjs
          node tools/build-pure.mjs
          node tools/build-shorts-preview.mjs
          node tools/check-pure.mjs
          node --test tools/test-shorts-*.mjs
      - name: Retain exact canonical candidate only on this repair branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/shorts-separated-legs-20260919"
          git add clothing/ShortsPattern.js clothing/ClothShorts.js tools/test-shorts-pattern.mjs tools/test-shorts-integration.mjs index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(shorts): retain canonical separated-gusset handling candidate; visual acceptance pending'
            git push origin HEAD:fix/shorts-separated-legs-20260919
          fi
      - name: Install isolated browser test dependency
        run: |
          mkdir -p /tmp/shorts-browser
          npm install --prefix /tmp/shorts-browser --no-audit --no-fund playwright@1.55.0
          /tmp/shorts-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual bounded sewing and multi-view browser review
        run: |
          python3 -m http.server 8793 --bind 127.0.0.1 >/tmp/shorts-http.log 2>&1 &
          node tools/review-shorts-browser.mjs
      - name: Archive exact audited working tree
        if: always()
        run: |
          mkdir -p /tmp/shorts-repair-artifact
          git rev-parse HEAD > /tmp/shorts-repair-artifact/SOURCE_COMMIT.txt
          tar --exclude=.git --exclude=node_modules -czf /tmp/shorts-repair-artifact/working-tree.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-repair-audited-source
          path: /tmp/shorts-repair-artifact
          retention-days: 7
