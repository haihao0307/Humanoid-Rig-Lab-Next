name: Cat Body Bind V1 R0

on:
  push:
    branches:
      - codex/cat-body-bind-v1-20260917
    paths:
      - .github/workflows/cat-body-bind-v1-r0.yml
      - cat-kaopu/body-bind-v1/**
      - cat-kaopu/tools/capture_cat_body_bind_v1_r0.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cat-body-bind-v1-r0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Cat Body Bind V1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned browser dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Serve and capture R0 body evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > "${RUNNER_TEMP}/cat-body-bind-v1-r0-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/cat-kaopu/body-bind-v1/index.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "${RUNNER_TEMP}/cat-body-bind-v1-r0-http.log" || true
            exit 1
          fi
          CAT_BODY_BIND_V1_URL='http://127.0.0.1:4173/cat-kaopu/body-bind-v1/index.html' \
            node cat-kaopu/tools/capture_cat_body_bind_v1_r0.mjs

      - name: Upload R0 body evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-body-bind-v1-r0-${{ github.run_number }}
          path: |
            cat-kaopu/body-bind-v1/index.html
            cat-kaopu/body-bind-v1/CAT_BODY_BIND_V1_CONTRACT.json
            cat-kaopu/docs/CAT_BODY_BIND_V1_DIRECTION_2026-09-17.md
            cat-kaopu/qa/body-bind-v1-r0/*.json
            cat-kaopu/qa/body-bind-v1-r0/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit R0 browser evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cat-body-bind-build-bot'
          git config user.email 'cat-body-bind-build-bot@users.noreply.github.com'
          git add cat-kaopu/qa/body-bind-v1-r0
          if git diff --cached --quiet; then
            echo 'No Cat Body Bind V1 R0 evidence changes to commit.'
            exit 0
          fi
          git commit -m 'test(cat): archive Cat Body Bind V1 R0 evidence [body-bind-v1 generated]'
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on latest branch head."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo 'Unable to push Cat Body Bind V1 R0 evidence after three attempts.' >&2
          exit 1
