name: Face perioral chin R8 candidate

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-perioral-r8-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: face-perioral-r8-candidate
  cancel-in-progress: true

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply R8 perioral candidate
        run: python3 tools/apply-face-perioral-r8-candidate.py
      - name: Preserve cavity winding and taper white roll into skin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('body/FaceAnatomy.js')
          text=path.read_text(encoding='utf-8')
          old="const mouthPoint=(a,t)=>{const x=lp.centreX+lp.halfWidth*.992*Math.cos(a)*(1-.38*t),q=compactLipOutline(x),seam=lipSurface(x,true,0)[2];return [x,q.seam+.00045*Math.sin(a)*(1+3*t),seam-.0030-.010*t];};"
          new="const mouthPoint=(a,t)=>{const x=lp.centreX+lp.halfWidth*.998*Math.cos(a)*(1-.38*t),q=compactLipOutline(x),seam=lipSurface(x,true,0)[2];return [x,q.seam+.0007*Math.sin(a)*(1+3*t),seam-.0020-.010*t];};"
          if text.count(old)!=1:
              raise SystemExit('R8 oral cavity corrective anchor mismatch')
          text=text.replace(old,new,1)
          old="const whiteRoll=(upper?p.whiteRollUpper:p.whiteRollLower)*Math.exp(-(((r-p.whiteRollCentre)/p.whiteRollWidth)**2))*Math.pow(Math.max(0,1-u*u),1.25);\n  return envelope*(base+swell)+whiteRoll;"
          new="const attach=clamp((p.apron-r)/(p.apron-p.whiteRollCentre),0,1),attachGate=attach*attach*(3-2*attach);\n  const whiteRoll=(upper?p.whiteRollUpper:p.whiteRollLower)*Math.exp(-(((r-p.whiteRollCentre)/p.whiteRollWidth)**2))*Math.pow(Math.max(0,1-u*u),1.25)*attachGate;\n  return envelope*(base+swell)+whiteRoll;"
          if text.count(old)!=1:
              raise SystemExit('R8 white-roll attachment anchor mismatch')
          path.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
      - name: Build and validate candidate
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install isolated browser runtime
        run: |
          mkdir -p /tmp/face-r8-browser
          cd /tmp/face-r8-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture fixed review views
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hrl-face-r8-server.log 2>&1 &
          mkdir -p visual-review-r8
          cat >/tmp/face-r8-browser/capture.cjs <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:1600,height:1200},deviceScaleFactor:1});
            const page=await context.newPage(),consoleMessages=[],pageErrors=[];
            page.on('console',message=>consoleMessages.push({type:message.type(),text:message.text()}));
            page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
            await page.goto('http://127.0.0.1:4173/index.html?review=face',{waitUntil:'domcontentloaded',timeout:120000});
            let frame=null;const deadline=Date.now()+420000;
            while(!frame&&Date.now()<deadline){for(const candidate of page.frames()){if(await candidate.evaluate(()=>Boolean(window.HumanLab?.face?.closeup)).catch(()=>false)){frame=candidate;break;}}if(!frame)await page.waitForTimeout(1000);}
            if(!frame)throw Error('Face review frame unavailable');
            await frame.waitForFunction(()=>window.__compactLoading?.state==='ready'&&window.__humanStartup?.status==='ready',null,{timeout:420000});
            await frame.waitForTimeout(5000);
            const canvas=frame.locator('canvas').first();await canvas.waitFor({state:'visible',timeout:30000});
            for(const view of ['front','side','lips']){
              await frame.evaluate(v=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup(v);window.HumanLab.render();},view);
              await frame.waitForTimeout(1500);
              await canvas.screenshot({path:`visual-review-r8/face-r8-${view}.png`});
            }
            await frame.evaluate(()=>{window.HumanLab.face.setWeight('lipPart',.72);window.HumanLab.face.closeup('lips');window.HumanLab.render();});
            await frame.waitForTimeout(1500);
            await canvas.screenshot({path:'visual-review-r8/face-r8-lip-part.png'});
            await frame.evaluate(()=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup('front');window.HumanLab.render();});
            const runtime=await frame.evaluate(()=>{
              const face=window.HumanLab.face.report(),compact=window.HumanLab.compact?.report,gl=document.querySelector('canvas')?.getContext('webgl2');
              return {review:window.HumanLab.review,startup:window.__humanStartup,compactLoading:window.__compactLoading,eyeAnatomy:compact?.eyeAnatomy,faceAnatomy:compact?.faceAnatomy,separation:face.separation,limitedNodes:face.limitedNodes,renderer:{frames:window.HumanLab.renderer?.frames,drawCalls:window.HumanLab.renderer?.drawCalls,webglError:gl?gl.getError():null,contextLost:gl?gl.isContextLost():null}};
            });
            if(runtime.faceAnatomy?.revision!=='r12-perioral-chin-continuity')throw Error('Unexpected R8 face revision');
            if(runtime.eyeAnatomy?.revision!=='r14-procedural-iris-lid-integration')throw Error('Eye production revision regressed');
            if(runtime.startup?.status!=='ready'||runtime.review?.singleActor!==true)throw Error('Review entry did not become naturally ready');
            if(runtime.renderer.webglError!==0||runtime.renderer.contextLost||pageErrors.length)throw Error('Browser or WebGL error detected');
            fs.writeFileSync('visual-review-r8/face-r8-diagnostics.json',JSON.stringify({runtime,consoleMessages,pageErrors,browserExecuted:true,visualAcceptance:false,productionReady:false},null,2)+'\n');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          NODE_PATH=/tmp/face-r8-browser/node_modules node /tmp/face-r8-browser/capture.cjs
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-perioral-r8-candidate
          path: visual-review-r8
          if-no-files-found: warn
          retention-days: 7
