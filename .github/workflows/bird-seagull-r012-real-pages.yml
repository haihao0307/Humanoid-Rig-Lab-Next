name: Deploy Bird Seagull R012 Real

on:
  push:
    branches:
      - main
    paths:
      - 'BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012/**'
      - '.github/workflows/bird-seagull-r012-real-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate R012 source and packet contract
        shell: bash
        run: |
          set -euo pipefail
          dir=BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012
          test -f "$dir/index.html"
          test -f "$dir/handoff-contract.json"
          test -f "$dir/data/handoff-contract.js"
          test -f "$dir/runtime/contract-ui-r011.js"
          test -f "$dir/runtime/contract-ui.js"
          test -f "$dir/runtime/handoff-ui.js"
          test -f "$dir/qa-r012.mjs"
          node --check "$dir/data/handoff-contract.js"
          node --check "$dir/runtime/contract-ui.js"
          node --check "$dir/runtime/handoff-ui.js"
          node --check "$dir/qa-r012.mjs"
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const dir='BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012';global.window={};
          vm.runInThisContext(fs.readFileSync(`${dir}/data/handoff-contract.js`,'utf8'));
          const p=window.__BIRD_R012_HANDOFF,j=JSON.parse(fs.readFileSync(`${dir}/handoff-contract.json`,'utf8'));
          if(p.version!=='R0.12'||j.version!=='R0.12')throw new Error('R012 version');
          if(p.packet.byteLength!==66||p.packet.fields.length!==12)throw new Error('R012 packet layout');
          if(p.controlOrder.length!==5||p.activeChannelOrder.length!==11||p.lockedChannelOrder.length!==2)throw new Error('R012 channel order');
          let end=0;for(const f of p.packet.fields){if(f.offset!==end)throw new Error(`R012 gap at ${f.name}`);end+=f.bytes}if(end!==66)throw new Error('R012 byte total');
          if(Object.values(p.eventBits).reduce((a,b)=>a|b,0)!==255)throw new Error('R012 event mask');
          console.log({bytes:p.packet.byteLength,fields:p.packet.fields.length,controls:p.controlOrder.length,active:p.activeChannelOrder.length,locked:p.lockedChannelOrder.length});
          NODE
      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  live-browser-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BIRD_R012_QA_URL: ${{ needs.deploy.outputs.page_url }}?qa=${{ github.run_id }}
      BIRD_R012_QA_ROOT: artifacts/bird-r012-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed R012 on desktop and mobile
        run: node BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012/qa-r012.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r012-real-live
          path: artifacts/bird-r012-live
          if-no-files-found: warn
          retention-days: 90
