name: Cat Kaopu V4.43 Orbital Soft Tissue

on:
  push:
    branches:
      - codex/cat-kaopu-v443-orbital-soft-tissue-20260916
    paths:
      - .github/workflows/cat-kaopu-v443-orbital-soft-tissue.yml
      - cat-kaopu/tools/patch_cat_v443_ui_state.py
      - cat-kaopu/tools/patch_cat_v443_orbital_shaders.py
      - cat-kaopu/tools/patch_cat_v443_orbital_geometry.py
      - cat-kaopu/tools/patch_cat_v443_controls_api.py
      - cat-kaopu/tools/finalize_cat_v443_orbital_soft_tissue.py
      - cat-kaopu/tools/verify_cat_v443_module.py
      - cat-kaopu/tools/capture_cat_v443_browser_qa.mjs
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cat-kaopu-v443-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze V4.42 source exactly once and reset workbench
        shell: bash
        run: |
          set -euo pipefail
          baseline='cat-kaopu/baselines/v4.42/CAT_KAOPU_V442_GEOMETRIC_EYELID_WORKBENCH_2026-09-16.html'
          if [ ! -f "$baseline" ]; then
            mkdir -p "$(dirname "$baseline")"
            cp cat-kaopu/workbench/CAT_KAOPU_CURRENT.html "$baseline"
          fi
          cp "$baseline" cat-kaopu/workbench/CAT_KAOPU_CURRENT.html

      - name: Add V4.43 controls and state
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/patch_cat_v443_ui_state.py

      - name: Add V4.43 orbital shaders
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/patch_cat_v443_orbital_shaders.py

      - name: Add V4.43 orbital geometry and draw pass
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/patch_cat_v443_orbital_geometry.py

      - name: Wire V4.43 controls and public API
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/patch_cat_v443_controls_api.py

      - name: Finalize V4.43 metadata and workbench
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/finalize_cat_v443_orbital_soft_tissue.py

      - name: Verify payload, rig and module invariants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/verify_cat_v443_module.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned browser dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run WebGL2 orbital close-up capture
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > "${RUNNER_TEMP}/cat-v443-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/cat-kaopu/workbench/CAT_KAOPU_CURRENT.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "${RUNNER_TEMP}/cat-v443-http.log" || true
            exit 1
          fi
          CAT_V443_URL='http://127.0.0.1:4173/cat-kaopu/workbench/CAT_KAOPU_CURRENT.html' \
            node cat-kaopu/tools/capture_cat_v443_browser_qa.mjs

      - name: Refresh manifest after browser evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python cat-kaopu/tools/finalize_cat_v443_orbital_soft_tissue.py
          python cat-kaopu/tools/verify_cat_v443_module.py

      - name: Upload V4.43 QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: cat-kaopu-v443-orbital-qa-${{ github.run_number }}
          path: |
            cat-kaopu/CURRENT.json
            cat-kaopu/BUILD_MANIFEST.json
            cat-kaopu/README.md
            cat-kaopu/workbench/CAT_KAOPU_CURRENT.html
            cat-kaopu/build/v4.43/CAT_KAOPU_V443_ORBITAL_SOFT_TISSUE_WORKBENCH_2026-09-16.html
            cat-kaopu/docs/CAT_KAOPU_V443_*.md
            cat-kaopu/qa/CAT_KAOPU_V443_*.json
            cat-kaopu/qa/CAT_KAOPU_V443_*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated V4.43 workbench and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cat-kaopu-build-bot'
          git config user.email 'cat-kaopu-build-bot@users.noreply.github.com'
          git add cat-kaopu
          if git diff --cached --quiet; then
            echo 'No generated V4.43 changes to commit.'
            exit 0
          fi
          git commit -m 'build(cat): generate V4.43 orbital soft-tissue evidence [cat-v443 generated]'
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on latest branch head."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo 'Unable to push V4.43 evidence after three attempts.' >&2
          exit 1
