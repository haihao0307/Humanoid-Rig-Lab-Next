name: Motion convergence browser smoke

on:
  push:
    branches:
      - feature/human-motion-convergence-r1
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact commit SHA to inspect
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: motion-convergence-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-qa-smoke]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            selenium==4.27.1 pillow==11.0.0 requests==2.32.3
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-noto-cjk
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          command -v Xvfb

      - name: Resolve immutable source
        id: target
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          PUBLIC_URL="https://rawcdn.githack.com/haihao0307/Humanoid-Rig-Lab-Next/${SOURCE_SHA}/index.html?visualTest=1"
          BROWSER_URL="http://127.0.0.1:8765/index.html?visualTest=1"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "public_url=${PUBLIC_URL}" >> "$GITHUB_OUTPUT"
          echo "browser_url=${BROWSER_URL}" >> "$GITHUB_OUTPUT"

      - name: Build lightweight motion review entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cp index.html source-index.html
          python - <<'PY'
          from pathlib import Path

          def patch_bytes(path, marker, insertion):
              file = Path(path)
              data = file.read_bytes()
              if data.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one marker, found {data.count(marker)}')
              file.write_bytes(data.replace(marker, marker + insertion, 1))

          patch_bytes(
              'body/CompactWorkbench.js',
              b"async function installCompactWorkbench(lab,pending){",
              b"\n  const motionVisualTest=new URLSearchParams(window.parent!==window?window.parent.location.search:location.search).has('visualTest');\n  if(motionVisualTest){\n    pending?.catch?.(()=>{});\n    cancelCompactSurface('motion visual QA uses the lightweight fallback surface');\n    window.__motionVisualQAFallback={active:true,renderer:'procedural-fallback',motionEvidence:true,skinApproval:false};\n    window.__compactLoading={quality:'qa-fallback',job:'surface',state:'ready',group:'ready',message:'motion visual QA lightweight surface',startedAt:performance.now(),updatedAt:performance.now()};\n    lab.renderer.setQuality('fast');\n    if(!lab.hair?.inStudio?.())lab.focus('body');\n    needsRedraw=true;\n    return;\n  }",
          )
          patch_bytes(
              'control/NPCPopulation.js',
              b"  this.place(actor,position,options.yaw??0);this.pendingIds.add(id);",
              b"\n  if(new URLSearchParams(window.parent!==window?window.parent.location.search:location.search).has('visualTest')){\n   actor.compact=null;\n   if(options.identity)actor.identity={residentId:String(options.identity.residentId||id).slice(0,64),displayName:String(options.identity.displayName||actor.label).slice(0,24),role:String(options.identity.role||'general').slice(0,48)};\n   this.pendingIds.delete(id);\n   return actor;\n  }",
          )
          PY
          node tools/build-pure.mjs
          sha256sum source-index.html index.html | tee qa-entrypoint-hashes.txt

      - name: Run fast browser matrix
        id: capture
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          PUBLIC_URL: ${{ steps.target.outputs.public_url }}
          BROWSER_URL: ${{ steps.target.outputs.browser_url }}
        shell: bash
        run: |
          set -o pipefail
          curl -fL --retry 12 --retry-delay 3 --connect-timeout 20 --max-time 240 \
            -H 'Cache-Control: no-cache' "$PUBLIC_URL" -o public-index.html
          sha256sum source-index.html public-index.html index.html | tee preview-hashes.txt
          cmp -s source-index.html public-index.html
          python -m http.server 8765 --bind 127.0.0.1 >http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS --connect-timeout 2 "http://127.0.0.1:8765/index.html" >/dev/null; then break; fi
            if [[ "$attempt" == 40 ]]; then echo 'Local exact-commit server did not start.' >&2; exit 1; fi
            sleep .25
          done
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python tools/motion_visual_qa_smoke.py \
              --url "$BROWSER_URL" --source-sha "$SOURCE_SHA" --output visual-review --skip-ab \
            | tee visual-qa-run.log

      - name: Upload smoke evidence
        if: always() && hashFiles('visual-review/browser-run-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: motion-convergence-smoke-${{ steps.target.outputs.short_sha }}
          path: |
            visual-review
            visual-qa-run.log
            http-server.log
            preview-hashes.txt
            qa-entrypoint-hashes.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Publish smoke review site
        if: hashFiles('visual-review/visual-review.html') != ''
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          REVIEW_BRANCH: visual-review/human-motion-convergence-smoke
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/$REVIEW_BRANCH:refs/remotes/origin/$REVIEW_BRANCH" || true
          rm -rf /tmp/human-motion-convergence-smoke
          git worktree add --detach /tmp/human-motion-convergence-smoke "$SOURCE_SHA"
          cd /tmp/human-motion-convergence-smoke
          if git show-ref --verify --quiet "refs/remotes/origin/$REVIEW_BRANCH"; then
            git checkout -B "$REVIEW_BRANCH" "refs/remotes/origin/$REVIEW_BRANCH"
          else
            git checkout --orphan "$REVIEW_BRANCH"
            git rm -rf . || true
          fi
          mkdir -p "reviews/$SOURCE_SHA"
          rm -rf "reviews/$SOURCE_SHA"
          cp -a "$GITHUB_WORKSPACE/visual-review/." "reviews/$SOURCE_SHA/"
          cat > latest.json <<EOF
          {
            "sourceSHA": "$SOURCE_SHA",
            "reviewPath": "reviews/$SOURCE_SHA/visual-review.html",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "surfaceReviewScope": "motion-smoke-lightweight-fallback",
            "skinApproval": false,
            "visualAcceptance": false,
            "productionReady": false,
            "userVisualAcceptance": "pending"
          }
          EOF
          cat > index.html <<EOF
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=reviews/$SOURCE_SHA/visual-review.html"><title>人物动作收敛快速验收</title></head><body><p><a href="reviews/$SOURCE_SHA/visual-review.html">打开人物动作收敛快速验收</a></p></body></html>
          EOF
          git add index.html latest.json "reviews/$SOURCE_SHA"
          git commit -m "visual-smoke: $SOURCE_SHA [skip ci]"
          git push origin "HEAD:$REVIEW_BRANCH"

      - name: Enforce smoke gate
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json
          path=Path('visual-review/browser-run-report.json')
          if not path.exists():
              raise SystemExit('Smoke QA did not produce browser-run-report.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          if not data.get('preflight',{}).get('passed'):
              raise SystemExit('Smoke browser preflight failed.')
          if data.get('status') == 'INCONCLUSIVE':
              raise SystemExit('Smoke browser QA is inconclusive.')
