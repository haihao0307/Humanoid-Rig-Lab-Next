name: Promote face eye and nose R7

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-r7-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face-r7-production-promotion
  cancel-in-progress: false

jobs:
  promote-verify-capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Promote readable production sources
        run: python3 tools/promote-face-eye-nose-r7.py
      - name: Build and validate source contracts
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install isolated browser harness
        run: |
          mkdir -p /tmp/face-r7-browser
          cd /tmp/face-r7-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture production review views
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hrl-face-r7-production-server.log 2>&1 &
          mkdir -p visual-review-r7-final docs/qa
          cat >/tmp/face-r7-browser/capture.cjs <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:1600,height:1200},deviceScaleFactor:1});
            const page=await context.newPage(),consoleMessages=[],pageErrors=[];
            page.on('console',message=>consoleMessages.push({type:message.type(),text:message.text()}));
            page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
            await page.goto('http://127.0.0.1:4173/index.html?review=face',{waitUntil:'domcontentloaded',timeout:120000});
            let frame=null;const deadline=Date.now()+420000;
            while(!frame&&Date.now()<deadline){for(const candidate of page.frames()){if(await candidate.evaluate(()=>Boolean(window.HumanLab?.face?.closeup)).catch(()=>false)){frame=candidate;break;}}if(!frame)await page.waitForTimeout(1000);}
            if(!frame)throw Error('Face review frame unavailable');
            await frame.waitForFunction(()=>window.__compactLoading?.state==='ready'&&window.__humanStartup?.status==='ready',null,{timeout:420000});
            await frame.waitForTimeout(5000);
            const canvas=frame.locator('canvas').first();await canvas.waitFor({state:'visible',timeout:30000});
            for(const view of ['front','side','lips']){
              await frame.evaluate(v=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup(v);window.HumanLab.render();},view);
              await frame.waitForTimeout(1500);
              await canvas.screenshot({path:`visual-review-r7-final/face-r7-${view}.png`});
            }
            const runtime=await frame.evaluate(()=>{
              const report=window.HumanLab.face.report(),compact=window.HumanLab.compact?.report,gl=document.querySelector('canvas')?.getContext('webgl2');
              return {review:window.HumanLab.review,compactLoading:window.__compactLoading,startup:window.__humanStartup,eyeAnatomy:compact?.eyeAnatomy,faceAnatomy:compact?.faceAnatomy,separation:report.separation,limitedNodes:report.limitedNodes,renderer:{frames:window.HumanLab.renderer?.frames,drawCalls:window.HumanLab.renderer?.drawCalls,webglError:gl?gl.getError():null,contextLost:gl?gl.isContextLost():null}};
            });
            if(runtime.eyeAnatomy?.revision!=='r14-procedural-iris-lid-integration')throw Error('Unexpected eye revision');
            if(runtime.faceAnatomy?.revision!=='r11-nasal-subunit-continuity')throw Error('Unexpected face revision');
            if(runtime.startup?.status!=='ready'||runtime.review?.singleActor!==true)throw Error('Review entry did not become naturally ready');
            if(runtime.renderer.webglError!==0||runtime.renderer.contextLost||pageErrors.length)throw Error('Browser or WebGL error detected');
            const qa={schema:'jarvis/face_eye_nose_browser_qa@1',commitSource:process.env.GITHUB_SHA,reviewMode:'face',startupReadyNaturally:true,startupOverlayBypassed:false,singleActor:true,eyeRevision:runtime.eyeAnatomy.revision,faceRevision:runtime.faceAnatomy.revision,eyeTriangles:runtime.eyeAnatomy.triangles,faceTriangles:runtime.faceAnatomy.triangles,identityExpressionSeparated:runtime.separation?.ok===true,limitedNodes:runtime.limitedNodes,renderer:runtime.renderer,consoleMessages,pageErrors,browserExecuted:true,visualAcceptance:false,productionReady:false};
            fs.writeFileSync('docs/qa/face-eye-nose-r7-browser.json',JSON.stringify(qa,null,2)+'\n');
            fs.writeFileSync('visual-review-r7-final/face-r7-diagnostics.json',JSON.stringify({runtime,consoleMessages,pageErrors},null,2)+'\n');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          NODE_PATH=/tmp/face-r7-browser/node_modules node /tmp/face-r7-browser/capture.cjs
      - name: Upload final visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: face-eye-nose-r7-final
          path: visual-review-r7-final
          retention-days: 14
      - name: Remove experiments, audit, and commit production state
        shell: bash
        run: |
          rm -f \
            .github/workflows/face-eye-fissure-matrix.yml \
            .github/workflows/face-eye-integration-r5-candidate.yml \
            .github/workflows/face-eye-optics-r6-candidate.yml \
            .github/workflows/face-eye-recess-matrix.yml \
            .github/workflows/face-nose-midface-r7-candidate.yml \
            .github/workflows/face-r4-visual-review.yml \
            .github/workflows/face-r7-promote.yml \
            tools/apply-face-nose-midface-r7-candidate.py \
            tools/promote-face-eye-nose-r7.py
          rm -rf visual-review-r7-final
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
          python3 tools/audit-files.py
          node tools/check-pure.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "face: integrate procedural eyes and nasal subunits"
          git push origin HEAD:feature/human-face-workbench-v1-20260915
