name: Chicken Complete Reference Import

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chicken-complete-reference-import.yml
      - tools/chicken_complete_reference_import.py
      - tools/chicken_complete_reference_import_v2.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade numpy trimesh pygltflib objaverse

      - name: Import and audit complete chicken reference
        run: python tools/chicken_complete_reference_import_v2.py

      - name: Build compact evidence package
        run: |
          cd out/chicken-complete-reference
          zip -9 -r ../CHICKEN_COMPLETE_REFERENCE_IMPORT.zip .

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: CHICKEN_COMPLETE_REFERENCE_IMPORT
          path: out/CHICKEN_COMPLETE_REFERENCE_IMPORT.zip
          if-no-files-found: error
          retention-days: 7
