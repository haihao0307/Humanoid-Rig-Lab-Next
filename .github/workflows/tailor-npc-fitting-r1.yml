name: Tailor NPC fitting R1
on:
  push:
    branches: [feature/tailor-npc-fitting-r1-20260915]
    paths:
      - '.github/workflows/tailor-npc-fitting-r1.yml'
      - 'tailor-npc-fitting/**'
permissions:
  contents: read
jobs:
  source-and-fit-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact source payload
        run: |
          mkdir -p /tmp/tailor-handoff
          git archive --format=zip HEAD -o /tmp/tailor-handoff/Human_Tailor_Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tailor-npc-full-source
          path: /tmp/tailor-handoff/Human_Tailor_Source.zip
          retention-days: 7
