name: Skin R02 build and real-browser validation
on:
  push:
    branches: [experiment/skin-quality-lab-r01-20261007]
    paths:
      - .github/workflows/skin-lab-r02.yml
      - skin-quality-lab/r02/**
permissions:
  contents: write
concurrency:
  group: skin-r02
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            skin-quality-lab/r01/
            skin-quality-lab/r02/
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Install pinned build and test tools
        run: |
          pip -q install pillow numpy scipy numba
          npm install --prefix /tmp/skin-r02 esbuild@0.25.10 playwright@1.55.1 pngjs@7.0.0
          cd /tmp/skin-r02
          npx playwright install --with-deps chromium
      - name: Build scan bands, geometric visibility and modular workbench
        env:
          NODE_PATH: /tmp/skin-r02/node_modules
        run: |
          python skin-quality-lab/r02/prepare.py
          python skin-quality-lab/r02/occlusion.py
          node skin-quality-lab/r02/build.cjs
      - name: Validate local rendering, zero-oil mode and closeup lighting
        env:
          NODE_PATH: /tmp/skin-r02/node_modules
        run: |
          python3 -m http.server 8793 --bind 127.0.0.1 > /tmp/skin-r02-http.log 2>&1 &
          node skin-quality-lab/r02/qa.cjs
          node skin-quality-lab/r02/lookdev.cjs
      - name: Commit tested new files without changing R01 or main
        env:
          NODE_PATH: /tmp/skin-r02/node_modules
        run: |
          git config user.name 'Skin Lab build'
          git config user.email 'skin-lab@users.noreply.github.com'
          git add skin-quality-lab/r02/app.js skin-quality-lab/r02/index.html
          git add -f skin-quality-lab/r02/assets
          if ! git diff --cached --quiet; then
            git commit -m 'build(skin-r02): tested skin bands and geometric visibility'
            git push origin HEAD:experiment/skin-quality-lab-r01-20261007
          fi
          ASSET_COMMIT=$(git rev-parse HEAD) node skin-quality-lab/r02/build.cjs
          git add skin-quality-lab/r02/preview.html
          if ! git diff --cached --quiet; then
            git commit -m 'release(skin-r02): immutable bundled public preview'
            git push origin HEAD:experiment/skin-quality-lab-r01-20261007
          fi
          echo "LAB_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate public HTTPS desktop and mobile viewports
        env:
          NODE_PATH: /tmp/skin-r02/node_modules
          SKIN_QA_DIR: r02-public-evidence
        run: |
          SKIN_QA_URL="https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/${LAB_COMMIT}/skin-quality-lab/r02/preview.html" node skin-quality-lab/r02/qa.cjs
      - name: Preserve source and actual rendered evidence
        if: always()
        run: |
          mkdir -p delivery
          cp -a r02-evidence delivery/ 2>/dev/null || true
          cp -a r02-public-evidence delivery/ 2>/dev/null || true
          cp -a skin-quality-lab/r02 delivery/source
          cp /tmp/skin-r02-http.log delivery/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-r02-source-render-evidence
          path: delivery/
          retention-days: 14
