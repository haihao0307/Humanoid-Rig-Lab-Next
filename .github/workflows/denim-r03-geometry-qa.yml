name: Denim R03 Geometry and Public QA
on:
  push:
    branches: [fix/denim-r03-geometry-edge-perspective-20261010]
    paths:
      - 'denim-workshop/r03/_source/**'
      - 'denim-workshop/r03/*.js'
      - 'denim-workshop/r03/*.cjs'
      - 'denim-workshop/r03/*.py'
      - 'denim-workshop/r03/template.html'
      - '.github/workflows/denim-r03-geometry-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: denim-r03-source-browser-qa
  cancel-in-progress: false
jobs:
  geometry-public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and build standalone
        run: |
          if [ ! -f denim-workshop/r03/app.js ]; then
            python3 denim-workshop/r03/unpack.py
          fi
          python3 denim-workshop/r03/build.py
          node --check denim-workshop/r03/app.js
          node denim-workshop/r03/test-core.cjs
          python3 - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('denim-workshop/r03')
          m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert hashlib.sha256((p/'index.html').read_bytes()).hexdigest()==m['sha256']
          print('HTML_SHA256',m['sha256'])
          PY
      - name: Publish canonical R03 only with normal fast-forward push
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denim-workshop/r03/core.js denim-workshop/r03/app.js denim-workshop/r03/template.html denim-workshop/r03/build.py denim-workshop/r03/test-core.cjs denim-workshop/r03/qa.py denim-workshop/r03/README.md denim-workshop/r03/SOURCES.md denim-workshop/r03/TASK_ANCHOR.json denim-workshop/r03/BUILD_MANIFEST.json denim-workshop/r03/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Build R03.1 geometric denim edges, perspective and damage candidates'
            git push origin HEAD:fix/denim-r03-geometry-edge-perspective-20261010
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/$SHA/denim-workshop/r03/index.html" >> "$GITHUB_ENV"
          echo "R03_FIXED_BUILD=$SHA"
      - name: Install Chromium test runtime
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Actual local file and fixed public browser regressions
        run: xvfb-run -a python3 -u denim-workshop/r03/qa.py --public "$PUBLIC_URL"
      - name: Upload rendered and numeric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denim-r03-geometry-public-evidence
          path: |
            denim-workshop/r03/evidence/**
            denim-workshop/r03/core-qa.json
            denim-workshop/r03/index.html
            denim-workshop/r03/BUILD_MANIFEST.json
          retention-days: 30
          if-no-files-found: warn
      - name: Summarize tested build
        if: success()
        run: |
          echo '## Denim R03.1 candidate' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build: ${{ steps.publish.outputs.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual file://, fixed public HTTPS and mobile viewport tested. User visual acceptance and phone-hardware performance remain pending.' >> "$GITHUB_STEP_SUMMARY"
