name: Promote face perioral chin R8

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-perioral-r8-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face-perioral-r8-promotion
  cancel-in-progress: false

jobs:
  promote-verify-capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the reviewed R8 source candidate
        run: python3 tools/apply-face-perioral-r8-candidate.py
      - name: Apply reviewed continuity corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('body/FaceAnatomy.js')
          text=path.read_text(encoding='utf-8')
          replacements={
            "bounds:[-.073,.072,1.414,1.579],ellipse:[-.0005,1.498,.069,.080]":"bounds:[-.073,.072,1.425,1.579],ellipse:[-.0005,1.503,.069,.073]",
            "if(Math.max(p[ia+1],p[ib+1],p[ic+1])<1.410":"if(Math.max(p[ia+1],p[ib+1],p[ic+1])<1.420",
            "if(loX>.08||hiX<-.08||loY>1.58||hiY<1.410":"if(loX>.08||hiX<-.08||loY>1.58||hiY<1.420",
            "Math.floor(Math.max(1.410,loY)/size)":"Math.floor(Math.max(1.420,loY)/size)",
            "lips:{centreX:-.0006,halfWidth:.0244,seamY:1.4587,apron:1.60,innerDepth:.0027,columns:160,rings:36":"lips:{centreX:-.0006,halfWidth:.0244,seamY:1.4587,apron:1.36,innerDepth:.0027,columns:160,rings:36",
            "upperSection:[[0,.00165],[.18,.00190],[.45,.00178],[.78,.00145],[1,.00115],[1.14,.00122],[1.36,.00055],[1.60,0]]":"upperSection:[[0,.00155],[.18,.00175],[.45,.00162],[.78,.00130],[1,.00100],[1.08,.00100],[1.20,.00050],[1.36,0]]",
            "lowerSection:[[0,.00165],[.20,.00210],[.48,.00245],[.75,.00235],[1,.00165],[1.18,.00095],[1.42,.00042],[1.60,0]]":"lowerSection:[[0,.00155],[.20,.00195],[.48,.00220],[.75,.00205],[1,.00145],[1.10,.00078],[1.24,.00032],[1.36,0]]",
            "whiteRollUpper:.00024,whiteRollLower:.00012,whiteRollCentre:1.06,whiteRollWidth:.14":"whiteRollUpper:.00012,whiteRollLower:.00005,whiteRollCentre:1.045,whiteRollWidth:.065",
            "labiomentalY:1.4398,labiomentalRx:.0245,labiomentalRy:.0058,labiomentalDepth:.00052,\n    mentalisY:1.4268,mentalisRx:.0225,mentalisRy:.0115,mentalisHeight:.00105":"labiomentalY:1.4450,labiomentalRx:.0230,labiomentalRy:.0048,labiomentalDepth:.00038,\n    mentalisY:1.4355,mentalisRx:.0210,mentalisRy:.0060,mentalisHeight:.00072",
            "const oralLo=1.429,oralHi=1.476,oralSpan=oralHi-oralLo;":"const oralLo=1.433,oralHi=1.476,oralSpan=oralHi-oralLo;",
            "if(compactFaceSkinMode<1.5&&r<.94)discard;":"if(compactFaceSkinMode<1.5&&r<.985)discard;"
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'R8 production refinement anchor mismatch: {old!r}, count={count}')
              text=text.replace(old,new,1)
          old="const mouthPoint=(a,t)=>{const x=lp.centreX+lp.halfWidth*.992*Math.cos(a)*(1-.38*t),q=compactLipOutline(x),seam=lipSurface(x,true,0)[2];return [x,q.seam+.00045*Math.sin(a)*(1+3*t),seam-.0030-.010*t];};"
          new="const mouthPoint=(a,t)=>{const x=lp.centreX+lp.halfWidth*.998*Math.cos(a)*(1-.38*t),q=compactLipOutline(x),seam=lipSurface(x,true,0)[2];return [x,q.seam+.0007*Math.sin(a)*(1+3*t),seam-.0020-.010*t];};"
          if text.count(old)!=1:
              raise SystemExit('R8 production cavity anchor mismatch')
          text=text.replace(old,new,1)
          old="const whiteRoll=(upper?p.whiteRollUpper:p.whiteRollLower)*Math.exp(-(((r-p.whiteRollCentre)/p.whiteRollWidth)**2))*Math.pow(Math.max(0,1-u*u),1.25);\n  return envelope*(base+swell)+whiteRoll;"
          new="const attach=clamp((p.apron-r)/(p.apron-p.whiteRollCentre),0,1),attachGate=attach*attach*(3-2*attach);\n  const whiteRoll=(upper?p.whiteRollUpper:p.whiteRollLower)*Math.exp(-(((r-p.whiteRollCentre)/p.whiteRollWidth)**2))*Math.pow(Math.max(0,1-u*u),1.25)*attachGate;\n  return envelope*(base+swell)+whiteRoll;"
          if text.count(old)!=1:
              raise SystemExit('R8 production white-roll anchor mismatch')
          path.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          check_path=Path('tools/check-face-anatomy.mjs')
          check=check_path.read_text(encoding='utf-8')
          old="check(source.includes('function compactPerioralDepth')&&source.includes('whiteRollUpper:.00024')&&source.includes('mentalisHeight:.00105'),'philtrum, white roll, labiomental crease and mentalis pad are explicit bounded structures');"
          new="check(source.includes('function compactPerioralDepth')&&source.includes('whiteRollUpper:.00012')&&source.includes('mentalisHeight:.00072'),'philtrum, white roll, labiomental crease and mentalis pad are explicit bounded structures');"
          if check.count(old)!=1:
              raise SystemExit('R8 production source contract anchor mismatch')
          check_path.write_text(check.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
      - name: Build and validate all source contracts
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install isolated browser harness
        run: |
          mkdir -p /tmp/face-r8-production
          cd /tmp/face-r8-production
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture production review and runtime report
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hrl-face-r8-production-server.log 2>&1 &
          mkdir -p visual-review-r8-final docs/qa
          cat >/tmp/face-r8-production/capture.cjs <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:1600,height:1200},deviceScaleFactor:1});
            const page=await context.newPage(),consoleMessages=[],pageErrors=[];
            page.on('console',message=>consoleMessages.push({type:message.type(),text:message.text()}));
            page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
            await page.goto('http://127.0.0.1:4173/index.html?review=face',{waitUntil:'domcontentloaded',timeout:120000});
            let frame=null;const deadline=Date.now()+420000;
            while(!frame&&Date.now()<deadline){for(const candidate of page.frames()){if(await candidate.evaluate(()=>Boolean(window.HumanLab?.face?.closeup)).catch(()=>false)){frame=candidate;break;}}if(!frame)await page.waitForTimeout(1000);}
            if(!frame)throw Error('Face review frame unavailable');
            await frame.waitForFunction(()=>window.__compactLoading?.state==='ready'&&window.__humanStartup?.status==='ready',null,{timeout:420000});
            await frame.waitForTimeout(5000);
            const canvas=frame.locator('canvas').first();await canvas.waitFor({state:'visible',timeout:30000});
            for(const view of ['front','side','lips']){
              await frame.evaluate(v=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup(v);window.HumanLab.render();},view);
              await frame.waitForTimeout(1500);
              await canvas.screenshot({path:`visual-review-r8-final/face-r8-${view}.png`});
            }
            await frame.evaluate(()=>{window.HumanLab.face.setWeight('lipPart',.72);window.HumanLab.face.closeup('lips');window.HumanLab.render();});
            await frame.waitForTimeout(1500);
            await canvas.screenshot({path:'visual-review-r8-final/face-r8-lip-part.png'});
            await frame.evaluate(()=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup('front');window.HumanLab.render();});
            const runtime=await frame.evaluate(()=>{
              const face=window.HumanLab.face.report(),compact=window.HumanLab.compact?.report,gl=document.querySelector('canvas')?.getContext('webgl2');
              return {review:window.HumanLab.review,startup:window.__humanStartup,compactLoading:window.__compactLoading,eyeAnatomy:compact?.eyeAnatomy,faceAnatomy:compact?.faceAnatomy,separation:face.separation,limitedNodes:face.limitedNodes,renderer:{frames:window.HumanLab.renderer?.frames,drawCalls:window.HumanLab.renderer?.drawCalls,webglError:gl?gl.getError():null,contextLost:gl?gl.isContextLost():null}};
            });
            if(runtime.faceAnatomy?.revision!=='r12-perioral-chin-continuity')throw Error('Unexpected production face revision');
            if(runtime.eyeAnatomy?.revision!=='r14-procedural-iris-lid-integration')throw Error('Production eye revision regressed');
            if(runtime.startup?.status!=='ready'||runtime.review?.singleActor!==true)throw Error('Review entry did not become naturally ready');
            if(runtime.renderer.webglError!==0||runtime.renderer.contextLost||pageErrors.length)throw Error('Browser or WebGL error detected');
            const qa={schema:'jarvis/face_perioral_chin_browser_qa@1',commitSource:process.env.GITHUB_SHA,reviewMode:'face',startupReadyNaturally:true,startupOverlayBypassed:false,singleActor:true,eyeRevision:runtime.eyeAnatomy.revision,faceRevision:runtime.faceAnatomy.revision,eyeTriangles:runtime.eyeAnatomy.triangles,faceTriangles:runtime.faceAnatomy.triangles,identityExpressionSeparated:runtime.separation?.ok===true,limitedNodes:runtime.limitedNodes,renderer:runtime.renderer,consoleMessages,pageErrors,browserExecuted:true,visualAcceptance:false,productionReady:false,userVisualAcceptance:'pending'};
            fs.writeFileSync('docs/qa/face-perioral-r8-browser.json',JSON.stringify(qa,null,2)+'\n');
            fs.writeFileSync('visual-review-r8-final/face-r8-diagnostics.json',JSON.stringify({runtime,consoleMessages,pageErrors},null,2)+'\n');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          NODE_PATH=/tmp/face-r8-production/node_modules node /tmp/face-r8-production/capture.cjs
      - name: Upload final visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: face-perioral-chin-r8-final
          path: visual-review-r8-final
          retention-days: 14
      - name: Remove staging files, audit, and commit
        shell: bash
        run: |
          rm -rf visual-review-r8-final
          rm -f \
            .github/workflows/face-perioral-r8-candidate.yml \
            .github/workflows/face-perioral-r8-promote.yml \
            tools/apply-face-perioral-r8-candidate.py
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
          python3 tools/audit-files.py
          node tools/check-pure.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "face: integrate perioral and chin continuity"
          git push origin HEAD:feature/human-face-workbench-v1-20260915
