name: Deploy Bird Seagull R004 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'BIRD_SEAGULL_A_DIRECT_OPEN_R004/**'
      - '.github/workflows/bird-seagull-r004-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate fixed source payload
        shell: bash
        run: |
          set -euo pipefail
          test -f BIRD_SEAGULL_A_DIRECT_OPEN_R004/index.html
          test -f BIRD_SEAGULL_A_DIRECT_OPEN_R004/viewer.js
          test -f BIRD_SEAGULL_A_DIRECT_OPEN_R004/manifest.json
          test "$(find BIRD_SEAGULL_A_DIRECT_OPEN_R004/data -name 'form-*.js' | wc -l)" -eq 5
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('BIRD_SEAGULL_A_DIRECT_OPEN_R004/manifest.json','utf8'));
          if (m.vertexCount !== 4416 || m.triangleCount !== 5624 || m.indexCount !== 16872 || m.payloadChars !== 39876) {
            throw new Error('R004 manifest integrity check failed');
          }
          console.log(m);
          NODE

      - name: Prepare minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a BIRD_SEAGULL_A_DIRECT_OPEN_R004/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live-page:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Verify deployed page on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cat > verify-live.mjs <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const base = process.env.PAGE_URL;
          if (!base) throw new Error('PAGE_URL missing');
          const url = `${base}${base.endsWith('/') ? '' : '/'}?qa=${Date.now()}`;
          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist']
          });

          async function audit(label, contextOptions) {
            const context = await browser.newContext(contextOptions);
            const page = await context.newPage();
            const pageErrors = [];
            const failedRequests = [];
            const consoleMessages = [];
            page.on('pageerror', error => pageErrors.push(error.stack || error.message));
            page.on('requestfailed', request => failedRequests.push({
              url: request.url(),
              error: request.failure()?.errorText || null
            }));
            page.on('console', message => consoleMessages.push(`${message.type()}: ${message.text()}`));

            let response = null;
            let report = null;
            let lastError = null;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForFunction(
                  () => window.__BIRD_QA?.ready === true || window.__BIRD_QA?.ready === false,
                  { timeout: 30000 }
                );
                await page.waitForTimeout(1200);
                report = await page.evaluate(async () => {
                  const canvas = document.getElementById('c');
                  const status = document.getElementById('status');
                  const gl = canvas?.getContext('webgl');
                  let changedSamples = -1;
                  if (gl && window.__BIRD_QA?.ready) {
                    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                    const sample = new Uint8Array(4);
                    changedSamples = 0;
                    for (let yi = 1; yi < 36; yi++) {
                      for (let xi = 1; xi < 56; xi++) {
                        const x = Math.min(canvas.width - 1, Math.floor((xi / 56) * canvas.width));
                        const y = Math.min(canvas.height - 1, Math.floor((yi / 36) * canvas.height));
                        gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, sample);
                        if (Math.abs(sample[0] - 9) + Math.abs(sample[1] - 15) + Math.abs(sample[2] - 19) > 30) {
                          changedSamples++;
                        }
                      }
                    }
                  }
                  return {
                    title: document.title,
                    statusText: status?.textContent || null,
                    qa: window.__BIRD_QA || null,
                    hasWebGL: Boolean(gl),
                    changedSamples,
                    canvas: canvas ? {
                      clientWidth: canvas.clientWidth,
                      clientHeight: canvas.clientHeight,
                      width: canvas.width,
                      height: canvas.height
                    } : null
                  };
                });
                const valid = response?.status() === 200
                  && report?.qa?.ready === true
                  && report.qa.vertexCount === 4416
                  && report.qa.triangleCount === 5624
                  && report.statusText?.includes('形态载入完成')
                  && report.hasWebGL
                  && report.changedSamples >= 20;
                if (valid) {
                  lastError = null;
                  break;
                }
                lastError = new Error(`attempt ${attempt} incomplete: ${JSON.stringify({ status: response?.status(), report })}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }

            if (lastError) throw lastError;
            if (pageErrors.length) throw new Error(`${label} page errors: ${pageErrors.join('\n')}`);
            if (failedRequests.length) throw new Error(`${label} failed requests: ${JSON.stringify(failedRequests)}`);

            await page.screenshot({ path: `${label}-three-quarter.png`, fullPage: true });

            for (const view of ['top', 'side', 'front', 'back', 'bottom', 'persp']) {
              const active = await page.evaluate(selectedView => {
                const button = document.querySelector(`button[data-v="${selectedView}"]`);
                if (!(button instanceof HTMLButtonElement)) return false;
                button.click();
                return button.classList.contains('active');
              }, view);
              if (!active) throw new Error(`${label} view did not activate: ${view}`);
              await page.waitForTimeout(200);
              if (['top', 'side'].includes(view)) {
                await page.screenshot({ path: `${label}-${view}.png`, fullPage: true });
              }
            }

            const wireResult = await page.evaluate(() => {
              const button = document.getElementById('wire');
              if (!(button instanceof HTMLButtonElement)) return null;
              button.click();
              return button.textContent;
            });
            if (!wireResult?.includes('开')) throw new Error(`${label} wireframe control did not activate`);
            await page.waitForTimeout(200);

            let panelBox = null;
            if (label === 'mobile') {
              await page.locator('#menu').click();
              await page.waitForFunction(() => document.getElementById('panel')?.classList.contains('open'));
              await page.waitForTimeout(350);
              panelBox = await page.locator('#panel').boundingBox();
              if (!panelBox || panelBox.x < 0 || panelBox.x + panelBox.width > 390) {
                throw new Error(`mobile panel is outside viewport: ${JSON.stringify(panelBox)}`);
              }
              await page.screenshot({ path: 'mobile-panel-open.png', fullPage: true });
            }

            const result = {
              label,
              url,
              responseStatus: response?.status() || null,
              report,
              panelBox,
              wireResult,
              pageErrors,
              failedRequests,
              consoleMessages
            };
            await context.close();
            return result;
          }

          let output;
          try {
            const desktop = await audit('desktop', {
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1
            });
            const mobile = await audit('mobile', {
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            output = { url, desktop, mobile, error: null };
          } catch (error) {
            output = { url, desktop: null, mobile: null, error: error.stack || error.message };
          }

          await writeFile('bird-seagull-r004-pages-live.json', JSON.stringify(output, null, 2) + '\n', 'utf8');
          console.log(JSON.stringify(output, null, 2));
          await browser.close();
          if (output.error) throw new Error(output.error);
          NODE
          node verify-live.mjs

      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r004-pages-live
          path: |
            bird-seagull-r004-pages-live.json
            desktop-three-quarter.png
            desktop-top.png
            desktop-side.png
            mobile-three-quarter.png
            mobile-top.png
            mobile-side.png
            mobile-panel-open.png
          if-no-files-found: warn
