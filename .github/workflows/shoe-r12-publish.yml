name: Shoe R12 reviewed artifact promotion and public receipt

'on':
  push:
    branches: [feature/shoe-four-styles-r12-20261017]
    paths: ['.github/workflows/shoe-r12-publish.yml']

permissions: {}
concurrency:
  group: shoe-r12-publish-${{ github.ref }}
  cancel-in-progress: false

# Source4 passed independent AI review of the actual rendered views; the three
# rejected candidates and their resolved defects are recorded in VISUAL_REVIEW.
# This unlock authorizes artifact publication, without claiming human approval.
env:
  PROMOTION_READY: 'true'
  VISUAL_HUMAN_REVIEW: 'false'
  REPOSITORY: haihao0307/Humanoid-Rig-Lab-Next
  TARGET_BRANCH: feature/shoe-four-styles-r12-20261017
  MODULE: shoe-workshop/r12
  VERIFY_WORKFLOW: .github/workflows/shoe-r12-verify.yml
  EXPECTED_HEAD: ${{ github.sha }}
  SOURCE_COMMIT: 7fd5527f475908d615db4f1fd36357f47e68ce46
  BASE_COMMIT: cafab0889b612ed6cbf461683dfe2851909df3be
  CANDIDATE_RUN_ID: '39018660835'
  CANDIDATE_ARTIFACT_ID: '12094814672'
  CANDIDATE_ARTIFACT_NAME: shoe-r12-candidate-39018660835
  CANDIDATE_ARTIFACT_DIGEST: sha256:a5087d7455d72a6a7c906df939bcbe69b1a1c54f5679c35e26315aa767b515b9
  EXPECTED_RUNTIME_SHA256: aaba719b65cbd4e53c19ffa74de335d90c81a8974ada4afa6460ada0a9d40a61
  EXPECTED_RUNTIME_BYTES: '13724240'
  EXPECTED_MANIFEST_SHA256: e4b2790f8ecad0028a9c2510b5b3fefdcbf6aad8f6a1af3eaba0a949a9f3b817
  EXPECTED_GEOMETRY_SHA256: 5c2048246836d59e36421ddee2c70aef388de2d8dbc3ac3207d363bde8d79f43
  EXPECTED_QA_SHA256: 9353f53a86e0b1967fc3d275e5f20d02cb4d5e8f6a91e4fe94186f50ef4e9ed7
  EXPECTED_BROWSER_TEST_SHA256: 572b996331252b105468e66f881cde9745fbd2da01e8ac786b7bee13e731b8bc
  EXPECTED_GEOMETRY_TEST_SHA256: cdd127e2e27b4b07faa1b42c82d0b2530d9318e2bb5998a3a2b09039549000d0
  EXPECTED_VERIFY_WORKFLOW_SHA256: c0ebe37852cf18d98f7594121e3a84d5fba597733c467ec53f9ce14ea8ac7eef
  EXPECTED_BROWSER_CHECKS: '8'
  EXPECTED_SCREENS: '23'
  EXPECTED_GEOMETRY_CHECKS: '114'
  PUBLIC_ARTIFACT_NAME: shoe-r12-public-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      build: ${{ steps.commit.outputs.build }}
    steps:
      - name: Require an explicitly unlocked reviewed candidate
        run: |
          test "$PROMOTION_READY" = true || { echo 'Candidate promotion is locked; review and replace the candidate constants first.'; exit 1; }
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          sparse-checkout: |
            shoe-workshop/r12
            shoe-workshop/r10
            shoe-workshop/r09/src
            shoe-workshop/r07/src
            shoe-workshop/r05/src
            shoe-workshop/r04/src
            shoe-workshop/r04/vendor
            .github/workflows/shoe-r12-verify.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.CANDIDATE_ARTIFACT_ID }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          repository: ${{ env.REPOSITORY }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/r12-candidate
      - name: Validate immutable evidence and copy data only
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/r12-candidate
        run: |
          python -I - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, urllib.request
          e = os.environ
          repo = pathlib.Path(e['GITHUB_WORKSPACE']).resolve()
          candidate = pathlib.Path(e['CANDIDATE_DIR']).resolve()
          module = repo / e['MODULE']
          source = e['SOURCE_COMMIT']
          runtime_hash = e['EXPECTED_RUNTIME_SHA256']
          runtime_bytes = int(e['EXPECTED_RUNTIME_BYTES'])
          def require(ok, message):
              if not ok: raise SystemExit(message)
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def file(root, relative):
              p = pathlib.PurePosixPath(relative)
              require(not p.is_absolute() and '..' not in p.parts and p.as_posix() == relative, 'Unsafe path: ' + relative)
              target = root.joinpath(*p.parts)
              require(target.resolve().is_relative_to(root) and target.is_file(), 'Missing or escaped file: ' + relative)
              require(not any(root.joinpath(*p.parts[:i]).is_symlink() for i in range(1, len(p.parts) + 1)), 'Symlink: ' + relative)
              return target
          def api(suffix):
              request = urllib.request.Request('https://api.github.com/repos/' + e['REPOSITORY'] + suffix,
                  headers={'Authorization': 'Bearer ' + e['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=45) as response: return json.load(response)
          for key in ('SOURCE_COMMIT', 'BASE_COMMIT', 'EXPECTED_HEAD'):
              require(re.fullmatch(r'[a-f0-9]{40}', e[key]), 'Invalid commit lock: ' + key)
          for key in [k for k in e if k.startswith('EXPECTED_') and k.endswith('_SHA256')]:
              require(re.fullmatch(r'[a-f0-9]{64}', e[key]), 'Invalid hash lock: ' + key)
          require(e['VISUAL_HUMAN_REVIEW'] in ('true', 'false'), 'Invalid human review value')
          require(re.fullmatch(r'sha256:[a-f0-9]{64}', e['CANDIDATE_ARTIFACT_DIGEST']), 'Invalid artifact digest')
          run = api('/actions/runs/' + e['CANDIDATE_RUN_ID'])
          require(run['status'] == 'completed' and run['conclusion'] == 'success', 'Candidate CI did not pass')
          require(run['event'] == 'push' and run['head_sha'] == source and run['head_branch'] == e['TARGET_BRANCH'], 'Wrong candidate source or branch')
          require(run['path'] == e['VERIFY_WORKFLOW'] and run['head_repository']['full_name'] == e['REPOSITORY'], 'Wrong candidate workflow or repository')
          artifact = api('/actions/artifacts/' + e['CANDIDATE_ARTIFACT_ID'])
          require(str(artifact['id']) == e['CANDIDATE_ARTIFACT_ID'] and artifact['name'] == e['CANDIDATE_ARTIFACT_NAME'], 'Wrong candidate artifact')
          require(not artifact['expired'] and artifact['digest'] == e['CANDIDATE_ARTIFACT_DIGEST'], 'Expired or changed candidate artifact')
          require(str(artifact['workflow_run']['id']) == e['CANDIDATE_RUN_ID'] and artifact['workflow_run']['head_sha'] == source, 'Artifact is from another run/source')
          comparison = api('/compare/' + source + '...' + e['EXPECTED_HEAD'])
          require(comparison['status'] in ('ahead', 'identical') and comparison['merge_base_commit']['sha'] == source, 'Expected head is not a descendant of candidate source')
          manifest_file = file(candidate, 'BUILD_MANIFEST.json')
          geometry_file = file(candidate, 'evidence/GEOMETRY.json')
          qa_file = file(candidate, 'evidence/browser/QA.json')
          for path, key in ((manifest_file, 'EXPECTED_MANIFEST_SHA256'), (geometry_file, 'EXPECTED_GEOMETRY_SHA256'), (qa_file, 'EXPECTED_QA_SHA256')):
              require(sha(path) == e[key], 'Evidence hash mismatch: ' + path.name)
          manifest, geometry, qa = [json.loads(p.read_text()) for p in (manifest_file, geometry_file, qa_file)]
          require(all(d['sourceCommit'] == source for d in (manifest, geometry, qa)), 'Manifest, geometry and browser source disagree')
          require(manifest['version'] == qa['version'] == 'R12.0' and manifest['styles'] == ['penny', 'chelsea', 'monk', 'canvas'], 'Wrong version or style set')
          require(manifest['baseCommit'] == geometry['baseline'] == e['BASE_COMMIT'], 'Wrong retained baseline')
          runtime = file(candidate, 'public-lite.html')
          require(runtime.stat().st_size == manifest['runtime']['bytes'] == runtime_bytes, 'Runtime byte count mismatch')
          require(sha(runtime) == manifest['runtime']['sha256'] == runtime_hash, 'Runtime hash mismatch')
          require(geometry['suite'] == 'SHOE-R12-INDEPENDENT-GEOMETRY' and geometry['taskId'] == 'SHOE-FOUR-STYLES-R12-20261017', 'Wrong geometry suite')
          require(geometry['success'] is True and geometry['failed'] == 0 and geometry['failures'] == [], 'Geometry failed')
          require(geometry['passed'] == int(e['EXPECTED_GEOMETRY_CHECKS']) and geometry['validatedParameterCases'] >= 100, 'Geometry coverage changed')
          require(len(geometry['measuredResponses']) == 4 and len(geometry['preservation']) == 2 and all(x['passed'] is True for x in geometry['measuredResponses'] + geometry['preservation']), 'Parameter or preservation check failed')
          require(qa['completed'] is True and qa['phase'] == 'complete' and not qa.get('failure'), 'Browser suite incomplete')
          require(qa['buildSha'] is None and qa['url'].startswith('file:///'), 'Candidate must come from actual file URL testing')
          require(all(qa[k] == [] for k in ('errors', 'consoleErrors', 'requestFailures', 'networkRequests')), 'Candidate browser or offline failure')
          require(qa['final']['source'] == source and qa['final']['stats']['errors'] == [], 'Runtime source or runtime errors mismatch')
          checks = qa['checks']
          require(len(checks) == len({x['name'] for x in checks}) == int(e['EXPECTED_BROWSER_CHECKS']) and all(x['passed'] is True for x in checks), 'Browser checks did not all pass')
          require(qa['visualHumanReview'] is False and qa['manufacturingValidated'] is False, 'CI cannot claim human or manufacturing acceptance')
          # BUILD_MANIFEST paths are repository-root paths. GEOMETRY paths are R12-relative.
          sources = manifest['sources']
          require(len(sources) > 0 and len({x['path'] for x in sources}) == len(sources), 'Empty or duplicate source inventory')
          for record in sources:
              require(record['path'].startswith('shoe-workshop/'), 'Unexpected source path')
              require(sha(file(repo, record['path'])) == record['sha256'], 'Current source differs: ' + record['path'])
          for record in geometry['testedSourceFiles']:
              require(sha(file(module, record['path'])) == record['sha256'], 'Current tested source differs: ' + record['path'])
          for relative, key in ((e['MODULE'] + '/tests/browser.mjs', 'EXPECTED_BROWSER_TEST_SHA256'), (e['MODULE'] + '/tests/geometry.mjs', 'EXPECTED_GEOMETRY_TEST_SHA256'), (e['VERIFY_WORKFLOW'], 'EXPECTED_VERIFY_WORKFLOW_SHA256')):
              require(sha(file(repo, relative)) == e[key], 'Current test/workflow differs: ' + relative)
          legacy = manifest['legacy']
          require(legacy['preserved'] is True and legacy['path'] == 'shoe-workshop/r10/public-lite.html', 'Original R10 was not retained')
          original = file(repo, legacy['path'])
          require(original.stat().st_size == legacy['bytes'] and sha(original) == legacy['sha256'], 'Original R10 runtime changed')
          copies = {'public-lite.html': runtime, 'BUILD_MANIFEST.json': manifest_file, 'evidence/GEOMETRY.json': geometry_file, 'evidence/browser/QA.json': qa_file}
          screens = qa['screens']
          require(len(screens) == len({x['name'] for x in screens}) == int(e['EXPECTED_SCREENS']), 'Screenshot coverage changed')
          for screen in screens:
              require(re.fullmatch(r'[a-z0-9-]+', screen['name']), 'Unsafe screenshot name')
              relative = 'evidence/browser/' + screen['name'] + '.png'
              path = file(candidate, relative)
              require(sha(path) == screen['sha256'] and path.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), 'Screenshot hash/type mismatch: ' + relative)
              copies[relative] = path
          # Drop earlier publication receipts: a new candidate is not yet publicly verified.
          for relative in ('evidence/browser', 'evidence/public'):
              target = module / relative
              require(not target.is_symlink() and not target.parent.is_symlink(), 'Unsafe evidence destination')
              if target.exists(): shutil.rmtree(target)
          for relative in ('PUBLIC_URL.txt', 'RELEASE_RECEIPT.json'):
              target = module / relative
              require(not target.is_symlink(), 'Unsafe receipt destination')
              if target.exists(): target.unlink()
          for relative, path in copies.items():
              target = module / relative
              require(not target.is_symlink(), 'Unsafe output destination')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
          receipt = {'version': 'R12.0', 'status': 'CANDIDATE_PROMOTED_PUBLIC_PENDING', 'sourceCommit': source,
              'expectedParent': e['EXPECTED_HEAD'], 'candidateRunId': int(e['CANDIDATE_RUN_ID']),
              'candidateArtifactId': artifact['id'], 'candidateArtifactDigest': artifact['digest'],
              'runtime': manifest['runtime'], 'projectCodeExecutedInWriteJob': False, 'publicVerified': False,
              'visualHumanReview': e['VISUAL_HUMAN_REVIEW'] == 'true', 'manufacturingValidated': False}
          require(not (module / 'PROMOTION_RECEIPT.json').is_symlink(), 'Unsafe promotion receipt destination')
          (module / 'PROMOTION_RECEIPT.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Validated locked candidate, current sources, all geometry/browser checks and every screenshot; copied data only.')
          PY
      - name: Commit only verified artifacts with an expected-head fast-forward guard
        id: commit
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$MODULE"
          while IFS= read -r -d '' path; do
            case "$path" in
              "$MODULE/public-lite.html"|"$MODULE/BUILD_MANIFEST.json"|"$MODULE/PROMOTION_RECEIPT.json"|"$MODULE/RELEASE_RECEIPT.json"|"$MODULE/PUBLIC_URL.txt"|"$MODULE/evidence/GEOMETRY.json"|"$MODULE/evidence/browser/QA.json"|"$MODULE/evidence/browser/"*.png|"$MODULE/evidence/public/QA.json"|"$MODULE/evidence/public/"*.png) ;;
              *) echo "Refusing unexpected staged path: $path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only -z)
          git diff --cached --quiet && { echo 'No new promotion delta'; exit 1; }
          git commit -m 'Publish reviewed R12 standalone candidate and bound evidence'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "build=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  public_browser:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      browser_attempt: ${{ steps.identity.outputs.browser_attempt }}
    steps:
      - name: Bind evidence identity to the browser job attempt
        id: identity
        run: |
          echo "artifact_name=$PUBLIC_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "browser_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.build }}
          sparse-checkout: shoe-workshop/r12
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shoe-workshop/r12/package-lock.json
      - name: Install the checked dependency lock
        working-directory: shoe-workshop/r12
        run: npm ci --ignore-scripts
      - name: Chromium render environment
        working-directory: shoe-workshop/r12
        run: npx playwright install --with-deps chromium
      - name: Test exact public bytes and live public controls
        working-directory: shoe-workshop/r12
        env:
          PUBLIC_BUILD_SHA: ${{ needs.publish.outputs.build }}
        run: node tests/browser.mjs --public
      - name: Preserve public browser evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PUBLIC_ARTIFACT_NAME }}
          path: shoe-workshop/r12/evidence/public/
          if-no-files-found: error
          retention-days: 14

  receipt:
    needs: [publish, public_browser]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.build }}
          sparse-checkout: shoe-workshop/r12
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.public_browser.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          repository: ${{ env.REPOSITORY }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/r12-public
      - name: Validate public evidence and write the URL receipt without project execution
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_BUILD_SHA: ${{ needs.publish.outputs.build }}
          PUBLIC_ARTIFACT_ID: ${{ needs.public_browser.outputs.artifact_id }}
          PUBLIC_ARTIFACT_DIGEST: ${{ needs.public_browser.outputs.artifact_digest }}
          PUBLIC_ARTIFACT_NAME: ${{ needs.public_browser.outputs.artifact_name }}
          PUBLIC_BROWSER_ATTEMPT: ${{ needs.public_browser.outputs.browser_attempt }}
          PUBLIC_EVIDENCE_DIR: ${{ runner.temp }}/r12-public
        run: |
          python -I - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, urllib.request
          e = os.environ
          module = pathlib.Path(e['GITHUB_WORKSPACE']).resolve() / e['MODULE']
          evidence = pathlib.Path(e['PUBLIC_EVIDENCE_DIR']).resolve()
          def require(ok, message):
              if not ok: raise SystemExit(message)
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def file(root, relative):
              p = pathlib.PurePosixPath(relative)
              require(not p.is_absolute() and '..' not in p.parts and p.as_posix() == relative, 'Unsafe evidence path')
              target = root.joinpath(*p.parts)
              require(target.resolve().is_relative_to(root) and target.is_file(), 'Missing or escaped evidence')
              require(not any(root.joinpath(*p.parts[:i]).is_symlink() for i in range(1, len(p.parts) + 1)), 'Symlink evidence')
              return target
          require(re.fullmatch(r'[a-f0-9]{40}', e['PUBLIC_BUILD_SHA']), 'Invalid public build commit')
          request = urllib.request.Request('https://api.github.com/repos/' + e['REPOSITORY'] + '/actions/artifacts/' + e['PUBLIC_ARTIFACT_ID'],
              headers={'Authorization': 'Bearer ' + e['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=45) as response: artifact = json.load(response)
          digest = 'sha256:' + e['PUBLIC_ARTIFACT_DIGEST'].removeprefix('sha256:')
          require(re.fullmatch(r'sha256:[a-f0-9]{64}', digest), 'Invalid public artifact digest')
          require(str(artifact['id']) == e['PUBLIC_ARTIFACT_ID'] and artifact['name'] == e['PUBLIC_ARTIFACT_NAME'], 'Wrong public artifact')
          require(not artifact['expired'] and artifact['digest'] == digest, 'Expired or changed public artifact')
          require(str(artifact['workflow_run']['id']) == e['GITHUB_RUN_ID'] and artifact['workflow_run']['head_sha'] == e['EXPECTED_HEAD'], 'Public artifact is from another workflow run')
          manifest_file = file(module, 'BUILD_MANIFEST.json')
          candidate_qa_file = file(module, 'evidence/browser/QA.json')
          require(sha(manifest_file) == e['EXPECTED_MANIFEST_SHA256'] and sha(candidate_qa_file) == e['EXPECTED_QA_SHA256'], 'Promoted evidence changed')
          manifest = json.loads(manifest_file.read_text())
          candidate_qa = json.loads(candidate_qa_file.read_text())
          qa_file = file(evidence, 'QA.json')
          qa = json.loads(qa_file.read_text())
          require(qa['version'] == manifest['version'] == 'R12.0', 'Wrong public version')
          require(qa['sourceCommit'] == manifest['sourceCommit'] == e['SOURCE_COMMIT'] and qa['buildSha'] == e['PUBLIC_BUILD_SHA'], 'Public source/build mismatch')
          require(qa['completed'] is True and qa['phase'] == 'complete' and not qa.get('failure'), 'Public browser incomplete')
          require(all(qa[k] == [] for k in ('errors', 'consoleErrors', 'requestFailures')), 'Public browser errors')
          require(qa['final']['source'] == e['SOURCE_COMMIT'] and qa['final']['stats']['errors'] == [], 'Public runtime mismatch or errors')
          require(qa['visualHumanReview'] is False and qa['manufacturingValidated'] is False, 'Machine QA cannot grant human or manufacturing acceptance')
          checks = qa['checks']
          require(len(checks) == len({x['name'] for x in checks}) == int(e['EXPECTED_BROWSER_CHECKS']) and all(x['passed'] is True for x in checks), 'Public checks did not all pass')
          require({x['name'] for x in checks} == {x['name'] for x in candidate_qa['checks']}, 'Public test coverage differs from reviewed candidate')
          raw = 'https://raw.githubusercontent.com/' + e['REPOSITORY'] + '/' + e['PUBLIC_BUILD_SHA'] + '/' + e['MODULE'] + '/public-lite.html'
          url = 'https://htmlpreview.github.io/?' + raw
          require(qa['url'] == url and qa['publicBytes']['raw'] == raw and qa['publicBytes']['matchesBuild'] is True, 'Public URL was not verified')
          runtime = file(module, 'public-lite.html')
          require(qa['publicBytes']['sha256'] == manifest['runtime']['sha256'] == e['EXPECTED_RUNTIME_SHA256'] == sha(runtime), 'Public bytes hash differs')
          require(qa['publicBytes']['bytes'] == manifest['runtime']['bytes'] == int(e['EXPECTED_RUNTIME_BYTES']) == runtime.stat().st_size, 'Public byte count differs')
          screens = qa['screens']
          require(len(screens) == len({x['name'] for x in screens}) == int(e['EXPECTED_SCREENS']), 'Public screenshot coverage changed')
          require({x['name'] for x in screens} == {x['name'] for x in candidate_qa['screens']}, 'Public views differ from reviewed candidate')
          copies = {'QA.json': qa_file}
          for screen in screens:
              require(re.fullmatch(r'[a-z0-9-]+', screen['name']), 'Unsafe public screenshot name')
              relative = screen['name'] + '.png'
              path = file(evidence, relative)
              require(sha(path) == screen['sha256'] and path.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), 'Public screenshot hash/type mismatch: ' + relative)
              copies[relative] = path
          destination = module / 'evidence/public'
          require(not destination.is_symlink() and not destination.parent.is_symlink(), 'Unsafe public evidence destination')
          if destination.exists(): shutil.rmtree(destination)
          destination.mkdir(parents=True)
          for relative, path in copies.items(): shutil.copyfile(path, destination / relative)
          receipt = {'version': 'R12.0', 'status': 'PUBLIC_VERIFIED_ACCEPTANCE_CANDIDATE', 'sourceCommit': e['SOURCE_COMMIT'],
              'buildSha': e['PUBLIC_BUILD_SHA'], 'publicUrl': url, 'rawUrl': raw, 'runtime': manifest['runtime'],
              'candidateRunId': int(e['CANDIDATE_RUN_ID']), 'candidateArtifactId': int(e['CANDIDATE_ARTIFACT_ID']),
              'candidateArtifactDigest': e['CANDIDATE_ARTIFACT_DIGEST'], 'publicRunId': int(e['GITHUB_RUN_ID']),
              'publicRunAttempt': int(e['PUBLIC_BROWSER_ATTEMPT']), 'publicArtifactId': artifact['id'], 'publicArtifactDigest': digest,
              'publicQAHash': sha(qa_file), 'publicVerified': True, 'browserChecksPassed': len(checks),
              'screenshotsVerified': len(screens), 'environment': qa['environment'], 'projectCodeExecutedInWriteJob': False,
              'visualHumanReview': e['VISUAL_HUMAN_REVIEW'] == 'true', 'userVisualApproval': False,
              'manufacturingValidated': False, 'physicalSolver': False, 'wearerFit': False}
          for name, text in (('PUBLIC_URL.txt', url + '\n'), ('RELEASE_RECEIPT.json', json.dumps(receipt, indent=2) + '\n')):
              require(not (module / name).is_symlink(), 'Unsafe release destination')
              (module / name).write_text(text)
          print('Verified public immutable bytes, live browser checks and all screenshot hashes; human review is separately recorded.')
          PY
      - name: Commit public data with a build-head fast-forward guard
        env:
          PUBLIC_BUILD_SHA: ${{ needs.publish.outputs.build }}
        run: |
          test "$(git rev-parse HEAD)" = "$PUBLIC_BUILD_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$PUBLIC_BUILD_SHA"
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$MODULE/evidence/public" "$MODULE/PUBLIC_URL.txt" "$MODULE/RELEASE_RECEIPT.json"
          while IFS= read -r -d '' path; do
            case "$path" in
              "$MODULE/PUBLIC_URL.txt"|"$MODULE/RELEASE_RECEIPT.json"|"$MODULE/evidence/public/QA.json"|"$MODULE/evidence/public/"*.png) ;;
              *) echo "Refusing unexpected staged path: $path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only -z)
          git diff --cached --quiet && { echo 'No new public receipt delta'; exit 1; }
          git commit -m 'Record exact R12 public browser evidence and immutable URL'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
