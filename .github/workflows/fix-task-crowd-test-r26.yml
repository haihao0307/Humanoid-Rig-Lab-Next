name: Fix Task Crowd Test R2.6

on:
  push:
    branches:
      - feature/human-task-workbench-adjustment-v2-fullbase

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-task-workbench-adjustment-v2-fullbase
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix declarations and verify syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/test-task-crowd-browser.mjs')
          text=path.read_text(encoding='utf-8')
          old="queueBeforeRelease:requester.queue.length,runningBeforeRelease:requester.running?.source||null"
          new="queueBeforeRelease=requester.queue.length,runningBeforeRelease=requester.running?.source||null"
          if text.count(old)!=1:
              raise SystemExit(f'expected one declaration repair site, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          node --check tools/test-task-crowd-browser.mjs
      - name: Commit syntax repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/test-task-crowd-browser.mjs
          git commit -m "fix(task): repair crowd browser test declarations"
          git push origin HEAD:feature/human-task-workbench-adjustment-v2-fullbase
