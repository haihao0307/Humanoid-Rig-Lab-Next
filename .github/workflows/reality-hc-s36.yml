name: Reality HC S3.6 fitting transaction
on:
  push:
    branches: [feature/reality-hc-s36-fitting-transaction-20261021]
    paths: [.github/workflows/reality-hc-s36.yml, reality-lab/hc-s3-6/RUN_REQUEST.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: reality-lab/hc-s3-6
      - name: Check code and transaction regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          for p in Path('reality-lab/hc-s3-6').glob('*.py'):ast.parse(p.read_text())
          PY
          node --check reality-lab/hc-s3-6/fitting-transaction.mjs
          node reality-lab/hc-s3-6/tests/transaction.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf36-unit
          path: reality-lab/hc-s3-6/qa/unit/
          retention-days: 30
  native:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        case: [baseline, progressive, cancel, fault]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: platform
          sparse-checkout: reality-lab/hc-s3-6
      - uses: actions/checkout@v4
        with:
          repository: haihao0307/guilin-dem-pipeline
          ref: c5c0bedbc35f24cbb35426ab9c14b74ca7fc5f49
          path: host
          sparse-checkout: kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
      - name: Install pinned original-runtime browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real source with bounded candidate
        env:
          FIT_CASE: ${{ matrix.case }}
          GARMENT_HOST: ${{ github.workspace }}/host/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
        run: python reality-lab/hc-s3-6/run_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf36-native-${{ matrix.case }}
          path: platform/reality-lab/hc-s3-6/qa/${{ matrix.case }}/
          retention-days: 30
