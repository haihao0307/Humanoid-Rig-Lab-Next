      - name: Build and validate source
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install browser harness
        run: |
          mkdir -p /tmp/face-qa
          cd /tmp/face-qa
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Run browser review
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/face-server.log 2>&1 &
          mkdir -p docs/qa
          cat >/tmp/face-qa/run.cjs <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:960},deviceScaleFactor:1});
            const consoleErrors=[],pageErrors=[];
            page.on('console',message=>{if(message.type()==='error')consoleErrors.push(message.text());});
            page.on('pageerror',error=>pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:8000/index.html?review=face',{waitUntil:'domcontentloaded',timeout:180000});
            let faceFrame=null;const deadline=Date.now()+180000;
            while(Date.now()<deadline&&!faceFrame){for(const frame of page.frames()){try{if(await frame.locator('#face-shape').count()){faceFrame=frame;break;}}catch{}}if(!faceFrame)await page.waitForTimeout(500);}
            if(!faceFrame)throw new Error('Face identity controls did not become available');
            for(const frame of page.frames())try{await frame.evaluate(()=>{for(const overlay of document.querySelectorAll('#bodyStartupDiagnostics,[data-startup-diagnostics]')){overlay.hidden=true;overlay.style.display='none';overlay.style.pointerEvents='none';}});}catch{}
            const shapeSliders=await faceFrame.locator('#face-shape input[type=range]').count();
            const identityButtons=await faceFrame.locator('#face-identities button').count();
            if(shapeSliders!==13)throw new Error('Expected 13 structural parameters, got '+shapeSliders);
            if(identityButtons!==5)throw new Error('Expected 5 identity presets, got '+identityButtons);
            const runtime=await faceFrame.evaluate(()=>{
              const api=window.HumanLab?.face;if(!api)throw new Error('Face API unavailable');
              window.HumanLab.setAuto?.(false);api.setIdentityPreset('angular');api.setShapeParameter('noseProjection',.55);
              const identityBefore=api.export().identity,landmarksBefore=api.landmarks();
              api.preset('smile',1);
              const identityDuring=api.export().identity,landmarksDuring=api.landmarks();
              document.getElementById('face-verify-separation').click();api.closeup('front');window.HumanLab.render?.();
              return {identityBefore,identityDuring,landmarksBefore,landmarksDuring,status:document.getElementById('face-status').textContent,report:api.report()};
            });
            if(JSON.stringify(runtime.identityBefore)!==JSON.stringify(runtime.identityDuring))throw new Error('Expression changed structural identity');
            if(JSON.stringify(runtime.landmarksBefore)!==JSON.stringify(runtime.landmarksDuring))throw new Error('Expression changed identity landmarks');
            if(!runtime.status.includes('通过'))throw new Error('Visible separation check failed: '+runtime.status);
            await page.waitForTimeout(400);
            await page.screenshot({path:'/tmp/face-identity-landmarks-r2.png',fullPage:true});
            const report={schema:'jarvis/face_identity_browser_qa@1',url:'index.html?review=face',shapeSliders,identityButtons,landmarks:Object.keys(runtime.landmarksDuring.values).length,status:runtime.status,identityPreserved:true,landmarksPreservedAcrossExpression:true,consoleErrors,pageErrors,viewport:[1440,960],browserExecuted:true,gpuAcceptance:false,visualAcceptance:false};
            fs.writeFileSync('docs/qa/face-identity-landmarks-r2.json',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          NODE_PATH=/tmp/face-qa/node_modules node /tmp/face-qa/run.cjs
