name: Deploy Bird Seagull R014 Real

on:
  push:
    branches:
      - main
    paths:
      - 'BIRD_SEAGULL_A_TOPOLOGY_ATLAS_R014/**'
      - '.github/workflows/bird-seagull-r014-real-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate R014 source topology atlas
        shell: bash
        run: |
          set -euo pipefail
          dir=BIRD_SEAGULL_A_TOPOLOGY_ATLAS_R014
          test -f "$dir/index.html"
          test -f "$dir/topology-contract.json"
          test "$(find "$dir/data" -name 'topology-atlas-*.js' | wc -l)" -eq 4
          test -f "$dir/runtime/contract-ui-r013.js"
          test -f "$dir/runtime/contract-ui.js"
          test -f "$dir/runtime/component-atlas-ui.js"
          test "$(find "$dir/runtime" -name 'component-atlas-chunk-*.js' | wc -l)" -eq 2
          test -f "$dir/qa-r014.mjs"
          node --check "$dir/runtime/contract-ui.js"
          node --check "$dir/runtime/component-atlas-ui.js"
          node --check "$dir/qa-r014.mjs"
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),zlib=require('zlib'),vm=require('vm');
          const dir='BIRD_SEAGULL_A_TOPOLOGY_ATLAS_R014';
          const c=JSON.parse(fs.readFileSync(`${dir}/topology-contract.json`,'utf8'));
          global.window={};
          for(const f of fs.readdirSync(`${dir}/data`).filter(x=>x.startsWith('topology-atlas-')).sort())vm.runInThisContext(fs.readFileSync(`${dir}/data/${f}`,'utf8'));
          const b64=window.__BIRD_R014_ATLAS_PAYLOAD,raw=zlib.gunzipSync(Buffer.from(b64,'base64')),a=JSON.parse(raw);
          const sha=crypto.createHash('sha256').update(raw).digest('hex'),gzSha=crypto.createHash('sha256').update(Buffer.from(b64,'base64')).digest('hex');
          window.__BIRD_R014_UI_PAYLOAD='';
          for(const f of fs.readdirSync(`${dir}/runtime`).filter(x=>x.startsWith('component-atlas-chunk-')).sort())vm.runInThisContext(fs.readFileSync(`${dir}/runtime/${f}`,'utf8'));
          const uiGz=Buffer.from(window.__BIRD_R014_UI_PAYLOAD,'base64'),ui=zlib.gunzipSync(uiGz);new Function(ui.toString('utf8'));
          if(c.version!=='R0.14'||a.version!=='R0.14')throw new Error('R014 version');
          if(sha!==c.topology.atlasSha256||gzSha!==c.topology.atlasGzipSha256)throw new Error(`R014 atlas sha ${sha}/${gzSha}`);
          if(raw.length!==c.topology.atlasBytes||b64.length!==c.topology.atlasBase64Chars)throw new Error('R014 atlas length');
          if(window.__BIRD_R014_UI_PAYLOAD.length!==10672||ui.length!==21501)throw new Error('R014 UI payload length');
          if(a.components.length!==147||a.mirrorPairs.length!==70)throw new Error('R014 component counts');
          if(a.summary.states.must_rebuild!==129||a.summary.states.learn_only!==13||a.summary.states.unresolved!==5)throw new Error('R014 adoption states');
          if(new Set(a.components.map(x=>x.id)).size!==147||a.components.some((x,i)=>x.id!==i))throw new Error('R014 canonical ids');
          for(const x of a.components){if(x.mirrorComponentId!=null){const y=a.components[x.mirrorComponentId];if(!y||y.mirrorComponentId!==x.id||y.mirrorPairId!==x.mirrorPairId)throw new Error(`R014 mirror ${x.id}`)}}
          console.log({sha,gzSha,components:a.components.length,pairs:a.mirrorPairs.length,states:a.summary.states});
          NODE
      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a BIRD_SEAGULL_A_TOPOLOGY_ATLAS_R014/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  live-browser-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BIRD_R014_QA_URL: ${{ needs.deploy.outputs.page_url }}?qa=${{ github.run_id }}
      BIRD_R014_QA_ROOT: artifacts/bird-r014-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed R014 on desktop and mobile
        run: node BIRD_SEAGULL_A_TOPOLOGY_ATLAS_R014/qa-r014.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r014-real-live
          path: artifacts/bird-r014-live
          if-no-files-found: warn
          retention-days: 90
