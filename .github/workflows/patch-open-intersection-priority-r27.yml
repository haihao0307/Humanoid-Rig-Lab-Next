name: Patch Open Intersection Circulation R2.7

on:
  push:
    branches:
      - feature/human-task-workbench-adjustment-v2-fullbase

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-task-workbench-adjustment-v2-fullbase
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Connect shared open-intersection coordinator
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          module=Path('body/CrowdIntersectionCoordinator.js')
          text=module.read_text(encoding='utf-8')
          text=text.replace("else{traffic.active=true;traffic.mode='intersection-circulation';","else{traffic.active=false;traffic.mode='intersection-circulation';")
          module.write_text(text,encoding='utf-8',newline='\n')

          runtime=Path('source/runtime.template.js')
          text=runtime.read_text(encoding='utf-8')
          old='/*__SOURCE:body/MotionLabActions.js__*/\n/*__SOURCE:body/NaturalLocomotion.js__*/'
          new='/*__SOURCE:body/MotionLabActions.js__*/\n/*__SOURCE:body/CrowdIntersectionCoordinator.js__*/\n/*__SOURCE:body/NaturalLocomotion.js__*/'
          if text.count(old)!=1:
              raise SystemExit(f'runtime coordinator anchor count: {text.count(old)}')
          runtime.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          assembly=Path('source/assembly.json')
          data=json.loads(assembly.read_text(encoding='utf-8'))
          modules=data['modules'];coordinator='body/CrowdIntersectionCoordinator.js'
          if coordinator not in modules: modules.insert(modules.index('body/NaturalLocomotion.js'),coordinator)
          if modules.count(coordinator)!=1: raise SystemExit('intersection coordinator must appear exactly once')
          assembly.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')

          path=Path('body/NaturalLocomotion.js')
          text=path.read_text(encoding='utf-8')
          replacements={
            "if(!runtime){runtime={slots:new Map(),corridors:new Map()};trafficRuntimeByPopulation.set(population,runtime);}":"if(!runtime){runtime={slots:new Map(),corridors:new Map(),intersections:new Map()};trafficRuntimeByPopulation.set(population,runtime);}",
            "if(this.traffic?.slotKey)trafficReleaseTargetSlot(this);if(this.traffic?.corridorKey)trafficReleaseCorridor(this);":"if(this.traffic?.slotKey)trafficReleaseTargetSlot(this);if(this.traffic?.corridorKey)trafficReleaseCorridor(this);if(this.traffic?.intersectionKey)trafficReleaseIntersection(this);",
            "corridorClaims:0,corridorYields:0};this.sync();":"corridorClaims:0,corridorYields:0,intersectionKey:null,intersectionTaskKey:null,intersectionOwner:null,intersectionCenter:null,intersectionOrbitDirection:0,intersectionOrbitLane:-1,intersectionOrbitAngle:null,intersectionClaims:0,intersectionYields:0,intersectionLaps:0,intersectionRotations:0};this.sync();",
            "if(this.world.free(target,.23))return target;":"if(this.world.free(target,.23)&&trafficSegmentClear(a,root,target,context))return target;",
            "if(this.traffic.corridorTaskKey&&this.traffic.corridorTaskKey!==currentTaskKey)trafficReleaseCorridor(this);":"if(this.traffic.corridorTaskKey&&this.traffic.corridorTaskKey!==currentTaskKey)trafficReleaseCorridor(this);\n  if(this.traffic.intersectionTaskKey&&this.traffic.intersectionTaskKey!==currentTaskKey)trafficReleaseIntersection(this);",
            "if(a.routeIndex>=a.route.length){if(this.traffic.corridorKey)trafficReleaseCorridor(this);return false;}":"if(a.routeIndex>=a.route.length){if(this.traffic.corridorKey)trafficReleaseCorridor(this);if(this.traffic.intersectionKey)trafficReleaseIntersection(this);return false;}",
            "if(this.traffic.corridorTaskKey&&this.traffic.corridorTaskKey!==currentTaskKey)trafficReleaseCorridor(this);\n  if(this.traffic.active&&this.traffic.phase!==undefined":"if(this.traffic.corridorTaskKey&&this.traffic.corridorTaskKey!==currentTaskKey)trafficReleaseCorridor(this);\n  if(this.traffic.intersectionTaskKey&&this.traffic.intersectionTaskKey!==currentTaskKey)trafficReleaseIntersection(this);\n  if(this.traffic.active&&this.traffic.phase!==undefined"
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count!=1: raise SystemExit(f'locomotion patch count {count} for {old[:90]!r}')
              text=text.replace(old,new,1)

          maintain_old="if(!a.w.population)return target;\n  const maintained=this.maintainCorridor(context,target);if(maintained)return maintained;\n  const predicted=predictTrafficConflict(a,speed,context);"
          maintain_new="if(!a.w.population)return target;\n  const intersectionTarget=trafficMaintainOpenIntersection(this,context,target);if(intersectionTarget)return intersectionTarget;\n  const maintained=this.maintainCorridor(context,target);if(maintained)return maintained;\n  const predicted=predictTrafficConflict(a,speed,context);"
          if text.count(maintain_old)!=1: raise SystemExit(f'intersection maintain anchor count: {text.count(maintain_old)}')
          text=text.replace(maintain_old,maintain_new,1)

          resolve_old="""  if(predicted){
   const corridor=this.resolveNarrowCorridor(predicted,context);
   if(corridor==='owner'||corridor==='yield'){const managed=this.maintainCorridor(context,target);if(managed)return managed;throw Error('狭窄通道没有可用的持续移动路线');}
   if(corridor==='blocked')throw Error('狭窄通道没有可用的主动撤离路线');
  }
  const rolling=this.rollingTrafficTarget(target,context);if(rolling&&rolling!==target)return rolling;"""
          resolve_new="""  if(predicted){
   const corridor=this.resolveNarrowCorridor(predicted,context);
   if(corridor==='owner'||corridor==='yield'){const managed=this.maintainCorridor(context,target);if(managed)return managed;throw Error('狭窄通道没有可用的持续移动路线');}
   if(corridor==='blocked')throw Error('狭窄通道没有可用的主动撤离路线');
   const intersection=trafficResolveOpenIntersection(this,predicted,context);
   if(intersection){const managed=trafficMaintainOpenIntersection(this,context,target);if(managed)return managed;}
  }
  const rolling=this.rollingTrafficTarget(target,context);if(rolling&&rolling!==target)return rolling;"""
          if text.count(resolve_old)!=1: raise SystemExit(f'intersection resolve anchor count: {text.count(resolve_old)}')
          text=text.replace(resolve_old,resolve_new,1)
          path.write_text(text,encoding='utf-8',newline='\n')

          browser=Path('tools/test-task-crowd-browser.mjs')
          text=browser.read_text(encoding='utf-8')
          replacements={
            "return population>=4;":"return w?.__humanStartup?.status==='ready'&&population>=6&&pending===0;",
            "assert.notEqual(ready.startup?.status,'failed','browser crowd startup failed: '+JSON.stringify(ready));":"assert.equal(ready.startup?.status,'ready','full review cast did not reach ready: '+JSON.stringify(ready));",
            "assert(ready.population>=4,'crowd browser scenario requires at least four real NPCs');":"assert(ready.population>=6,'crowd browser scenario requires the six-person review cast');\n assert.equal(ready.pending,0,'review-cast generation must finish before traffic scenarios');",
            "['detours','replans','sideSteps','retreats','corridorYields','corridorClaims','slotReservations']":"['detours','replans','sideSteps','retreats','corridorYields','corridorClaims','slotReservations','intersectionClaims','intersectionYields','intersectionLaps','intersectionRotations']",
            "assert(crossing.trafficActions>=1,'four-way browser crossing did not exercise traffic recovery');":"assert(crossing.trafficActions>=1,'four-way browser crossing did not exercise traffic recovery');\n const intersectionClaims=crossing.actors.reduce((sum,actor)=>sum+(Number(actor.traffic.intersectionClaims)||0),0),intersectionYields=crossing.actors.reduce((sum,actor)=>sum+(Number(actor.traffic.intersectionYields)||0),0),kernelRecoveries=crossing.actors.reduce((sum,actor)=>sum+(Number(actor.traffic.recoveries)||0),0);\n assert(intersectionClaims>=1,'browser crossing did not establish shared open-intersection ownership');\n assert(intersectionYields>=2,'browser crossing did not circulate the non-owner actors');\n assert(kernelRecoveries<128,'browser crossing repeatedly drove the motion kernel into blocked recovery');",
            "assert(crossing.actors.every(actor=>actor.pathRatio<3.4),'browser crossing produced an excessive detour');":"assert(crossing.actors.every(actor=>actor.pathRatio<4.2),'browser crossing produced an excessive detour');\n assert(crossing.actors.every(actor=>actor.maxStationaryS<15),'browser crossing left an actor stationary for too long');"
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count!=1: raise SystemExit(f'browser patch count {count} for {old[:90]!r}')
              text=text.replace(old,new,1)
          browser.write_text(text,encoding='utf-8',newline='\n')

          unit=Path('tools/test-npc-four-way-crossing.mjs')
          text=unit.read_text(encoding='utf-8')
          old="const trafficActions=actors.reduce((sum,actor)=>sum+actor.locomotion.traffic.detours+actor.locomotion.traffic.retreats+actor.locomotion.traffic.recoveries+(actor.locomotion.traffic.escapes||0),0);\nassert(trafficActions>0,'the crossing must exercise predictive traffic handling');"
          new="const intersectionClaims=actors.reduce((sum,actor)=>sum+(actor.locomotion.traffic.intersectionClaims||0),0),intersectionYields=actors.reduce((sum,actor)=>sum+(actor.locomotion.traffic.intersectionYields||0),0),kernelRecoveries=actors.reduce((sum,actor)=>sum+(actor.locomotion.traffic.recoveries||0),0),trafficActions=actors.reduce((sum,actor)=>sum+actor.locomotion.traffic.detours+actor.locomotion.traffic.retreats+actor.locomotion.traffic.recoveries+(actor.locomotion.traffic.escapes||0)+(actor.locomotion.traffic.intersectionClaims||0)+(actor.locomotion.traffic.intersectionYields||0),0);\nassert(trafficActions>0,'the crossing must exercise predictive traffic handling');\nassert(intersectionClaims>=1,'the crossing must establish shared open-intersection ownership');\nassert(intersectionYields>=2,'the crossing must keep non-owner actors moving outside the intersection');\nassert(kernelRecoveries<128,'the crossing must not repeatedly drive the motion kernel into blocked recovery');"
          if text.count(old)!=1: raise SystemExit(f'unit intersection metric anchor count: {text.count(old)}')
          unit.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
      - name: Build and verify source traffic suite
        run: |
          node --check body/CrowdIntersectionCoordinator.js
          node --check body/NaturalLocomotion.js
          node --check tools/test-task-crowd-browser.mjs
          node --check tools/test-npc-four-way-crossing.mjs
          node tools/build-pure.mjs
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
          node tools/test-npc-task-selection-bridge.mjs
          node tools/test-npc-traffic-wait.mjs
          node tools/test-npc-target-reservations.mjs
          node tools/test-npc-four-way-crossing.mjs
          node tools/test-npc-corridor-active-yield.mjs
          node tools/test-npc-resource-circulation.mjs
          node tools/test-grid-navigation-batch.mjs
      - name: Install browser dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi
      - name: Verify six-person browser crowd scenarios
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/humanlab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          if [ -n "$CHROME_BIN" ]; then
            CHROME_BIN="$CHROME_BIN" HUMANLAB_URL=http://127.0.0.1:4173/index.html node tools/test-task-crowd-browser.mjs
          else
            HUMANLAB_URL=http://127.0.0.1:4173/index.html node tools/test-task-crowd-browser.mjs
          fi
      - name: Upload R2.7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-open-intersection-r27
          path: |
            artifacts/task-crowd-crossing-r26.png
            artifacts/task-crowd-corridor-r26.png
            artifacts/task-crowd-resource-r26.png
            artifacts/task-crowd-browser-r26.json
            artifacts/task-crowd-browser-r26-failure.png
            artifacts/task-crowd-browser-r26-failure.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit verified R2.7 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add body/CrowdIntersectionCoordinator.js body/NaturalLocomotion.js source/runtime.template.js source/assembly.json tools/test-task-crowd-browser.mjs tools/test-npc-four-way-crossing.mjs index.html
          git commit -m "fix(task): coordinate open intersections without parking R2.7"
          git push origin HEAD:feature/human-task-workbench-adjustment-v2-fullbase
