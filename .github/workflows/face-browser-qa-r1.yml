name: Face browser QA R1

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix visible separation result
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('body/FaceControls.js')
          text=p.read_text(encoding='utf-8')
          old="  el('verify-separation').onclick=()=>edit(()=>{const result=api.verifySeparation();el('status').textContent=result.ok?'通过：微笑、眨眼等表情不会改写固定身份中性脸。':'失败：固定身份数据发生变化。';});"
          new="  el('verify-separation').onclick=()=>{const result=api.verifySeparation();el('status').textContent=result.ok?'通过：微笑、眨眼等表情不会改写固定身份中性脸。':'失败：固定身份数据发生变化。';};"
          if text.count(old)!=1:
              raise SystemExit('face separation callback anchor mismatch')
          p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
      - name: Rebuild and verify source
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/test-face-profile-separation.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
          python3 tools/audit-files.py
      - name: Install browser harness
        run: |
          mkdir -p /tmp/face-qa
          cd /tmp/face-qa
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Run actual webpage QA
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/face-server.log 2>&1 &
          echo $! >/tmp/face-server.pid
          mkdir -p docs/qa
          cat >/tmp/face-qa/run.cjs <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const consoleErrors=[],pageErrors=[];
            page.on('console',msg=>{if(msg.type()==='error')consoleErrors.push(msg.text());});
            page.on('pageerror',error=>pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:8000/index.html?review=face',{waitUntil:'domcontentloaded',timeout:180000});
            let faceFrame=null;
            const deadline=Date.now()+180000;
            while(Date.now()<deadline&&!faceFrame){
              for(const frame of page.frames()){
                try{if(await frame.locator('#face-identities').count()){faceFrame=frame;break;}}catch{}
              }
              if(!faceFrame)await page.waitForTimeout(500);
            }
            if(!faceFrame)throw new Error('Face settings frame did not become available');
            await faceFrame.locator('#face-identities button').first().waitFor({state:'visible',timeout:60000});
            await faceFrame.evaluate(()=>{
              const overlay=document.querySelector('#bodyStartupDiagnostics');
              if(overlay){overlay.hidden=true;overlay.style.display='none';overlay.style.pointerEvents='none';}
              window.HumanLab?.setAuto?.(false);
              window.HumanLab?.face?.closeup?.('front');
              window.HumanLab?.render?.();
            });
            const identityButtons=await faceFrame.locator('#face-identities button').count();
            const expressionButtons=await faceFrame.locator('#face-presets button').count();
            if(identityButtons!==5)throw new Error('Expected 5 identity presets, got '+identityButtons);
            if(expressionButtons<7)throw new Error('Expected expression presets, got '+expressionButtons);
            const identityBefore=await faceFrame.evaluate(()=>{
              const api=window.HumanLab?.face;
              if(!api)throw new Error('Face runtime API is unavailable');
              api.setIdentityPreset('broad');
              api.refresh();
              return api.export().identity;
            });
            await faceFrame.locator('#face-presets button[data-preset="smile"]').click({force:true});
            await page.waitForTimeout(800);
            const identityDuring=await faceFrame.evaluate(()=>window.HumanLab.face.export().identity);
            if(JSON.stringify(identityBefore)!==JSON.stringify(identityDuring))throw new Error('Expression changed fixed identity');
            await faceFrame.locator('#face-verify-separation').click({force:true});
            const status=await faceFrame.locator('#face-status').textContent();
            if(!status||!status.includes('通过'))throw new Error('Separation check did not pass: '+status);
            await faceFrame.evaluate(()=>window.HumanLab?.render?.());
            await page.waitForTimeout(300);
            await page.screenshot({path:'docs/qa/face-profile-split-r1.png',fullPage:true});
            const report={schema:'jarvis/face_browser_qa@1',url:'index.html?review=face',identityButtons,expressionButtons,status,identityComparedInRuntime:true,identityPreserved:JSON.stringify(identityBefore)===JSON.stringify(identityDuring),startupOverlayHiddenForQa:true,consoleErrors,pageErrors,viewport:[1440,900],browserExecuted:true,gpuAcceptance:false,visualAcceptance:false};
            fs.writeFileSync('docs/qa/face-profile-split-r1.json',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          NODE_PATH=/tmp/face-qa/node_modules node /tmp/face-qa/run.cjs
      - name: Commit verified implementation and QA evidence
        shell: bash
        run: |
          rm -f .github/workflows/face-browser-qa-r1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "face: fix separation control and capture browser review"
          git push origin HEAD:feature/human-face-workbench-v1-20260915
