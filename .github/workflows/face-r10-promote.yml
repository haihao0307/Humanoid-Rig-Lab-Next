name: Finalize face jaw and oral R10

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-r10-promote.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize reviewed R10 source and documentation
        run: python3 tools/finalize-face-r10.py
      - name: Build and validate final readable sources
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-face-controls.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
          python3 tools/audit-files.py
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
      - name: Remove staging files and push final source
        shell: bash
        run: |
          rm -f \
            .github/workflows/export-face-r10-source.yml \
            .github/workflows/face-jaw-oral-r10-candidate.yml \
            .github/workflows/face-r10-promote.yml \
            tools/apply-face-jaw-oral-r10-candidate.py.gz.b64 \
            tools/capture-face-jaw-oral-r10.cjs \
            tools/fix-face-jaw-oral-r10-contract.py \
            tools/finalize-face-r10.py
          python3 tools/audit-files.py
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "face: finalize jaw and oral R10 for integration"
          git push origin HEAD:feature/human-face-workbench-v1-20260915
