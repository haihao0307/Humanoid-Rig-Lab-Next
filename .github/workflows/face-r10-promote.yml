name: Finalize face jaw and oral R10

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-r10-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face-r10-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize the validated R10 candidate
        shell: bash
        run: |
          base64 --decode tools/apply-face-jaw-oral-r10-candidate.py.gz.b64 | gzip -d > /tmp/apply-face-jaw-oral-r10-candidate.py
          python3 /tmp/apply-face-jaw-oral-r10-candidate.py
          python3 tools/fix-face-jaw-oral-r10-contract.py
      - name: Record R10 handoff and QA boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          Path('docs/FACE_JAW_ORAL_R10.md').write_text('''# 头部局部下颌与程序化口腔 R10

2026-09-16。本阶段在 R9 中性唇接触基础上，加入与 Core Rig 隔离的头部局部下颌表现控制，并建立程序化牙列、牙龈和舌体遮挡层。

## 已实施内容

- `body/FaceAnatomy.js` 升级为 `r14-jaw-oral-cavity`。
- 新增独立 `jawOpen` 表情通道；`lipPart` 继续只表示上下唇自由边分离。
- 下颌采用头部局部坐标中的有界旋转与平移，只影响下牙、下牙龈、舌体、下唇和中央下脸权重区。
- 上牙与上牙龈保持在头部坐标中，不随下颌移动。
- 程序化生成上、下牙列、连续牙龈弓和舌体；当前属于遮挡与运动关系候选，不是测量牙科模型。
- 闭口时口腔结构隐藏；张口达到阈值后，牙齿、牙龈和舌体进入独立材质与深度绘制。
- NPC 居民缓存、面部编辑器和渲染器均增加 `jawOpen`，身份脸与临时表情继续分层。

## 不变量

本阶段没有修改 Core Rig、父子层级、骨长、绑定姿势、人物比例、动作或任务系统。下颌仍属于 Performance Deform 高级表现层。

## 已知边界

- 当前下颌不是双侧髁突、关节盘和下颌窝组成的真实 TMJ 模型。
- 当前牙列为 24 颗程序化候选牙，未覆盖完整恒牙类别和咬合关系。
- 当前没有牙齿碰撞、唇齿接触、舌齿接触和咀嚼动力学。
- 参数与浏览器检查通过不等于视觉验收；`visualAcceptance=false`、`productionReady=false`。

## 验证

- 源码装配与生成入口一致性检查
- 面部控制、眼部结构和面部结构参数夹具
- 身份/表情分层、NPC uniform 隔离和启动测试
- 候选浏览器运行确认：自然进入 ready、WebGL 错误为 0、无页面脚本异常
''', encoding='utf-8', newline='\n')

          readme=Path('README.md')
          text=readme.read_text(encoding='utf-8')
          marker='# 重建人物 R2 · 行为与人物模块修整 R11\n'
          entry='''\n2026-09-16 **头部局部下颌与程序化口腔 R10**：拆分 `jawOpen` 与 `lipPart`，在头部局部坐标中增加有界下颌表现控制，并程序化生成上、下牙列、连续牙龈弓和舌体遮挡。上颌保持静止，下颌相关结构与中央下脸按权重运动；闭口时口腔层隐藏。该阶段不修改 Core Rig，仍为候选状态。见 [头部局部下颌与程序化口腔 R10](docs/FACE_JAW_ORAL_R10.md)。\n'''
          if marker not in text:
              raise SystemExit('README title anchor missing')
          if entry.strip() not in text:
              text=text.replace(marker,marker+entry,1)
          readme.write_text(text,encoding='utf-8',newline='\n')

          qa={
            'schema':'jarvis/face_jaw_oral_browser_qa@1',
            'candidateCommit':'9bfb62a4bd6de4a50edea132c0f44ce99f0d81ea',
            'candidateWorkflowRun':35049064927,
            'startupReadyNaturally':True,
            'startupOverlayBypassed':False,
            'singleActor':True,
            'eyeRevision':'r14-procedural-iris-lid-integration',
            'faceRevision':'r14-jaw-oral-cavity',
            'recipeRevision':'r5-jaw-oral-cavity',
            'channels':23,
            'oralStructures':['upperTeeth','lowerTeeth','upperGum','lowerGum','tongue'],
            'webglError':0,
            'contextLost':False,
            'pageErrors':[],
            'browserExecuted':True,
            'visualAcceptance':False,
            'productionReady':False,
            'userVisualAcceptance':'pending'
          }
          Path('docs/qa').mkdir(parents=True,exist_ok=True)
          Path('docs/qa/face-jaw-oral-r10-browser.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
      - name: Build and validate final readable sources
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-face-controls.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
          python3 tools/audit-files.py
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
      - name: Remove staging-only files and commit final face source
        shell: bash
        run: |
          rm -f \
            .github/workflows/export-face-r10-source.yml \
            .github/workflows/face-jaw-oral-r10-candidate.yml \
            .github/workflows/face-r10-promote.yml \
            tools/apply-face-jaw-oral-r10-candidate.py.gz.b64 \
            tools/capture-face-jaw-oral-r10.cjs \
            tools/fix-face-jaw-oral-r10-contract.py
          python3 tools/audit-files.py
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "face: finalize jaw and oral R10 for integration"
          git push origin HEAD:feature/human-face-workbench-v1-20260915
