name: Apply face R25C clean face fast once

on:
  push:
    branches:
      - feature/face-features-r25-20260919
    paths:
      - .github/workflows/apply-face-clean-shaven-fast-once.yml

permissions:
  contents: write

jobs:
  implement-clean-face:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/face-features-r25-20260919
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply production patch
        run: node tools/apply-face-clean-shaven-neutral-skin.mjs
      - name: Build and run focused gates
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-face-r25-baseline.mjs
          node tools/test-beard-anatomy.mjs
          node --check tools/capture-face-clean-preview.cjs
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          QA_NODE="$RUNNER_TEMP/face-r25c-playwright"
          mkdir -p "$QA_NODE" && cd "$QA_NODE"
          npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          echo "HUMAN_PLAYWRIGHT_MODULE=$QA_NODE/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Capture real WebGL face
        env:
          HUMAN_PLAYWRIGHT_MODULE: ${{ env.HUMAN_PLAYWRIGHT_MODULE }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/face-r25c-clean"
          node tools/capture-face-clean-preview.cjs "$OUT"
          rm -rf face-r25c-clean-evidence
          cp -a "$OUT" face-r25c-clean-evidence
      - name: Verify capture
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('face-r25c-clean-evidence/capture.json','utf8'));
          if(d.errors?.length||d.setup.redness!==0||d.setup.beard?.strands!==0||d.setup.groups.includes('faceBeard'))throw Error('clean-face setup failed');
          for(const s of d.samples)if(s.glError||s.skin.redness!==0||s.beard?.strands!==0||s.groups.includes('faceBeard'))throw Error(s.name+' failed');
          console.log(JSON.stringify({views:d.samples.map(s=>s.name),redness:0,beardStrands:0,glErrors:0}));
      - name: Commit production result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add body/FaceAnatomy.js body/CharacterPresets.js body/SkinAppearance.js tools/test-beard-anatomy.mjs tools/check-skin-appearance.mjs docs/face-knowledge/R25C_CLEAN_SHAVEN_NEUTRAL_SKIN_20260920.md index.html FILE_AUDIT.json SHA256SUMS.txt
          git commit -m "face R25C: remove beard and default facial redness"
          git push origin HEAD:feature/face-features-r25-20260919
      - name: Upload clean-face evidence
        if: always() && hashFiles('face-r25c-clean-evidence/capture.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: face-r25c-clean-fast-${{ github.sha }}
          path: face-r25c-clean-evidence
          retention-days: 30
