name: Face identity landmarks R2 browser QA

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face-identity-landmarks-r2-browser
  cancel-in-progress: false

jobs:
  browser-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser harness
        run: |
          mkdir -p /tmp/face-qa
          cd /tmp/face-qa
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Run actual webpage review
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/face-server.log 2>&1 &
          mkdir -p docs/qa
          cat >/tmp/face-qa/run.cjs <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:960},deviceScaleFactor:1});
            const consoleErrors=[],pageErrors=[];
            page.on('console',message=>{if(message.type()==='error')consoleErrors.push(message.text());});
            page.on('pageerror',error=>pageErrors.push(String(error)));
            await page.goto('http://127.0.0.1:8000/index.html?review=face',{waitUntil:'domcontentloaded',timeout:180000});
            let faceFrame=null;const deadline=Date.now()+180000;
            while(Date.now()<deadline&&!faceFrame){
              for(const frame of page.frames()){
                try{if(await frame.locator('#face-shape').count()){faceFrame=frame;break;}}catch{}
              }
              if(!faceFrame)await page.waitForTimeout(500);
            }
            if(!faceFrame)throw new Error('Face identity controls did not become available');
            await faceFrame.locator('#face-shape input[type=range]').first().waitFor({state:'visible',timeout:60000});
            for(const frame of page.frames()){
              try{await frame.evaluate(()=>{for(const overlay of document.querySelectorAll('#bodyStartupDiagnostics,[data-startup-diagnostics]')){overlay.hidden=true;overlay.style.display='none';overlay.style.pointerEvents='none';}});}catch{}
            }
            const shapeSliders=await faceFrame.locator('#face-shape input[type=range]').count();
            const identityButtons=await faceFrame.locator('#face-identities button').count();
            const localNodes=await faceFrame.locator('#face-node option').count();
            const expressionButtons=await faceFrame.locator('#face-presets button').count();
            if(shapeSliders!==13)throw new Error('Expected 13 structural parameters, got '+shapeSliders);
            if(identityButtons!==5)throw new Error('Expected 5 identity presets, got '+identityButtons);
            if(localNodes!==25)throw new Error('Expected 25 bounded local regions, got '+localNodes);
            if(expressionButtons<7)throw new Error('Expected expression controls, got '+expressionButtons);
            const runtime=await faceFrame.evaluate(()=>{
              const api=window.HumanLab?.face;if(!api)throw new Error('Face API unavailable');
              window.HumanLab.setAuto?.(false);
              api.setIdentityPreset('angular');
              api.setShapeParameter('noseProjection',.55);
              const identityBefore=api.export().identity,landmarksBefore=api.landmarks();
              api.preset('smile',1);
              const identityDuring=api.export().identity,landmarksDuring=api.landmarks();
              api.clearExpression();
              const identityAfter=api.export().identity;
              document.getElementById('face-verify-separation').click();
              api.closeup('front');window.HumanLab.render?.();
              return {identityBefore,identityDuring,identityAfter,landmarksBefore,landmarksDuring,status:document.getElementById('face-status').textContent,report:api.report()};
            });
            const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
            if(!same(runtime.identityBefore,runtime.identityDuring)||!same(runtime.identityBefore,runtime.identityAfter))throw new Error('Expression changed structural identity');
            if(!same(runtime.landmarksBefore,runtime.landmarksDuring))throw new Error('Expression changed identity landmarks');
            if(runtime.report.identityModel.parameters.length!==13)throw new Error('Runtime report parameter count mismatch');
            if(Object.keys(runtime.report.identityModel.landmarks.values).length!==21)throw new Error('Runtime report landmark count mismatch');
            if(!runtime.status.includes('通过'))throw new Error('Visible separation check failed: '+runtime.status);
            await page.waitForTimeout(500);
            await page.screenshot({path:'/tmp/face-identity-landmarks-r2.png',fullPage:true});
            const report={schema:'jarvis/face_identity_browser_qa@1',url:'index.html?review=face',shapeSliders,identityButtons,localNodes,expressionButtons,landmarks:Object.keys(runtime.landmarksDuring.values).length,status:runtime.status,identityPreserved:true,landmarksPreservedAcrossExpression:true,consoleErrors,pageErrors,viewport:[1440,960],browserExecuted:true,gpuAcceptance:false,visualAcceptance:false};
            fs.writeFileSync('docs/qa/face-identity-landmarks-r2.json',JSON.stringify(report,null,2)+'\n');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          NODE_PATH=/tmp/face-qa/node_modules node /tmp/face-qa/run.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: face-identity-landmarks-r2-screenshot
          path: /tmp/face-identity-landmarks-r2.png
          retention-days: 14
      - name: Recheck, audit and commit evidence
        shell: bash
        run: |
          rm -f .github/workflows/face-identity-landmarks-r2-browser.yml
          node tools/check-pure.mjs
          python3 tools/audit-files.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "qa: verify structural face identity in browser"
          git push origin HEAD:feature/human-face-workbench-v1-20260915
