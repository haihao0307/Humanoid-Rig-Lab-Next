name: Task Runtime Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify assembled entrypoint
        run: node tools/build-pure.mjs --check
      - name: Install browser smoke dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi
      - name: Run browser smoke
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/humanlab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          if [ -n "$CHROME_BIN" ]; then
            CHROME_BIN="$CHROME_BIN" HUMANLAB_URL=http://127.0.0.1:4173/index.html node tools/test-task-runtime-browser.mjs
          else
            HUMANLAB_URL=http://127.0.0.1:4173/index.html node tools/test-task-runtime-browser.mjs
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-runtime-browser-smoke
          path: |
            artifacts/task-runtime-browser.png
            artifacts/task-runtime-browser-failure.png
          if-no-files-found: ignore
          retention-days: 14
