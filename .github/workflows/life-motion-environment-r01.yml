name: Life Motion Environment R01 Contract Tests

on:
  push:
    branches:
      - experiment/life-motion-environment-r01-20261025
    paths:
      - 'experiments/life-motion-environment-r01/**'
      - '.github/workflows/life-motion-environment-r01.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/life-motion-environment-r01/**'
      - '.github/workflows/life-motion-environment-r01.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check isolated routine
        run: |
          node --check experiments/life-motion-environment-r01/routine-engine.mjs
          node --check experiments/life-motion-environment-r01/routine-engine.test.mjs
          node --check experiments/life-motion-environment-r01/motion-trace-audit.mjs
          node --check experiments/life-motion-environment-r01/motion-trace-audit.test.mjs
      - name: Run long-horizon contract soak
        run: |
          node experiments/life-motion-environment-r01/routine-engine.test.mjs
          node experiments/life-motion-environment-r01/motion-trace-audit.test.mjs