name: Skin reference read-only comparison
on:
  push:
    branches: [experiment/skin-quality-lab-r01-20261007]
    paths: [.github/workflows/skin-reference-readonly.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read user-selected public artwork, without adding it to runtime assets
        run: |
          mkdir -p reference-review
          python - <<'PY'
          import urllib.request,json,pathlib,re
          d=pathlib.Path('reference-review');url='https://artefactvfx.com/wp-content/uploads/2025/03/kyka_portrait_keyframe_poseA_comp_v003.1005-2000x1200.jpg';r={'source':url,'purpose':'Private visual comparison only. Not an included project asset. Copyright retained by the original artist.'}
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=60) as f:b=f.read(12000000);r['contentType']=f.headers.get('Content-Type');r['status']=f.status
            assert b[:2]==b'\xff\xd8','Not a JPEG response'
            (d/'kyka-reference.jpg').write_bytes(b);r['bytes']=len(b)
            page=urllib.request.urlopen('https://artefactvfx.com/personal-work/kyka/',timeout=30).read().decode()
            r['pageMedia']=list(dict.fromkeys(re.findall(r'https://[^\s\"<>]+?\.(?:jpg|png|mp4)',page)))[:60]
          except Exception as e:r['error']=str(e)
          (d/'source.json').write_text(json.dumps(r,indent=2));print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-reference-visual-review
          path: reference-review/
          retention-days: 7
