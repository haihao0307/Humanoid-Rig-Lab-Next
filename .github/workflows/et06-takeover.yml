name: ET06 isolated eye takeover
on:
  push:
    branches: [fix/eye-envelope-takeover-et06-20261009]
    paths:
      - '.github/workflows/et06-takeover.yml'
      - 'skin-quality-lab/emily-transfer/takeover/**'
permissions:
  contents: write
concurrency:
  group: et06-takeover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            skin-quality-lab/r01
            skin-quality-lab/r02
            skin-quality-lab/emily-transfer
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and bundler
        run: |
          npm install --prefix /tmp/et06-tools --no-audit --no-fund esbuild@0.25.11 playwright@1.56.1 pngjs@7.0.0
          /tmp/et06-tools/node_modules/.bin/playwright install chromium
          timeout 60s sudo apt-get install --no-install-recommends -y fonts-wqy-zenhei || true
      - name: Apply connected eyelid reconstruction and build
        env:
          NODE_PATH: /tmp/et06-tools/node_modules
          ASSET_COMMIT: ${{ github.sha }}
        run: |
          if ! grep -q "VERSION='emily-transfer/6.0.0'" skin-quality-lab/emily-transfer/app.js; then
            node skin-quality-lab/emily-transfer/takeover/apply-et06.cjs
          fi
          node skin-quality-lab/emily-transfer/anatomy/bundle.cjs
          git diff --exit-code -- skin-quality-lab/r01 skin-quality-lab/r02
          node skin-quality-lab/emily-transfer/talkinghead/test-kernel.mjs
      - name: Actual shared seam, posterior contact and visual regression
        env:
          NODE_PATH: /tmp/et06-tools/node_modules
          EVIDENCE_DIR: /tmp/et06-evidence/local
        run: node skin-quality-lab/emily-transfer/takeover/qa.cjs
      - name: Preserve candidate and diagnostics
        if: always()
        run: |
          mkdir -p /tmp/et06-evidence/candidate
          cp skin-quality-lab/emily-transfer/BUILD_MANIFEST.json /tmp/et06-evidence/candidate/
          cp skin-quality-lab/emily-transfer/preview.html /tmp/et06-evidence/candidate/
          cp skin-quality-lab/emily-transfer/research/ResearchEyes.js /tmp/et06-evidence/candidate/
      - name: Publish only tested candidate to isolated branch
        if: success()
        run: |
          git config user.name 'et06-eye-validation'
          git config user.email 'et06-eye-validation@users.noreply.github.com'
          cp /tmp/et06-evidence/local/report.json skin-quality-lab/emily-transfer/takeover/qa-report.json
          git add skin-quality-lab/emily-transfer
          if ! git diff --cached --quiet; then
            git commit -m 'build(eyes): connected ET06 eyelids and validation evidence [skip ci]'
            git push origin HEAD:fix/eye-envelope-takeover-et06-20261009
          fi
          git rev-parse HEAD | tee /tmp/et06-evidence/PUBLISHED_COMMIT.txt
      - name: Verify immutable public HTTPS page without interception
        if: success()
        env:
          NODE_PATH: /tmp/et06-tools/node_modules
          EVIDENCE_DIR: /tmp/et06-evidence/public
        run: |
          export PUBLIC_COMMIT=$(git rev-parse HEAD)
          node skin-quality-lab/emily-transfer/takeover/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: et06-connected-eyelid-evidence
          path: /tmp/et06-evidence
          retention-days: 14
