name: Face eye optics R6 candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-eye-optics-r6-candidate.yml

permissions:
  contents: read

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply R6 procedural optical candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          def replace(path,old,new,label):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count!=1: raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          workflow=Path('.github/workflows/face-eye-integration-r5-candidate.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"; start=workflow.index(marker)+len(marker); end=workflow.index("\n          PY",start)
          exec(compile(textwrap.dedent(workflow[start:end]),'r5-candidate-patch','exec'),{})

          eye=Path('body/EyeAnatomy.js')
          text=eye.read_text(encoding='utf-8')
          old_header="""const COMPACT_EYE_ANATOMY={revision:'r13-compact-lid-orbit-blend',recess:.0002,blinkRetractionM:.0010,segments:96,rings:24,
            fissure:{halfWidth:.0126,upperHeight:.00405,lowerHeight:.00305,lateralCanthusLift:.00070,upperTemporalBias:.08,lowerTemporalBias:.04,verticalRoundness:.26,upperFoldM:.00042,lowerSulcusM:.00018},
            outerBand:{canthus:.00220,upper:.00335,lower:.00265,marginRadial:.022,marginOffset:.000045},
            left:{centre:[.029181616,1.518095373,.152055491],radius:.012623681},
            right:{centre:[-.030466569,1.518094244,.151979130],radius:.012591195}};
          """
          new_header="""const COMPACT_EYE_ANATOMY={revision:'r14-procedural-iris-lid-integration',recess:.0020,blinkRetractionM:.0010,segments:96,rings:24,
            fissure:{halfWidth:.0126,upperHeight:.00500,lowerHeight:.00400,lateralCanthusLift:.00070,upperTemporalBias:.08,lowerTemporalBias:.04,verticalRoundness:.22,upperFoldM:.00030,lowerSulcusM:.00008},
            outerBand:{canthus:.00150,upper:.00220,lower:.00180,marginRadial:.016,marginOffset:.000035},
            iris:{outerRadius:.00585,pupilRadius:.00210,planeOffset:-.00020,curve:.00010,segments:128,rings:4},
            left:{centre:[.029181616,1.518095373,.152055491],radius:.012623681},
            right:{centre:[-.030466569,1.518094244,.151979130],radius:.012591195}};
          """
          if text.count(old_header)!=1: raise SystemExit('R6 eye header anchor mismatch')
          text=text.replace(old_header,new_header,1)

          pupil_anchor="""    // The iris is an annulus. Its pupil opening needs a dark interior behind
              // the iris plane; placing black pigment on the cornea flattens the eye.
              const pupilPositions=[],pupilNormals=[],pupilIndices=[];
              for(let i=0;i<=64;i++){const angle=i/64*2*Math.PI,r=i===64?0:.0024;
                pupilPositions.push(...add(frame.centre,add(mul(frame.u,r*Math.cos(angle)),add(mul(frame.v,r*Math.sin(angle)),mul(frame.n,-.00055-COMPACT_EYE_ANATOMY.recess)))));
          """
          iris_block="""    // Replace the low-resolution source iris with one parameter-generated
              // annulus in the same eye frame. The corneal shell remains independent.
              const iris=COMPACT_EYE_ANATOMY.iris,irisPositions=[],irisNormals=[],irisIndices=[];
              for(let j=0;j<=iris.rings;j++)for(let i=0;i<=iris.segments;i++){
                const radial=j/iris.rings,r=iris.pupilRadius+(iris.outerRadius-iris.pupilRadius)*radial,angle=i/iris.segments*2*Math.PI;
                const direction=add(mul(frame.u,Math.cos(angle)),mul(frame.v,Math.sin(angle))),depth=iris.planeOffset-COMPACT_EYE_ANATOMY.recess-iris.curve*radial*radial;
                irisPositions.push(...add(frame.centre,add(mul(direction,r),mul(frame.n,depth))));irisNormals.push(...compactEyeEncodeNormal(frame.n));
              }
              for(let j=0;j<iris.rings;j++)for(let i=0;i<iris.segments;i++){const a=j*(iris.segments+1)+i,b=a+iris.segments+1;irisIndices.push(a,b,a+1,a+1,b,b+1);}
              const irisCount=irisPositions.length/3,irisIds=new Uint16Array(irisCount*COMPACT_INFLUENCES),irisWeights=new Uint16Array(irisIds.length);
              for(let i=0;i<irisCount;i++){irisIds[i*COMPACT_INFLUENCES]=head;irisWeights[i*COMPACT_INFLUENCES]=65535;}
              output.push({name:'eyeIris',eyeSide:side,sourceGroup:'procedural-eye-tissue',origin:[0,0,0],extent:[1,1,1],vertices:irisCount,triangles:irisIndices.length/3,
                canonicalPositions:Float32Array.from(irisPositions),positions:Float32Array.from(irisPositions,p=>p*statureScale),normals:Int16Array.from(irisNormals),indices:Uint16Array.from(irisIndices),
                binding:{ids:irisIds,weights:irisWeights,colors:new Uint8Array(irisCount*3),groupCounts:{head:irisCount},maximumWeightError:0}});
              report.triangles+=irisIndices.length/3;
              // A separate pupil sits slightly behind the generated iris plane.
              const pupilPositions=[],pupilNormals=[],pupilIndices=[];
              for(let i=0;i<=64;i++){const angle=i/64*2*Math.PI,r=i===64?0:iris.pupilRadius;
                pupilPositions.push(...add(frame.centre,add(mul(frame.u,r*Math.cos(angle)),add(mul(frame.v,r*Math.sin(angle)),mul(frame.n,iris.planeOffset-.00035-COMPACT_EYE_ANATOMY.recess)))));
          """
          if text.count(pupil_anchor)!=1: raise SystemExit('procedural iris insertion anchor mismatch')
          text=text.replace(pupil_anchor,iris_block,1)
          eye.write_text(text,encoding='utf-8',newline='\n')

          face=Path('body/FaceAnatomy.js')
          f=face.read_text(encoding='utf-8')
          changes={
            "revision:'r9-eyelid-orbit-integration'":"revision:'r10-procedural-optical-integration'",
            "{id:'orbitalTransition',x:side*.030,y:1.532,rx:.029,ry:.018,z:-.00052}":"{id:'orbitalTransition',x:side*.030,y:1.532,rx:.029,ry:.018,z:-.00032}",
            "{id:'upperLidSulcus',x:side*.030,y:1.538,rx:.021,ry:.0075,z:-.00018}":"{id:'upperLidSulcus',x:side*.030,y:1.538,rx:.021,ry:.0075,z:-.00012}",
            "{id:'infraorbitalTransition',x:side*.030,y:1.505,rx:.028,ry:.017,z:-.00036}":"{id:'infraorbitalTransition',x:side*.030,y:1.505,rx:.028,ry:.017,z:-.00022}",
            "{id:'lowerLidTransition',x:side*.030,y:1.500,rx:.023,ry:.0075,z:-.00010}":"{id:'lowerLidTransition',x:side*.030,y:1.500,rx:.023,ry:.0075,z:-.00006}",
            "{id:'malarVolume',x:side*.037,y:1.493,rx:.023,ry:.016,z:.00060}":"{id:'malarVolume',x:side*.037,y:1.493,rx:.023,ry:.016,z:.00055}"
          }
          for old,new in changes.items():
              if f.count(old)!=1: raise SystemExit('face R6 anchor mismatch: '+old)
              f=f.replace(old,new,1)
          face.write_text(f,encoding='utf-8',newline='\n')

          work=Path('body/CompactWorkbench.js')
          w=work.read_text(encoding='utf-8')
          old="const COMPACT_SCLERA_APERTURE=`if(compactFeature>4.5&&compactFeature<5.5&&length(compactEyeUV(R))<.985&&dot(R-compactEyeCentre,cross(compactEyeU,compactEyeV))>${(-COMPACT_EYE_ANATOMY.recess-.001).toFixed(6)})discard;`;"
          new="const COMPACT_SCLERA_APERTURE=`if(compactFeature>4.5&&compactFeature<5.5&&length(compactEyeUV(R))<${(COMPACT_EYE_ANATOMY.iris.outerRadius/.0064*.985).toFixed(6)}&&dot(R-compactEyeCentre,cross(compactEyeU,compactEyeV))>${(-COMPACT_EYE_ANATOMY.recess-.001).toFixed(6)})discard;`;"
          if w.count(old)!=1: raise SystemExit('sclera aperture anchor mismatch')
          w=w.replace(old,new,1)
          old="const replacedSclera=data.meshes.filter(m=>['FJ1317','FJ1368','FJ2812','FJ2814'].includes(m.name));"
          new="const replacedSclera=data.meshes.filter(m=>['FJ1297','FJ1348','FJ1317','FJ1368','FJ2812','FJ2814'].includes(m.name));"
          if w.count(old)!=1: raise SystemExit('source iris replacement anchor mismatch')
          w=w.replace(old,new,1)
          old="gl.uniform1f(p.u.compactSourceEye,['FJ1289','FJ1340','FJ1297','FJ1348','FJ1317','FJ1368'].includes(c.name)?1:['eyeSclera','eyePupil'].includes(c.name)?2:0);"
          new="gl.uniform1f(p.u.compactSourceEye,['FJ1289','FJ1340','FJ1297','FJ1348','FJ1317','FJ1368'].includes(c.name)?1:['eyeSclera','eyeIris','eyePupil'].includes(c.name)?2:0);"
          if w.count(old)!=1: raise SystemExit('generated optical path anchor mismatch')
          w=w.replace(old,new,1)
          old="const eye=c.name==='FJ1289'||c.name==='FJ1340'?1:c.name==='FJ1297'||c.name==='FJ1348'?2:0;"
          new="const eye=c.name==='FJ1289'||c.name==='FJ1340'?1:c.name==='FJ1297'||c.name==='FJ1348'||c.name==='eyeIris'?2:0;"
          if w.count(old)!=1: raise SystemExit('iris material feature anchor mismatch')
          w=w.replace(old,new,1)
          work.write_text(w,encoding='utf-8',newline='\n')

          check=Path('tools/check-eye-anatomy.mjs')
          c=check.read_text(encoding='utf-8')
          c=c.replace("revision:'r13-compact-lid-orbit-blend'","revision:'r14-procedural-iris-lid-integration'",1)
          c=c.replace("check(height>7&&height<8,'neutral fissure height remains in the authored human-scale range');","check(height>8.6&&height<9.4,'neutral fissure height remains in the authored human-scale range');",1)
          c=c.replace("source.includes('function compactEyeOuterOverlap')&&source.includes('outerBand:{canthus:.00220,upper:.00335,lower:.00265')","source.includes('function compactEyeOuterOverlap')&&source.includes('outerBand:{canthus:.00150,upper:.00220,lower:.00180')",1)
          old="check(source.includes('upperFold=-p.upperFoldM')&&source.includes('lowerSulcus=-p.lowerSulcusM')&&source.includes('upperFold=-${COMPACT_EYE_ANATOMY.fissure.upperFoldM.toFixed(6)}')&&source.includes('lowerSulcus=-${COMPACT_EYE_ANATOMY.fissure.lowerSulcusM.toFixed(6)}'),'CPU and shader share bounded upper and lower lid transitions');"
          new=old+"\n  check(source.includes(\"name:'eyeIris'\")&&source.includes('iris:{outerRadius:.00585,pupilRadius:.00210')&&source.includes('irisIndices.push'),'iris is generated as a bounded annulus in the shared eye frame');"
          if c.count(old)!=1: raise SystemExit('eye source contract insertion mismatch')
          c=c.replace(old,new,1)
          old="check(renderer.includes(\"['eyeSclera','eyePupil'].includes(c.name)?2:0\")&&renderer.includes('if(compactSourceEye<1.5)'),'generated and source optical layers share blink correction without applying the rest offset twice');"
          new="check(renderer.includes(\"['eyeSclera','eyeIris','eyePupil'].includes(c.name)?2:0\")&&renderer.includes(\"['FJ1297','FJ1348','FJ1317','FJ1368','FJ2812','FJ2814']\")&&renderer.includes('if(compactSourceEye<1.5)'),'generated optical layers share blink correction and replace the source iris without applying the rest offset twice');"
          if c.count(old)!=1: raise SystemExit('renderer optical contract anchor mismatch')
          c=c.replace(old,new,1)
          check.write_text(c,encoding='utf-8',newline='\n')

          face_check=Path('tools/check-face-anatomy.mjs')
          fc=face_check.read_text(encoding='utf-8')
          if fc.count("revision:'r9-eyelid-orbit-integration'")!=1: raise SystemExit('face check revision anchor mismatch')
          face_check.write_text(fc.replace("revision:'r9-eyelid-orbit-integration'","revision:'r10-procedural-optical-integration'",1),encoding='utf-8',newline='\n')
          PY
      - name: Build and validate candidate
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hrl-face-r6-server.log 2>&1 &
      - name: Capture candidate views
        shell: bash
        run: |
          mkdir -p visual-review-r6
          cat > capture-face-r6.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1600,height:1200},deviceScaleFactor:1});const page=await context.newPage(),consoleMessages=[],pageErrors=[];
          page.on('console',message=>consoleMessages.push({type:message.type(),text:message.text()}));page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
          await page.goto('http://127.0.0.1:4173/index.html?review=face',{waitUntil:'domcontentloaded',timeout:120000});
          let frame=null;const deadline=Date.now()+420000;while(!frame&&Date.now()<deadline){for(const candidate of page.frames()){if(await candidate.evaluate(()=>Boolean(window.HumanLab?.face?.closeup)).catch(()=>false)){frame=candidate;break;}}if(!frame)await page.waitForTimeout(1000);}if(!frame)throw Error('Face review frame unavailable');
          await frame.waitForFunction(()=>window.__compactLoading?.state==='ready',null,{timeout:420000});await frame.waitForTimeout(5000);const canvas=frame.locator('canvas').first();await canvas.waitFor({state:'visible',timeout:30000});
          for(const view of ['front','side','lips']){await frame.evaluate(v=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup(v);},view);await frame.waitForTimeout(1500);await canvas.screenshot({path:`visual-review-r6/face-r6-${view}.png`});}
          const diagnostics=await frame.evaluate(()=>{const report=window.HumanLab.face.report(),compact=window.HumanLab.compact?.report,gl=document.querySelector('canvas')?.getContext('webgl2');return {review:window.HumanLab.review,compactLoading:window.__compactLoading,startup:window.__humanStartup,eyeAnatomy:compact?.eyeAnatomy,faceAnatomy:compact?.faceAnatomy,separation:report.separation,limitedNodes:report.limitedNodes,renderer:{webglError:gl?gl.getError():null}};});await writeFile('visual-review-r6/face-r6-diagnostics.json',JSON.stringify({diagnostics,consoleMessages,pageErrors},null,2));await browser.close();
          JS
          node capture-face-r6.mjs
      - name: Upload candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-eye-optics-r6-candidate
          path: visual-review-r6
          if-no-files-found: warn
          retention-days: 7
