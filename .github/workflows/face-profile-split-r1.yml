name: Face identity-expression split R1

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face-profile-split-r1
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply face profile split
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_regex(path, pattern, replacement, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              updated,count=re.subn(pattern,lambda _:replacement,text,count=1,flags=re.S)
              if count!=1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(updated,encoding='utf-8',newline='\n')

          def replace_text(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          face_header=r'''const FACE_RECIPE=/*__FACE_RECIPE_JSON__*/;
          const FACE_SCHEMA='jarvis/face_profile@2';
          const FACE_IDENTITY_SCHEMA='jarvis/face_identity@1';
          const FACE_EXPRESSION_SCHEMA='jarvis/face_expression@1';
          const FACE_LEGACY_SCHEMA='jarvis/face_pose@1';
          const FACE_NODE_INDEX=new Map(FACE_RECIPE.nodes.map((node,index)=>[node.id,index]));
          const FACE_IDENTITY_PRESETS=Object.freeze([
            {id:'reference',label:'参考中性',offsetsMm:{}},
            {id:'slender',label:'清瘦轮廓',offsetsMm:{cheekLeft:[-2.4,-.4,-1.5],cheekRight:[2.4,-.4,-1.5],mouthLeft:[-1,0,0],mouthRight:[1,0,0],chin:[0,-1.8,1.8],noseLeft:[-.5,0,.8],noseRight:[.5,0,.8]}},
            {id:'broad',label:'宽阔轮廓',offsetsMm:{cheekLeft:[3.2,0,1.2],cheekRight:[-3.2,0,1.2],mouthLeft:[1.2,0,0],mouthRight:[-1.2,0,0],chin:[0,.8,1.2],noseLeft:[1,0,.4],noseRight:[-1,0,.4]}},
            {id:'round',label:'圆润轮廓',offsetsMm:{cheekLeft:[2.4,.6,2.6],cheekRight:[-2.4,.6,2.6],lidLowerLeft:[0,-.4,.6],lidLowerRight:[0,-.4,.6],mouthLeft:[.6,.5,.2],mouthRight:[-.6,.5,.2],chin:[0,1.7,-.8]}},
            {id:'angular',label:'棱角轮廓',offsetsMm:{cheekLeft:[-1.5,.8,-1.8],cheekRight:[1.5,.8,-1.8],mouthLeft:[-.7,-.4,0],mouthRight:[.7,-.4,0],chin:[0,-2.4,2.6],noseLeft:[-.5,0,1],noseRight:[.5,0,1]}}
          ]);
          const faceHas=(value,key)=>Object.prototype.hasOwnProperty.call(value,key);
          function faceObject(value,label){if(!value||typeof value!=='object'||Array.isArray(value))throw Error(label+'必须为对象');}
          function faceNumber(value,min,max,label){if(typeof value!=='number'||!Number.isFinite(value)||value<min||value>max)throw Error(label+'超出范围 '+min+' 至 '+max);return value;}
          function validateFaceRevision(input){if(input.revision!==undefined&&input.revision!==FACE_RECIPE.revision&&!FACE_RECIPE.legacyRevisions.includes(input.revision))throw Error('面部配方版本不匹配');}
          function validateFaceWeights(input={}){
            faceObject(input,'表情权重');const weights={},channels=new Set(FACE_RECIPE.channels.map(c=>c.id));
            for(const [key,value]of Object.entries(input)){if(!channels.has(key))throw Error('未知表情通道 '+key);weights[key]=faceNumber(value,0,1,key);}
            return weights;
          }
          function validateFaceOffsets(input={}){
            faceObject(input,'固定身份局部位移');const offsetsMm={};
            for(const [key,value]of Object.entries(input)){
              if(!FACE_NODE_INDEX.has(key)||!Array.isArray(value)||value.length!==3)throw Error('局部控制点或位移无效 '+key);
              offsetsMm[key]=value.map(v=>faceNumber(v,-FACE_RECIPE.maximumOffsetMm,FACE_RECIPE.maximumOffsetMm,key));
            }
            return offsetsMm;
          }
          function validateFacePose(input={}){
            faceObject(input,'面部配方');validateFaceRevision(input);
            const legacy=input.schema===FACE_LEGACY_SCHEMA||faceHas(input,'weights')||faceHas(input,'offsetsMm');
            if(legacy){
              if(input.schema!==undefined&&input.schema!==FACE_LEGACY_SCHEMA)throw Error('面部配方 schema 与字段不匹配');
              if(Object.keys(input).some(key=>!['schema','revision','weights','offsetsMm'].includes(key)))throw Error('面部配方含未知字段');
              const neutralOffsetsMm=validateFaceOffsets(input.offsetsMm??{}),weights=validateFaceWeights(input.weights??{});
              return {schema:FACE_SCHEMA,revision:FACE_RECIPE.revision,identity:{schema:FACE_IDENTITY_SCHEMA,neutralOffsetsMm},expression:{schema:FACE_EXPRESSION_SCHEMA,weights}};
            }
            if(input.schema!==undefined&&input.schema!==FACE_SCHEMA)throw Error('不支持的面部配方 schema');
            if(Object.keys(input).some(key=>!['schema','revision','identity','expression'].includes(key)))throw Error('面部配方含未知字段');
            const identity=input.identity??{},expression=input.expression??{};faceObject(identity,'固定身份');faceObject(expression,'临时表情');
            if(Object.keys(identity).some(key=>!['schema','neutralOffsetsMm'].includes(key))||identity.schema!==undefined&&identity.schema!==FACE_IDENTITY_SCHEMA)throw Error('固定身份格式无效');
            if(Object.keys(expression).some(key=>!['schema','weights'].includes(key))||expression.schema!==undefined&&expression.schema!==FACE_EXPRESSION_SCHEMA)throw Error('临时表情格式无效');
            const neutralOffsetsMm=validateFaceOffsets(identity.neutralOffsetsMm??{}),weights=validateFaceWeights(expression.weights??{});
            return {schema:FACE_SCHEMA,revision:FACE_RECIPE.revision,identity:{schema:FACE_IDENTITY_SCHEMA,neutralOffsetsMm},expression:{schema:FACE_EXPRESSION_SCHEMA,weights}};
          }
          function faceOffsetKey(offsetsMm={}){return FACE_RECIPE.nodes.map(node=>node.id+':'+(offsetsMm[node.id]||[0,0,0]).map(v=>Number(v).toFixed(4)).join(',')).join('|');}
          function faceWeightKey(weights={}){return FACE_RECIPE.channels.map(channel=>channel.id+':'+Number(weights[channel.id]||0).toFixed(4)).join('|');}
          function faceIdentityPreset(identity){const key=faceOffsetKey(identity.neutralOffsetsMm);return FACE_IDENTITY_PRESETS.find(preset=>faceOffsetKey(validateFaceOffsets(preset.offsetsMm))===key)||null;}
          function faceExpressionPreset(expression){const key=faceWeightKey(expression.weights);return FACE_RECIPE.presets.find(preset=>faceWeightKey(preset.weights)===key)||null;}
          function resolveFaceOffsets(input){'''
          replace_regex('body/FaceControls.js',r"const FACE_RECIPE=/\*__FACE_RECIPE_JSON__\*/;.*?function resolveFaceOffsets\(input\)\{",face_header,'face header')

          resolver=r'''function resolveFaceOffsets(input){
            const pose=validateFacePose(input),weights=pose.expression.weights,offsetsMm=pose.identity.neutralOffsetsMm,values=new Float32Array(FACE_RECIPE.nodes.length*3),limited=[];
            for(const [key,value]of Object.entries(offsetsMm))values.set(value,FACE_NODE_INDEX.get(key)*3);
            for(const channel of FACE_RECIPE.channels){const weight=weights[channel.id]||0;
              for(const [key,delta]of Object.entries(channel.offsets)){const offset=FACE_NODE_INDEX.get(key)*3;for(let axis=0;axis<3;axis++)values[offset+axis]+=weight*delta[axis];}
            }
            for(let i=0;i<FACE_RECIPE.nodes.length;i++){
              const at=i*3,length=Math.hypot(values[at],values[at+1],values[at+2]),scale=Math.min(1,FACE_RECIPE.maximumOffsetMm/Math.max(length,1e-12));
              if(scale<1)limited.push(FACE_RECIPE.nodes[i].id);
              for(let axis=0;axis<3;axis++)values[at+axis]*=scale*.001;
            }
            const muscles=new Float32Array(FACE_RECIPE.muscleFields.map(field=>Math.min(1,Object.entries(field.activation).reduce((sum,[id,gain])=>sum+(weights[id]||0)*gain,0))));
            const eyelids=new Float32Array(['Left','Right'].flatMap(side=>['eyeNarrow','eyeWide','eyeBlink'].map(id=>weights[id+side]||0)));
            return {profile:pose,values,muscles,eyelids,lipOpen:weights.lipPart||0,limited};
          }
          function interpolateFacePose(from,to,weight){
            const a=validateFacePose(from),b=validateFacePose(to);faceNumber(weight,0,1,'表情过渡');
            const mix=(x=0,y=0)=>x+(y-x)*weight,weights={};
            for(const channel of FACE_RECIPE.channels){const value=mix(a.expression.weights[channel.id],b.expression.weights[channel.id]);if(value!==0)weights[channel.id]=value;}
            return validateFacePose({identity:a.identity,expression:{weights}});
          }
          function faceChunkEligible'''
          replace_regex('body/FaceControls.js',r"function resolveFaceOffsets\(input\)\{.*?function faceChunkEligible",resolver,'face resolver')

          panel_head=r'''panel.innerHTML=`<p>固定身份中性脸与临时表情已经分层：脸型微调长期保存，微笑、眨眼和皱眉只属于当前表情，不会覆盖人物长相。</p>
              <button id="face-closeup">面部近景</button><button id="face-lip-closeup">嘴唇近景</button><button id="face-neutral">清除表情（回到本人的中性脸）</button>
              <label><input id="face-enabled" type="checkbox" checked>显示形变</label>
              <h3>1 · 固定身份中性脸</h3><div id="face-identities"></div>
              <button id="face-reset-identity">重置身份为参考脸</button><button id="face-verify-separation">检查身份/表情分层</button>
              <h3>2 · 固定身份局部微调</h3>'''
          replace_regex('body/FaceControls.js',r"panel\.innerHTML=`<p>.*?<h3>1 · 局部采样</h3>",panel_head,'face panel heading')
          replace_text('body/FaceControls.js','<h3>2 · 明显表情示例</h3>','<h3>3 · 临时表情示例</h3>','expression heading')
          replace_text('body/FaceControls.js','<button id="face-export">导出面部配方</button>','<button id="face-export">导出身份与表情配方</button>','export label')
          replace_text('body/FaceControls.js','当前为程序化肌肉形变近似；上下唇可分别拉开，连接内侧唇面和口腔入口，尚未包含下颌关节、牙齿和舌头。采样读数用于检查局部覆盖。','固定身份使用中性局部位移，临时表情使用独立通道。当前仍是程序化肌肉形变近似；上下唇可分别拉开，但尚未包含下颌关节、牙齿和舌头。','panel hint')
          replace_regex('body/FaceControls.js',r"  let enabled=true,heatmap=false,selected=0,resolved=resolveFaceOffsets\(lab\.human\.characterPreset\.appearance\.face\),demo=null,sampling=null,transition=null,presetId=null;", "  const initialFace=validateFacePose(lab.human.characterPreset.appearance.face);\n  let enabled=true,heatmap=false,selected=0,resolved=resolveFaceOffsets(initialFace),demo=null,sampling=null,transition=null,presetId=null,identityPresetId=faceIdentityPreset(initialFace.identity)?.id||null;",'initial face state')

          api_block=r'''  const api={
            export:()=>validateFacePose(lab.human.characterPreset.appearance.face),
            identity:()=>copy(api.export().identity),
            expression:()=>copy(api.export().expression),
            identityPresets:()=>copy(FACE_IDENTITY_PRESETS),
            resetTransient(){demo=null;sampling=null;transition=null;presetId=null;},
            apply(input){
              faceObject(input,'面部配方');const previous=api.export(),normalised=validateFacePose(input);
              const ownsIdentity=faceHas(input,'identity')||faceHas(input,'offsetsMm'),pose=ownsIdentity?normalised:{...normalised,identity:copy(previous.identity)};
              const next=resolveFaceOffsets(pose);api.stop();sampling=null;presetId=null;commit(pose,next);api.refresh();return api.export();
            },
            preset(id,intensity=1){faceNumber(intensity,0,1,'示例强度');const preset=FACE_RECIPE.presets.find(p=>p.id===id);if(!preset)throw Error('未知表情示例');
              const result=api.apply({weights:Object.fromEntries(Object.entries(preset.weights).map(([key,value])=>[key,value*intensity]))});presetId=id;api.refresh();return result;},
            setWeight(id,value){const pose=api.export();return api.apply({...pose,expression:{...pose.expression,weights:{...pose.expression.weights,[id]:value}}});},
            setOffset(id,offset,mirror=false){if(!FACE_NODE_INDEX.has(id))throw Error('未知面部控制点');
              const pose=api.export(),offsetsMm={...pose.identity.neutralOffsetsMm,[id]:offset};
              const other=FACE_RECIPE.nodes[FACE_NODE_INDEX.get(id)].mirror;if(mirror&&other)offsetsMm[other]=[-offset[0],offset[1],offset[2]];
              return api.apply({...pose,identity:{...pose.identity,neutralOffsetsMm}});},
            setIdentityPreset(id){const preset=FACE_IDENTITY_PRESETS.find(p=>p.id===id);if(!preset)throw Error('未知身份脸型起点');
              const pose=api.export();identityPresetId=id;return api.apply({...pose,identity:{schema:FACE_IDENTITY_SCHEMA,neutralOffsetsMm:copy(preset.offsetsMm)}});},
            resetIdentity(){return api.setIdentityPreset('reference');},
            clearExpression(){return api.apply({weights:{}});},
            verifySeparation(){
              const before=api.export(),smile=FACE_RECIPE.presets.find(p=>p.id==='smile'),withExpression=validateFacePose({identity:before.identity,expression:{weights:smile.weights}}),neutral=interpolateFacePose(withExpression,validateFacePose({identity:before.identity,expression:{weights:{}}}),1);
              const ok=faceOffsetKey(before.identity.neutralOffsetsMm)===faceOffsetKey(neutral.identity.neutralOffsetsMm);
              return {schema:'jarvis/face_separation_check@1',ok,identitySchema:before.identity.schema,expressionSchema:before.expression.schema,legacySchemaAccepted:FACE_LEGACY_SCHEMA,legacyOffsetsInterpretation:'neutral identity',visualAcceptance:false};
            },
            refresh(){resolved=resolveFaceOffsets(api.export());const pose=api.export(),node=FACE_RECIPE.nodes[selected],offset=pose.identity.neutralOffsetsMm[node.id]||[0,0,0];
              identityPresetId=faceIdentityPreset(pose.identity)?.id||null;
              el('node').value=node.id;el('enabled').checked=enabled;el('heat').checked=heatmap;
              ['x','y','z'].forEach((axis,i)=>{el(axis).value=offset[i];el(axis+'-value').textContent=offset[i].toFixed(2)+' mm';});
              for(const c of FACE_RECIPE.channels){el('channel-'+c.id).value=pose.expression.weights[c.id]||0;el('value-'+c.id).textContent=Math.round((pose.expression.weights[c.id]||0)*100)+'%';}
              for(const button of el('identities').children)button.setAttribute('aria-pressed',String(button.dataset.identity===identityPresetId));
              for(const button of el('presets').children)button.setAttribute('aria-pressed',String(button.dataset.preset===presetId));
              const sample=lab.compact?.faceSampling?.nodes[selected];
              el('coverage').textContent=sample?`${node.label} · 覆盖 ${sample.coveredVertices} 个显示顶点 · 峰值权重 ${sample.peakWeight.toFixed(3)} · 最近距离 ${sample.nearestDistanceMm===null?'未知':sample.nearestDistanceMm.toFixed(2)+' mm'} · ${lab.compact.quality}${sample.peakWeight<.2?' · 覆盖偏弱，请复查控制点范围':''}`:'人物就绪后生成采样读数。';
              const identity=faceIdentityPreset(pose.identity),expression=faceExpressionPreset(pose.expression),limit=resolved.limited.length?'组合位移已限制到每点 '+FACE_RECIPE.maximumOffsetMm+' mm：'+resolved.limited.join('、')+'。':'';
              el('status').textContent=limit+'固定身份：'+(identity?.label||'自定义身份')+'；临时表情：'+(expression?.label||(Object.keys(pose.expression.weights).length?'自定义表情':'中性'))+'。';
              needsRedraw=true;
            },
            uniforms(){return {offsets:resolved.values,muscles:resolved.muscles,eyelids:resolved.eyelids,lipOpen:resolved.lipOpen,enabled:enabled&&(resolved.lipOpen>0||[resolved.values,resolved.muscles,resolved.eyelids].some(values=>values.some(value=>value!==0)))?1:0,heatmap:heatmap?1:0,selected};},
            closeup(view='front'){
              lab.setCameraFollow(false);lab.tissue.setView('skin');
              const reference=lab.human.sourceBind.get('head'),current=lab.human.world('head'),s=lab.human.bodyMetrics.statureScale;
              const q=qnorm(qm(current.q,inv(reference.q))),translation=sub(current.p,rotate(q,reference.p)),r=lab.renderer;
              const lips=view==='lips';r.target=add(rotate(q,(lips?[-.0006,1.4586,.188]:[.0006,1.500,.160]).map(v=>v*s)),translation);r.distance=(lips?.125:.50)*s;r.projection='perspective';r.pitch=0;
              r.yaw=lab.agent.yaw+(view==='side'?Math.PI/3:0);needsRedraw=true;
            },
            samples:()=>lab.compact?.faceSampling?copy(lab.compact.faceSampling):{state:'NotObserved'},
            samplePlan(stepMm=.5){faceNumber(stepMm,.1,1,'采样步幅');return FACE_RECIPE.nodes.flatMap(node=>[0,1,2].flatMap(axis=>[-1,1].map(sign=>({node:node.id,axis:['x','y','z'][axis],offsetsMm:{[node.id]:[0,1,2].map(i=>i===axis?sign*stepMm:0)}}))));},
            sampleStep(direction=1,stepMm=.5){if(direction!==1&&direction!==-1)throw Error('采样方向无效');const plan=api.samplePlan(stepMm);api.stop();
              if(!sampling)sampling={saved:api.export(),index:direction===1?-1:0};
              sampling.index=(sampling.index+direction+plan.length)%plan.length;const entry=plan[sampling.index];selected=FACE_NODE_INDEX.get(entry.node);
              commit(validateFacePose({offsetsMm:entry.offsetsMm}));identityPresetId=null;presetId=null;enabled=true;api.refresh();
              el('sample-label').textContent=`${sampling.index+1}/${plan.length} · ${FACE_RECIPE.nodes[selected].label} · ${entry.axis.toUpperCase()} ${entry.offsetsMm[entry.node][['x','y','z'].indexOf(entry.axis)]} mm（单侧隔离）`;return copy(entry);},
            endSample(){if(sampling){const saved=sampling.saved;sampling=null;commit(saved);api.refresh();}el('sample-label').textContent='采样已结束。';},
            play(){api.stop();api.endSample();demo={saved:api.export(),elapsed:0};enabled=true;heatmap=false;api.refresh();},
            stop(){if(demo||transition){const saved=(demo||transition).saved;demo=null;transition=null;presetId=null;commit(saved);api.refresh();}},
            tick(dt){
              if(transition){if(document.hidden)return;transition.elapsed+=Math.min(Math.max(dt,0),.1);
                const t=Math.min(1,transition.elapsed/transition.duration),weight=t*t*(3-2*t),label=transition.label;
                if(t===1){const target=transition.target;transition=null;commit(target);api.refresh();}
                else{commit(interpolateFacePose(transition.saved,transition.target,weight));el('status').textContent='正在切换：'+label;}
                return;
              }
              if(!demo||document.hidden)return;demo.elapsed+=Math.min(Math.max(dt,0),.1);
              const presets=FACE_RECIPE.presets.filter(p=>p.id!=='neutral'),index=Math.floor(demo.elapsed/3);
              if(index>=presets.length){api.stop();return;}
              const phase=demo.elapsed%3,ramp=phase<.8?phase/.8:phase<1.9?1:Math.max(0,(2.7-phase)/.8),weight=ramp*ramp*(3-2*ramp)*Number(el('intensity').value),preset=presets[index];
              commit(validateFacePose({identity:demo.saved.identity,expression:{weights:Object.fromEntries(Object.entries(preset.weights).map(([key,value])=>[key,value*weight]))}}));
              el('status').textContent='正在演示：'+preset.label;needsRedraw=true;
            },
            report:()=>{const profile=api.export();return {schema:FACE_SCHEMA,recipe:copy(FACE_RECIPE),parameters:profile,identity:copy(profile.identity),expression:copy(profile.expression),separation:api.verifySeparation(),sampling:api.samples(),limitedNodes:resolved.limited.slice(),enabled,generatedGeometryIncluded:false,runtimeVerified:false,visualAcceptance:false};}
          };
          function commit(pose,next=resolveFaceOffsets(pose)){const profile=validateFacePose(pose);lab.human.characterPreset={...lab.human.characterPreset,appearance:{...lab.human.characterPreset.appearance,face:profile}};resolved=next;identityPresetId=faceIdentityPreset(profile.identity)?.id||null;needsRedraw=true;}
          function transitionPreset(id,intensity=1){
            const preset=FACE_RECIPE.presets.find(p=>p.id===id);if(!preset)throw Error('未知表情示例');faceNumber(intensity,0,1,'示例强度');
            const saved=api.export(),target=validateFacePose({identity:saved.identity,expression:{weights:Object.fromEntries(Object.entries(preset.weights).map(([key,value])=>[key,value*intensity]))}});
            api.stop();sampling=null;commit(saved);transition={saved,target,elapsed:0,duration:.45,label:preset.label};presetId=id;api.refresh();
          }
          const edit=operation=>'''
          replace_regex('body/FaceControls.js',r"  const api=\{.*?\n  const edit=operation=>",api_block,'face API')

          identity_loop=r'''  for(const preset of FACE_IDENTITY_PRESETS){const button=document.createElement('button');button.textContent=preset.label;button.dataset.identity=preset.id;
            button.onclick=()=>edit(()=>api.setIdentityPreset(preset.id));el('identities').append(button);}
          for(const preset of FACE_RECIPE.presets){const button=document.createElement('button');button.textContent=preset.label;button.dataset.preset=preset.id;
            button.onclick=()=>edit(()=>{enabled=true;heatmap=false;transitionPreset(preset.id,Number(el('intensity').value));});el('presets').append(button);}
          el('node').onchange'''
          replace_regex('body/FaceControls.js',r"  for\(const preset of FACE_RECIPE\.presets\).*?\n  el\('node'\)\.onchange",identity_loop,'identity UI loop')
          replace_text('body/FaceControls.js',"  el('neutral').onclick=()=>edit(()=>transitionPreset('neutral'));", "  el('neutral').onclick=()=>edit(()=>transitionPreset('neutral'));\n  el('reset-identity').onclick=()=>edit(()=>api.resetIdentity());\n  el('verify-separation').onclick=()=>edit(()=>{const result=api.verifySeparation();el('status').textContent=result.ok?'通过：微笑、眨眼等表情不会改写固定身份中性脸。':'失败：固定身份数据发生变化。';});",'identity callbacks')
          replace_text('body/FaceControls.js',"hfDownload('face-pose.json'","hfDownload('face-profile.json'",'face export filename')

          review_old="  lab.renderer.setQuality('shadow');if(!lab.hair?.inStudio())lab.focus('body');publishCompactProgress({group:'ready',state:'ready'});needsRedraw=true;"
          review_new="  lab.renderer.setQuality('shadow');if(!lab.hair?.inStudio())lab.focus('body');\n  const review=new URLSearchParams(window.parent.location.search);if(review.get('review')==='face')requestAnimationFrame(()=>{if(disposed)return;panel.open=false;lab.settings.open('face');lab.face.refresh();lab.face.closeup(review.get('faceView')==='lips'?'lips':'front');});\n  publishCompactProgress({group:'ready',state:'ready'});needsRedraw=true;"
          replace_text('body/CompactWorkbench.js',review_old,review_new,'face review route')

          checker=Path('tools/check-face-controls.mjs')
          text=checker.read_text(encoding='utf-8')
          anchor="  check(recipe.schema==='jarvis/face_control_recipe@1'&&recipe.status==='Candidate'&&!recipe.runtimeVerified&&!recipe.visualAcceptance,'explicit authored recipe and unverified acceptance');\n"
          extra="""  check(source.includes(\"const FACE_SCHEMA='jarvis/face_profile@2'\")&&source.includes(\"const FACE_IDENTITY_SCHEMA='jarvis/face_identity@1'\")&&source.includes(\"const FACE_EXPRESSION_SCHEMA='jarvis/face_expression@1'\"),'versioned identity and expression profiles');
          check(source.includes(\"const FACE_LEGACY_SCHEMA='jarvis/face_pose@1'\")&&source.includes(\"legacyOffsetsInterpretation:'neutral identity'\"),'legacy face-pose migration keeps an explicit assumption');
          check(source.includes('weights=pose.expression.weights,offsetsMm=pose.identity.neutralOffsetsMm'),'resolver composes fixed identity before transient expression');
          check(source.includes('identity:demo.saved.identity,expression:{weights:')&&source.includes('identity:saved.identity,expression:{weights:'),'demo and eased presets retain the current identity');
          check(source.includes('verifySeparation(){')&&source.includes('face-identities')&&source.includes('reset-identity'),'visible separation controls and invariant check');
          """
          if text.count(anchor)!=1: raise SystemExit('checker insertion anchor mismatch')
          checker.write_text(text.replace(anchor,anchor+extra,1),encoding='utf-8',newline='\n')

          test=r'''// Execute the versioned face-profile migration and identity/expression invariant.
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import vm from 'node:vm';
          const read=p=>readFileSync(new URL('../'+p,import.meta.url),'utf8');
          const source=read('body/FaceControls.js').replace('/*__FACE_RECIPE_JSON__*/',read('body/FaceControlRecipe.json'));
          const prefix=source.slice(0,source.indexOf('function faceChunkEligible'));
          const api=vm.runInNewContext(prefix+'\n({FACE_SCHEMA,FACE_IDENTITY_SCHEMA,FACE_EXPRESSION_SCHEMA,FACE_IDENTITY_PRESETS,validateFacePose,resolveFaceOffsets,interpolateFacePose})');
          const normal=value=>JSON.parse(JSON.stringify(value,(key,v)=>ArrayBuffer.isView(v)?Array.from(v):v));
          const legacy=api.validateFacePose({schema:'jarvis/face_pose@1',offsetsMm:{cheekLeft:[2,0,0],chin:[0,-1,1]},weights:{mouthSmileLeft:.7}});
          assert.equal(legacy.schema,'jarvis/face_profile@2');
          assert.equal(legacy.identity.schema,'jarvis/face_identity@1');
          assert.equal(legacy.expression.schema,'jarvis/face_expression@1');
          assert.deepEqual(normal(legacy.identity.neutralOffsetsMm),{cheekLeft:[2,0,0],chin:[0,-1,1]});
          assert.deepEqual(normal(legacy.expression.weights),{mouthSmileLeft:.7});
          const smile=api.validateFacePose({identity:legacy.identity,expression:{weights:{mouthSmileLeft:1,mouthSmileRight:1,cheekRaiseLeft:.8,cheekRaiseRight:.8}}});
          const halfway=api.interpolateFacePose(legacy,smile,.5),neutral=api.interpolateFacePose(smile,api.validateFacePose({identity:legacy.identity,expression:{weights:{}}}),1);
          assert.deepEqual(normal(halfway.identity),normal(legacy.identity),'expression interpolation must preserve identity');
          assert.deepEqual(normal(neutral.identity),normal(legacy.identity),'return to neutral must restore the same identity');
          assert.deepEqual(normal(neutral.expression.weights),{});
          const resolved=api.resolveFaceOffsets(neutral),cheekIndex=JSON.parse(read('body/FaceControlRecipe.json')).nodes.findIndex(n=>n.id==='cheekLeft')*3;
          assert(Math.abs(resolved.values[cheekIndex]-.002)<1e-7,'neutral identity offset reaches renderer uniforms');
          for(const preset of api.FACE_IDENTITY_PRESETS){const profile=api.validateFacePose({identity:{neutralOffsetsMm:preset.offsetsMm}});assert.equal(profile.schema,api.FACE_SCHEMA);for(const delta of Object.values(profile.identity.neutralOffsetsMm))assert(Math.hypot(...delta)<=6);}
          assert.throws(()=>api.validateFacePose({schema:'jarvis/face_profile@2',identity:{neutralOffsetsMm:{}},weights:{}}),/schema|未知字段/);
          assert.throws(()=>api.validateFacePose({identity:{neutralOffsetsMm:{unknown:[0,0,0]}}}),/局部控制点/);
          console.log(JSON.stringify({legacyMigrated:true,identityPreservedAcrossExpression:true,identityPresetCount:api.FACE_IDENTITY_PRESETS.length,rendererNeutralOffsetChecked:true,browserExecuted:false,gpuExecuted:false,visualAcceptance:false}));
          '''
          Path('tools/test-face-profile-separation.mjs').write_text(test,encoding='utf-8',newline='\n')

          docs=r'''# 面部固定身份与临时表情分层 R1

## 目的

此前 `appearance.face.offsetsMm` 和 `appearance.face.weights` 共用 `jarvis/face_pose@1`。切换表情预设时只生成新的 `weights`，会把人物原有脸型位移一起清空。本轮将人物长期中性脸与当前临时表情拆成两个子状态。

## 新数据结构

```json
{
  "schema": "jarvis/face_profile@2",
  "revision": "r3-independent-lip-opening",
  "identity": {
    "schema": "jarvis/face_identity@1",
    "neutralOffsetsMm": {}
  },
  "expression": {
    "schema": "jarvis/face_expression@1",
    "weights": {}
  }
}
```

`identity.neutralOffsetsMm` 保存人物长期长相；`expression.weights` 保存微笑、眨眼、皱眉、抿嘴等临时状态。渲染时先应用固定身份，再叠加临时表情。表情插值和恢复中性只处理 `expression`。

## 旧数据迁移

继续接受 `jarvis/face_pose@1` 与无 schema 的旧对象：

- `offsetsMm` 迁移到 `identity.neutralOffsetsMm`；
- `weights` 迁移到 `expression.weights`；
- 明确记录迁移假设为 `legacy offsets = neutral identity`。

旧文件无法证明每个历史位移最初是否属于身份或一次临时修形，因此这一解释是兼容性假设，不是事实复原。

## 页面检查

打开 `index.html?review=face` 会自动进入面部近景和面部设置。面板新增：

1. 参考、清瘦、宽阔、圆润、棱角五个中性脸起点；
2. 固定身份局部微调；
3. 独立的临时表情区；
4. “检查身份/表情分层”按钮。

建议先选一个明显的身份起点，再依次点击微笑、惊讶和中性。人物应始终回到该人物自己的中性脸，而不是公共参考脸。

## 已验证与未验证

源码检查、旧 schema 迁移、身份保持、NPC uniform 传递、装配构建和文件审计进入自动检查。浏览器中的真实外观仍需用户在固定预览页确认；本文件不把源码检查等同于视觉验收。
'''
          Path('docs/FACE_IDENTITY_EXPRESSION_SPLIT_R1.md').write_text(docs,encoding='utf-8',newline='\n')
