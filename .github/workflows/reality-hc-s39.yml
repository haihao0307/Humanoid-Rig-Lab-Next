name: Reality HC S3.9 endurance and cost
on:
  push:
    branches: [feature/reality-hc-s39-endurance-cost-20261021]
    paths: [.github/workflows/reality-hc-s39.yml, reality-lab/hc-s3-9/RUN_REQUEST.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: platform
          sparse-checkout: |
            reality-lab/hc-s3-6
            reality-lab/hc-s3-7
            reality-lab/hc-s3-8
            reality-lab/hc-s3-9
      - uses: actions/checkout@v4
        with:
          repository: haihao0307/guilin-dem-pipeline
          ref: c5c0bedbc35f24cbb35426ab9c14b74ca7fc5f49
          path: host
          sparse-checkout: kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
      - name: Verify syntax and frozen candidate module
        env:
          GARMENT_HOST: ${{ github.workspace }}/host/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
        run: |
          python - <<'PY'
          import ast,sys,os,subprocess
          from pathlib import Path
          r=Path('reality-lab/hc-s3-9');sys.path.insert(0,str(r.resolve()))
          for p in r.rglob('*.py'):ast.parse(p.read_text())
          from instrument import assemble
          q=r/'_syntax';q.mkdir(exist_ok=True)
          for v in ['baseline','coverage']:
            out,m=assemble(Path(os.environ['GARMENT_HOST']),v,'walk')
            for n,b in out.items():
              p=q/(v+'-'+n);p.write_bytes(b);subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Install pinned Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Execute two-cycle A/B without concurrent native cases
        env:
          GARMENT_HOST: ${{ github.workspace }}/host/kaopu-tailor-workbench/material-products/mp05-studio-r10-3fc034fa91ef
        run: python reality-lab/hc-s3-9/run_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf39-native-endurance
          path: platform/reality-lab/hc-s3-9/qa/native/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf39-native-source
          path: |
            platform/reality-lab/hc-s3-9/*.py
            platform/reality-lab/hc-s3-9/*.mjs
            platform/reality-lab/hc-s3-9/*.json
          retention-days: 7
