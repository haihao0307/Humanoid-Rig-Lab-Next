name: Face eye recess matrix

on:
  workflow_dispatch:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-eye-recess-matrix.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: recess-080
            recess: '.0008'
          - label: recess-120
            recess: '.0012'
          - label: recess-200
            recess: '.0020'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild the accepted R5 candidate patch
        shell: bash
        env:
          EYE_RECESS: ${{ matrix.recess }}
          VARIANT_LABEL: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, textwrap

          workflow=Path('.github/workflows/face-eye-integration-r5-candidate.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          patch=textwrap.dedent(workflow[start:end])
          exec(compile(patch,'r5-candidate-patch','exec'),{})

          path=Path('body/EyeAnatomy.js')
          text=path.read_text(encoding='utf-8')
          if text.count('recess:.0002')!=1:
              raise SystemExit('eye recess anchor mismatch')
          recess=os.environ['EYE_RECESS']
          label=os.environ['VARIANT_LABEL']
          text=text.replace('recess:.0002',f'recess:{recess}',1)
          text=text.replace("revision:'r13-compact-lid-orbit-blend'",f"revision:'r13-compact-lid-orbit-blend-{label}'",1)
          path.write_text(text,encoding='utf-8',newline='\n')
          PY
      - name: Build and validate
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hrl-eye-recess-server.log 2>&1 &
      - name: Capture fixed views
        shell: bash
        env:
          VARIANT_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p visual-review
          cat > capture-eye-recess.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const label=process.env.VARIANT_LABEL;
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1600,height:1200},deviceScaleFactor:1});
          const page=await context.newPage(),consoleMessages=[],pageErrors=[];
          page.on('console',message=>consoleMessages.push({type:message.type(),text:message.text()}));
          page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
          await page.goto('http://127.0.0.1:4173/index.html?review=face',{waitUntil:'domcontentloaded',timeout:120000});
          let frame=null;const deadline=Date.now()+420000;
          while(!frame&&Date.now()<deadline){for(const candidate of page.frames()){if(await candidate.evaluate(()=>Boolean(window.HumanLab?.face?.closeup)).catch(()=>false)){frame=candidate;break;}}if(!frame)await page.waitForTimeout(1000);}
          if(!frame)throw Error('Face review frame unavailable');
          await frame.waitForFunction(()=>window.__compactLoading?.state==='ready',null,{timeout:420000});
          await frame.waitForTimeout(5000);
          const canvas=frame.locator('canvas').first();await canvas.waitFor({state:'visible',timeout:30000});
          for(const view of ['front','side']){await frame.evaluate(v=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup(v);},view);await frame.waitForTimeout(1500);await canvas.screenshot({path:`visual-review/${label}-${view}.png`});}
          const diagnostics=await frame.evaluate(()=>{const report=window.HumanLab.face.report(),compact=window.HumanLab.compact?.report,gl=document.querySelector('canvas')?.getContext('webgl2');return {review:window.HumanLab.review,compactLoading:window.__compactLoading,startup:window.__humanStartup,eyeAnatomy:compact?.eyeAnatomy,faceAnatomy:compact?.faceAnatomy,separation:report.separation,limitedNodes:report.limitedNodes,renderer:{webglError:gl?gl.getError():null}};});
          await writeFile(`visual-review/${label}-diagnostics.json`,JSON.stringify({diagnostics,consoleMessages,pageErrors},null,2));
          await browser.close();
          JS
          node capture-eye-recess.mjs
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-eye-${{ matrix.label }}
          path: visual-review
          if-no-files-found: warn
          retention-days: 7
