name: Denim R16 exact render-cache parity and public performance
on:
  push:
    branches: [perf/denim-r16-render-path-20261014]
    paths: ['denim-workshop/r16/derive.py', 'denim-workshop/r16/qa.py', 'denim-workshop/r16/test-render.cjs', 'denim-workshop/r16/*.js', '.github/workflows/denim-r16-performance.yml']
permissions:
  contents: write
concurrency:
  group: denim-r16-render-path
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: denim-workshop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Derive once and prove protected sources and filter algebra
        run: |
          test -f denim-workshop/r16/app.js || python denim-workshop/r16/derive.py
          python denim-workshop/r16/build.py
          for f in denim-workshop/r16/*.js; do node --check "$f"; done
          node denim-workshop/r16/test-render.cjs
          python -m py_compile denim-workshop/r16/qa.py
          git diff --exit-code HEAD -- denim-workshop/r15 denim-workshop/r14 denim-workshop/archives
      - name: Install independent pinned browser
        run: |
          pip install playwright==1.55.0 pillow==11.3.0 numpy==2.2.6
          python -m playwright install --with-deps chromium
      - name: Actual file rendering, reference pixels and full motion comparison
        run: xvfb-run -a python -u denim-workshop/r16/qa.py
      - name: Publish only file-tested candidate
        id: publish
        run: |
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('denim-workshop/r16');assert json.loads((p/'evidence/file-qa.json').read_text())['passed']
          files=[str(f) for f in p.iterdir() if f.is_file() and f.suffix in ['.js','.py','.c','.cjs','.json','.html','.md','.wasm']]+[str(p/'LICENSE')]
          subprocess.run(['git','add','--',*files],check=True)
          PY
          git commit -m 'build(denim): file-tested R16 exact render reuse [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          PUB=$(git rev-parse HEAD)
          echo "commit=$PUB" >> "$GITHUB_OUTPUT"
          echo "url=https://htmlpreview.github.io/?https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PUB}/denim-workshop/r16/index.html" >> "$GITHUB_OUTPUT"
      - name: Actual immutable public viewport and live controls
        env:
          PUBLIC_URL: ${{ steps.publish.outputs.url }}
        run: xvfb-run -a python -u denim-workshop/r16/qa.py --public "$PUBLIC_URL"
      - name: Verify bytes and write scoped performance receipt
        env:
          PUBLIC_BUILD: ${{ steps.publish.outputs.commit }}
          PUBLIC_URL: ${{ steps.publish.outputs.url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib,urllib.request
          p=Path('denim-workshop/r16');f=json.loads((p/'evidence/file-qa.json').read_text());u=json.loads((p/'evidence/public-qa.json').read_text());unit=json.loads((p/'RENDER_UNIT_QA.json').read_text());m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert f['passed'] and u['passed'] and unit['passed']
          raw='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['PUBLIC_BUILD']+'/denim-workshop/r16/index.html'
          with urllib.request.urlopen(raw,timeout=90) as resp:data=resp.read();assert resp.status==200
          assert data==(p/'index.html').read_bytes() and hashlib.sha256(data).hexdigest()==m['sha256']
          def summary(r):
              return {'passed':r['passed'],'comparisons':r['comparisons'],'benchmarks':r['benchmarks'],'states':[s['name'] for s in r['states']],'network':r['network'],'maxTrackedGpuBytes':max(s['frame']['performance']['trackedGpuBytes'] for s in r['states']),'maxCacheBytes':max((s.get('cache') or {}).get('bytes',0) for s in r['states'])}
          rec={'version':'R16.0','status':'PUBLIC_VERIFIED_60FPS_NOT_CERTIFIED','publicVerified':True,'publicBytesMatch':True,'sixtyFPSAccepted':False,'consumerGPUVerified':False,'userVisualApproved':False,'sourceCommit':os.environ['GITHUB_SHA'],'parentSource':'895bf144e2a8e70b86f7f15cfeaedba2b4415170','buildCommit':os.environ['PUBLIC_BUILD'],'publicUrl':os.environ['PUBLIC_URL'],'workflow':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'manifest':m,'unit':unit,'browser':{'file':summary(f),'public':summary(u)},'limits':['Software Chromium/SwiftShader, not consumer hardware','390x844 viewport is not real phone','FPS uses original complete-wall-window GPU-fence observations, not screen capture','Cached physical vertex values are not prerecorded motion or interpolated reduced physics','Added bounded GPU memory; prior fixed-swatch, unmeasured physics and incomplete CCD limits retained','Old versions and other workbenches unchanged; no merge or force push']}
          (p/'DELIVERY_RECEIPT.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2))
          PY
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$PUBLIC_BUILD"
          git add denim-workshop/r16/DELIVERY_RECEIPT.json
          git commit -m 'docs(denim): R16 verified public bytes and measured performance limits [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: denim-r16-render-evidence
          path: denim-workshop/r16
          retention-days: 14
