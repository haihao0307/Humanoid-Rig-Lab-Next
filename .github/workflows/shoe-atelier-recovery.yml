name: Shoe Atelier Recovery
on:
  push:
    branches: [feature/shoe-atelier-r01-20261010]
    paths: ['.github/workflows/shoe-atelier-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shoe-atelier-r01-20261010
          sparse-checkout: |
            shoe-workshop/r01
            .github/workflows/shoe-atelier-r01.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p /tmp/shoe-recovery
          cp -r shoe-workshop/r01 /tmp/shoe-recovery/r01
          cp .github/workflows/shoe-atelier-r01.yml /tmp/shoe-recovery/
          cd /tmp/shoe-recovery
          npm init -y >/dev/null
          npm install --save-exact esbuild@0.25.10 playwright@1.56.0
          tar -czf /tmp/shoe-recovery.tgz -C /tmp shoe-recovery
      - uses: actions/upload-artifact@v4
        with:
          name: shoe-atelier-recovery
          path: /tmp/shoe-recovery.tgz
          retention-days: 7
