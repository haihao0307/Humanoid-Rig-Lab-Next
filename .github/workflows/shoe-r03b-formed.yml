name: Shoe R03-B formed panels
on:
  push:
    branches: [feature/shoe-r03b-formed-panels-20261011]
    paths: ['shoe-workshop/r03b/**', '.github/workflows/shoe-r03b-formed.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shoe-r03b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            shoe-workshop/r02
            shoe-workshop/r03
            shoe-workshop/r03b
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install pinned source readers and browser
        run: |
          pip install rhino3dm==8.17.0 numpy==2.3.5 shapely==2.1.2
          npm install --prefix shoe-workshop --no-save --package-lock=false three@0.179.1 esbuild@0.25.10 playwright@1.56.0
          cd shoe-workshop && npx playwright install --with-deps chromium
      - name: Read actual original CAD, not guessed assembly
        run: |
          mkdir -p shoe-workshop/r03b/intake
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json, rhino3dm as r
          dest=pathlib.Path('shoe-workshop/r03b/intake')
          root='https://raw.githubusercontent.com/saraalvin/SymbioticShoes/69e98e7f2e576cea09ef0bcb117b52d4f1cdabb6/'
          locks={'ClassicDerby_EU39.3dm':'5fcf227ca1fb8ec4d6fc61c7175a5ec17f8aec98b054d5f11f0bd2aa00076688','Parametric shoe last.3dm':'820284e4e8e8eeb0a80d8aaf9b910c35787280e639f5b09e03fe54201e2ee927'}
          summary={}
          def xyz(v): return [v.X,v.Y,v.Z]
          for name,digest in locks.items():
              raw=urllib.request.urlopen(root+urllib.parse.quote(name)).read()
              assert hashlib.sha256(raw).hexdigest()==digest
              (dest/name).write_bytes(raw)
              model=r.File3dm.Read(str(dest/name)); rows=[]; geometry=[]
              for i,obj in enumerate(model.Objects):
                  g=obj.Geometry; row={'objectIndex':i,'id':str(obj.Attributes.Id),'name':obj.Attributes.Name,'layer':model.Layers[obj.Attributes.LayerIndex].Name,'type':type(g).__name__,'bbox':[xyz(g.GetBoundingBox().Min),xyz(g.GetBoundingBox().Max)]}
                  item=dict(row)
                  try:
                      meshes=[f.GetMesh(r.MeshType.Any) for f in g.Faces] if isinstance(g,r.Brep) else [g] if isinstance(g,r.Mesh) else []
                      pos=[];ind=[]
                      for m in meshes:
                          if m is None: continue
                          off=len(pos)//3;pos.extend(x for p in m.Vertices for x in xyz(p))
                          for f in m.Faces:
                              a,b,c,d=map(int,f);ind.extend([off+a,off+b,off+c])
                              if c!=d:ind.extend([off+a,off+c,off+d])
                      if pos: item.update(positions=pos,indices=ind);row.update(vertices=len(pos)//3,triangles=len(ind)//3)
                      if isinstance(g,r.Curve):
                          row['closed']=g.IsClosed
                          item['points']=[xyz(g.PointAt(g.Domain.T0+(g.Domain.T1-g.Domain.T0)*j/512)) for j in range(513)]
                  except Exception as e: row['readError']=str(e)
                  rows.append(row);geometry.append(item)
              summary[name]={'sha256':digest,'units':str(model.Settings.ModelUnitSystem),'objects':rows}
              (dest/(name+'.json')).write_text(json.dumps(geometry,separators=(',',':')))
          (dest/'INVENTORY.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Current source build and verification
        id: build
        run: |
          if [ -f shoe-workshop/r03b/tools/build.mjs ]; then
            node shoe-workshop/r03b/tests/kernel.mjs
            node shoe-workshop/r03b/tools/build.mjs
            node shoe-workshop/r03b/tests/browser.mjs
            echo 'built=true' >> "$GITHUB_OUTPUT"
          else
            echo 'built=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish candidate without changing earlier workbenches
        if: steps.build.outputs.built == 'true'
        id: publish
        run: |
          git config user.name 'Shoe R03B Build'
          git config user.email 'shoe-r03b@users.noreply.github.com'
          git add shoe-workshop/r03b/public-lite.html shoe-workshop/r03b/BUILD_MANIFEST.json shoe-workshop/r03b/evidence
          git diff --cached --name-only | grep -v '^shoe-workshop/r03b/' && exit 1 || true
          git commit -m 'build(shoes): R03-B formed panel candidate and numeric/browser evidence [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
          BUILD_SHA=$(git rev-parse HEAD)
          echo "sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "https://htmlpreview.github.io/?https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$BUILD_SHA/shoe-workshop/r03b/public-lite.html" > shoe-workshop/r03b/PUBLIC_URL.txt
      - name: Verify actual fixed public build
        if: steps.build.outputs.built == 'true'
        env:
          PUBLIC_BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          node shoe-workshop/r03b/tests/browser.mjs --public
          git add shoe-workshop/r03b/PUBLIC_URL.txt shoe-workshop/r03b/evidence/public
          git commit -m 'test(shoes): R03-B exact public bytes and browser receipt [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Preserve evidence and research inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoe-r03b-${{ github.run_id }}
          path: |
            shoe-workshop/r03b/
            shoe-workshop/node_modules/three/
            shoe-workshop/node_modules/esbuild/
            shoe-workshop/node_modules/@esbuild/
          retention-days: 14
