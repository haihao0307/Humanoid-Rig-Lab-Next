name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python tools
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test
          if [ -f Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py ]; then
            python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py
            python Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py --self-test
          fi

      - name: JSON and JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          json_files = [
              root / 'original-bird-kernel.schema.json',
              root / 'original-bird-anatomy-landmarks.schema.json',
              root / 'original-bird-reference-measurements.r001.json',
              root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json',
              root / 'distilled/COLUMBID_REALISM_TARGET_R005.json',
              root / 'distilled/COLUMBID_SOURCE_RUNTIME_BRIDGE_R006.json',
              root / 'distilled/COLUMBID_SEMANTIC_MAP_R007.json',
              root / 'distilled/COLUMBID_MATERIAL_ROLE_MAP_R008.json',
              root / 'distilled/COLUMBID_FIXED_VIEW_BASELINE_R010.json',
              root / 'distilled/COLUMBID_3A_GAME_ASSET_STANDARD_R011.json',
              root / 'distilled/COLUMBID_FEATHER_ALPHA_EDGE_R012.json',
              root / 'CURRENT_STATUS.json',
          ]
          for p in json_files:
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON_OK', p)
          html_files = [
              root / 'workbench/original-bird-source-measure-r006.html',
              root / 'workbench/original-bird-semantic-map-r007.html',
              root / 'workbench/original-bird-material-audit-r008.html',
              root / 'workbench/original-bird-fixed-view-baseline-r010.html',
              root / 'workbench/original-bird-3a-quality-gate-r011.html',
              root / 'workbench/original-bird-feather-alpha-r012.html',
              root / 'workbench/original-bird-production-hub-r012.html',
          ]
          for p in html_files:
              text = p.read_text(encoding='utf-8')
              scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not scripts:
                  raise SystemExit('NO_INLINE_SCRIPT ' + str(p))
              out = pathlib.Path('/tmp') / (p.stem + '.js')
              out.write_text('\n'.join(scripts), encoding='utf-8')
              print('SCRIPT_EXTRACTED', out)
          PY
          for f in /tmp/original-bird-*.js; do node --check "$f"; done

      - name: R0.12 feather-alpha production guards
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('Bird-Reconstruction-Lab/original-bird')

          for rejected in (
              root / 'workbench/original-bird-columbid-form-r003.html',
              root / 'workbench/original-bird-studio-review-r006.html',
          ):
              if rejected.exists():
                  raise SystemExit('REJECTED_FILE_REAPPEARED ' + str(rejected))

          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          if status.get('revision') != 'R0.12-feather-alpha-edge-calibration':
              raise SystemExit('R012_STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not False or status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('INDEPENDENT_BIRD_GATE_INVALID')
          hub = status.get('productionHub', {})
          alpha_status = status.get('featherAlphaEdge', {})
          if hub.get('revision') != 'R0.12' or hub.get('singleEntry') is not True or hub.get('blackModelBackgroundRemoved') is not True:
              raise SystemExit('R012_HUB_STATUS_INVALID')
          if alpha_status.get('revision') != 'R0.12' or alpha_status.get('generated') is not True:
              raise SystemExit('R012_ALPHA_STATUS_INVALID')
          if alpha_status.get('runtimeAlphaMaskApplied') is not False or alpha_status.get('allCriticalAlphaGatesPassed') is not False:
              raise SystemExit('R012_ALPHA_ACCEPTANCE_MUST_REMAIN_FALSE')
          if status['primaryVisibleRigReference']['assetId'] != 'BIRD-REF-002' or status['primaryMotionRigReference']['assetId'] != 'BIRD-REF-001':
              raise SystemExit('SOURCE_PAIR_CHANGED')

          alpha = json.loads((root / 'distilled/COLUMBID_FEATHER_ALPHA_EDGE_R012.json').read_text(encoding='utf-8'))
          zones = alpha['correctionModel']['zones']
          gates = alpha['qualityGates']
          if len(zones) != 4 or len(gates) != 7 or len([g for g in gates if g['critical']]) != 6:
              raise SystemExit('R012_ALPHA_CONTRACT_STRUCTURE_INVALID')
          if {z['id'] for z in zones} != {'VOID','BARB_FRINGE','VANE_CORE','RACHIS_SHAFT'}:
              raise SystemExit('R012_ALPHA_ZONE_SET_INVALID')
          if alpha['openGates']['runtimeAlphaMaskApplied'] is not False or alpha['openGates']['allCriticalAlphaGatesPassed'] is not False:
              raise SystemExit('R012_ALPHA_CONTRACT_GATE_INVALID')

          standard = json.loads((root / 'distilled/COLUMBID_3A_GAME_ASSET_STANDARD_R011.json').read_text(encoding='utf-8'))
          domains = standard['qualityDomains']
          all_gates = [g for d in domains for g in d['gates']]
          if len(domains) != 6 or len(all_gates) != 30 or sum(d['weight'] for d in domains) != 100:
              raise SystemExit('R011_3A_STANDARD_CHANGED')

          alpha_path = root / 'workbench/original-bird-feather-alpha-r012.html'
          hub_path = root / 'workbench/original-bird-production-hub-r012.html'
          alpha_text = alpha_path.read_text(encoding='utf-8')
          hub_text = hub_path.read_text(encoding='utf-8')
          for token in (
              '821135a09d3f48909b977a416d99c93b',
              'channels?.Opacity',
              'addTexture',
              'setMaterial',
              'generateMask',
              'maskCanvas',
              'BARB_FRINGE',
              'studio:[.72,.77,.79]',
              'sky:[.47,.67,.82]',
              'warm:[.72,.66,.57]',
              'PHASES=[0,.125,.25,.375,.5,.625,.75,.875]',
              'original-bird-r012-feather-alpha-mask.png',
              'original-bird-r012-feather-alpha.json',
              'feather alpha-edge calibration',
          ):
              if token not in alpha_text:
                  raise SystemExit('R012_ALPHA_TOKEN_MISSING ' + token)
          for token in (
              'original-bird-feather-alpha-r012.html',
              'original-bird-3a-quality-gate-r011.html',
              'CURRENT_STATUS.json',
              'single-entry',
              'Original Bird R0.12',
          ):
              if token not in hub_text:
                  raise SystemExit('R012_HUB_TOKEN_MISSING ' + token)

          files_to_scan = [alpha_path, hub_path]
          for token in ('data-bg="dark"', "state.background='dark'", 'new THREE.SphereGeometry', 'deformedBodyGeometry', 'original-bird-columbid-form-r003'):
              for p in files_to_scan:
                  if token in p.read_text(encoding='utf-8'):
                      raise SystemExit('FORBIDDEN_TOKEN ' + token + ' in ' + str(p))
          print('R012_FEATHER_ALPHA_EDGE_GUARDS_OK')
