name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python tools
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test
          if [ -f Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py ]; then
            python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py
            python Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py --self-test
          fi
      - name: Validate R0.12.3 files
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          for p in [
              root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json',
              root / 'distilled/COLUMBID_3A_GAME_ASSET_STANDARD_R011.json',
              root / 'distilled/COLUMBID_FEATHER_ALPHA_AUTO_EXTRACT_R0122.json',
              root / 'distilled/COLUMBID_MOBILE_UI_R0123.json',
              root / 'CURRENT_STATUS.json',
          ]:
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON_OK', p)
          for p in [
              root / 'workbench/original-bird-feather-alpha-r0122.html',
              root / 'workbench/original-bird-feather-alpha-mobile-r0123.html',
              root / 'workbench/original-bird-production-hub-r0123.html',
          ]:
              text = p.read_text(encoding='utf-8')
              scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not scripts:
                  raise SystemExit('NO_INLINE_SCRIPT ' + str(p))
              out = pathlib.Path('/tmp') / (p.stem + '.js')
              out.write_text('\n'.join(scripts), encoding='utf-8')
              print('SCRIPT_EXTRACTED', out)
          PY
          node --check /tmp/original-bird-feather-alpha-r0122.js
          node --check /tmp/original-bird-feather-alpha-mobile-r0123.js
          node --check /tmp/original-bird-production-hub-r0123.js
      - name: R0.12.3 mobile production guards
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('Bird-Reconstruction-Lab/original-bird')
          for rejected in (root / 'workbench/original-bird-columbid-form-r003.html', root / 'workbench/original-bird-studio-review-r006.html'):
              if rejected.exists():
                  raise SystemExit('REJECTED_FILE_REAPPEARED ' + str(rejected))
          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          if status.get('revision') != 'R0.12.3-touch-first-mobile-production-ui':
              raise SystemExit('R0123_STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not False or status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('INDEPENDENT_BIRD_GATE_INVALID')
          hub = status.get('productionHub', {})
          mobile = status.get('mobileMode', {})
          alpha = status.get('featherAlphaAutoExtract', {})
          if hub.get('revision') != 'R0.12.3' or hub.get('singleEntry') is not True or hub.get('mobileFirst') is not True:
              raise SystemExit('R0123_HUB_STATUS_INVALID')
          if mobile.get('revision') != 'R0.12.3' or mobile.get('generated') is not True:
              raise SystemExit('R0123_MOBILE_STATUS_INVALID')
          if alpha.get('generated') is not True or alpha.get('visibleDifferenceVerified') is not False:
              raise SystemExit('R0123_ALPHA_GATE_INVALID')
          if status['primaryVisibleRigReference']['assetId'] != 'BIRD-REF-002' or status['primaryMotionRigReference']['assetId'] != 'BIRD-REF-001':
              raise SystemExit('SOURCE_PAIR_CHANGED')
          contract = json.loads((root / 'distilled/COLUMBID_MOBILE_UI_R0123.json').read_text(encoding='utf-8'))
          if contract['target']['primaryViewport'] != '390x844 portrait':
              raise SystemExit('MOBILE_TARGET_CHANGED')
          if contract['target']['minimumTouchTargetPx'] != 44 or contract['target']['safeAreaInsets'] is not True:
              raise SystemExit('MOBILE_TOUCH_OR_SAFE_AREA_INVALID')
          if contract['alphaWorkbench']['defaultViewer'] != 'calibrated alpha result':
              raise SystemExit('MOBILE_DEFAULT_VIEWER_INVALID')
          if contract['openGates']['iphonePortraitVisualQaPassed'] is not False or contract['openGates']['visualAcceptance'] is not False:
              raise SystemExit('MOBILE_ACCEPTANCE_GATE_INVALID')
          lab = root / 'workbench/original-bird-feather-alpha-mobile-r0123.html'
          hub_path = root / 'workbench/original-bird-production-hub-r0123.html'
          lab_text = lab.read_text(encoding='utf-8')
          hub_text = hub_path.read_text(encoding='utf-8')
          for token in ('height:100dvh','env(safe-area-inset-bottom)','min-height:44px','class="viewer after show"','data-mode="before"','data-mode="after"','paramsSheet','auditSheet','openSheet',"setMode('after')","setView('wingtip')",'getTextureList','deriveMask','changedRatio','original-bird-r0123-mobile-alpha-report.json'):
              if token not in lab_text:
                  raise SystemExit('R0123_MOBILE_LAB_TOKEN_MISSING ' + token)
          for token in ('height:100dvh','env(safe-area-inset-bottom)','min-height:44px','stageDrawer','statusDrawer','original-bird-feather-alpha-mobile-r0123.html',"let active='alpha'",'single-entry-mobile-first'):
              if token not in hub_text:
                  raise SystemExit('R0123_HUB_TOKEN_MISSING ' + token)
          for token in ('data-bg="dark"', "state.background='dark'", 'new THREE.SphereGeometry', 'deformedBodyGeometry', 'original-bird-columbid-form-r003'):
              for p in (lab, hub_path):
                  if token in p.read_text(encoding='utf-8'):
                      raise SystemExit('FORBIDDEN_TOKEN ' + token + ' in ' + str(p))
          print('R0123_TOUCH_FIRST_MOBILE_GUARDS_OK')
