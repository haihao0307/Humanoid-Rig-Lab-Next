name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python tools
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test
          if [ -f Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py ]; then
            python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py
            python Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py --self-test
          fi

      - name: JSON and workbench syntax
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          json_files = [
              root / 'original-bird-kernel.schema.json',
              root / 'original-bird-anatomy-landmarks.schema.json',
              root / 'original-bird-reference-measurements.r001.json',
              root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json',
              root / 'distilled/COLUMBID_REALISM_TARGET_R005.json',
              root / 'distilled/COLUMBID_SOURCE_RUNTIME_BRIDGE_R006.json',
              root / 'distilled/COLUMBID_SEMANTIC_MAP_R007.json',
              root / 'distilled/COLUMBID_MATERIAL_ROLE_MAP_R008.json',
              root / 'distilled/COLUMBID_FIXED_VIEW_BASELINE_R010.json',
              root / 'CURRENT_STATUS.json',
          ]
          for p in json_files:
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON_OK', p)
          html_files = [
              root / 'workbench/original-bird-columbid-skeleton-r002.html',
              root / 'workbench/original-bird-glb-source-review-r004.html',
              root / 'workbench/original-bird-source-beauty-r005.html',
              root / 'workbench/original-bird-source-measure-r006.html',
              root / 'workbench/original-bird-semantic-map-r007.html',
              root / 'workbench/original-bird-material-audit-r008.html',
              root / 'workbench/original-bird-fixed-view-baseline-r010.html',
              root / 'workbench/original-bird-production-hub-r010.html',
          ]
          for p in html_files:
              text = p.read_text(encoding='utf-8')
              scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not scripts:
                  raise SystemExit('NO_INLINE_SCRIPT ' + str(p))
              out = pathlib.Path('/tmp') / (p.stem + '.js')
              out.write_text('\n'.join(scripts), encoding='utf-8')
              print('SCRIPT_EXTRACTED', out)
          PY
          for f in /tmp/original-bird-*.js; do node --check "$f"; done

      - name: R0.10 production guards
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('Bird-Reconstruction-Lab/original-bird')

          for rejected in (
              root / 'workbench/original-bird-columbid-form-r003.html',
              root / 'workbench/original-bird-studio-review-r006.html',
          ):
              if rejected.exists():
                  raise SystemExit('REJECTED_FILE_REAPPEARED ' + str(rejected))

          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          if status.get('revision') != 'R0.10-fixed-view-source-baseline':
              raise SystemExit('R010_STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not False or status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('INDEPENDENT_BIRD_GATE_INVALID')
          hub = status.get('productionHub', {})
          fixed = status.get('fixedViewBaselineWorkbench', {})
          if hub.get('revision') != 'R0.10' or hub.get('singleEntry') is not True or hub.get('blackModelBackgroundRemoved') is not True:
              raise SystemExit('R010_HUB_STATUS_INVALID')
          if fixed.get('revision') != 'R0.10' or fixed.get('generated') is not True or fixed.get('blackModelBackgroundRemoved') is not True:
              raise SystemExit('R010_FIXED_VIEW_STATUS_INVALID')

          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          by_id = {r['assetId']: r for r in batch['records']}
          if len(batch['records']) != 7 or len([r for r in batch['records'] if r['assetId'].startswith('BIRD-REF-')]) != 6:
              raise SystemExit('SOURCE_BATCH_COUNT_INVALID')
          if by_id['BIRD-REF-002']['counts']['vertices'] != 18152 or by_id['BIRD-REF-002']['counts']['joints'] != 117:
              raise SystemExit('DETAIL_REFERENCE_CHANGED')
          if by_id['BIRD-REF-001']['counts']['joints'] != 44 or by_id['BIRD-REF-001']['skeleton']['semanticCounts']['wing'] != 10:
              raise SystemExit('MOTION_REFERENCE_CHANGED')

          paths = {
              'r006': root / 'workbench/original-bird-source-measure-r006.html',
              'r007': root / 'workbench/original-bird-semantic-map-r007.html',
              'r008': root / 'workbench/original-bird-material-audit-r008.html',
              'r010baseline': root / 'workbench/original-bird-fixed-view-baseline-r010.html',
              'r010hub': root / 'workbench/original-bird-production-hub-r010.html',
          }
          texts = {k: p.read_text(encoding='utf-8') for k, p in paths.items()}
          required = {
              'r006': ('821135a09d3f48909b977a416d99c93b','67f9422072664cf1967ae4fe440585a9','双点测量','capturePhase','original-bird-r006-motion-phase.json'),
              'r007': ('COLUMBID_SEMANTIC_MAP_R007.json','canonicalRole','seedKnown','original-bird-r007-semantic-map.json'),
              'r008': ('COLUMBID_MATERIAL_ROLE_MAP_R008.json','getMaterialList','setMaterial','RoughnessPBR','MetalnessPBR','SpecularF0','resetAll'),
              'r010baseline': ('821135a09d3f48909b977a416d99c93b','getScreenShot','front','side','top','three_quarter','maskMetrics','IoU','original-bird-r010-fixed-view-baseline.json','fixed-view baseline runtime'),
              'r010hub': ('original-bird-source-measure-r006.html','original-bird-semantic-map-r007.html','original-bird-material-audit-r008.html','original-bird-fixed-view-baseline-r010.html','CURRENT_STATUS.json','unified production hub','single-entry'),
          }
          for stage, tokens in required.items():
              for token in tokens:
                  if token not in texts[stage]:
                      raise SystemExit(stage.upper() + '_TOKEN_MISSING ' + token)
          for token in ('data-bg="dark"',"state.background='dark'",'new THREE.SphereGeometry','deformedBodyGeometry','original-bird-columbid-form-r003'):
              if any(token in text for text in texts.values()):
                  raise SystemExit('FORBIDDEN_TOKEN ' + token)

          semantic = json.loads((root / 'distilled/COLUMBID_SEMANTIC_MAP_R007.json').read_text(encoding='utf-8'))
          material = json.loads((root / 'distilled/COLUMBID_MATERIAL_ROLE_MAP_R008.json').read_text(encoding='utf-8'))
          baseline = json.loads((root / 'distilled/COLUMBID_FIXED_VIEW_BASELINE_R010.json').read_text(encoding='utf-8'))
          if len(semantic['candidateMappings']) < 30 or semantic['openGates']['semanticMappingProductionReady'] is not False:
              raise SystemExit('SEMANTIC_GATE_INVALID')
          required_roles = {'feather_body','feather_wing','feather_tail','eye_cornea','eye_iris','beak_keratin','foot_keratin_skin','unknown'}
          if set(material['roles']) != required_roles or material['openGates']['independentCommercialSafeMaterialGenerated'] is not False:
              raise SystemExit('MATERIAL_GATE_INVALID')
          if baseline['source']['assetId'] != 'BIRD-REF-002' or len(baseline['capture']['views']) != 4:
              raise SystemExit('FIXED_VIEW_BASELINE_INVALID')
          if baseline['openGates']['candidateFourViewCaptureComplete'] is not False or baseline['openGates']['visualAcceptance'] is not False:
              raise SystemExit('FIXED_VIEW_ACCEPTANCE_GATE_INVALID')
          print('R010_FIXED_VIEW_PRODUCTION_GUARDS_OK')
