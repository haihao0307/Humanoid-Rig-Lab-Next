name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tool self-tests
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test
      - name: R0.15 structure and evidence gates
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          contract = json.loads((root / 'distilled/LARID_ORIGINAL_BIRD_C_DRAFT_R015.json').read_text(encoding='utf-8'))
          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          kernel = root / 'runtime/original-bird-c-kernel-r015.js'
          lab = root / 'workbench/original-bird-seagull-c-draft-r015.html'
          hub = root / 'workbench/original-bird-production-hub-r015.html'
          source_lab = root / 'workbench/original-bird-seagull-phase1-r014.html'
          kernel_text = kernel.read_text(encoding='utf-8')
          lab_text = lab.read_text(encoding='utf-8')
          hub_text = hub.read_text(encoding='utf-8')

          if status.get('revision') != 'R0.15-larid-original-bird-c-draft':
              raise SystemExit('STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not True or status.get('visualBirdClassification') != 'INDEPENDENT_C_DRAFT_NOT_VISUAL_ACCEPTANCE':
              raise SystemExit('C_DRAFT_VISUAL_CLASSIFICATION_INVALID')
          if status.get('continuousSurfaceBirdGenerated') is not True:
              raise SystemExit('CONTINUOUS_SURFACE_STATUS_INVALID')
          if status['productionHub']['revision'] != 'R0.15' or status['productionHub']['defaultMobileStage'] != 'c':
              raise SystemExit('HUB_STATUS_INVALID')
          c = status.get('laridCDraft', {})
          if c.get('kernelGenerated') is not True or c.get('fixedVertexArrayStored') is not False or c.get('fixedTriangleArrayStored') is not False:
              raise SystemExit('C_DRAFT_REPRESENTATION_INVALID')
          if c.get('sourceRuntimeDependency') is not False or c.get('exactSpecies') != 'UNRESOLVED' or c.get('realScaleStatus') != 'UNKNOWN':
              raise SystemExit('C_DRAFT_EVIDENCE_BOUNDARY_INVALID')
          if c.get('visualAcceptance') is not False or c.get('productionReady') is not False:
              raise SystemExit('C_DRAFT_ACCEPTANCE_GATE_INVALID')

          by_id = {r['assetId']: r for r in batch['records']}
          if by_id['BIRD-REF-004']['counts']['joints'] != 15 or by_id['BIRD-REF-005']['counts']['joints'] != 21:
              raise SystemExit('SEAGULL_SOURCE_PAIR_CHANGED')
          if contract['representation']['fixedVertexArrayStored'] is not False or contract['representation']['fixedTriangleArrayStored'] is not False:
              raise SystemExit('CONTRACT_FIXED_TOPOLOGY_INVALID')
          if contract['method']['runtimeDependencyOnSourceGlb'] is not False or contract['method']['unknownRemainsUnknown'] is not True:
              raise SystemExit('CONTRACT_KAOPU_BOUNDARY_INVALID')
          if contract['sourceGuidance']['primary']['assetId'] != 'BIRD-REF-004' or contract['sourceGuidance']['secondary']['assetId'] != 'BIRD-REF-005':
              raise SystemExit('CONTRACT_SOURCE_PAIR_CHANGED')
          if contract['coordinateSystem']['realScaleStatus'] != 'UNKNOWN' or contract['projectUse']['exactSpecies'] != 'UNRESOLVED':
              raise SystemExit('SCALE_OR_SPECIES_BOUNDARY_CHANGED')
          if contract['domains']['legFoot']['status'] != 'UNKNOWN_BLOCKED':
              raise SystemExit('LEG_FOOT_UNKNOWN_GATE_CHANGED')
          if len(contract['semanticAnchors']) != 9:
              raise SystemExit('SEMANTIC_ANCHOR_COUNT_CHANGED')

          required_kernel = (
              'DEFAULT_LARID_C_PROFILE','evaluateBody','evaluateWing','adaptiveParameters',
              'buildLaridDisplay','semanticAnchors','exportKaopuCProfile',
              "representation:'continuous-functions-sampled-in-memory'",
              'sourceTopologyDependency:false','fixedVertexArrayStored:false','fixedTriangleArrayStored:false'
          )
          for token in required_kernel:
              if token not in kernel_text:
                  raise SystemExit('KERNEL_TOKEN_MISSING ' + token)
          required_lab = (
              'dc42ffc81c86480e9e7f7752fa134174',
              '../runtime/original-bird-c-kernel-r015.js',
              'buildLaridDisplay','exportKaopuCProfile','verifyIndependence',
              'preview','balanced','close','sourceTopologyDependency',
              'original-bird-r015-larid-c-draft.kaopu',
              'Stone Money Island','UNKNOWN'
          )
          for token in required_lab:
              if token not in lab_text:
                  raise SystemExit('LAB_TOKEN_MISSING ' + token)
          required_hub = (
              'original-bird-seagull-c-draft-r015.html',
              "let active='c'",
              'continuous profile','single-entry-mobile-first'
          )
          for token in required_hub:
              if token not in hub_text:
                  raise SystemExit('HUB_TOKEN_MISSING ' + token)
          if not source_lab.exists():
              raise SystemExit('R014_SOURCE_WORKBENCH_MISSING')
          for token in ('new THREE.SphereGeometry','deformedBodyGeometry','original-bird-columbid-form-r003'):
              if token in kernel_text or token in lab_text or token in hub_text:
                  raise SystemExit('FORBIDDEN_TOKEN ' + token)

          for p in (lab, hub):
              text = p.read_text(encoding='utf-8')
              scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not scripts:
                  raise SystemExit('NO_INLINE_SCRIPT ' + str(p))
              out = pathlib.Path('/tmp') / (p.stem + '.mjs')
              out.write_text('\n'.join(scripts), encoding='utf-8')
              print('SCRIPT_EXTRACTED', out)
          print('R015_STRUCTURE_GATES_OK')
      - name: R0.15 kernel runtime and sampling independence
        shell: bash
        run: |
          cp Bird-Reconstruction-Lab/original-bird/runtime/original-bird-c-kernel-r015.js /tmp/original-bird-c-kernel-r015.mjs
          node --input-type=module - <<'NODE'
          import {cloneProfile,buildLaridDisplay,exportKaopuCProfile} from 'file:///tmp/original-bird-c-kernel-r015.mjs';
          const profile=cloneProfile();
          const results=['preview','balanced','close'].map(q=>buildLaridDisplay(profile,q));
          const counts=new Set(results.map(r=>`${r.stats.vertices}/${r.stats.triangles}`));
          if(counts.size!==3)throw new Error('DISPLAY_COUNTS_DO_NOT_CHANGE_WITH_TOLERANCE');
          for(const r of results){
            if(r.sourceTopologyDependency!==false)throw new Error('SOURCE_TOPOLOGY_DEPENDENCY_REGRESSION');
            if(r.stats.vertices<=0||r.stats.triangles<=0)throw new Error('EMPTY_DISPLAY_SAMPLE');
            if(Object.keys(r.anchors).length!==9)throw new Error('ANCHOR_COUNT_REGRESSION');
          }
          const keys=Object.keys(results[0].anchors);let max=0;
          for(let i=1;i<results.length;i++)for(const k of keys)for(let j=0;j<3;j++)max=Math.max(max,Math.abs(results[i].anchors[k][j]-results[0].anchors[k][j]));
          if(max>1e-12)throw new Error('SEMANTIC_ANCHOR_DRIFT '+max);
          const doc=exportKaopuCProfile(profile,{test:true});
          if(doc.representation.fixedVertexArrayStored!==false||doc.representation.fixedTriangleArrayStored!==false)throw new Error('EXPORT_STORES_FIXED_TOPOLOGY');
          if(doc.evidence.sourceRuntimeDependency!==false)throw new Error('EXPORT_SOURCE_DEPENDENCY_INVALID');
          console.log('R015_KERNEL_OK',results.map(r=>r.stats),'anchorDrift',max);
          NODE
          node --check /tmp/original-bird-seagull-c-draft-r015.mjs
          node --check /tmp/original-bird-production-hub-r015.mjs
