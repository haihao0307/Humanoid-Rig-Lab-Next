name: Original Bird Reference Measurement Check

on:
  push:
    branches:
      - bird-mother-original-bird-r001-20260920
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax and self tests
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test
          if [ -f Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py ]; then
            python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py
            python Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py --self-test
          fi

      - name: Validate JSON records
        shell: python
        run: |
          import json, pathlib
          files = [
            pathlib.Path('Bird-Reconstruction-Lab/original-bird/original-bird-kernel.schema.json'),
            pathlib.Path('Bird-Reconstruction-Lab/original-bird/original-bird-anatomy-landmarks.schema.json'),
            pathlib.Path('Bird-Reconstruction-Lab/original-bird/original-bird-reference-measurements.r001.json'),
            pathlib.Path('Bird-Reconstruction-Lab/original-bird/distilled/BIRD_REFERENCE_BATCH_A_R002.json'),
            pathlib.Path('Bird-Reconstruction-Lab/original-bird/distilled/COLUMBID_REALISM_TARGET_R005.json'),
            pathlib.Path('Bird-Reconstruction-Lab/original-bird/distilled/COLUMBID_SOURCE_RUNTIME_BRIDGE_R006.json'),
            pathlib.Path('Bird-Reconstruction-Lab/original-bird/distilled/COLUMBID_SEMANTIC_MAP_R007.json'),
            pathlib.Path('Bird-Reconstruction-Lab/original-bird/CURRENT_STATUS.json'),
          ]
          for p in files:
            json.loads(p.read_text(encoding='utf-8'))
            print('JSON_OK', p)

      - name: Validate workbench inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re
          files = [
              pathlib.Path('Bird-Reconstruction-Lab/original-bird/workbench/original-bird-columbid-skeleton-r002.html'),
              pathlib.Path('Bird-Reconstruction-Lab/original-bird/workbench/original-bird-glb-source-review-r004.html'),
              pathlib.Path('Bird-Reconstruction-Lab/original-bird/workbench/original-bird-source-beauty-r005.html'),
              pathlib.Path('Bird-Reconstruction-Lab/original-bird/workbench/original-bird-source-measure-r006.html'),
              pathlib.Path('Bird-Reconstruction-Lab/original-bird/workbench/original-bird-semantic-map-r007.html'),
          ]
          for p in files:
              text = p.read_text(encoding='utf-8')
              scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not scripts:
                  raise SystemExit(f'NO_INLINE_SCRIPT {p}')
              out = pathlib.Path('/tmp') / (p.stem + '.js')
              out.write_text('\n'.join(scripts), encoding='utf-8')
              print(out)
          PY
          node --check /tmp/original-bird-columbid-skeleton-r002.js
          node --check /tmp/original-bird-glb-source-review-r004.js
          node --check /tmp/original-bird-source-beauty-r005.js
          node --check /tmp/original-bird-source-measure-r006.js
          node --check /tmp/original-bird-semantic-map-r007.js

      - name: R0.07 source-backed semantic mapping guards
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('Bird-Reconstruction-Lab/original-bird')
          if (root / 'workbench/original-bird-columbid-form-r003.html').exists():
              raise SystemExit('REJECTED_R003_FORM_REAPPEARED')
          if (root / 'workbench/original-bird-studio-review-r006.html').exists():
              raise SystemExit('REDUNDANT_R006_STUDIO_WORKBENCH_REAPPEARED')

          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          records = batch['records']
          birds = [r for r in records if r['assetId'].startswith('BIRD-REF-')]
          if len(records) != 7 or len(birds) != 6:
              raise SystemExit(f'BIRD_BATCH_COUNT_REGRESSION total={len(records)} birds={len(birds)}')
          by_id = {r['assetId']: r for r in records}
          if by_id['BIRD-REF-002']['counts']['joints'] != 117 or by_id['BIRD-REF-002']['counts']['vertices'] != 18152:
              raise SystemExit('PRIMARY_DETAIL_REFERENCE_CHANGED')
          if by_id['BIRD-REF-001']['counts']['joints'] != 44 or by_id['BIRD-REF-001']['skeleton']['semanticCounts']['wing'] != 10:
              raise SystemExit('PRIMARY_MOTION_REFERENCE_CHANGED')

          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          if status.get('visualBirdGenerated') is not False:
              raise SystemExit('VISUAL_BIRD_MUST_REMAIN_FALSE_UNTIL_INDEPENDENT_DISTILLATION')
          if status.get('r003InventedFormDeleted') is not True:
              raise SystemExit('R003_DELETION_NOT_RECORDED')
          r006 = status.get('sourceMeasurementWorkbench', {})
          if r006.get('generated') is not True or r006.get('revision') != 'R0.06':
              raise SystemExit('R006_MEASUREMENT_WORKBENCH_NOT_RECORDED')
          if r006.get('blackModelBackgroundRemoved') is not True:
              raise SystemExit('BLACK_BACKGROUND_REMOVAL_NOT_RECORDED')
          r007 = status.get('semanticMappingWorkbench', {})
          if r007.get('generated') is not True or r007.get('revision') != 'R0.07':
              raise SystemExit('R007_SEMANTIC_MAPPING_WORKBENCH_NOT_RECORDED')
          if r007.get('blackModelBackgroundRemoved') is not True:
              raise SystemExit('R007_BLACK_BACKGROUND_REMOVAL_NOT_RECORDED')
          if status['primaryVisibleRigReference']['assetId'] != 'BIRD-REF-002':
              raise SystemExit('PRIMARY_VISIBLE_REFERENCE_NOT_LOCKED')
          if status['primaryMotionRigReference']['assetId'] != 'BIRD-REF-001':
              raise SystemExit('PRIMARY_MOTION_REFERENCE_NOT_LOCKED')

          r006_path = root / 'workbench/original-bird-source-measure-r006.html'
          r007_path = root / 'workbench/original-bird-semantic-map-r007.html'
          if not r006_path.exists() or not r007_path.exists():
              raise SystemExit('REQUIRED_WORKBENCH_MISSING')

          r006_text = r006_path.read_text(encoding='utf-8')
          r006_required = (
              '821135a09d3f48909b977a416d99c93b',
              '67f9422072664cf1967ae4fe440585a9',
              "background:'studio'",
              'const BG={studio:[.72,.77,.79]',
              '双点测量',
              '动作相位采样',
              'getNodeMap',
              'getMatrix',
              'capturePhase',
              'original-bird-r006-measurements.json',
              'original-bird-r006-motion-phase.json',
              'bright-studio measurement runtime',
          )
          for token in r006_required:
              if token not in r006_text:
                  raise SystemExit('R006_TOKEN_MISSING ' + token)

          r007_text = r007_path.read_text(encoding='utf-8')
          r007_required = (
              '821135a09d3f48909b977a416d99c93b',
              '67f9422072664cf1967ae4fe440585a9',
              "background:'studio'",
              'COLUMBID_SEMANTIC_MAP_R007.json',
              'canonicalRole',
              'seedKnown',
              'getNodeMap',
              'getMatrix',
              'original-bird-r007-semantic-map.json',
              'live semantic mapping',
          )
          for token in r007_required:
              if token not in r007_text:
                  raise SystemExit('R007_TOKEN_MISSING ' + token)

          forbidden = (
              'data-bg="dark"',
              "state.background='dark'",
              'new THREE.SphereGeometry',
              'deformedBodyGeometry',
              'original-bird-columbid-form-r003',
          )
          for token in forbidden:
              if token in r006_text or token in r007_text:
                  raise SystemExit('FORBIDDEN_TOKEN ' + token)

          target = json.loads((root / 'distilled/COLUMBID_REALISM_TARGET_R005.json').read_text(encoding='utf-8'))
          bridge = json.loads((root / 'distilled/COLUMBID_SOURCE_RUNTIME_BRIDGE_R006.json').read_text(encoding='utf-8'))
          semantic = json.loads((root / 'distilled/COLUMBID_SEMANTIC_MAP_R007.json').read_text(encoding='utf-8'))
          if target['primaryVisibleReference']['assetId'] != 'BIRD-REF-002' or target['primaryMotionReference']['assetId'] != 'BIRD-REF-001':
              raise SystemExit('REALISM_TARGET_SOURCE_PAIR_CHANGED')
          if bridge['sourcePair']['visibleRig']['assetId'] != 'BIRD-REF-002' or bridge['sourcePair']['motionRig']['assetId'] != 'BIRD-REF-001':
              raise SystemExit('SOURCE_RUNTIME_BRIDGE_PAIR_CHANGED')
          if semantic['sources']['BIRD-REF-002']['viewerUid'] != '821135a09d3f48909b977a416d99c93b':
              raise SystemExit('SEMANTIC_MAP_VISIBLE_UID_CHANGED')
          if semantic['sources']['BIRD-REF-001']['viewerUid'] != '67f9422072664cf1967ae4fe440585a9':
              raise SystemExit('SEMANTIC_MAP_MOTION_UID_CHANGED')
          if len(semantic['candidateMappings']) < 30:
              raise SystemExit('SEMANTIC_MAP_TOO_SMALL')
          if semantic['openGates']['semanticMappingProductionReady'] is not False:
              raise SystemExit('SEMANTIC_MAPPING_GATE_MUST_REMAIN_FALSE')
          print('R007_LIVE_SEMANTIC_MAPPING_GUARDS_OK')
