name: Original Bird Shape-First Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Repository terminology lock
        shell: python
        run: |
          import pathlib, subprocess
          forbidden = chr(0x4E89) + chr(0x6D41)
          files = [pathlib.Path(x.decode('utf-8')) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          hits = []
          for file in files:
              try:
                  text = file.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if forbidden in text:
                  hits.append(str(file))
          if hits:
              print('\n'.join('FORBIDDEN_TERM_PATH ' + x for x in hits))
              raise SystemExit('TERMINOLOGY_LOCK_FAILED')
          print('TERMINOLOGY_SCAN_OK', len(files))

      - name: Existing tool self-tests
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test

      - name: R0.17.1 shape-first guards
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          contract = json.loads((root / 'distilled/LARID_ORIGINAL_FORM_R017.json').read_text(encoding='utf-8'))
          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          runtime = root / 'runtime/original-bird-gull-form-r017.mjs'
          workbench = root / 'workbench/original-bird-gull-form-r0171.html'
          runtime_text = runtime.read_text(encoding='utf-8')
          workbench_text = workbench.read_text(encoding='utf-8')

          assert status['revision'] == 'R0.17.1-refined-shape-first-original-gull'
          assert status['visualBirdGenerated'] is True
          assert status['continuousSurfaceBirdGenerated'] is False
          assert status['productionEntry']['path'] == 'Bird-Reconstruction-Lab/original-bird/workbench/original-bird-gull-form-r0171.html'
          assert status['productionEntry']['advancedFlightAvailable'] is False
          assert status['sourceRoleSplit']['morphologyAndDetailAuthority']['assetId'] == 'BIRD-REF-005'
          assert status['sourceRoleSplit']['basicAnimationAuthority']['assetId'] == 'BIRD-REF-004'
          assert status['openGates']['r0171StaticFormAccepted'] is False
          assert status['openGates']['advancedFlightAllowed'] is False

          by_id = {row['assetId']: row for row in batch['records']}
          assert by_id['BIRD-REF-005']['sha256'] == '4aa183fdce3ae81b51767d81dcc1a775d990ecad81cc7fc45c3c0670c928f3f7'
          assert by_id['BIRD-REF-004']['sha256'] == '5d5e5b6897b54db20280603eff57fc0aa2c816957349eec5231d5419747143af'

          assert contract['revision'] == 'Original-Bird-R0.17.1-shape-refinement'
          independent = contract['independentForm']
          assert independent['workbench'] == 'Bird-Reconstruction-Lab/original-bird/workbench/original-bird-gull-form-r0171.html'
          assert independent['bodyRadialSegments'] == 52
          assert independent['bodyLongitudinalSubdivisions'] == 5
          assert independent['thirdPartyMeshLoaded'] is False
          assert independent['thirdPartyTextureLoaded'] is False
          assert independent['thirdPartySkeletonLoaded'] is False
          assert contract['basicMotion']['advancedFlightStatesEnabled'] is False
          assert contract['openGates']['staticFormAccepted'] is False

          runtime_tokens = (
              "GULL_R017_ID = 'original-bird-gull-form-r0171'",
              'densifyRings', 'CatmullRomCurve3', 'makeWingGeometry', 'pushTriangle',
              'continuous-body-head-beak-carrier', 'continuous-wing.L', 'continuous-wing.R',
              'mirroredWingNormalsCorrected: true', 'tail-continuous-carrier',
              'makeWebbingGeometry', 'webbedFeetPresent: true',
              'basicFlapDeformationAvailable: true', 'advancedFlightAvailable: false'
          )
          for token in runtime_tokens:
              if token not in runtime_text:
                  raise SystemExit('R0171_RUNTIME_TOKEN_MISSING ' + token)

          workbench_tokens = (
              'Original Bird R0.17.1', '../runtime/original-bird-gull-form-r017.mjs',
              'createOriginalGullR017', '静态形体', '基础拍翼', '高级飞行关闭',
              'type="importmap"', "import * as THREE from 'three'", 'camera.up.set(0, 0, 1)',
              'side', 'front', 'top', 'three', 'underside',
              'window.__BIRD_R017_READY__ = true', '1d3b3cea037f4fb3bc9fbd72013bb94a'
          )
          for token in workbench_tokens:
              if token not in workbench_text:
                  raise SystemExit('R0171_WORKBENCH_TOKEN_MISSING ' + token)

          for token in ('GLTFLoader', '.glb', '1d3b3cea037f4fb3bc9fbd72013bb94a', 'dc42ffc81c86480e9e7f7752fa134174', 'Sketchfab'):
              if token in runtime_text:
                  raise SystemExit('SOURCE_DEPENDENCY_IN_R0171_RUNTIME ' + token)

          scripts = []
          for match in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', workbench_text, re.S | re.I):
              tag_end = workbench_text.find('>', match.start()) + 1
              tag = workbench_text[match.start():tag_end]
              if 'importmap' not in tag.lower():
                  scripts.append(match.group(1))
          if not scripts:
              raise SystemExit('NO_R0171_INLINE_MODULE')
          pathlib.Path('/tmp/original-bird-gull-form-r0171-inline.mjs').write_text('\n'.join(scripts), encoding='utf-8')
          print('R0171_SHAPE_FIRST_GUARDS_OK')

      - name: R0.17.1 JavaScript syntax
        run: |
          node --check Bird-Reconstruction-Lab/original-bird/runtime/original-bird-gull-form-r017.mjs
          node --check /tmp/original-bird-gull-form-r0171-inline.mjs
