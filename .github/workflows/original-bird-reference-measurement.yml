name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python tools
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test
          if [ -f Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py ]; then
            python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py
            python Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py --self-test
          fi

      - name: Validate JSON and inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          json_files = [
              root / 'original-bird-kernel.schema.json',
              root / 'original-bird-anatomy-landmarks.schema.json',
              root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json',
              root / 'distilled/COLUMBID_3A_GAME_ASSET_STANDARD_R011.json',
              root / 'distilled/COLUMBID_FEATHER_ALPHA_EDGE_R012.json',
              root / 'distilled/COLUMBID_FEATHER_MATERIAL_PICK_R0121.json',
              root / 'distilled/COLUMBID_FEATHER_ALPHA_AUTO_EXTRACT_R0122.json',
              root / 'CURRENT_STATUS.json',
          ]
          for p in json_files:
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON_OK', p)
          html_files = [
              root / 'workbench/original-bird-source-measure-r006.html',
              root / 'workbench/original-bird-semantic-map-r007.html',
              root / 'workbench/original-bird-material-audit-r008.html',
              root / 'workbench/original-bird-fixed-view-baseline-r010.html',
              root / 'workbench/original-bird-3a-quality-gate-r011.html',
              root / 'workbench/original-bird-feather-alpha-r0122.html',
              root / 'workbench/original-bird-production-hub-r0122.html',
          ]
          for p in html_files:
              text = p.read_text(encoding='utf-8')
              scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not scripts:
                  raise SystemExit('NO_INLINE_SCRIPT ' + str(p))
              out = pathlib.Path('/tmp') / (p.stem + '.js')
              out.write_text('\n'.join(scripts), encoding='utf-8')
              print('SCRIPT_EXTRACTED', out)
          PY
          for f in /tmp/original-bird-*.js; do node --check "$f"; done

      - name: R0.12.2 source-atlas alpha guards
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('Bird-Reconstruction-Lab/original-bird')

          for rejected in (
              root / 'workbench/original-bird-columbid-form-r003.html',
              root / 'workbench/original-bird-studio-review-r006.html',
          ):
              if rejected.exists():
                  raise SystemExit('REJECTED_FILE_REAPPEARED ' + str(rejected))

          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          if status.get('revision') != 'R0.12.2-auto-source-atlas-alpha':
              raise SystemExit('R0122_STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not False or status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('INDEPENDENT_BIRD_GATE_INVALID')
          hub = status.get('productionHub', {})
          alpha_status = status.get('featherAlphaAutoExtract', {})
          if hub.get('revision') != 'R0.12.2' or hub.get('singleEntry') is not True or hub.get('blackModelBackgroundRemoved') is not True:
              raise SystemExit('R0122_HUB_STATUS_INVALID')
          if alpha_status.get('revision') != 'R0.12.2' or alpha_status.get('generated') is not True:
              raise SystemExit('R0122_ALPHA_STATUS_INVALID')
          if alpha_status.get('runtimeAlphaMaskApplied') is not False or alpha_status.get('visibleDifferenceVerified') is not False:
              raise SystemExit('R0122_OPEN_GATES_MUST_REMAIN_FALSE')
          if status['primaryVisibleRigReference']['assetId'] != 'BIRD-REF-002' or status['primaryMotionRigReference']['assetId'] != 'BIRD-REF-001':
              raise SystemExit('SOURCE_PAIR_CHANGED')

          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          by_id = {r['assetId']: r for r in batch['records']}
          if len(batch['records']) != 7 or len([r for r in batch['records'] if r['assetId'].startswith('BIRD-REF-')]) != 6:
              raise SystemExit('SOURCE_BATCH_COUNT_INVALID')
          if by_id['BIRD-REF-002']['counts']['vertices'] != 18152 or by_id['BIRD-REF-002']['counts']['joints'] != 117:
              raise SystemExit('DETAIL_REFERENCE_CHANGED')
          if by_id['BIRD-REF-001']['counts']['joints'] != 44 or by_id['BIRD-REF-001']['skeleton']['semanticCounts']['wing'] != 10:
              raise SystemExit('MOTION_REFERENCE_CHANGED')

          contract = json.loads((root / 'distilled/COLUMBID_FEATHER_ALPHA_AUTO_EXTRACT_R0122.json').read_text(encoding='utf-8'))
          if contract['source']['assetId'] != 'BIRD-REF-002':
              raise SystemExit('R0122_CONTRACT_SOURCE_CHANGED')
          if contract['correction']['maskEncoding'] != 'coverage is copied to R, G, B and A simultaneously':
              raise SystemExit('R0122_MASK_ENCODING_CHANGED')
          if contract['boundaries']['visualAcceptance'] is not False or contract['boundaries']['independentCommercialAtlasAuthored'] is not False:
              raise SystemExit('R0122_ACCEPTANCE_GATE_INVALID')

          lab = root / 'workbench/original-bird-feather-alpha-r0122.html'
          hub_path = root / 'workbench/original-bird-production-hub-r0122.html'
          lab_text = lab.read_text(encoding='utf-8')
          hub_text = hub_path.read_text(encoding='utf-8')
          required_lab = (
              '821135a09d3f48909b977a416d99c93b',
              'getTextureList',
              'bestTextureUrl',
              'deriveMask',
              'source RGBA alpha',
              'atlas border chroma-key',
              'forced grayscale channel probe',
              'od.data[i]=v;od.data[i+1]=v;od.data[i+2]=v;od.data[i+3]=v',
              'addTexture',
              'setMaterial',
              'getScreenShot',
              'changedRatio',
              'autoExtract',
              'original-bird-r0122-opacity-mask.png',
              'original-bird-r0122-alpha-report.json',
              'auto atlas alpha extraction',
          )
          for token in required_lab:
              if token not in lab_text:
                  raise SystemExit('R0122_LAB_TOKEN_MISSING ' + token)
          for token in (
              'original-bird-feather-alpha-r0122.html',
              'original-bird-3a-quality-gate-r011.html',
              'CURRENT_STATUS.json',
              'single-entry',
              'Original Bird R0.12.2',
          ):
              if token not in hub_text:
                  raise SystemExit('R0122_HUB_TOKEN_MISSING ' + token)

          for token in ('data-bg="dark"', "state.background='dark'", 'new THREE.SphereGeometry', 'deformedBodyGeometry', 'original-bird-columbid-form-r003'):
              for p in (lab, hub_path):
                  if token in p.read_text(encoding='utf-8'):
                      raise SystemExit('FORBIDDEN_TOKEN ' + token + ' in ' + str(p))
          print('R0122_SOURCE_ATLAS_ALPHA_GUARDS_OK')
