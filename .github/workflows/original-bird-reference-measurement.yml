name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Repository terminology lock
        shell: python
        run: |
          import pathlib, subprocess
          forbidden = chr(0x4E89) + chr(0x6D41)
          paths = [pathlib.Path(x.decode('utf-8')) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          hits = []
          for path in paths:
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if forbidden in text:
                  hits.append(str(path))
          if hits:
              for path in hits:
                  print('FORBIDDEN_TERM_PATH', path)
              raise SystemExit('TERMINOLOGY_LOCK_FAILED')
          print('TERMINOLOGY_SCAN_OK', len(paths))

      - name: Tool self-tests
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test

      - name: R0.16.2 higher-detail source guards
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          contract = json.loads((root / 'distilled/LARID_C_SOURCE_REPLICA_R0162.json').read_text(encoding='utf-8'))
          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          lab = root / 'workbench/original-bird-seagull-source-distillation-r0162.html'
          lab_text = lab.read_text(encoding='utf-8')

          if status.get('revision') != 'R0.16.2-higher-detail-seagull-source-correction':
              raise SystemExit('STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not False or status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('GENERATED_REPLACEMENT_STATUS_INVALID')
          if status['productionEntry']['path'] != 'Bird-Reconstruction-Lab/original-bird/workbench/original-bird-seagull-source-distillation-r0162.html':
              raise SystemExit('CURRENT_ENTRY_NOT_R0162')

          replica = status['seagullSourceReplica']
          if replica['authoritativeSourceAssetId'] != 'BIRD-REF-005':
              raise SystemExit('HIGH_DETAIL_SOURCE_NOT_ACTIVE')
          if replica['secondaryLowDetailAssetId'] != 'BIRD-REF-004':
              raise SystemExit('LOW_DETAIL_SOURCE_NOT_DEMOTED')
          if replica['eyeConstructionVerified'] is not False:
              raise SystemExit('EYE_CONSTRUCTION_MUST_REMAIN_UNVERIFIED')

          by_id = {r['assetId']: r for r in batch['records']}
          high = by_id['BIRD-REF-005']
          low = by_id['BIRD-REF-004']
          if high['sha256'] != '4aa183fdce3ae81b51767d81dcc1a775d990ecad81cc7fc45c3c0670c928f3f7':
              raise SystemExit('HIGH_DETAIL_SHA_CHANGED')
          if high['geometrySha256'] != 'd9f71e1fcaad1cac3dbed0d4b3f4ed1577c478fbc35bfa0e3c047915766799f2':
              raise SystemExit('HIGH_DETAIL_GEOMETRY_SHA_CHANGED')
          if high['counts']['vertices'] != 4416 or high['counts']['triangles'] != 5624 or high['counts']['joints'] != 21:
              raise SystemExit('HIGH_DETAIL_COUNTS_CHANGED')
          if not (high['counts']['vertices'] > low['counts']['vertices'] and high['counts']['triangles'] > low['counts']['triangles'] and high['counts']['joints'] > low['counts']['joints']):
              raise SystemExit('HIGH_DETAIL_COMPARISON_FAILED')

          if contract['revision'] != 'Original-Bird-R0.16.2':
              raise SystemExit('CONTRACT_REVISION_MISMATCH')
          if contract['authoritativeSource']['assetId'] != 'BIRD-REF-005':
              raise SystemExit('CONTRACT_HIGH_DETAIL_SOURCE_MISMATCH')
          if contract['demotedLowDetailSource']['assetId'] != 'BIRD-REF-004':
              raise SystemExit('CONTRACT_LOW_DETAIL_ROLE_MISMATCH')
          if contract['openGates']['eyeConstructionVerified'] is not False:
              raise SystemExit('CONTRACT_EYE_GATE_INVALID')

          required = (
              '1d3b3cea037f4fb3bc9fbd72013bb94a',
              '4aa183fdce3ae81b51767d81dcc1a775d990ecad81cc7fc45c3c0670c928f3f7',
              'd9f71e1fcaad1cac3dbed0d4b3f4ed1577c478fbc35bfa0e3c047915766799f2',
              "assetId:'BIRD-REF-005'",
              "role:'LOW_DETAIL_SECONDARY_ONLY'",
              'getNodeMap','getMatrix','getMaterialList','getTextureList','getAnimations',
              'PHASES=[0,.125,.25,.375,.5,.625,.75,.875]',
              'kaopu/source-bird-replica@1.0',
              'original-bird-r0162-seagull-high-detail-source-replica.kaopu'
          )
          for token in required:
              if token not in lab_text:
                  raise SystemExit('R0162_WORKBENCH_TOKEN_MISSING ' + token)

          forbidden = (
              "const SOURCE={assetId:'BIRD-REF-004'",
              'new THREE.',
              'buildLaridDisplay',
              'evaluateBody',
              'evaluateWing'
          )
          for token in forbidden:
              if token in lab_text:
                  raise SystemExit('FORBIDDEN_R0162_TOKEN ' + token)

          scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>', lab_text, re.S | re.I)]
          if not scripts:
              raise SystemExit('NO_INLINE_SCRIPT')
          out = pathlib.Path('/tmp/original-bird-seagull-source-distillation-r0162.js')
          out.write_text('\n'.join(scripts), encoding='utf-8')
          print('R0162_HIGHER_DETAIL_SOURCE_GUARDS_OK')

      - name: R0.16.2 JavaScript syntax
        run: node --check /tmp/original-bird-seagull-source-distillation-r0162.js
