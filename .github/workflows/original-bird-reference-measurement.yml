name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tool self-tests
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test
      - name: R0.14 structure, syntax and gates
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          contract = json.loads((root / 'distilled/LARID_SEAGULL_PHASE1_R014.json').read_text(encoding='utf-8'))
          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          lab = root / 'workbench/original-bird-seagull-phase1-r014.html'
          hub = root / 'workbench/original-bird-production-hub-r014.html'
          pigeon = root / 'workbench/original-bird-pigeon-motion-auto-r0131.html'
          lab_text = lab.read_text(encoding='utf-8')
          hub_text = hub.read_text(encoding='utf-8')

          if status.get('revision') != 'R0.14-tropical-island-seagull-phase1':
              raise SystemExit('STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not False or status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('INDEPENDENT_BIRD_GATE_INVALID')
          if status['productionHub']['revision'] != 'R0.14' or status['productionHub']['defaultMobileStage'] != 'seagull':
              raise SystemExit('HUB_STATUS_INVALID')
          gull = status.get('seagullPhase1', {})
          if gull.get('generated') is not True or gull.get('primaryAssetId') != 'BIRD-REF-004' or gull.get('secondaryAssetId') != 'BIRD-REF-005':
              raise SystemExit('SEAGULL_STATUS_INVALID')
          if gull.get('dualSourcePhaseCaptureComplete') is not False or gull.get('independentCommercialSafeSeagullGenerated') is not False:
              raise SystemExit('SEAGULL_RUNTIME_GATES_MUST_REMAIN_FALSE')
          if status['alphaIssue']['status'] != 'DEFERRED_TO_LARGE_SCREEN_REVIEW':
              raise SystemExit('ALPHA_DEFER_STATUS_INVALID')
          if status['deferredSpecies']['species'] != 'Passer domesticus':
              raise SystemExit('DEFERRED_SPECIES_CHANGED')

          by_id = {r['assetId']: r for r in batch['records']}
          if len(batch['records']) != 7 or len([r for r in batch['records'] if r['assetId'].startswith('BIRD-REF-')]) != 6:
              raise SystemExit('SOURCE_BATCH_COUNT_INVALID')
          if by_id['BIRD-REF-004']['counts']['joints'] != 15 or by_id['BIRD-REF-004']['skeleton']['semanticCounts']['wing'] != 8:
              raise SystemExit('PRIMARY_GULL_REFERENCE_CHANGED')
          if by_id['BIRD-REF-005']['counts']['joints'] != 21 or by_id['BIRD-REF-005']['skeleton']['semanticCounts']['wing'] != 8:
              raise SystemExit('SECONDARY_GULL_REFERENCE_CHANGED')

          if contract['projectUse']['game'] != 'Stone Money Island' or contract['projectUse']['exactSpecies'] != 'UNRESOLVED':
              raise SystemExit('GAME_OR_SPECIES_BOUNDARY_CHANGED')
          if contract['sourcePair']['primary']['assetId'] != 'BIRD-REF-004' or contract['sourcePair']['secondary']['assetId'] != 'BIRD-REF-005':
              raise SystemExit('SEAGULL_SOURCE_PAIR_CHANGED')
          if contract['sourcePair']['primary']['semanticCounts']['leg'] != 0:
              raise SystemExit('PRIMARY_LEG_ABSENCE_CHANGED')
          if contract['boundaries']['shoreLandingReady'] is not False or contract['boundaries']['waterContactReady'] is not False:
              raise SystemExit('CONTACT_GATE_INVALID')
          if len(contract['gameZones']) != 4 or contract['openGates']['visualAcceptance'] is not False:
              raise SystemExit('GAME_PROFILE_OR_ACCEPTANCE_GATE_INVALID')

          required_lab = (
              'dc42ffc81c86480e9e7f7752fa134174',
              '1d3b3cea037f4fb3bc9fbd72013bb94a',
              'PHASES=[0,.125,.25,.375,.5,.625,.75,.875]',
              'getNodeMap','getAnimations','getMatrix','runBoth','sampleSource','analyze',
              'window.__BIRD_R014_REPORT__','original-bird-r014-seagull-report',
              'kaopu/bird-seabird-game-profile@1.0','original-bird-r014-seagull-game-profile.kaopu',
              'reef_edge','lagoon','beach','offshore','Laridae seagull candidate'
          )
          for token in required_lab:
              if token not in lab_text:
                  raise SystemExit('LAB_TOKEN_MISSING ' + token)
          required_hub = (
              'original-bird-seagull-phase1-r014.html',
              "let active='seagull'",
              'Stone Money Island',
              'single-entry-mobile-first'
          )
          for token in required_hub:
              if token not in hub_text:
                  raise SystemExit('HUB_TOKEN_MISSING ' + token)
          for token in ('data-bg="dark"',"state.background='dark'",'new THREE.SphereGeometry','deformedBodyGeometry','original-bird-columbid-form-r003'):
              if token in lab_text or token in hub_text:
                  raise SystemExit('FORBIDDEN_TOKEN ' + token)
          if not pigeon.exists():
              raise SystemExit('PIGEON_BASELINE_MISSING')

          for p in (lab, hub):
              text = p.read_text(encoding='utf-8')
              scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not scripts:
                  raise SystemExit('NO_INLINE_SCRIPT ' + str(p))
              out = pathlib.Path('/tmp') / (p.stem + '.js')
              out.write_text('\n'.join(scripts), encoding='utf-8')
              print('SCRIPT_EXTRACTED', out)
          print('R014_TROPICAL_ISLAND_SEAGULL_PHASE1_GUARDS_OK')
          PY
          node --check /tmp/original-bird-seagull-phase1-r014.js
          node --check /tmp/original-bird-production-hub-r014.js
