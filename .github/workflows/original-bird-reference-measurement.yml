name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Repository terminology lock
        shell: python
        run: |
          import pathlib, subprocess
          forbidden = chr(0x4E89) + chr(0x6D41)
          paths = [pathlib.Path(x.decode('utf-8')) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          hits = []
          for path in paths:
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if forbidden in text:
                  hits.append(str(path))
          if hits:
              for path in hits:
                  print('FORBIDDEN_TERM_PATH', path)
              raise SystemExit('TERMINOLOGY_LOCK_FAILED')
          print('TERMINOLOGY_SCAN_OK', len(paths))

      - name: Tool self-tests
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test

      - name: R0.16.4 form-motion role and flight-learning guards
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          flight = json.loads((root / 'distilled/LARID_DUAL_SOURCE_ROLE_AND_FLIGHT_LEARNING_R0164.json').read_text(encoding='utf-8'))
          intake = json.loads((root / 'distilled/BIRD_MOTION_REFERENCE_INTAKE_R0164.schema.json').read_text(encoding='utf-8'))
          detail = json.loads((root / 'distilled/LARID_C_DETAIL_AUDIT_R0163.json').read_text(encoding='utf-8'))
          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          lab = root / 'workbench/original-bird-seagull-flight-learning-r0164.html'
          text = lab.read_text(encoding='utf-8')

          if status.get('revision') != 'R0.16.4-dual-source-flight-learning':
              raise SystemExit('STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not False or status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('GENERATED_REPLACEMENT_STATUS_INVALID')
          if status['productionEntry']['path'] != 'Bird-Reconstruction-Lab/original-bird/workbench/original-bird-seagull-flight-learning-r0164.html':
              raise SystemExit('CURRENT_ENTRY_NOT_R0164')

          roles = status['sourceRoleSplit']
          if roles.get('locked') is not True:
              raise SystemExit('ROLE_SPLIT_NOT_LOCKED')
          if roles['morphologyAndDetailAuthority']['assetId'] != 'BIRD-REF-005':
              raise SystemExit('FORM_AUTHORITY_NOT_REF005')
          if roles['animationAndFlightAuthority']['assetId'] != 'BIRD-REF-004':
              raise SystemExit('MOTION_AUTHORITY_NOT_REF004')
          if status['seagullFlightLearning']['productionMotionGenerated'] is not False:
              raise SystemExit('PRODUCTION_MOTION_GATE_INVALID')

          by_id = {r['assetId']: r for r in batch['records']}
          form = by_id['BIRD-REF-005']
          motion = by_id['BIRD-REF-004']
          if form['sha256'] != '4aa183fdce3ae81b51767d81dcc1a775d990ecad81cc7fc45c3c0670c928f3f7':
              raise SystemExit('FORM_SHA_CHANGED')
          if form['geometrySha256'] != 'd9f71e1fcaad1cac3dbed0d4b3f4ed1577c478fbc35bfa0e3c047915766799f2':
              raise SystemExit('FORM_GEOMETRY_SHA_CHANGED')
          if motion['sha256'] != '5d5e5b6897b54db20280603eff57fc0aa2c816957349eec5231d5419747143af':
              raise SystemExit('MOTION_SHA_CHANGED')
          if motion['geometrySha256'] != 'd6e4cc5add60e3ce4d8ba225f660fe1ef1cec0998944972611814f8d4d209bac':
              raise SystemExit('MOTION_GEOMETRY_SHA_CHANGED')
          if (form['counts']['vertices'], form['counts']['triangles'], form['counts']['joints']) != (4416,5624,21):
              raise SystemExit('FORM_COUNTS_CHANGED')
          if (motion['counts']['vertices'], motion['counts']['triangles'], motion['counts']['joints']) != (3291,4352,15):
              raise SystemExit('MOTION_COUNTS_CHANGED')

          if flight['revision'] != 'Original-Bird-R0.16.4':
              raise SystemExit('FLIGHT_CONTRACT_REVISION_MISMATCH')
          if flight['roleSeparation']['morphologyAndDetailAuthority']['assetId'] != 'BIRD-REF-005':
              raise SystemExit('FLIGHT_CONTRACT_FORM_AUTHORITY_CHANGED')
          if flight['roleSeparation']['animationAndFlightAuthority']['assetId'] != 'BIRD-REF-004':
              raise SystemExit('FLIGHT_CONTRACT_MOTION_AUTHORITY_CHANGED')
          if len(flight['flightLearningStates']) != 8:
              raise SystemExit('FLIGHT_STATE_COUNT_CHANGED')
          if len(flight['scientificEvidence']) < 6:
              raise SystemExit('SCIENTIFIC_EVIDENCE_INCOMPLETE')
          if flight['strictBoundaries']['primaryShapeOverwrittenByMotionSource'] is not False:
              raise SystemExit('MOTION_SOURCE_OVERWRITE_FLAG_INVALID')
          if flight['strictBoundaries']['generatedProductionMotion'] is not False:
              raise SystemExit('GENERATED_MOTION_GATE_INVALID')

          if intake['title'] != 'Bird Motion Reference Intake R0.16.4':
              raise SystemExit('INTAKE_SCHEMA_TITLE_CHANGED')
          if set(intake['required']) != {'referenceId','sourceType','identity','behavior','capture','rights','evidence','confidence'}:
              raise SystemExit('INTAKE_SCHEMA_REQUIRED_FIELDS_CHANGED')
          states = set(intake['properties']['behavior']['properties']['state']['enum'])
          required_states = {'powered_flap_cruise','flap_glide_transition','glide_and_soar','bank_and_turn','climb_and_descent','takeoff','approach_and_landing','wind_hold_and_gust_response','other'}
          if states != required_states:
              raise SystemExit('INTAKE_BEHAVIOR_STATES_CHANGED')

          if detail['primarySource']['assetId'] != 'BIRD-REF-005' or detail['secondarySource']['assetId'] != 'BIRD-REF-004':
              raise SystemExit('R0163_SOURCE_PAIR_CHANGED')

          required = (
              '1d3b3cea037f4fb3bc9fbd72013bb94a',
              'dc42ffc81c86480e9e7f7752fa134174',
              "role:'MORPHOLOGY_AND_DETAIL_AUTHORITY'",
              "role:'ANIMATION_AND_FLIGHT_AUTHORITY'",
              'getNodeMap','getMatrix','getMaterialList','getTextureList','getAnimations','getScreenShot',
              'PHASES=[0,.125,.25,.375,.5,.625,.75,.875]',
              'motionAmplitude',
              'rotationAngle',
              'ROLE_OPTIONS',
              'powered_flap_cruise',
              'flap_glide_transition',
              'wind_hold_and_gust_response',
              'referenceTemplate',
              'importReferences',
              'kaopu/bird-flight-learning@1.0',
              'original-bird-r0164-flight-learning.kaopu'
          )
          for token in required:
              if token not in text:
                  raise SystemExit('R0164_WORKBENCH_TOKEN_MISSING ' + token)

          forbidden = (
              'new THREE.',
              'buildLaridDisplay',
              'evaluateBody',
              'evaluateWing',
              'primaryShapeOverwrittenByMotionSource:true',
              'generatedProductionMotion:true'
          )
          for token in forbidden:
              if token in text:
                  raise SystemExit('FORBIDDEN_R0164_TOKEN ' + token)

          scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
          if not scripts:
              raise SystemExit('NO_INLINE_SCRIPT')
          out = pathlib.Path('/tmp/original-bird-seagull-flight-learning-r0164.js')
          out.write_text('\n'.join(scripts), encoding='utf-8')
          print('R0164_DUAL_SOURCE_FLIGHT_LEARNING_GUARDS_OK')

      - name: R0.16.4 JavaScript syntax
        run: node --check /tmp/original-bird-seagull-flight-learning-r0164.js
