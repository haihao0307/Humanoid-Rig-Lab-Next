name: Original Bird Reference Measurement Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python tools
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test
          if [ -f Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py ]; then
            python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py
            python Bird-Reconstruction-Lab/original-bird/tools/distill_bird_reference.py --self-test
          fi

      - name: JSON and JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          json_files = [
              root / 'original-bird-kernel.schema.json',
              root / 'original-bird-anatomy-landmarks.schema.json',
              root / 'original-bird-reference-measurements.r001.json',
              root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json',
              root / 'distilled/COLUMBID_REALISM_TARGET_R005.json',
              root / 'distilled/COLUMBID_SOURCE_RUNTIME_BRIDGE_R006.json',
              root / 'distilled/COLUMBID_SEMANTIC_MAP_R007.json',
              root / 'distilled/COLUMBID_MATERIAL_ROLE_MAP_R008.json',
              root / 'distilled/COLUMBID_FIXED_VIEW_BASELINE_R010.json',
              root / 'distilled/COLUMBID_3A_GAME_ASSET_STANDARD_R011.json',
              root / 'CURRENT_STATUS.json',
          ]
          for p in json_files:
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON_OK', p)
          html_files = [
              root / 'workbench/original-bird-columbid-skeleton-r002.html',
              root / 'workbench/original-bird-glb-source-review-r004.html',
              root / 'workbench/original-bird-source-beauty-r005.html',
              root / 'workbench/original-bird-source-measure-r006.html',
              root / 'workbench/original-bird-semantic-map-r007.html',
              root / 'workbench/original-bird-material-audit-r008.html',
              root / 'workbench/original-bird-fixed-view-baseline-r010.html',
              root / 'workbench/original-bird-3a-quality-gate-r011.html',
              root / 'workbench/original-bird-production-hub-r011.html',
          ]
          for p in html_files:
              text = p.read_text(encoding='utf-8')
              scripts = [m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.S | re.I)]
              if not scripts:
                  raise SystemExit('NO_INLINE_SCRIPT ' + str(p))
              out = pathlib.Path('/tmp') / (p.stem + '.js')
              out.write_text('\n'.join(scripts), encoding='utf-8')
              print('SCRIPT_EXTRACTED', out)
          PY
          for f in /tmp/original-bird-*.js; do node --check "$f"; done

      - name: R0.11 3A quality guards
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('Bird-Reconstruction-Lab/original-bird')

          for rejected in (
              root / 'workbench/original-bird-columbid-form-r003.html',
              root / 'workbench/original-bird-studio-review-r006.html',
          ):
              if rejected.exists():
                  raise SystemExit('REJECTED_FILE_REAPPEARED ' + str(rejected))

          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          if status.get('revision') != 'R0.11-evidence-backed-3a-quality-gate':
              raise SystemExit('R011_STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not False or status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('INDEPENDENT_BIRD_GATE_INVALID')
          if status.get('r003InventedFormDeleted') is not True:
              raise SystemExit('R003_DELETION_NOT_RECORDED')
          hub = status.get('productionHub', {})
          quality = status.get('qualityGate3A', {})
          if hub.get('revision') != 'R0.11' or hub.get('singleEntry') is not True or hub.get('blackModelBackgroundRemoved') is not True:
              raise SystemExit('R011_HUB_STATUS_INVALID')
          if quality.get('revision') != 'R0.11' or quality.get('generated') is not True:
              raise SystemExit('R011_QUALITY_STATUS_INVALID')
          if quality.get('candidateLoaded') is not False or quality.get('allCriticalGatesPassed') is not False:
              raise SystemExit('R011_CANDIDATE_GATE_MUST_REMAIN_FALSE')
          if status['primaryVisibleRigReference']['assetId'] != 'BIRD-REF-002' or status['primaryMotionRigReference']['assetId'] != 'BIRD-REF-001':
              raise SystemExit('SOURCE_PAIR_CHANGED')

          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          by_id = {r['assetId']: r for r in batch['records']}
          if len(batch['records']) != 7 or len([r for r in batch['records'] if r['assetId'].startswith('BIRD-REF-')]) != 6:
              raise SystemExit('SOURCE_BATCH_COUNT_INVALID')
          if by_id['BIRD-REF-002']['counts']['vertices'] != 18152 or by_id['BIRD-REF-002']['counts']['joints'] != 117:
              raise SystemExit('DETAIL_REFERENCE_CHANGED')
          if by_id['BIRD-REF-001']['counts']['joints'] != 44 or by_id['BIRD-REF-001']['skeleton']['semanticCounts']['wing'] != 10:
              raise SystemExit('MOTION_REFERENCE_CHANGED')

          standard = json.loads((root / 'distilled/COLUMBID_3A_GAME_ASSET_STANDARD_R011.json').read_text(encoding='utf-8'))
          domains = standard['qualityDomains']
          gates = [g for d in domains for g in d['gates']]
          if len(domains) != 6 or len(gates) != 30 or sum(d['weight'] for d in domains) != 100:
              raise SystemExit('R011_STANDARD_STRUCTURE_INVALID')
          if len([g for g in gates if g['critical']]) < 20:
              raise SystemExit('R011_CRITICAL_GATE_COUNT_TOO_LOW')
          if standard['acceptanceLogic']['motionEvidence']['minimumNormalizedPhases'] != 8:
              raise SystemExit('R011_PHASE_EVIDENCE_INVALID')
          if standard['openGates']['independentCommercialSafeAssetGenerated'] is not False or standard['openGates']['visualAcceptance'] is not False:
              raise SystemExit('R011_STANDARD_ACCEPTANCE_GATE_INVALID')

          quality_path = root / 'workbench/original-bird-3a-quality-gate-r011.html'
          hub_path = root / 'workbench/original-bird-production-hub-r011.html'
          quality_text = quality_path.read_text(encoding='utf-8')
          hub_text = hub_path.read_text(encoding='utf-8')
          for token in (
              '821135a09d3f48909b977a416d99c93b',
              'candidateUid',
              "PHASES=[0,.125,.25,.375,.5,.625,.75,.875]",
              "neutral:{exp:.22",
              'grazing',
              'rim',
              'overcast',
              'wingroot',
              'wingtip',
              'capture',
              'original-bird-r011-3a-quality-report.json',
              '3A evidence gate',
          ):
              if token not in quality_text:
                  raise SystemExit('R011_QUALITY_TOKEN_MISSING ' + token)
          for gate_id in ('FORM-01','FEATHER-01','MATERIAL-01','RIG-01','MOTION-01','GAME-01'):
              if gate_id not in quality_text:
                  raise SystemExit('R011_GATE_ID_MISSING ' + gate_id)
          for token in (
              'original-bird-source-measure-r006.html',
              'original-bird-semantic-map-r007.html',
              'original-bird-material-audit-r008.html',
              'original-bird-fixed-view-baseline-r010.html',
              'original-bird-3a-quality-gate-r011.html',
              'CURRENT_STATUS.json',
              'single-entry',
              '3A production hub',
          ):
              if token not in hub_text:
                  raise SystemExit('R011_HUB_TOKEN_MISSING ' + token)

          files_to_scan = [
              root / 'workbench/original-bird-source-measure-r006.html',
              root / 'workbench/original-bird-semantic-map-r007.html',
              root / 'workbench/original-bird-material-audit-r008.html',
              root / 'workbench/original-bird-fixed-view-baseline-r010.html',
              quality_path,
              hub_path,
          ]
          for token in ('data-bg="dark"', "state.background='dark'", 'new THREE.SphereGeometry', 'deformedBodyGeometry', 'original-bird-columbid-form-r003'):
              for p in files_to_scan:
                  if token in p.read_text(encoding='utf-8'):
                      raise SystemExit('FORBIDDEN_TOKEN ' + token + ' in ' + str(p))
          print('R011_EVIDENCE_BACKED_3A_QUALITY_GUARDS_OK')
