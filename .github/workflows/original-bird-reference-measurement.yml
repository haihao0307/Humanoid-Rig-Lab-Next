name: Original Bird Shape-First Check

on:
  push:
    branches: [bird-mother-original-bird-r001-20260920]
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'
  pull_request:
    paths:
      - 'Bird-Reconstruction-Lab/original-bird/**'
      - '.github/workflows/original-bird-reference-measurement.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Repository terminology lock
        shell: python
        run: |
          import pathlib, subprocess
          forbidden = chr(0x4E89) + chr(0x6D41)
          paths = [pathlib.Path(x.decode('utf-8')) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          hits = []
          for path in paths:
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if forbidden in text:
                  hits.append(str(path))
          if hits:
              for path in hits:
                  print('FORBIDDEN_TERM_PATH', path)
              raise SystemExit('TERMINOLOGY_LOCK_FAILED')
          print('TERMINOLOGY_SCAN_OK', len(paths))

      - name: Existing tool self-tests
        run: |
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py
          python -m py_compile Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py
          python Bird-Reconstruction-Lab/original-bird/tools/measure_bird_reference.py --self-test
          python Bird-Reconstruction-Lab/original-bird/tools/catalog_bird_package.py --self-test

      - name: R0.17 shape-first guards
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path('Bird-Reconstruction-Lab/original-bird')
          status = json.loads((root / 'CURRENT_STATUS.json').read_text(encoding='utf-8'))
          form = json.loads((root / 'distilled/LARID_ORIGINAL_FORM_R017.json').read_text(encoding='utf-8'))
          batch = json.loads((root / 'distilled/BIRD_REFERENCE_BATCH_A_R002.json').read_text(encoding='utf-8'))
          runtime = root / 'runtime/original-bird-gull-form-r017.mjs'
          workbench = root / 'workbench/original-bird-gull-form-r017.html'
          runtime_text = runtime.read_text(encoding='utf-8')
          workbench_text = workbench.read_text(encoding='utf-8')

          if status.get('revision') != 'R0.17-shape-first-original-gull':
              raise SystemExit('R017_STATUS_REVISION_MISMATCH')
          if status.get('visualBirdGenerated') is not True:
              raise SystemExit('R017_VISIBLE_FORM_NOT_RECORDED')
          if status.get('continuousSurfaceBirdGenerated') is not False:
              raise SystemExit('WHOLE_BIRD_CONTINUITY_MUST_REMAIN_FALSE')
          entry = status.get('productionEntry', {})
          if entry.get('path') != 'Bird-Reconstruction-Lab/original-bird/workbench/original-bird-gull-form-r017.html':
              raise SystemExit('R017_PRODUCTION_ENTRY_CHANGED')
          if entry.get('generatedCandidatePresent') is not True:
              raise SystemExit('R017_CANDIDATE_NOT_RECORDED')
          if entry.get('advancedFlightAvailable') is not False:
              raise SystemExit('ADVANCED_FLIGHT_MUST_REMAIN_DISABLED')

          roles = status.get('sourceRoleSplit', {})
          if roles.get('morphologyAndDetailAuthority', {}).get('assetId') != 'BIRD-REF-005':
              raise SystemExit('FORM_AUTHORITY_NOT_REF005')
          if roles.get('basicAnimationAuthority', {}).get('assetId') != 'BIRD-REF-004':
              raise SystemExit('BASIC_ANIMATION_AUTHORITY_NOT_REF004')

          by_id = {r['assetId']: r for r in batch['records']}
          if by_id['BIRD-REF-005']['sha256'] != '4aa183fdce3ae81b51767d81dcc1a775d990ecad81cc7fc45c3c0670c928f3f7':
              raise SystemExit('FORM_SOURCE_SHA_CHANGED')
          if by_id['BIRD-REF-004']['sha256'] != '5d5e5b6897b54db20280603eff57fc0aa2c816957349eec5231d5419747143af':
              raise SystemExit('ANIMATION_SOURCE_SHA_CHANGED')

          if form.get('revision') != 'Original-Bird-R0.17-shape-first':
              raise SystemExit('R017_FORM_CONTRACT_REVISION_MISMATCH')
          independent = form.get('independentForm', {})
          if independent.get('thirdPartyMeshLoaded') is not False:
              raise SystemExit('THIRD_PARTY_MESH_FLAG_INVALID')
          if independent.get('thirdPartyTextureLoaded') is not False:
              raise SystemExit('THIRD_PARTY_TEXTURE_FLAG_INVALID')
          if independent.get('thirdPartySkeletonLoaded') is not False:
              raise SystemExit('THIRD_PARTY_SKELETON_FLAG_INVALID')
          if form.get('basicMotion', {}).get('advancedFlightStatesEnabled') is not False:
              raise SystemExit('FORM_CONTRACT_ADVANCED_FLIGHT_INVALID')
          if form.get('openGates', {}).get('staticFormAccepted') is not False:
              raise SystemExit('STATIC_FORM_ACCEPTANCE_MUST_REMAIN_FALSE')

          required_runtime = (
              'createOriginalGullR017',
              'makeLoftGeometry',
              'makeWingGeometry',
              'continuous-body-head-beak-carrier',
              'wing.L.shoulder',
              'wing.L.elbow',
              'wing.L.wrist',
              'wing.L.tip',
              'primary-feathers.L',
              'tail-feather-array',
              'basicFlapDeformationAvailable: true',
              'advancedFlightAvailable: false',
          )
          for token in required_runtime:
              if token not in runtime_text:
                  raise SystemExit('R017_RUNTIME_TOKEN_MISSING ' + token)

          required_workbench = (
              'Original Bird R0.17',
              '../runtime/original-bird-gull-form-r017.mjs',
              'createOriginalGullR017',
              '静态形体',
              '基础拍翼',
              '高级飞行保持关闭',
              'type="importmap"',
              "import * as THREE from 'three'",
              'side', 'front', 'top', 'three', 'underside',
              'window.__BIRD_R017_READY__ = true',
              '1d3b3cea037f4fb3bc9fbd72013bb94a',
          )
          for token in required_workbench:
              if token not in workbench_text:
                  raise SystemExit('R017_WORKBENCH_TOKEN_MISSING ' + token)

          forbidden_runtime = (
              'GLTFLoader',
              '.glb',
              '1d3b3cea037f4fb3bc9fbd72013bb94a',
              'dc42ffc81c86480e9e7f7752fa134174',
              'Sketchfab',
          )
          for token in forbidden_runtime:
              if token in runtime_text:
                  raise SystemExit('SOURCE_DEPENDENCY_IN_R017_RUNTIME ' + token)

          scripts = []
          for match in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', workbench_text, re.S | re.I):
              tag_end = workbench_text.find('>', match.start()) + 1
              tag = workbench_text[match.start():tag_end]
              if 'importmap' not in tag.lower():
                  scripts.append(match.group(1))
          if not scripts:
              raise SystemExit('NO_R017_INLINE_MODULE')
          pathlib.Path('/tmp/original-bird-gull-form-r017-inline.mjs').write_text('\n'.join(scripts), encoding='utf-8')
          print('R017_SHAPE_FIRST_GUARDS_OK')

      - name: R0.17 JavaScript syntax
        run: |
          node --check Bird-Reconstruction-Lab/original-bird/runtime/original-bird-gull-form-r017.mjs
          node --check /tmp/original-bird-gull-form-r017-inline.mjs
