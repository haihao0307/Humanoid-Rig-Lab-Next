name: Shoe R06 contact repair verification
on:
  push:
    branches: [fix/shoe-r06-panel-contact-20261011]
    paths: ['shoe-workshop/r06/**', '.github/workflows/shoe-r06-contact.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shoe-r06-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shoe-workshop
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible offline repair environment
        run: |
          npm install --prefix shoe-workshop --no-save --package-lock=false three@0.179.1 esbuild@0.25.10 playwright@1.56.0
          tar --exclude='*/evidence' --exclude='*/public-lite.html' --exclude='*/source-transfer' --exclude='*/originals' -czf /tmp/shoe-r06-repair-environment.tgz shoe-workshop/r02 shoe-workshop/r03 shoe-workshop/r03b shoe-workshop/r04 shoe-workshop/r05 shoe-workshop/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: shoe-r06-repair-environment
          path: /tmp/shoe-r06-repair-environment.tgz
          retention-days: 2
