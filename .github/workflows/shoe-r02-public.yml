name: Shoe R02 Visual Review and Public Acceptance
on:
  push:
    branches: [feature/shoe-atelier-r01-20261010]
    paths: ['.github/workflows/shoe-r02-public.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shoe-r02-public
  cancel-in-progress: false
jobs:
  publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SHOE_EXPECT_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: shoe-workshop/r02
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checked screenshot-review corrections to actual source modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          R=Path('shoe-workshop/r02');receipt=R/'DISPLAY_REVIEW_FIX.json';changes={}
          expected={'src/main.mjs':('c8a8ba7f315f0a6850dc8362da23bc70f57eb89a1a19323b55755123b3e8b296','05ba2443f60f3fd83d3d218bae371c79430a23bbb0d1878d9e380bf0b5c47828'),'index.html':('8aea1002253f523369128d4f01386fc3034357281b146616d78b79ff4a63207d','e68e2487918bde12e3d85417918df546447405136b52b00ca924dbdeb787c424'),'tests/browser.mjs':('7db21639d45cdc14efd393b75483e5692a85d439f1f9cb0d9506b0cd0aea1c22','6a6f2146138d6409d5039b170de931338fb99f2c9f2ac957004e64db2f7dc607')}
          def patch(name,repls):
            p=R/name;s=p.read_text();before=hashlib.sha256(s.encode()).hexdigest()
            if before!=expected[name][0]:raise ValueError('Unexpected pre-review source '+name)
            for a,b in repls:
              if s.count(a)!=1:raise ValueError((name,s.count(a),a[:90]))
              s=s.replace(a,b)
            after=hashlib.sha256(s.encode()).hexdigest()
            if after!=expected[name][1]:raise ValueError('Unexpected post-review source '+name)
            p.write_text(s);changes[name]={'before':before,'after':after}
          if not receipt.exists():
            patch('src/main.mjs',[
              ('sourceVisibleOriginal=false;','sourceVisibleOriginal=false,detailView=false;'),
              ('scene.add(key);','scene.add(key);scene.add(key.target);'),
              ("ctx.font='22px sans-serif'","ctx.font='32px sans-serif'"),
              ('new T.SpriteMaterial({map:tx,depthTest:false})','new T.SpriteMaterial({map:tx,depthTest:false,depthWrite:false,toneMapped:false})'),
              ('s.scale.set(48,12,1)','s.scale.set(144,36,1)'),
              ("selected?'#ad8965':'#d0c4ad'","selected?'#96754d':'#94998c'"),
              ("selected?'#62482e':'#958469',.14","selected?'#543b22':'#485346',.40"),
              ('if(fit)setCamera(state.camera);updateNumbers();render();',"$('#seam-detail').hidden=state.mode!=='seam';if(fit){detailView=false;setCamera(state.camera);}else if(detailView)seamDetail();updateNumbers();render();"),
              ('function setCamera(name){state.camera=name;','function setCamera(name){detailView=false;state.camera=name;'),
              ('const distance=r/Math.sin(v)*1.22;','const distance=r/Math.sin(v)*1.22;const sr=Math.max(r,8);key.target.position.copy(center);key.position.copy(center).add(new T.Vector3(-.85,1.55,1.05).multiplyScalar(sr*3.4));Object.assign(key.shadow.camera,{left:-sr*1.3,right:sr*1.3,top:sr*1.3,bottom:-sr*1.3,near:sr*.05,far:sr*14});key.shadow.camera.updateProjectionMatrix();key.shadow.bias=-.0002;key.shadow.normalBias=sr*.0008;key.shadow.needsUpdate=true;'),
              ("function metric(id,name,value,unit='mm')","function seamDetail(){if(state.mode!=='seam'||!seamModel)return;detailView=true;const h=seamModel.holes[Math.floor(seamModel.holes.length/2)],center=new T.Vector3(h.x,root.position.y,h.z);control.target.copy(center);camera.up.set(0,1,0);camera.position.copy(center).add(new T.Vector3(5.2,7.4,8.6));camera.near=.015;camera.far=5000;camera.updateProjectionMatrix();control.update();document.querySelectorAll('[data-camera]').forEach(b=>b.classList.remove('active'));render();}\n $('#seam-detail').onclick=seamDetail;\n function metric(id,name,value,unit='mm')"),
              ('sourceCheck,guards,rayHoles,seamAudit:','sourceCheck,guards,rayHoles,seamDetail,seamAudit:'),
              ('原工程对象 #32','Parametric shoe last.3dm · #32')])
            patch('index.html',[('<button id="shot">截图</button>','<button id="shot">截图</button><button id="seam-detail" hidden>针孔特写</button>')])
            patch('tests/browser.mjs',[("await p.locator('#p-count').evaluate","await p.locator('#seam-detail').click();check('needle-hole-macro-is-real-camera',await p.evaluate(()=>SHOE_R02.camera.position.distanceTo(SHOE_R02.control.target)<15));await shot('06b-needle-hole-macro');const macroRays=await p.evaluate(()=>SHOE_R02.rayHoles());check('macro-keeps-original-holes',macroRays.holeHits===0&&macroRays.materialHits>0,macroRays);\n await p.locator('#p-count').evaluate")])
            receipt.write_text(json.dumps({'files':changes,'review':'Actual browser screenshot review: higher pattern contrast, legible part labels, local shadow frustum removes self-shadow striping, true camera macro for original seam specimen. Native geometry and sewing paths are unchanged.','previousBrowserRun':38041064243},indent=2))
          else:print('Review correction already applied; retaining current sources.')
          fail=R/'evidence/failures';fail.mkdir(parents=True,exist_ok=True)
          (fail/'38040804181.json').write_text(json.dumps({'runId':38040804181,'sourceBuild':'81f8e84ef6def784c49103e618668202840b71f3','stage':'browser startup','status':'failed','errors':['SyntaxError: Unexpected token <'],'cause':'HTML replacement-string dollar-ampersand expansion corrupted JavaScript. Corrected function replacements and final-script syntax checks are recorded in BUILD_EMBED_FIX.json.','wasPublished':False,'artifactId':11666255439},indent=2))
          PY
      - name: Exact browser/build dependencies
        run: |
          mkdir -p /tmp/shoe-r02-public
          cd /tmp/shoe-r02-public
          npm init -y >/dev/null
          npm install --save-exact three@0.179.1 esbuild@0.25.10 playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Rebuild from reviewed modules and run local gates
        working-directory: shoe-workshop/r02
        env:
          EXPECT_BUILD: ${{ github.sha }}
        run: |
          ln -s /tmp/shoe-r02-public/node_modules node_modules
          node tests/numerics.mjs
          node tools/build.mjs
          node tests/browser.mjs
      - name: Publish only a fixed unaccepted research candidate
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/feature/shoe-atelier-r01-20261010 | cut -f1)
          test "$current" = "$GITHUB_SHA"
          rm -f shoe-workshop/r02/node_modules
          git config user.name 'Shoe R02 Build'
          git config user.email 'shoe-r02@users.noreply.github.com'
          git add shoe-workshop/r02
          git commit -m 'build(shoes): R02-S1 reviewed source modules and local browser evidence [skip ci]'
          git push origin HEAD:feature/shoe-atelier-r01-20261010
          target=$(git rev-parse HEAD)
          echo "SHOE_TARGET_COMMIT=$target" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/$target/shoe-workshop/r02/public-lite.html" >> "$GITHUB_ENV"
          ln -s /tmp/shoe-r02-public/node_modules shoe-workshop/r02/node_modules
      - name: Verify public fixed bytes and source identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import{createHash}from'node:crypto';
          const {SHOE_TARGET_COMMIT:sha,SHOE_EXPECT_BUILD:source}=process.env;if(!/^[a-f0-9]{40}$/.test(sha||'')||!/^[a-f0-9]{40}$/.test(source||''))throw Error('Fixed commits required');
          const r='shoe-workshop/r02',local=fs.readFileSync(r+'/public-lite.html'),m=JSON.parse(fs.readFileSync(r+'/BUILD_MANIFEST.json'));
          const raw=`https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/${sha}/shoe-workshop/r02/public-lite.html`;
          const response=await fetch(raw,{signal:AbortSignal.timeout(90000)}),bytes=Buffer.from(await response.arrayBuffer()),hash=createHash('sha256').update(bytes).digest('hex');
          const report={schema:'kaopu-shoe-r02-public-bytes/1',testedAt:new Date().toISOString(),targetCommit:sha,expectedSource:source,url:raw,status:response.status,bytes:bytes.length,sha256:hash,matchesCheckout:local.equals(bytes),matchesBuild:hash===m.runtime.sha256&&m.sourceBuild===source,scope:'Byte verification only; browser evidence remains separately required.'};
          fs.mkdirSync(r+'/evidence/public',{recursive:true});fs.writeFileSync(r+'/evidence/public/PUBLIC_BYTES.json',JSON.stringify(report,null,2));if(!response.ok||!report.matchesCheckout||!report.matchesBuild)throw Error('Public frozen bytes differ');console.log(JSON.stringify(report,null,2));
          JS
      - name: Full regression through actual public HTTPS navigation
        working-directory: shoe-workshop/r02
        env:
          EXPECT_BUILD: ${{ github.sha }}
          EVIDENCE_DIR: evidence/public
        run: node tests/browser.mjs
      - name: Record explicit research-only delivery and immutable URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,datetime,hashlib
          R=Path('shoe-workshop/r02');m=json.loads((R/'BUILD_MANIFEST.json').read_text());b=json.loads((R/'evidence/public/QA.json').read_text());n=json.loads((R/'evidence/numerics/QA.json').read_text())
          assert b['status']=='passed' and n['status']=='passed' and b['public'] and not b['errors']
          receipt={'schema':'kaopu-shoe-r02-delivery/1','version':'R02-S1','fixedCommit':os.environ['SHOE_TARGET_COMMIT'],'buildExecutionCommit':os.environ['SHOE_EXPECT_BUILD'],'publicUrl':os.environ['PUBLIC_URL'],'runtime':m['runtime'],'numericalChecks':len(n['checks']),'publicBrowserChecks':b['total'],'publicBrowserPassed':b['passed'],'publicBrowserRun':int(os.environ['GITHUB_RUN_ID']),'methodologyCommit':'a0cd098b4a0fcb8b5d5de90200acd0fb1051f543','rejectedBaseline':'R01.2','renderReview':'Original screenshot problems corrected; latest screenshots require separate inspection. This receipt is NOT user visual acceptance.','acceptance':{'publicInteraction':True,'nativeGrasshopperExecution':False,'completeShoe':False,'productionPatterns':False,'comfortOrDynamics':False,'userVisualApproval':False},'deviceScope':'Chromium/SwiftShader desktop 1440x1000 and 390x844 mobile viewport simulation; not physical devices.','recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (R/'RELEASE.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2));(R/'PUBLIC_URL.txt').write_text(receipt['publicUrl']+'\n')
          p=R/'README.md';s=p.read_text();s+='\n## 固定公网候选\n\n'+receipt['publicUrl']+'\n\n当前仅交付原工程复现与参数研究工位，不是已完成成鞋。详细校验及未完成项见 RELEASE.json。\n';p.write_text(s)
          PY
          rm -f shoe-workshop/r02/node_modules
          current=$(git ls-remote origin refs/heads/feature/shoe-atelier-r01-20261010 | cut -f1)
          test "$current" = "$SHOE_TARGET_COMMIT"
          git add shoe-workshop/r02/evidence/public shoe-workshop/r02/RELEASE.json shoe-workshop/r02/PUBLIC_URL.txt shoe-workshop/r02/README.md
          git commit -m 'test(shoes): persist actual fixed-public browser evidence and research-only receipt [skip ci]'
          git push origin HEAD:feature/shoe-atelier-r01-20261010
      - name: Preserve reviewable sources and real screenshots
        if: always()
        run: tar --exclude=node_modules --exclude=source/teacher --exclude=source-transfer -czf /tmp/shoe-r02-public-reviewed.tgz -C shoe-workshop r02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoe-r02-public-reviewed
          path: /tmp/shoe-r02-public-reviewed.tgz
          retention-days: 30
