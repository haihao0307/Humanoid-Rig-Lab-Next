name: Shorts R2.4 centre-rise review
on:
  push:
    branches: [fix/shorts-two-leg-assembly-r2-20260919]
    paths:
      - 'clothing/ShortsRiseAssemblyR2.js'
      - 'tools/apply-shorts-r24-rise.mjs'
      - 'tools/test-shorts-rise-r24.mjs'
      - 'tools/review-shorts-rise-r24.mjs'
      - '.github/workflows/shorts-r24-rise-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shorts-r24-rise-review
  cancel-in-progress: true
jobs:
  actual-browser-centre-rise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire canonical R2.4 centre-rise source
        run: node tools/apply-shorts-r24-rise.mjs
      - name: Build and test canonical source
        shell: bash
        run: |
          mkdir -p /tmp/shorts-r24-rise
          set -o pipefail
          {
            node tools/build-pure.mjs
            node tools/build-shorts-preview.mjs
            node tools/check-pure.mjs
            node --test tools/test-shorts-*.mjs
          } 2>&1 | tee /tmp/shorts-r24-rise/build-and-test.log
      - name: Retain validated canonical source
        run: |
          test "$GITHUB_REF_NAME" = "fix/shorts-two-leg-assembly-r2-20260919"
          git add source/assembly.json source/runtime.template.js clothing/ClothShorts.js clothing/ShortsRiseAssemblyR2.js index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(shorts): connect centre-front and centre-back rises in R2.4'
            git push origin HEAD:fix/shorts-two-leg-assembly-r2-20260919
          fi
      - name: Install isolated browser dependency
        run: |
          mkdir -p /tmp/shorts-browser
          npm install --prefix /tmp/shorts-browser --no-audit --no-fund playwright@1.55.0
          /tmp/shorts-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture actual R2.4 progress views
        run: |
          python3 -m http.server 8793 --bind 127.0.0.1 >/tmp/shorts-r24-http.log 2>&1 &
          node tools/review-shorts-rise-r24.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-r2-4-centre-rise-progress
          path: /tmp/shorts-r24-rise
          if-no-files-found: error
          retention-days: 14
