name: Cat Procedural Body V1 P1.5 Neutral Stance

on:
  push:
    branches:
      - codex/cat-procedural-body-v1-p1-5-neutral-stance-20260918
    paths:
      - .github/workflows/cat-procedural-body-v1-p15.yml
      - cat-kaopu/tools/bootstrap_cat_procedural_v1_p15.py
      - cat-kaopu/tools/bootstrap/p15_sources.part*.b64
      - cat-kaopu/procedural-cat-v1/**
      - cat-kaopu/tools/validate_cat_procedural_v1.mjs
      - cat-kaopu/tools/validate_cat_procedural_v1_p15.mjs
      - cat-kaopu/tools/capture_cat_procedural_v1_p15.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cat-procedural-body-v1-p15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  neutral-stance-validate-capture:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout P1.5 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode audited P1.5 sources
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python cat-kaopu/tools/bootstrap_cat_procedural_v1_p15.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate base procedural contract
        run: node cat-kaopu/tools/validate_cat_procedural_v1.mjs

      - name: Validate P1.5 neutral stance and joint carriers
        run: node cat-kaopu/tools/validate_cat_procedural_v1_p15.mjs

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run P1.5 WebGL2 fixed-view QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > "${RUNNER_TEMP}/cat-procedural-p15-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/cat-kaopu/procedural-cat-v1/index.html; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "${RUNNER_TEMP}/cat-procedural-p15-http.log" || true; exit 1; fi
          CAT_PROCEDURAL_P15_URL='http://127.0.0.1:4173/cat-kaopu/procedural-cat-v1/index.html' \
            node cat-kaopu/tools/capture_cat_procedural_v1_p15.mjs

      - name: Upload P1.5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-procedural-body-v1-p1-5-${{ github.run_number }}
          path: |
            cat-kaopu/procedural-cat-v1/index.html
            cat-kaopu/procedural-cat-v1/README.md
            cat-kaopu/procedural-cat-v1/DEFAULT_GREY_TABBY_A.catdna.json
            cat-kaopu/procedural-cat-v1/P1_AUTHORITATIVE_CALIBRATION.json
            cat-kaopu/procedural-cat-v1/P1_1_MORPHOLOGY_CANDIDATE.json
            cat-kaopu/procedural-cat-v1/P1_2_SILHOUETTE_CANDIDATE.json
            cat-kaopu/procedural-cat-v1/P1_3_MASS_DISTRIBUTION_CANDIDATE.json
            cat-kaopu/procedural-cat-v1/P1_4_JOINT_CARRIER_CANDIDATE.json
            cat-kaopu/procedural-cat-v1/P1_5_NEUTRAL_STANCE_CANDIDATE.json
            cat-kaopu/procedural-cat-v1/CAT_PROCEDURAL_CAT_V1_CONTRACT.json
            cat-kaopu/procedural-cat-v1/CAT_DNA_SCHEMA.json
            cat-kaopu/procedural-cat-v1/src/cat-procedural-core.mjs
            cat-kaopu/tools/validate_cat_procedural_v1_p15.mjs
            cat-kaopu/tools/capture_cat_procedural_v1_p15.mjs
            cat-kaopu/qa/procedural-cat-v1-p1-5/*.json
            cat-kaopu/qa/procedural-cat-v1-p1-5/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit P1.5 source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cat-procedural-build-bot'
          git config user.email 'cat-procedural-build-bot@users.noreply.github.com'
          git add \
            cat-kaopu/procedural-cat-v1/index.html \
            cat-kaopu/procedural-cat-v1/README.md \
            cat-kaopu/procedural-cat-v1/DEFAULT_GREY_TABBY_A.catdna.json \
            cat-kaopu/procedural-cat-v1/P1_5_NEUTRAL_STANCE_CANDIDATE.json \
            cat-kaopu/procedural-cat-v1/CAT_PROCEDURAL_CAT_V1_CONTRACT.json \
            cat-kaopu/procedural-cat-v1/CAT_DNA_SCHEMA.json \
            cat-kaopu/procedural-cat-v1/src/cat-procedural-core.mjs \
            cat-kaopu/tools/validate_cat_procedural_v1_p15.mjs \
            cat-kaopu/tools/capture_cat_procedural_v1_p15.mjs \
            cat-kaopu/qa/procedural-cat-v1-p1-5
          if git diff --cached --quiet; then echo 'No P1.5 changes to commit.'; exit 0; fi
          git commit -m 'build(cat): establish P1.5 neutral stance and archive evidence [generated]'
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
