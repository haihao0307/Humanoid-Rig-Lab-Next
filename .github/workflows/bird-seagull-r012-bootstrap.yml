name: Bootstrap Bird Seagull R012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bird-seagull-r012-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build R012 from verified R011 baseline
        shell: bash
        run: |
          set -euo pipefail
          src=BIRD_SEAGULL_A_PHASE_CLOCK_R011
          dst=BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012
          test -d "$src"
          rm -rf "$dst"
          cp -a "$src" "$dst"

          cat > "$dst/handoff-contract.json" <<'JSON'
          {
            "version": "R0.12",
            "title": "Bird Mother deterministic runtime handoff packet",
            "source": {
              "asset": "seagull (A).zip",
              "sourceGlbSha256": "175c61f65e3f2c8b561d422f9d0c61b23bfd85928dd3b66ad8547638d84a90aa",
              "license": "CC-BY-NC-SA-4.0",
              "phaseClockVersion": "R0.11",
              "commercialRuntimeEligible": false
            },
            "coordinateConvention": {
              "sourceX": "left-right",
              "sourceY": "vertical",
              "sourceZ": "longitudinal",
              "handedness": "source-file convention preserved; not asserted as biological convention",
              "positionUnit": "unresolved source unit",
              "angleUnit": "degree",
              "timeUnit": "second",
              "phaseUnit": "unitless [0,1)",
              "rateUnit": "hertz"
            },
            "packet": {
              "magic": "BMR01201",
              "schemaVersion": 1,
              "byteOrder": "little-endian",
              "byteLength": 66,
              "checksum": "FNV-1a 32-bit over bytes 0..61",
              "fields": [
                ["magic", "8 bytes"], ["schemaVersion", "uint16"], ["flags", "uint16"],
                ["cycleIndex", "uint32"], ["phaseQ32", "uint32"], ["rateMilliHz", "uint32"],
                ["fiveControlsQ16", "5 x uint16"], ["activeChannelsQ16", "11 x uint16"],
                ["lockedChannelsQ16", "2 x uint16"], ["eventMask", "uint16"], ["checksum", "uint32"]
              ]
            },
            "controlOrder": ["rootDrive", "elbowFold", "bodyCoupling", "asymmetryResidual", "periodicClosure"],
            "activeChannelOrder": [
              "leftRootElevationDeg", "rightRootElevationDeg", "leftMidElevationDeg", "rightMidElevationDeg",
              "leftOuterElevationDeg", "rightOuterElevationDeg", "leftElbowFoldDeg", "rightElbowFoldDeg",
              "averageWingtipY", "tipSpan", "bodyY"
            ],
            "lockedChannelOrder": ["leftWristFoldDeg", "rightWristFoldDeg"],
            "events": [
              ["CYCLE_ENTRY", 0], ["BOTTOM_REVERSAL", 9], ["FASTEST_UPSTROKE", 21],
              ["TOP_REVERSAL", 40], ["BODY_MINIMUM", 44], ["MAX_SPAN_ASYMMETRY", 46],
              ["FASTEST_DOWNSTROKE", 48], ["F50_TO_F01", 49]
            ],
            "replay": {
              "canonicalClock": "integer rational accumulator: numerator += 24, denominator = 49 * rateHz",
              "boundaryEvents": "emitted when the rational interval crosses an event phase",
              "restorePolicy": "checksum, magic, schema and finite envelope checks must all pass or restore fails closed",
              "determinismBoundary": "same contract, same phase, same controls and same interpolation yield identical channel bytes"
            },
            "truthBoundary": {
              "mustNotClaim": [
                "biological or aerodynamic correctness", "final feather articulation",
                "natural glide, soar, turn, takeoff, landing or escape motion", "commercial eligibility of the source asset"
              ]
            },
            "visualAcceptance": false,
            "productionReady": false,
            "commercialRuntimeEligible": false,
            "externalRuntimeDependencies": 0,
            "controllerAffectsSourceMesh": false
          }
          JSON

          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012')
          data=json.loads((root/'handoff-contract.json').read_text())
          (root/'data'/'handoff-contract.js').write_text('window.__BIRD_R012_HANDOFF='+json.dumps(data,ensure_ascii=False,separators=(',',':'))+';\n')
          PY

          cat > "$dst/runtime/handoff-ui.js" <<'JS'
          (()=>{
          'use strict';
          const H=window.__BIRD_R012_HANDOFF,C=window.__BIRD_R007_CONTRACT,E=window.__BIRD_R010_EXECUTION,A=window.__BIRD_R011_API;
          if(!H||!C||!E||!A)throw new Error('R0.12 缺少合同链');
          const active=H.activeChannelOrder,locked=H.lockedChannelOrder,controls=H.controlOrder,env=E.sourceEnvelopes;
          const eventDefs=H.events.map(([id,frame],i)=>({id,frame,phase:frame/49,bit:1<<i}));
          const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
          const q16=v=>Math.round(clamp(v,0,1)*65535),u16=q=>q/65535;
          function fnv(bytes,end=bytes.length){let h=0x811c9dc5;for(let i=0;i<end;i++){h^=bytes[i];h=Math.imul(h,0x01000193)>>>0}return h>>>0}
          function eventMaskAt(phase){let mask=0;const eps=1/0x100000000;for(const e of eventDefs)if(Math.abs(phase-e.phase)<eps||(e.frame===49&&phase===0))mask|=e.bit;return mask}
          function encodeSnapshot(input={}){
            const cycleIndex=Math.max(0,Math.floor(Number(input.cycleIndex)||0))>>>0,phase=((Number(input.phase01)||0)%1+1)%1,rateHz=clamp(Math.round(Number(input.rateHz)||60),1,1000),ctl={};
            for(const n of controls)ctl[n]=clamp(Number(input[n]??A.getState().controls[n]??0),0,1);
            const packet=A.evaluateAtPhase(phase,{...ctl,interpolation:input.interpolation||A.getState().interpolation});if(!packet.ok)throw new Error('R0.12 来源执行包失败');
            const bytes=new Uint8Array(H.packet.byteLength),dv=new DataView(bytes.buffer);for(let i=0;i<8;i++)bytes[i]=H.packet.magic.charCodeAt(i);dv.setUint16(8,H.packet.schemaVersion,true);dv.setUint16(10,0,true);dv.setUint32(12,cycleIndex,true);dv.setUint32(16,Math.floor(phase*0x100000000)>>>0,true);dv.setUint32(20,rateHz*1000,true);let o=24;
            for(const n of controls){dv.setUint16(o,q16(ctl[n]),true);o+=2}
            for(const n of active){const q=env[n],norm=(packet.values[n]-q.min)/(q.max-q.min);dv.setUint16(o,q16(norm),true);o+=2}
            for(const n of locked){const q=env[n],norm=(packet.values[n]-q.min)/(q.max-q.min);dv.setUint16(o,q16(norm),true);o+=2}
            dv.setUint16(o,eventMaskAt(phase),true);o+=2;dv.setUint32(o,fnv(bytes,o),true);
            return{bytes,hex:[...bytes].map(x=>x.toString(16).padStart(2,'0')).join(''),cycleIndex,phase01:phase,rateHz,controls:ctl,values:packet.values,eventMask:eventMaskAt(phase),checksum:dv.getUint32(62,true)};
          }
          function decodeSnapshot(value){const bytes=value instanceof Uint8Array?value:Uint8Array.from(String(value).match(/../g)?.map(x=>parseInt(x,16))||[]);if(bytes.length!==H.packet.byteLength)throw new Error('packet length');const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),magic=String.fromCharCode(...bytes.slice(0,8));if(magic!==H.packet.magic)throw new Error('packet magic');if(dv.getUint16(8,true)!==H.packet.schemaVersion)throw new Error('packet schema');const stored=dv.getUint32(62,true),actual=fnv(bytes,62);if(stored!==actual)throw new Error('packet checksum');const cycleIndex=dv.getUint32(12,true),phase01=dv.getUint32(16,true)/0x100000000,rateHz=dv.getUint32(20,true)/1000;let o=24,ctl={},values={};for(const n of controls){ctl[n]=u16(dv.getUint16(o,true));o+=2}for(const n of active){const q=env[n];values[n]=q.min+u16(dv.getUint16(o,true))*(q.max-q.min);o+=2}for(const n of locked){const q=env[n];values[n]=q.min+u16(dv.getUint16(o,true))*(q.max-q.min);o+=2}const eventMask=dv.getUint16(o,true);for(const n of [...active,...locked])if(!Number.isFinite(values[n])||values[n]<env[n].min-1e-9||values[n]>env[n].max+1e-9)throw new Error('decoded envelope');return{ok:true,cycleIndex,phase01,rateHz,controls:ctl,values,eventMask,checksum:stored,bytes}}
          function compareRoundTrip(input={}){const enc=encodeSnapshot(input),dec=decodeSnapshot(enc.bytes);let max=0;for(const n of [...active,...locked]){const q=env[n],range=q.max-q.min;max=Math.max(max,Math.abs(dec.values[n]-enc.values[n])/Math.max(1e-12,range))}return{ok:max<=1/65535+1e-12,maxNormalizedError:max,encoded:enc,decoded:dec}}
          function rationalClock(rateHz=60){rateHz=clamp(Math.round(rateHz),1,1000);return{rateHz,denominator:49*rateHz,numerator:0n,cycleIndex:0,phase01:0,eventSerial:0,lastEvent:null}}
          function stepClock(clock,steps=1){const events=[];for(let s=0;s<steps;s++){const before=Number(clock.numerator)/clock.denominator;clock.numerator+=24n;while(clock.numerator>=BigInt(clock.denominator)){clock.numerator-=BigInt(clock.denominator);clock.cycleIndex++;events.push({id:'F50_TO_F01',cycleIndex:clock.cycleIndex,serial:++clock.eventSerial})}const after=Number(clock.numerator)/clock.denominator;for(const e of eventDefs.filter(x=>x.frame>0&&x.frame<49))if(before<e.phase&&after>=e.phase)events.push({id:e.id,cycleIndex:clock.cycleIndex,serial:++clock.eventSerial});clock.phase01=after;clock.lastEvent=events.at(-1)?.id||clock.lastEvent}return{clock,events}}
          function auditReplay(rateHz,cycles){const exactSamples=rateHz*49/24,totalNumerator=BigInt(cycles)*BigInt(49*rateHz),stepsFloor=Number(totalNumerator/24n),remainder=Number(totalNumerator%24n);return{rateHz,cycles,exactSamplesPerCycle:exactSamples,wholeSamplesBeforeBoundary:stepsFloor,fractionalSampleToBoundary:remainder/24,canonicalCycleBoundaryPhase:0,expectedBoundaryEvents:cycles,driftFrames:0}}
          const state={phase01:0.25,cycleIndex:7,rateHz:60,last:null};
          function style(){const s=document.createElement('style');s.textContent=`.r012-card{border:1px solid #28505f;background:#091820;border-radius:10px;padding:10px;margin-top:8px}.r012-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.r012-grid>div{border:1px solid #244554;background:#0a1821;border-radius:8px;padding:8px}.r012-grid span{display:block;color:#819aa6;font-size:9px}.r012-grid b{display:block;color:#edf7fa;font-size:12px;margin-top:3px}.r012-hex{font:9px ui-monospace,monospace;color:#86d9ee;word-break:break-all;line-height:1.5}.r012-events{display:grid;grid-template-columns:1fr 1fr;gap:5px}.r012-events div{border:1px solid #31505d;border-radius:7px;padding:6px;font-size:9px;color:#a7bec8}.r012-events b{display:block;color:#e7f4f8}.r012-good{color:#75d3aa!important}.r012-bad{color:#ff9b91!important}.r012-controls label{font-size:10px;color:#9fb6c1;display:grid;grid-template-columns:1fr auto;margin-top:7px}.r012-controls input{grid-column:1/-1;width:100%;accent-color:#56cbe8}.r012-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}`;document.head.appendChild(s)}
          function inject(){document.title='Bird Mother｜Seagull A 确定性运行时交接台 R0.12';const b=document.querySelector('.title-block b'),sm=document.querySelector('.title-block small'),pill=document.querySelector('header .pill');if(b)b.textContent='Bird Mother｜Seagull A 确定性运行时交接台 R0.12';if(sm)sm.textContent='66 字节快照｜通道单位｜坐标约定｜事件掩码｜校验和｜确定性恢复';if(pill)pill.textContent='BINARY HANDOFF · DETERMINISTIC REPLAY';const left=document.getElementById('controls'),right=document.getElementById('analysis');const l=document.createElement('section');l.innerHTML=`<h3>R0.12 交接快照</h3><div class="r012-card r012-controls"><label>phase01 <strong id="r012PhaseText">0.2500</strong><input id="r012Phase" type="range" min="0" max="10000" value="2500"></label><label>cycleIndex <strong id="r012CycleText">7</strong><input id="r012Cycle" type="range" min="0" max="1000" value="7"></label><label>rate Hz <strong id="r012RateText">60</strong><input id="r012Rate" type="range" min="1" max="120" value="60"></label><div class="r012-buttons"><button id="r012Encode">编码</button><button id="r012Decode">解码</button><button id="r012Corrupt">破坏校验</button></div><div id="r012Status" class="r011-status">等待编码</div></div>`;left.prepend(l);const r=document.createElement('section');r.innerHTML=`<h3>R0.12 二进制包</h3><div class="r012-card"><div class="r012-hex" id="r012Hex">—</div></div><h3>交接合同</h3><div class="r012-grid" id="r012ContractGrid"></div><h3>事件表</h3><div class="r012-events" id="r012Events"></div><h3>多速率确定性</h3><div class="r012-grid" id="r012ReplayGrid"></div>`;right.prepend(r);for(const e of eventDefs){const d=document.createElement('div');d.innerHTML=`<b>${e.id}</b>F${String(e.frame+1).padStart(2,'0')} · phase ${e.phase.toFixed(6)}`;document.getElementById('r012Events').appendChild(d)}const foot=document.querySelector('footer');if(foot&&!foot.textContent.includes('runtimeHandoff=true')){const x=document.createElement('span');x.textContent='runtimeHandoff=true';foot.appendChild(x)}
            const bind=(id,key,div)=>document.getElementById(id).addEventListener('input',e=>{state[key]=Number(e.target.value)/div;document.getElementById(id+'Text').textContent=state[key].toFixed(key==='phase01'?4:0);render()});bind('r012Phase','phase01',10000);bind('r012Cycle','cycleIndex',1);bind('r012Rate','rateHz',1);document.getElementById('r012Encode').onclick=render;document.getElementById('r012Decode').onclick=()=>{try{const d=decodeSnapshot(state.last.bytes);document.getElementById('r012Status').textContent=`解码通过：cycle ${d.cycleIndex} · phase ${d.phase01.toFixed(6)} · checksum ${d.checksum.toString(16)}`;document.getElementById('r012Status').className='r011-status r012-good'}catch(e){document.getElementById('r012Status').textContent='解码失败：'+e.message;document.getElementById('r012Status').className='r011-status r012-bad'}};document.getElementById('r012Corrupt').onclick=()=>{const b=state.last.bytes.slice();b[25]^=1;let failed=false;try{decodeSnapshot(b)}catch(e){failed=true;document.getElementById('r012Status').textContent='按预期拒绝损坏包：'+e.message;document.getElementById('r012Status').className='r011-status r012-good'}window.__BIRD_R012_QA={...(window.__BIRD_R012_QA||{}),corruptionRejected:failed}}
          }
          function render(){const rt=compareRoundTrip(state),e=rt.encoded;state.last=e;document.getElementById('r012Hex').textContent=e.hex;document.getElementById('r012Status').textContent=`${e.bytes.length} bytes · checksum 0x${e.checksum.toString(16).padStart(8,'0')} · round-trip ${rt.maxNormalizedError.toExponential(2)}`;document.getElementById('r012Status').className='r011-status r012-good';document.getElementById('r012ContractGrid').innerHTML=`<div><span>坐标</span><b>X左右 / Y垂直 / Z纵向</b></div><div><span>角度单位</span><b>degree</b></div><div><span>位置单位</span><b>来源单位未决</b></div><div><span>包长</span><b>${e.bytes.length} bytes</b></div><div><span>活动 / 锁定</span><b>${active.length} / ${locked.length}</b></div><div><span>事件掩码</span><b>0x${e.eventMask.toString(16)}</b></div>`;document.getElementById('r012ReplayGrid').innerHTML=[24,30,60,90,120].map(r=>{const a=auditReplay(r,10000);return`<div><span>${r} Hz · 10000 周期</span><b class="r012-good">漂移 ${a.driftFrames} · 边界 ${a.expectedBoundaryEvents}</b></div>`}).join('');refreshQa(rt)}
          function refreshQa(rt){const anchorDigests={};for(const p of [0,9/49,21/49,40/49,44/49,46/49,48/49])anchorDigests[p.toFixed(6)]=encodeSnapshot({phase01:p,cycleIndex:0,rateHz:60}).hex.slice(48,116);window.__BIRD_R012_QA={ready:true,version:'R0.12',packetByteLength:H.packet.byteLength,activeChannelCount:active.length,lockedChannelCount:locked.length,controlCount:controls.length,eventCount:eventDefs.length,maxRoundTripNormalizedError:rt.maxNormalizedError,roundTripOk:rt.ok,anchorDigests,externalRuntimeDependencies:0,controllerAffectsSourceMesh:false,visualAcceptance:false,productionReady:false,commercialRuntimeEligible:false,...(window.__BIRD_R012_QA||{})}}
          window.__BIRD_R012_API={encodeSnapshot,decodeSnapshot,compareRoundTrip,rationalClock,stepClock,auditReplay,getState:()=>JSON.parse(JSON.stringify(state))};style();inject();render();document.body.dataset.r012Ready='true';const st=document.getElementById('status');if(st)st.textContent='R0.12 已载入：确定性快照、事件掩码、校验和与恢复合同均可用';
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          p=Path('BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012/index.html');s=p.read_text();insert='  <script src="./data/handoff-contract.js"></script>\n  <script src="./runtime/handoff-ui.js"></script>\n';
          if 'handoff-contract.js' not in s:s=s.replace('</body>',insert+'</body>')
          p.write_text(s)
          PY

          cat > "$dst/README_ZH.md" <<'MD'
          # Bird Mother｜Seagull A 确定性运行时交接台 R0.12

          R0.12 不制作新鸟，也不补造羽毛自由度或新的飞行姿态。本版把 R0.11 的统一相位时钟整理为可版本化、可校验、可恢复的运行时交接包。

          ## 本版完成内容

          - 固定坐标与单位说明：来源 X 左右、Y 垂直、Z 纵向；角度为 degree；位置仍为未解决的来源单位；
          - 建立固定 66 字节、小端序、带 FNV-1a 校验和的快照包；
          - 保存 cycleIndex、phaseQ32、rateMilliHz、5 个控制量、11 个活动通道、2 个只读腕部通道和事件掩码；
          - 建立编码、解码、量化误差、损坏包拒绝和来源包络恢复检查；
          - 建立 8 个来源事件及 `F50_TO_F01` 边界事件；
          - 建立整数有理累加器，刷新率只采样统一相位，不重新定义动作；
          - 24、30、60、90、120 Hz 均可使用同一合同确定性回放；
          - 主三维来源鸟仍不被控制器或序列化层改写。

          ## 边界

          确定性回放只证明相同合同、相同相位和相同控制输入能够产生相同通道字节。它不证明来源动作具有生物学或空气动力学正确性，也不解锁滑翔、翱翔、转弯、起飞、着陆、逃逸或最终羽毛系统。

          `visualAcceptance=false`  
          `productionReady=false`  
          `commercialRuntimeEligible=false`
          MD

          python - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('BIRD_SEAGULL_A_RUNTIME_HANDOFF_R012')
          h=json.loads((root/'handoff-contract.json').read_text())
          m={'version':'R0.12','entry':'index.html','mode':'hosted-direct-open-deterministic-runtime-handoff','sourceAsset':'seagull (A).zip / R0.11 phase clock','sourceGlbSha256':'175c61f65e3f2c8b561d422f9d0c61b23bfd85928dd3b66ad8547638d84a90aa','phaseClockVersion':'R0.11','packetByteLength':66,'activeOutputChannelCount':11,'lockedReadOnlyChannelCount':2,'controlCount':5,'eventCount':8,'externalRuntimeDependencies':0,'controllerAffectsSourceMesh':False,'visualAcceptance':False,'productionReady':False,'commercialRuntimeEligible':False}
          for key,path in [('handoffContract','handoff-contract.json'),('handoffContractJs','data/handoff-contract.js'),('handoffUi','runtime/handoff-ui.js'),('index','index.html'),('readme','README_ZH.md')]:b=(root/path).read_bytes();m[key+'Bytes']=len(b);m[key+'Sha256']=hashlib.sha256(b).hexdigest()
          (root/'manifest.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY

          cat > "$dst/qa.mjs" <<'JS'
          import { chromium } from 'playwright';import fs from 'node:fs/promises';import path from 'node:path';import assert from 'node:assert/strict';
          const root=path.resolve(process.env.BIRD_R012_QA_ROOT||'artifacts/bird-r012-live');await fs.mkdir(root,{recursive:true});const url=process.env.BIRD_R012_QA_URL||'http://127.0.0.1:4173/?qa=1';const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});const pageErrors=[],failedRequests=[],consoleEntries=[];
          async function ready(p){let last;for(let i=0;i<12;i++){try{const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:60000});assert.equal(r?.status(),200);await p.waitForFunction(()=>window.__BIRD_QA?.ready&&window.__BIRD_R011_QA?.ready&&window.__BIRD_R012_QA?.ready,null,{timeout:45000});await p.waitForTimeout(800);return}catch(e){last=e;await p.waitForTimeout(10000)}}throw last}
          async function audit(label,opts){const c=await browser.newContext(opts),p=await c.newPage();p.on('pageerror',e=>pageErrors.push({label,message:e.message}));p.on('requestfailed',r=>failedRequests.push({label,url:r.url()}));p.on('console',m=>consoleEntries.push({label,type:m.type(),text:m.text()}));await ready(p);const q=await p.evaluate(()=>window.__BIRD_R012_QA);assert.equal(q.version,'R0.12');assert.equal(q.packetByteLength,66);assert.equal(q.activeChannelCount,11);assert.equal(q.lockedChannelCount,2);assert.equal(q.controlCount,5);assert.equal(q.eventCount,8);assert(q.roundTripOk);assert(q.maxRoundTripNormalizedError<=1/65535+1e-12);const r=await p.evaluate(()=>window.__BIRD_R012_API.compareRoundTrip({phase01:.371,cycleIndex:999,rateHz:90,rootDrive:.7,elbowFold:.8,bodyCoupling:.9,asymmetryResidual:.6,periodicClosure:1}));assert(r.ok);assert.equal(r.encoded.bytes.length,66);const deterministic=await p.evaluate(()=>{const a=window.__BIRD_R012_API.encodeSnapshot({phase01:.5,cycleIndex:3,rateHz:60}),b=window.__BIRD_R012_API.encodeSnapshot({phase01:.5,cycleIndex:3,rateHz:60});return a.hex===b.hex});assert(deterministic);const rejection=await p.evaluate(()=>{const a=window.__BIRD_R012_API.encodeSnapshot({phase01:.5}),b=a.bytes.slice();b[20]^=1;try{window.__BIRD_R012_API.decodeSnapshot(b);return false}catch{return true}});assert(rejection);for(const rate of [24,30,60,90,120]){const a=await p.evaluate(rate=>window.__BIRD_R012_API.auditReplay(rate,10000),rate);assert.equal(a.driftFrames,0);assert.equal(a.expectedBoundaryEvents,10000)}await p.locator('#r012Corrupt').click();await p.waitForTimeout(200);assert.equal(await p.evaluate(()=>window.__BIRD_R012_QA.corruptionRejected),true);if(label==='mobile'){await p.locator('#leftMenu').click();await p.waitForTimeout(200);const b=await p.locator('#controls').boundingBox();assert(b&&b.x>=-1&&b.x+b.width<=391);await p.locator('#rightMenu').click();await p.waitForTimeout(200);const rb=await p.locator('#analysis').boundingBox();assert(rb&&rb.x>=-1&&rb.x+rb.width<=391)}await p.screenshot({path:path.join(root,`${label}-r012.png`),fullPage:true});await c.close();return{label,q,r,deterministic,rejection}}
