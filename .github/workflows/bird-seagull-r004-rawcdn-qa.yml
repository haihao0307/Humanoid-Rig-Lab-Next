name: Bird Seagull R004 RawCDN Delivery Gate

on:
  push:
    branches:
      - handoff/bird-seagull-a-direct-open-r004-20260923
    paths:
      - 'BIRD_SEAGULL_A_DIRECT_OPEN_R004/**'
      - 'scripts/qa-bird-seagull-r004-rawcdn.mjs'
      - '.github/workflows/bird-seagull-r004-rawcdn-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rawcdn-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify fixed-commit rawcdn URL renders the bird
        run: node scripts/qa-bird-seagull-r004-rawcdn.mjs
      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r004-rawcdn-qa
          path: |
            bird-seagull-r004-rawcdn.json
            bird-seagull-r004-rawcdn.png
          if-no-files-found: warn
