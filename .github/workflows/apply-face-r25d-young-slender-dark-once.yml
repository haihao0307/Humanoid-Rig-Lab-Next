name: Apply face R25D young slender darker role once

on:
  push:
    branches:
      - feature/face-features-r25-20260919
    paths:
      - tools/apply-face-r25d-young-slender-dark.mjs
      - tools/test-face-young-slender-dark.mjs
      - tools/test-face-clean-shaven-neutral-skin.mjs
      - .github/workflows/apply-face-r25d-young-slender-dark-once.yml

permissions:
  contents: write

jobs:
  apply-role-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout R25 branch
        uses: actions/checkout@v4
        with:
          ref: feature/face-features-r25-20260919
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply young slender darker current-role data
        run: node tools/apply-face-r25d-young-slender-dark.mjs

      - name: Rebuild generated workbench
        run: node tools/build-pure.mjs

      - name: Run source and role-data gates
        run: |
          node tools/check-pure.mjs
          node tools/check-face-r25-baseline.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/test-eye-aperture-family.mjs
          node tools/test-face-young-slender-dark.mjs
          node tools/test-face-clean-shaven-neutral-skin.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-identity-warp.mjs
          node tools/test-npc-face-uniforms.mjs

      - name: Commit production role update
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No R25D role changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add body/FaceIdentity.js body/CharacterPresets.js docs/face-knowledge/R25D_YOUNG_SLENDER_DARKER_ROLE_20260920.md index.html FILE_AUDIT.json SHA256SUMS.txt
          git commit -m "face R25D: make current role younger slimmer and darker"
          git push origin HEAD:feature/face-features-r25-20260919
