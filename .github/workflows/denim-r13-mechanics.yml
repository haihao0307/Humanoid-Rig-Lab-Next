name: Denim R13 swatch contact fracture and seam mechanics
on:
  push:
    branches: [feature/denim-r13-contact-tear-seam-20261013]
    paths: ['denim-workshop/r13/**', '.github/workflows/denim-r13-mechanics.yml']
permissions:
  contents: write
concurrency:
  group: denim-r13-mechanics
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: denim-workshop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize and verify readable canonical source
        run: |
          python denim-workshop/r13/hydrate.py
          python denim-workshop/r13/build.py
          for f in denim-workshop/r13/*.js; do node --check "$f"; done
          python -m py_compile denim-workshop/r13/qa.py
          git diff --exit-code HEAD -- denim-workshop/r12-1 denim-workshop/r11 denim-workshop/archives
      - name: Independent mechanics and unchanged legacy regression
        run: node denim-workshop/r13/test-mechanics.cjs
      - name: Install pinned independent browser
        run: |
          pip install playwright==1.55.0 pillow==11.3.0 numpy==2.2.6
          python -m playwright install --with-deps chromium
      - name: Real file navigation, material and three mechanics experiments
        run: xvfb-run -a python -u denim-workshop/r13/qa.py
      - name: Publish only actual file-tested canonical version
        id: publish
        run: |
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('denim-workshop/r13')
          assert json.loads((p/'evidence/file-qa.json').read_text())['passed']
          paths=[str(f) for f in p.iterdir() if f.is_file() and f.suffix in ['.js','.py','.json','.html','.md','.cjs']]+[str(p/'LICENSE')]
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'build(denim): file-tested R13 swatch contact fracture and stitches [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          PUB=$(git rev-parse HEAD)
          echo "commit=$PUB" >> "$GITHUB_OUTPUT"
          echo "url=https://htmlpreview.github.io/?https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PUB}/denim-workshop/r13/index.html" >> "$GITHUB_OUTPUT"
      - name: Actual immutable public rendering and interaction
        env:
          PUBLIC_URL: ${{ steps.publish.outputs.url }}
        run: xvfb-run -a python -u denim-workshop/r13/qa.py --public "$PUBLIC_URL"
      - name: Exact public bytes and scoped delivery receipt
        env:
          PUBLIC_BUILD: ${{ steps.publish.outputs.commit }}
          PUBLIC_URL: ${{ steps.publish.outputs.url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,urllib.request
          p=Path('denim-workshop/r13');file=json.loads((p/'evidence/file-qa.json').read_text());public=json.loads((p/'evidence/public-qa.json').read_text());num=json.loads((p/'MECHANICS_QA.json').read_text());manifest=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert file['passed'] and public['passed'] and num['passed']
          raw='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['PUBLIC_BUILD']+'/denim-workshop/r13/index.html'
          with urllib.request.urlopen(raw,timeout=90) as response:
              data=response.read();assert response.status==200
          assert data==(p/'index.html').read_bytes() and hashlib.sha256(data).hexdigest()==manifest['sha256']
          def compact(q):
              return {k:v for k,v in q.items() if k!='states'}|{'states':[s['name'] for s in q['states']],'maximumTrackedGpuBytes':max(s['frame']['performance']['trackedGpuBytes'] for s in q['states'])}
          receipt={'version':'R13.0','status':'PUBLIC_VERIFIED_USER_REVIEW_PENDING','publicVerified':True,'userVisualApproved':False,'filmGrade':False,'sourceCommit':os.environ['GITHUB_SHA'],'parentSource':'cc3038076feea701593b671665fe060608165eff','buildCommit':os.environ['PUBLIC_BUILD'],'publicUrl':os.environ['PUBLIC_URL'],'workflow':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'manifest':manifest,'publicBytesIdentical':True,'numerical':num,'browser':{'file':compact(file),'public':compact(public)},'limits':['Explicit swatch experiments, original material mode remains','Surface-proxy VF/EE contact, not every cotton fiber and not globally robust CCD','One preset central cohesive fracture path, not arbitrary remeshing','Tension-only embedded stitch cables, no needle/knot/industrial seam calibration','Additional CPU and GPU cost, not an FPS upgrade','Strength and material coefficients unmeasured; strong-interface test may stretch over15%','Software Chromium; mobile390x844 is viewport only','No full garment or person integration, as requested','Default appearance comparison is one camera, not every dynamic state','Draft only; old versions, archive, main and other workbenches untouched']}
          (p/'DELIVERY_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$PUBLIC_BUILD"
          git add denim-workshop/r13/DELIVERY_RECEIPT.json
          git commit -m 'docs(denim): verified immutable R13 swatch mechanics evidence [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: denim-r13-mechanics-evidence
          path: denim-workshop/r13
          retention-days: 14
          if-no-files-found: error
