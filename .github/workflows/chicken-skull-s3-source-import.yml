name: Chicken Skull S3 Authority Source Import

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chicken-skull-s3-source-import.yml
      - tools/chicken_skull_source_import.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-authoritative-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install import dependencies
        run: python -m pip install --upgrade requests numpy trimesh objaverse

      - name: Download, fingerprint, and license-gate sources
        run: python tools/chicken_skull_source_import.py

      - name: Upload source import evidence
        uses: actions/upload-artifact@v4
        with:
          name: CHICKEN_SKULL_S3_SOURCE_IMPORT
          path: out/chicken-skull-s3
          if-no-files-found: error
          retention-days: 7
