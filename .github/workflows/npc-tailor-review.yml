name: NPC tailor review
on:
  push:
    branches: [feature/npc-tailor-linen-fit-r1-20260915]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        route: [local, public]
    env:
      REVIEW_ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse integration modules
        run: for f in tailor/*.mjs; do node --check "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Render actual NPC and test fitting controls
        run: python tailor/tests/browser_review.py
      - name: Preserve source and evidence
        if: always()
        run: |
          mkdir -p /tmp/tailor-artifact
          git archive --format=zip HEAD -o /tmp/tailor-artifact/NPC_Tailor_Complete_Source.zip
          if [ -d tailor-review ]; then cp -r tailor-review /tmp/tailor-artifact/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-tailor-${{ matrix.route }}-source-and-review
          path: /tmp/tailor-artifact/
          retention-days: 7
