name: Deploy Bird Seagull R010 Real

on:
  push:
    branches:
      - main
    paths:
      - 'BIRD_SEAGULL_A_CHANNEL_EXECUTOR_R010/**'
      - '.github/workflows/bird-seagull-r010-real-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate R010 source
        shell: bash
        run: |
          set -euo pipefail
          dir=BIRD_SEAGULL_A_CHANNEL_EXECUTOR_R010
          test -f "$dir/index.html"
          test -f "$dir/execution-contract.json"
          test -f "$dir/data/execution-contract.js"
          test -f "$dir/runtime/contract-ui-r009.js"
          test -f "$dir/runtime/contract-ui.js"
          test -f "$dir/runtime/execution-ui.js"
          test -f "$dir/qa-r010.mjs"
          node --check "$dir/data/execution-contract.js"
          node --check "$dir/runtime/contract-ui.js"
          node --check "$dir/runtime/execution-ui.js"
          node --check "$dir/qa-r010.mjs"
          node -e "const c=require('./$dir/execution-contract.json'); if(c.version!=='R0.10'||c.interface.output.activeChannels.length!==11||c.interface.output.lockedReadOnlyChannels.length!==2||c.controlGroups.length!==5) process.exit(1)"
      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a BIRD_SEAGULL_A_CHANNEL_EXECUTOR_R010/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  live-browser-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BIRD_R010_QA_URL: ${{ needs.deploy.outputs.page_url }}?qa=${{ github.run_id }}
      BIRD_R010_QA_ROOT: artifacts/bird-r010-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed R010 on desktop and mobile
        run: node BIRD_SEAGULL_A_CHANNEL_EXECUTOR_R010/qa-r010.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bird-seagull-r010-real-live
          path: artifacts/bird-r010-live
          if-no-files-found: warn
          retention-days: 90
