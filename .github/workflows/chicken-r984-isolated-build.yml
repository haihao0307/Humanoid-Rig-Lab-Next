name: Chicken R9.8.4 Isolated Head Build

on:
  push:
    branches:
      - codex/chicken-r984-natural-head
    paths:
      - .github/workflows/chicken-r984-isolated-build.yml
      - tools/build_chicken_r984.py
      - tools/build_chicken_r984_isolated.py
      - tools/chicken_r984_override.js
      - tools/chicken_r984_isolated_head.js
      - tools/capture_chicken_r984.mjs
      - tools/check_chicken_r984_isolated.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chicken-r984-isolated-head
  cancel-in-progress: true

jobs:
  build-audit-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify R9.8.4 isolated-head source tools
        shell: bash
        run: |
          test -s tools/build_chicken_r984_isolated.py
          test -s tools/chicken_r984_isolated_head.js
          test -s tools/check_chicken_r984_isolated.mjs
          python -m py_compile tools/build_chicken_r95.py tools/build_chicken_r96.py tools/build_chicken_r98.py tools/build_chicken_r981.py tools/build_chicken_r982.py tools/build_chicken_r983.py tools/build_chicken_r984.py tools/build_chicken_r984_isolated.py
          node --check tools/chicken_r98_override.js
          node --check tools/chicken_r984_override.js
          node --check tools/chicken_r984_isolated_head.js
          node --check tools/capture_chicken_r984.mjs
          node --check tools/check_chicken_r984_isolated.mjs

      - name: Build deterministic R9.8.4 isolated-head executable
        run: python tools/build_chicken_r984_isolated.py

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.55.0

      - name: Run fixed-view browser capture
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHICKEN_R984_URL: http://127.0.0.1:8765/CHICKEN_V46_R9_8_4_NATURAL_FACE.html
          CHICKEN_R983_URL: http://127.0.0.1:8765/CHICKEN_V46_R9_8_3_CLEAN_FACE.html
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/chicken-r984-isolated-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tools/capture_chicken_r984.mjs
          node tools/check_chicken_r984_isolated.mjs

      - name: Finalize state, review board and manifest
        run: python tools/build_chicken_r984_isolated.py --finalize

      - name: Verify generated gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=[
              Path('CHICKEN_V46_R9_8_4_NATURAL_FACE.html'),
              Path('data/CHICKEN_R984_NATURAL_FACE_PARAMETERS.json'),
              Path('qa/CHICKEN_R984_STATIC_QA.json'),
              Path('qa/CHICKEN_R984_BROWSER_QA.json'),
              Path('qa/CHICKEN_R984_ISOLATED_HEAD_QA.json'),
              Path('evidence/r984/R984_REVIEW_BOARD.html'),
              Path('BUILD_MANIFEST_R984.json'),
          ]
          missing=[str(path) for path in required if not path.exists()]
          if missing: raise SystemExit(f'Missing generated files: {missing}')
          for path in [Path('qa/CHICKEN_R984_STATIC_QA.json'),Path('qa/CHICKEN_R984_BROWSER_QA.json'),Path('qa/CHICKEN_R984_ISOLATED_HEAD_QA.json')]:
              data=json.loads(path.read_text(encoding='utf-8'))
              if not data.get('passed'): raise SystemExit(f'QA failed: {path}')
          print('R9.8.4 isolated procedural head, browser, capture and integrity gates passed. Independent visual acceptance remains open.')
          PY

      - name: Upload R9.8.4 isolated-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: chicken-r984-isolated-head-${{ github.run_number }}
          path: |
            CHICKEN_V46_R9_8_4_NATURAL_FACE.html
            data/CHICKEN_R984_NATURAL_FACE_PARAMETERS.json
            qa/CHICKEN_R984_STATIC_QA.json
            qa/CHICKEN_R984_BROWSER_QA.json
            qa/CHICKEN_R984_ISOLATED_HEAD_QA.json
            evidence/r984
            BUILD_MANIFEST_R984.json
            01_CURRENT_STATE.json
            README.md
            CURRENT_HANDOFF.md
            CURRENT_FULL_HANDOFF.md
            06_NEXT_STAGE_PLAN.md
            reference/head/APPROVED_HEAD_SHAPE_REFERENCE_2026-09-15.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated R9.8.4 isolated-head candidate
        shell: bash
        run: |
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add -A \
            CHICKEN_V46_R9_8_4_NATURAL_FACE.html \
            data/CHICKEN_R984_NATURAL_FACE_PARAMETERS.json \
            qa/CHICKEN_R984_STATIC_QA.json \
            qa/CHICKEN_R984_BROWSER_QA.json \
            qa/CHICKEN_R984_ISOLATED_HEAD_QA.json \
            evidence/r984 \
            BUILD_MANIFEST_R984.json \
            01_CURRENT_STATE.json \
            README.md \
            CURRENT_HANDOFF.md \
            CURRENT_FULL_HANDOFF.md \
            06_NEXT_STAGE_PLAN.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build Chicken V4.6 R9.8.4 isolated head candidate [skip ci]"
            git pull --rebase origin codex/chicken-r984-natural-head
            git push origin HEAD:codex/chicken-r984-natural-head
          fi
