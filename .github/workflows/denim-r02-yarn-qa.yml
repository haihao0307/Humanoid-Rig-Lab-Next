name: Denim R02 Yarn and Public QA
on:
  push:
    branches: [experiment/denim-yarn-r02-20261010]
    paths:
      - 'denim-workshop/r02/_bundle/**'
      - 'denim-workshop/r02/*.js'
      - 'denim-workshop/r02/*.mjs'
      - 'denim-workshop/r02/*.cjs'
      - 'denim-workshop/r02/*.py'
      - 'denim-workshop/r02/template.html'
      - '.github/workflows/denim-r02-yarn-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: denim-r02-source-and-qa
  cancel-in-progress: false
jobs:
  yarn-public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unpack integrity-checked source and assemble standalone
        run: |
          if [ ! -f denim-workshop/r02/app.js ]; then
            python3 denim-workshop/r02/unpack.py
          fi
          python3 denim-workshop/r02/build.py
          node --check denim-workshop/r02/app.js
          (cd denim-workshop/r02 && node test-core.cjs)
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('denim-workshop/r02')
          m=json.loads((p/'BUILD_MANIFEST.json').read_text())
          assert hashlib.sha256((p/'index.html').read_bytes()).hexdigest()==m['artifactSha256']
          print('STANDALONE_SHA256',m['artifactSha256'])
          PY
      - name: Commit only R02 source, fast-forward only
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add denim-workshop/r02/core.js denim-workshop/r02/app.js denim-workshop/r02/template.html denim-workshop/r02/build.py denim-workshop/r02/qa.mjs denim-workshop/r02/test-core.cjs denim-workshop/r02/README.md denim-workshop/r02/SOURCES.md denim-workshop/r02/TASK_ANCHOR.json denim-workshop/r02/BUILD_MANIFEST.json denim-workshop/r02/denim-material-profile.schema.json denim-workshop/r02/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Build denim R02 canonical yarn source and standalone HTML'
            git push origin HEAD:experiment/denim-yarn-r02-20261010
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_URL=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/$SHA/denim-workshop/r02/index.html" >> "$GITHUB_ENV"
          echo "R02_FIXED_COMMIT=$SHA"
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real file and fixed public browser regression
        run: xvfb-run -a node denim-workshop/r02/qa.mjs
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denim-r02-yarn-browser-evidence
          path: |
            denim-r02-evidence/**
            denim-workshop/r02/core-qa.json
          retention-days: 30
          if-no-files-found: warn
      - name: Receipt
        if: success()
        run: |
          echo '## Denim R02 real-yarn candidate' >> "$GITHUB_STEP_SUMMARY"
          echo "Fixed build: ${{ steps.publish.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Local file, actual public HTTPS, real rendered crossing checks and mobile viewport passed. Film-grade and phone-hardware acceptance remain pending.' >> "$GITHUB_STEP_SUMMARY"
