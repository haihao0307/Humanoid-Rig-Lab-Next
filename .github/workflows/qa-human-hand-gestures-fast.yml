name: QA fast visible human hand gestures

on:
  push:
    branches:
      - qa/human-hand-gestures-20260920
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-fast-visible-human-hand-gestures
  cancel-in-progress: true

jobs:
  visible-gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir selenium==4.27.1 pillow==11.0.0
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          command -v xvfb-run

      - name: Build visible lightweight workbench
        id: target
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          PUBLIC_URL="https://rawcdn.githack.com/haihao0307/Humanoid-Rig-Lab-Next/${SOURCE_SHA}/index.html"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "public_url=${PUBLIC_URL}" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          from pathlib import Path

          def patch(path, marker, insertion):
              file=Path(path); data=file.read_bytes()
              if data.count(marker)!=1:
                  raise SystemExit(f'{path}: marker count {data.count(marker)}')
              file.write_bytes(data.replace(marker, marker+insertion, 1))

          patch(
              'body/CompactWorkbench.js',
              b"async function installCompactWorkbench(lab,pending){",
              b"\n  const motionVisualTest=new URLSearchParams(window.parent!==window?window.parent.location.search:location.search).has('visualTest');\n  if(motionVisualTest){pending?.catch?.(()=>{});cancelCompactSurface('fast visible gesture QA');window.__motionVisualQAFallback={active:true,renderer:'procedural-fallback',motionEvidence:true,skinApproval:false};window.__compactLoading={quality:'qa-fallback',job:'surface',state:'ready',group:'ready',message:'fast visible gesture QA',startedAt:performance.now(),updatedAt:performance.now()};lab.renderer.setQuality('fast');if(!lab.hair?.inStudio?.())lab.focus('body');needsRedraw=true;return;}"
          )
          patch(
              'control/NPCPopulation.js',
              b"  this.place(actor,position,options.yaw??0);this.pendingIds.add(id);",
              b"\n  if(new URLSearchParams(window.parent!==window?window.parent.location.search:location.search).has('visualTest')){actor.compact=null;this.pendingIds.delete(id);return actor;}"
          )
          PY
          node tools/build-pure.mjs | tee qa-build-result.json
          test "$(wc -c < index.html)" -gt 1000000

      - name: Capture three visible gestures
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          PUBLIC_URL: ${{ steps.target.outputs.public_url }}
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          QA_URL="http://127.0.0.1:8765/index.html?visualTest=1"
          for attempt in $(seq 1 40); do
            curl -fsS --connect-timeout 2 "$QA_URL" >/dev/null && break
            [[ "$attempt" == 40 ]] && exit 1
            sleep .25
          done
          timeout --signal=TERM --kill-after=15s 720s \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            python tools/motion_hand_gesture_visible_proof.py \
              --url "$QA_URL" \
              --source-sha "$SOURCE_SHA" \
              --interactive-url "$PUBLIC_URL" \
              --output gesture-visible | tee gesture-visible.log

      - name: Check visible character evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json
          from PIL import Image, ImageStat
          report_path=Path('gesture-visible/browser-run-report.json')
          if not report_path.exists():
              raise SystemExit('missing gesture report')
          data=json.loads(report_path.read_text(encoding='utf-8'))
          failures=[]; checked=[]
          for capture in data.get('captures',[]):
              raw=report_path.parent/capture['raw']
              state=capture.get('state') or {}; points=state.get('points') or {}; canvas=state.get('canvas') or {}
              with Image.open(raw) as image:
                  image=image.convert('RGB')
                  sx=image.width/max(1,float(canvas.get('clientWidth') or image.width)); sy=image.height/max(1,float(canvas.get('clientHeight') or image.height))
                  scores=[]
                  for name in ('head','rightHand','leftHand','hips'):
                      screen=(points.get(name) or {}).get('screen') or {}
                      if not screen.get('visible'): continue
                      x=int(float(screen.get('x',0))*sx); y=int(float(screen.get('y',0))*sy)
                      patch=image.crop((max(0,x-38),max(0,y-38),min(image.width,x+39),min(image.height,y+39)))
                      scores.append(sum(ImageStat.Stat(patch).stddev))
                  checked.append({'id':capture.get('id'),'scores':scores})
                  if not scores or max(scores)<12: failures.append({'id':capture.get('id'),'scores':scores})
          Path('gesture-visibility-check.json').write_text(json.dumps({'checked':checked,'failures':failures},ensure_ascii=False,indent=2),encoding='utf-8')
          if failures: raise SystemExit(str(failures))

      - name: Upload gesture evidence
        if: always() && hashFiles('gesture-visible/browser-run-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-fast-visible-hand-gestures-${{ steps.target.outputs.short_sha }}
          path: |
            gesture-visible
            gesture-visible.log
            gesture-visibility-check.json
            http-server.log
            qa-build-result.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
