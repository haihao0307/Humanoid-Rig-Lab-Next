name: Skin Final Public Recheck
on:
  push:
    branches: [feature/skin-r02-three-identities-20261008]
    paths: [.github/workflows/skin-three-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser verification
        run: |
          mkdir -p /tmp/skin-final-tools /tmp/skin-final-recheck
          cd /tmp/skin-final-tools
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
          python -m pip install pillow numpy
      - name: Verify fixed public return and unchanged R02 canvas
        env:
          NODE_PATH: /tmp/skin-final-tools/node_modules
          QA_URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/52c6590259e353b43669f2114266e17e699ee147/skin-quality-lab/r02/preview.html
        run: |
          node - <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('assert/strict');
          (async()=>{const out='/tmp/skin-final-recheck';fs.mkdirSync(out,{recursive:true});const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});const context=await browser.newContext({viewport:{width:1440,height:1040},deviceScaleFactor:1});const page=await context.newPage();page.setDefaultTimeout(120000);const errors=[],checks=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});const ready=()=>page.waitForFunction(()=>window.__SKIN_LAB__?.state.ready&&!window.__SKIN_LAB__.state.identityLoading,null,{timeout:180000});const check=(name,pass)=>{checks.push({name,pass:!!pass});assert(pass,name)};const targets={baseline:'https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/aac1c1b808141d5eb47f4d05b5d1419945de1890/skin-quality-lab/r02/preview.html',candidate:process.env.QA_URL};
          for(const [name,url]of Object.entries(targets)){await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await ready();await page.evaluate(()=>window.__SKIN_LAB__.identity.set('original'));await page.locator('#layer').selectOption('beauty');await page.locator('#lightPreset').selectOption('studio');await page.evaluate(()=>{window.__SKIN_LAB__.setCamera('portrait');window.__SKIN_LAB__.render()});await page.waitForTimeout(350);const png=await page.evaluate(()=>{window.__SKIN_LAB__.render();return document.querySelector('#viewport canvas').toDataURL('image/png')});fs.writeFileSync(out+'/'+name+'-original-canvas.png',Buffer.from(png.split(',')[1],'base64'));}
          await page.evaluate(()=>window.__SKIN_LAB__.identity.set('weathered'));
          check('Published shape calibration is locked reviewed candidate',await page.evaluate(()=>window.__SKIN_LAB__.identity.diagnostics().ageMorph.calibration==='r024-elder-shape-2'));
          await page.locator('#layer').selectOption('clay');await page.evaluate(()=>window.__SKIN_LAB__.setCamera('quarter'));await page.evaluate(()=>{document.getElementById('beardDensity').value=.57;document.getElementById('beardDensity').dispatchEvent(new Event('input'));document.getElementById('beardLength').value=1.75;document.getElementById('beardLength').dispatchEvent(new Event('input'))});await page.locator('#save').click();await page.goto('about:blank');await page.goBack({waitUntil:'domcontentloaded',timeout:120000});await ready();await page.locator('#restore').click();await page.waitForFunction(()=>window.__SKIN_LAB__.identity.current()==='weathered'&&!window.__SKIN_LAB__.state.identityLoading);const restored=await page.evaluate(()=>({recipe:window.__SKIN_LAB__.identity.report(),state:structuredClone(window.__SKIN_LAB__.state)}));check('Back then saved recipe restores identity, shape, layer and camera',restored.recipe.hair.beardDensity===.57&&restored.recipe.hair.beardLength===1.75&&restored.recipe.ageStrength===1&&restored.state.ageMorph.strength===1&&restored.state.layer==='clay'&&restored.state.camera==='quarter');check('Restored geometry view has no maps or shadows',restored.state.materialMode==='MeshStandardMaterial'&&!restored.state.materialHasMaps&&restored.state.geometryPreviewNoShadow);await page.locator('#identityMaps').click();await page.keyboard.press('Escape');check('Map dialog closes via Escape',await page.locator('#mapsDialog').evaluate(e=>!e.open));await page.locator('#layer').selectOption('beauty');check('Textured material and shadows restore',await page.evaluate(()=>window.__SKIN_LAB__.state.materialMode==='MeshPhysicalMaterial'&&!window.__SKIN_LAB__.state.geometryPreviewNoShadow));check('Original measured detail and fuzz retained',await page.evaluate(()=>{const s=window.__SKIN_LAB__.state;return s.fuzzStrands===14000&&s.assets.albedo[0]===4096&&s.assets.mesostructure[0]===4096&&s.assets.microstructure[0]===4096}));check('No shader, JavaScript or browser errors',errors.length===0);fs.writeFileSync(out+'/report.json',JSON.stringify({targets,checks,errors,restored},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          python - <<'PY'
          from PIL import Image
          import numpy as np,json
          from pathlib import Path
          p=Path('/tmp/skin-final-recheck')
          a=np.array(Image.open(p/'baseline-original-canvas.png').convert('RGBA'))
          b=np.array(Image.open(p/'candidate-original-canvas.png').convert('RGBA'))
          assert a.shape==b.shape,(a.shape,b.shape)
          d=np.abs(a.astype(int)-b.astype(int))
          r={'baseline':'aac1c1b original R02 mode','candidate':'52c6590259e353b43669f2114266e17e699ee147 original R02 mode','sameBrowserSameCamera':True,'pixels':int(a.shape[0]*a.shape[1]),'maximumChannelDifference':int(d.max()),'changedPixels':int(np.count_nonzero(np.any(d,axis=2))),'meanChannelDifference':float(d.mean())}
          (p/'pixel-regression.json').write_text(json.dumps(r,indent=2))
          print(r)
          assert r['maximumChannelDifference']==0,r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-final-public-recheck
          path: /tmp/skin-final-recheck
          retention-days: 7
