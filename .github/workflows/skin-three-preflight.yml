name: Skin Final Public Recheck
on:
  push:
    branches: [feature/skin-r02-three-identities-20261008]
    paths: [.github/workflows/skin-three-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser verification
        run: |
          mkdir -p /tmp/skin-final-tools /tmp/skin-final-recheck
          cd /tmp/skin-final-tools
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify fixed public recipe return and fibre distance stability
        env:
          NODE_PATH: /tmp/skin-final-tools/node_modules
          QA_URL: https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/8ca55abb14cf308c708cc13d17765755cbfc5aef/skin-quality-lab/r02/preview.html
        run: |
          node - <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),assert=require('assert/strict');
          (async()=>{const dir='/tmp/skin-final-recheck';fs.mkdirSync(dir,{recursive:true});const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});const page=await browser.newPage({viewport:{width:1440,height:1040},deviceScaleFactor:1});const errors=[],checks=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});const ready=()=>page.waitForFunction(()=>window.__SKIN_LAB__?.state.ready&&!window.__SKIN_LAB__.state.identityLoading,null,{timeout:180000});const check=(name,pass)=>{checks.push({name,pass:!!pass});assert(pass,name)};await page.goto(process.env.QA_URL,{waitUntil:'domcontentloaded',timeout:120000});await ready();await page.evaluate(()=>window.__SKIN_LAB__.identity.set('weathered'));await page.evaluate(()=>window.__SKIN_LAB__.setCamera('portrait'));const view=await page.evaluate(()=>window.__SKIN_LAB__.camera());for(const [i,dx]of [-.0012,0,.0012,0].entries()){await page.evaluate(({view,dx})=>window.__SKIN_LAB__.setView([view.position[0]+dx,view.position[1],view.position[2]],view.target),{view,dx});await page.waitForTimeout(300);await page.screenshot({path:dir+'/portrait-motion-'+i+'.png'});}await page.evaluate(()=>{document.getElementById('beardDensity').value=.57;document.getElementById('beardDensity').dispatchEvent(new Event('input'));document.getElementById('beardLength').value=1.75;document.getElementById('beardLength').dispatchEvent(new Event('input'));});await page.locator('#save').click();const before=await page.evaluate(()=>window.__SKIN_LAB__.identity.report());await page.goto('about:blank');await page.goBack({waitUntil:'domcontentloaded',timeout:120000});await ready();await page.locator('#restore').click();await page.waitForFunction(()=>window.__SKIN_LAB__.identity.current()==='weathered'&&!window.__SKIN_LAB__.state.identityLoading);const restored=await page.evaluate(()=>window.__SKIN_LAB__.identity.report());check('Back reload then explicit saved recipe restore',restored.id===before.id&&restored.hair.beardDensity===.57&&restored.hair.beardLength===1.75);await page.locator('#identityMaps').click();await page.keyboard.press('Escape');check('Map dialog Escape closes',await page.locator('#mapsDialog').evaluate(e=>!e.open));await page.evaluate(()=>window.__SKIN_LAB__.identity.set('original'));await page.evaluate(()=>window.__SKIN_LAB__.setCamera('portrait'));await page.waitForTimeout(500);await page.screenshot({path:dir+'/original-final.png'});check('Original keeps 14000 fuzz and 4K scan',await page.evaluate(()=>{const s=window.__SKIN_LAB__.state;return s.fuzzStrands===14000&&s.assets.albedo[0]===4096&&s.assets.mesostructure[0]===4096&&s.assets.microstructure[0]===4096}));check('No shader or browser errors',errors.length===0);fs.writeFileSync(dir+'/report.json',JSON.stringify({url:process.env.QA_URL,checks,errors,visualMotionReview:'Four real portrait frames retained for review; no automated claim of production temporal stability.'},null,2));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-final-public-recheck
          path: /tmp/skin-final-recheck
          retention-days: 7
