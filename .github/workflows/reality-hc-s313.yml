name: Reality S3.13 adaptive preflight experiment
on:
  push:
    branches: [feature/reality-hc-s313-adaptive-preflight-20261022]
    paths: [.github/workflows/reality-hc-s313.yml, reality-lab/hc-s3-13/RUN_REQUEST.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      url: ${{ steps.freeze.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            reality-lab/hc-s3-7
            reality-lab/hc-s3-11
            reality-lab/hc-s3-12
            reality-lab/hc-s3-13
      - name: Verify bounded source changes and reset current evidence
        run: |
          git fetch --filter=blob:none --depth=1 origin 2d26e832b0f0dbf0590b7444efdad3ba869b6947
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,shutil,ast
          r=Path('reality-lab/hc-s3-13');changed=subprocess.check_output(['git','diff','--name-only','2d26e832b0f0dbf0590b7444efdad3ba869b6947','HEAD'],text=True).splitlines()
          assert changed and all(p.startswith('reality-lab/hc-s3-13/') or p=='.github/workflows/reality-hc-s313.yml' for p in changed),changed
          for p in r.glob('*.py'):ast.parse(p.read_text(),filename=str(p))
          shutil.rmtree(r/'qa',ignore_errors=True);(r/'qa').mkdir()
          (r/'qa/SCOPE.json').write_text(json.dumps({'passed':True,'changedPaths':changed,'originalProductionChanged':False,'otherCandidateBranchesModified':False},indent=2))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: rf312-fixtures-and-native-toolkit
          run-id: 39570430770
          github-token: ${{ github.token }}
          path: _fixtures
      - name: Exact-source staging and actual repeated endpoint searches
        env:
          RF313_MESH_CONTACT: ${{ github.workspace }}/_fixtures/hc-s3-12/_toolkit/mesh-contact.mjs
        run: |
          python reality-lab/hc-s3-13/prepare.py
          node reality-lab/hc-s3-13/evaluate.mjs _fixtures/hc-s3-12/qa/fixtures reality-lab/hc-s3-13/RESULT.json
          node reality-lab/hc-s3-13/tests.mjs reality-lab/hc-s3-13/RESULT.json _fixtures/hc-s3-12/qa/fixtures reality-lab/hc-s3-13/qa/TESTS.json
          python reality-lab/hc-s3-13/build.py
      - name: Install pinned independent browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify standalone actual geometry and all controls
        run: python reality-lab/hc-s3-13/browser.py
      - name: Freeze verified experiment page, not a contact fix
        id: freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=Path('reality-lab/hc-s3-13')
          for n in ['qa/SCOPE.json','qa/ASSEMBLY.json','qa/TESTS.json','qa/file/BROWSER.json']:assert json.loads((r/n).read_text())['passed'],n
          x=json.loads((r/'RESULT.json').read_text());assert x['status']=='HOLD_NO_ACCEPTABLE_LOCAL_MOVE' and not x['fullMotionExecuted']
          PY
          EXPECTED=$(git rev-parse HEAD)
          git fetch --filter=blob:none --depth=1 origin feature/reality-hc-s313-adaptive-preflight-20261022
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f reality-lab/hc-s3-13/BUILD_MANIFEST.json reality-lab/hc-s3-13/SUMMARY.json reality-lab/hc-s3-13/preview.html reality-lab/hc-s3-13/qa/SCOPE.json reality-lab/hc-s3-13/qa/ASSEMBLY.json reality-lab/hc-s3-13/qa/TESTS.json reality-lab/hc-s3-13/qa/file/BROWSER.json reality-lab/hc-s3-13/qa/file/*.png
          git commit -m 'build(reality): freeze S3.13 true scope-preflight searches and rejected-trial viewer'
          git push origin HEAD:refs/heads/feature/reality-hc-s313-adaptive-preflight-20261022
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=https://htmlpreview.github.io/?https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/$SHA/reality-lab/hc-s3-13/preview.html" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf313-experiment-and-build
          path: |
            reality-lab/hc-s3-13/RESULT.json
            reality-lab/hc-s3-13/BUILD_MANIFEST.json
            reality-lab/hc-s3-13/SUMMARY.json
            reality-lab/hc-s3-13/preview.html
            reality-lab/hc-s3-13/qa/
          retention-days: 30
  public:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          sparse-checkout: reality-lab/hc-s3-13
      - name: Verify public immutable bytes
        env:
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          RF313_URL: ${{ needs.build.outputs.url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json,hashlib,time,os
          r=Path('reality-lab/hc-s3-13');m=json.loads((r/'BUILD_MANIFEST.json').read_text());url='https://raw.githubusercontent.com/haihao0307/Humanoid-Rig-Lab-Next/'+os.environ['BUILD_SHA']+'/reality-lab/hc-s3-13/preview.html'
          for i in range(12):
            try:b=urllib.request.urlopen(url,timeout=90).read();break
            except Exception:
              if i==11:raise
              time.sleep(3)
          assert len(b)==m['html']['bytes'] and hashlib.sha256(b).hexdigest()==m['html']['sha256']
          q=r/'qa/public';q.mkdir(parents=True,exist_ok=True);(q/'PUBLIC_BYTES.json').write_text(json.dumps({'passed':True,'url':os.environ['RF313_URL'],'sourceCommit':m['sourceCommit'],'publicCommit':os.environ['BUILD_SHA'],'html':m['html']},indent=2))
          PY
      - name: Install pinned public browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Fixed HTTPS actual interaction checks
        env:
          RF313_URL: ${{ needs.build.outputs.url }}
          RF313_QA: ${{ github.workspace }}/reality-lab/hc-s3-13/qa/public
        run: python reality-lab/hc-s3-13/browser.py
      - name: Persist exact delivery and failure boundary
        env:
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          RF313_URL: ${{ needs.build.outputs.url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,datetime
          r=Path('reality-lab/hc-s3-13');m=json.loads((r/'BUILD_MANIFEST.json').read_text());s=json.loads((r/'SUMMARY.json').read_text());t=json.loads((r/'qa/TESTS.json').read_text());f=json.loads((r/'qa/file/BROWSER.json').read_text());p=json.loads((r/'qa/public/BROWSER.json').read_text())
          assert t['passed'] and f['passed'] and f['fileVerified'] and p['passed'] and p['publicVerified']
          d={'version':'REALITY-HC-S3.13','status':'PREFLIGHT_INTEGRATION_AND_VIEWER_VERIFIED_CONTACT_REPAIR_HOLD','sourceCommit':m['sourceCommit'],'publicCommit':os.environ['BUILD_SHA'],'fixedURL':os.environ['RF313_URL'],'workflowRun':os.environ['GITHUB_RUN_ID'],'html':m['html'],'fixtureRun':m['fixtureRun'],'rawReportSHA256':m['rawReportSHA256'],'rulesChecks':t['count'],'fileBrowserChecks':len(f['checks']),'publicBrowserChecks':len(p['checks']),'actualFrozenCases':3,'orderedRunsPerCase':['original','adaptive','adaptive','original'],'summary':s['summary'],'localMovesAccepted':0,'sourceWritten':False,'newMotionSequenceExecuted':False,'sourceRuntimeInstalled':False,'originalProductionChanged':False,'fitCertified':False,'continuousCollisionCertified':False,'userVisualAccepted':False,'physicalDeviceTested':False,'next':'Use sampled-contact reachability and edge-deformation constraints together during mobile-set selection and step computation. Do not enlarge the displacement cap to hide the documented first-linearization conflict. Revalidate the same frozen states before any full-motion candidate run.','verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (r/'DELIVERY.json').write_text(json.dumps(d,ensure_ascii=False,indent=2));(r/'TASK_STATE.json').write_text(json.dumps({'taskId':'RF01-S3.13-ADAPTIVE-PREFLIGHT-20261022','status':d['status'],'fixedURL':d['fixedURL'],'sourceCommit':d['sourceCommit'],'publicCommit':d['publicCommit'],'contactFixed':False,'nextAction':d['next'],'productionChanged':False},ensure_ascii=False,indent=2));print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          git fetch --filter=blob:none --depth=1 origin feature/reality-hc-s313-adaptive-preflight-20261022
          test "$(git rev-parse FETCH_HEAD)" = "$BUILD_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f reality-lab/hc-s3-13/DELIVERY.json reality-lab/hc-s3-13/TASK_STATE.json reality-lab/hc-s3-13/qa/public/BROWSER.json reality-lab/hc-s3-13/qa/public/PUBLIC_BYTES.json reality-lab/hc-s3-13/qa/public/*.png
          git commit -m 'docs(reality): persist public preflight integration evidence while keeping contact repair on HOLD'
          git push origin HEAD:refs/heads/feature/reality-hc-s313-adaptive-preflight-20261022
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf313-public-evidence
          path: reality-lab/hc-s3-13/qa/public/
          retention-days: 30
