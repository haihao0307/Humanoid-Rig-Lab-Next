name: QA real Compact human hand actions

on:
  push:
    branches:
      - qa/human-hand-actions-20260920
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-real-compact-human-hand-actions
  cancel-in-progress: true

jobs:
  visible-hand-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir selenium==4.27.1 pillow==11.0.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth fonts-noto-cjk
          command -v google-chrome || command -v google-chrome-stable || command -v chromium

      - name: Build real reconstructed-character workbench
        id: target
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          PUBLIC_URL="https://rawcdn.githack.com/haihao0307/Humanoid-Rig-Lab-Next/${SOURCE_SHA}/index.html"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "public_url=${PUBLIC_URL}" >> "$GITHUB_OUTPUT"

          node tools/build-pure.mjs --check
          python - <<'PY'
          from pathlib import Path

          def patch(path, marker, insertion):
              file=Path(path); data=file.read_bytes()
              if data.count(marker)!=1:
                  raise SystemExit(f'{path}: marker count {data.count(marker)}')
              file.write_bytes(data.replace(marker, marker+insertion, 1))

          # Keep the real Compact body. Hair is outside this hand-action review.
          patch(
              'body/CompactWorkbench.js',
              b"function scheduleCompactHair(lab){",
              b"\n  if(new URLSearchParams(window.parent!==window?window.parent.location.search:location.search).has('visualTest')){lab.hairStatus={state:'disabled'};return;}"
          )
          # The active mother owns the reviewed Compact surface. Avoid spending
          # reconstruction time on the four inactive review-cast residents.
          patch(
              'control/NPCPopulation.js',
              b"  this.place(actor,position,options.yaw??0);this.pendingIds.add(id);",
              b"\n  if(new URLSearchParams(window.parent!==window?window.parent.location.search:location.search).has('visualTest')){actor.compact=null;if(options.identity)actor.identity={residentId:String(options.identity.residentId||id).slice(0,64),displayName:String(options.identity.displayName||actor.label).slice(0,24),role:String(options.identity.role||'general').slice(0,48)};this.pendingIds.delete(id);return actor;}"
          )
          PY

          node tools/build-pure.mjs | tee qa-build-result.json
          test "$(wc -c < index.html)" -gt 1000000
          sha256sum index.html | tee qa-entrypoint-hash.txt

      - name: Run all real-character hand-action captures
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          PUBLIC_URL: ${{ steps.target.outputs.public_url }}
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          QA_URL="http://127.0.0.1:8765/index.html?visualTest=1"
          for attempt in $(seq 1 40); do
            curl -fsS --connect-timeout 2 "$QA_URL" >/dev/null && break
            [[ "$attempt" == 40 ]] && exit 1
            sleep .25
          done

          timeout --signal=TERM --kill-after=15s 2400s \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            python tools/motion_hand_interaction_visible_proof.py \
              --url "$QA_URL" \
              --source-sha "$SOURCE_SHA" \
              --interactive-url "$PUBLIC_URL" \
              --output all-hand-actions | tee all-hand-actions.log

      - name: Require real Compact renderer evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json
          report_path=Path('all-hand-actions/browser-run-report.json')
          if not report_path.exists():
              raise SystemExit('missing hand-action report')
          data=json.loads(report_path.read_text(encoding='utf-8'))
          failures=[]; checks={}
          for section in ('startup','pushReload'):
              block=data.get(section) or {}
              real=block.get('realCompact') or {}
              compact=real.get('compact') or {}
              scene=block.get('proofScene') or {}
              scene_compact=scene.get('compact') or {}
              checks[section]={'compact':compact,'sceneCompact':scene_compact}
              for label,value in [('visible',compact.get('visible')),('boundToActive',compact.get('boundToActive')),('scene.visible',scene_compact.get('visible')),('scene.boundToActive',scene_compact.get('boundToActive'))]:
                  if value is not True: failures.append(f'{section}.{label}={value!r}')
              for label,value in [('chunks',compact.get('chunks',0)),('triangles',compact.get('triangles',0)),('scene.chunks',scene_compact.get('chunks',0)),('scene.triangles',scene_compact.get('triangles',0))]:
                  if not isinstance(value,(int,float)) or value<=0: failures.append(f'{section}.{label}={value!r}')
          if data.get('status') not in {'CAPTURED','CAPTURED_WITH_FAILURES'}:
              failures.append('capture status='+str(data.get('status')))
          captures=data.get('captures') or []
          if len(captures)<6: failures.append('capture count='+str(len(captures)))
          for capture in captures:
              raw=report_path.parent/capture.get('raw','')
              if not raw.is_file() or raw.stat().st_size<50000:
                  failures.append('missing/small image '+str(raw))
          result={'status':data.get('status'),'scenarioFailures':data.get('scenarioFailures') or [],'checks':checks,'captures':[c.get('id') for c in captures],'failures':failures}
          Path('real-compact-check.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          if failures: raise SystemExit('\n'.join(failures))

      - name: Upload real hand-action evidence
        if: always() && hashFiles('all-hand-actions/browser-run-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-real-compact-human-hand-actions-${{ steps.target.outputs.short_sha }}
          path: |
            all-hand-actions
            all-hand-actions.log
            real-compact-check.json
            http-server.log
            qa-build-result.json
            qa-entrypoint-hash.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
