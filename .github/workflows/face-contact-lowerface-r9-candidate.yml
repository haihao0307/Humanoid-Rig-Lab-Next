name: Face neutral oral seal lower-face R9 candidate
# refined after browser review of the inner oral return

on:
  push:
    branches:
      - feature/human-face-workbench-v1-20260915
    paths:
      - .github/workflows/face-contact-lowerface-r9-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: face-contact-lowerface-r9-candidate
  cancel-in-progress: true

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-face-workbench-v1-20260915
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply R9 candidate
        run: python3 tools/apply-face-contact-lowerface-r9-candidate.py
      - name: Refine lip border and inner mucosa
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          face=Path('body/FaceAnatomy.js')
          text=face.read_text(encoding='utf-8')
          replacements={
            "whiteRollUpper:.00006,whiteRollLower:.00002,whiteRollCentre:1.040,whiteRollWidth:.052":"whiteRollUpper:.00002,whiteRollLower:.000005,whiteRollCentre:1.030,whiteRollWidth:.038",
            "return (1.-smoothstep(.94,1.12,radial))*smoothstep(0.,.24,1.-abs(q.x));":"return (1.-smoothstep(1.02,1.22,radial))*smoothstep(0.,.24,1.-abs(q.x));",
            "float planeTone=p.y>q.y?.92:1.02;\n    return vec3(.90,.68,.77)*(planeTone+.045*variation);":"float planeTone=p.y>q.y?.92:1.02,outerGate=smoothstep(.1862,.1882,p.z);\n    vec3 outer=vec3(.90,.68,.77)*(planeTone+.045*variation),inner=vec3(.54,.30,.35)*(1.+.025*variation);\n    return mix(inner,outer,outerGate);",
            "return -.000075*(compactLipGrooves(uv,23.,seed)+.22*compactLipGrooves(uv,47.,seed+31.))*compactLipPigment(p);":"float outerGate=smoothstep(.1894,.1901,p.z),openingGate=1.-smoothstep(.04,.18,compactLipOpen);\n    return -.000075*(compactLipGrooves(uv,23.,seed)+.22*compactLipGrooves(uv,47.,seed+31.))*compactLipPigment(p)*outerGate*openingGate;"
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'R9 visual correction anchor mismatch: {old!r}, count={count}')
              text=text.replace(old,new,1)
          old_inner="""    for(let i=0;i<=lp.columns;i++)for(let j=0;j<=rows;j++){
      const x=lp.centreX+lp.halfWidth*(-.998+1.996*i/lp.columns),t=j/rows,e=.00005,a=sub(innerPoint(x+e,t),innerPoint(x-e,t)),b=sub(innerPoint(x,Math.min(1,t+.0001)),innerPoint(x,Math.max(0,t-.0001)));
      let normal=norm(cross(b,a));if(!upper)normal=mul(normal,-1);lipP.push(...innerPoint(x,t));lipN.push(...compactEyeEncodeNormal(normal));
    }
"""
          new_inner="""    for(let i=0;i<=lp.columns;i++)for(let j=0;j<=rows;j++){
      const x=lp.centreX+lp.halfWidth*(-.998+1.996*i/lp.columns),t=j/rows,q=compactLipOutline(x),angle=t*Math.PI/2;
      // The inherited skin sampler is intentionally excluded from inner-return
      // normals. Its submillimetre triangle gradients created false vertical
      // bands that looked like teeth when the lips opened.
      const normal=norm([-.10*q.u*Math.sin(angle),upper?-Math.cos(angle):Math.cos(angle),-Math.sin(angle)]);
      lipP.push(...innerPoint(x,t));lipN.push(...compactEyeEncodeNormal(normal));
    }
"""
          if text.count(old_inner)!=1:
              raise SystemExit('R9 inner-return normal anchor mismatch')
          text=text.replace(old_inner,new_inner,1)
          face.write_text(text,encoding='utf-8',newline='\n')

          check=Path('tools/check-face-anatomy.mjs')
          value=check.read_text(encoding='utf-8')
          old="source.includes('whiteRollUpper:.00006')"
          new="source.includes('whiteRollUpper:.00002')"
          if value.count(old)!=1:
              raise SystemExit('R9 white-roll source contract anchor mismatch')
          value=value.replace(old,new,1)
          source_anchor="check(source.includes('const chinLo=1.4270,chinHi=1.4495')&&source.includes('compactLipContactShadow')&&source.includes('compactLipOpen<.025'),'lower-face Hermite bed, nonuniform contact shadow and closed-mouth cavity gate are explicit');"
          if value.count(source_anchor)!=1:
              raise SystemExit('R9 open-mouth striping contract anchor mismatch')
          value=value.replace(source_anchor,source_anchor+"\n check(source.includes('openingGate=1.-smoothstep(.04,.18,compactLipOpen)')&&source.includes('upper?-Math.cos(angle):Math.cos(angle)'),'open-mouth fallback suppresses microgrooves and inner-return normals are independent of noisy source triangles');",1)
          check.write_text(value,encoding='utf-8',newline='\n')
          PY
      - name: Build and validate candidate
        run: |
          node tools/build-pure.mjs
          node tools/check-pure.mjs
          node tools/check-eye-anatomy.mjs --parameter-fixtures
          node tools/check-face-anatomy.mjs --parameter-fixtures
          node tools/test-face-profile-separation.mjs
          node tools/test-face-identity-landmarks.mjs
          node tools/test-face-review-entry.mjs
          node tools/test-npc-face-uniforms.mjs
          node tools/test-face-startup.mjs
      - name: Install isolated browser runtime
        run: |
          mkdir -p /tmp/face-r9-browser
          cd /tmp/face-r9-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture fixed review views
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hrl-face-r9-server.log 2>&1 &
          mkdir -p visual-review-r9
          cat >/tmp/face-r9-browser/capture.cjs <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--use-gl=angle','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:1600,height:1200},deviceScaleFactor:1});
            const page=await context.newPage(),consoleMessages=[],pageErrors=[];
            page.on('console',message=>consoleMessages.push({type:message.type(),text:message.text()}));
            page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
            await page.goto('http://127.0.0.1:4173/index.html?review=face',{waitUntil:'domcontentloaded',timeout:120000});
            let frame=null;const deadline=Date.now()+420000;
            while(!frame&&Date.now()<deadline){for(const candidate of page.frames()){if(await candidate.evaluate(()=>Boolean(window.HumanLab?.face?.closeup)).catch(()=>false)){frame=candidate;break;}}if(!frame)await page.waitForTimeout(1000);}
            if(!frame)throw Error('Face review frame unavailable');
            await frame.waitForFunction(()=>window.__compactLoading?.state==='ready'&&window.__humanStartup?.status==='ready',null,{timeout:420000});
            await frame.waitForTimeout(5000);
            const canvas=frame.locator('canvas').first();await canvas.waitFor({state:'visible',timeout:30000});
            const capture=async path=>{const box=await canvas.boundingBox();if(!box)throw Error('Canvas bounds unavailable');await page.screenshot({path,clip:box,animations:'disabled'});};
            for(const view of ['front','side','lips']){
              await frame.evaluate(v=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup(v);window.HumanLab.render();},view);
              await frame.waitForTimeout(1500);
              await capture(`visual-review-r9/face-r9-${view}.png`);
            }
            await frame.evaluate(()=>{window.HumanLab.face.setWeight('lipPart',.72);window.HumanLab.face.closeup('lips');window.HumanLab.render();});
            await frame.waitForTimeout(1500);
            await capture('visual-review-r9/face-r9-lip-part.png');
            await frame.evaluate(()=>{window.HumanLab.face.clearExpression();window.HumanLab.face.closeup('front');window.HumanLab.render();});
            const runtime=await frame.evaluate(()=>{
              const face=window.HumanLab.face.report(),compact=window.HumanLab.compact?.report,gl=document.querySelector('canvas')?.getContext('webgl2');
              return {review:window.HumanLab.review,startup:window.__humanStartup,compactLoading:window.__compactLoading,eyeAnatomy:compact?.eyeAnatomy,faceAnatomy:compact?.faceAnatomy,separation:face.separation,limitedNodes:face.limitedNodes,renderer:{frames:window.HumanLab.renderer?.frames,drawCalls:window.HumanLab.renderer?.drawCalls,webglError:gl?gl.getError():null,contextLost:gl?gl.isContextLost():null}};
            });
            if(runtime.faceAnatomy?.revision!=='r13-neutral-oral-seal-lower-face')throw Error('Unexpected R9 face revision');
            if(runtime.eyeAnatomy?.revision!=='r14-procedural-iris-lid-integration')throw Error('Eye production revision regressed');
            if(runtime.startup?.status!=='ready'||runtime.review?.singleActor!==true)throw Error('Review entry did not become naturally ready');
            if(runtime.renderer.webglError!==0||runtime.renderer.contextLost||pageErrors.length)throw Error('Browser or WebGL error detected');
            fs.writeFileSync('visual-review-r9/face-r9-diagnostics.json',JSON.stringify({runtime,consoleMessages,pageErrors,browserExecuted:true,visualAcceptance:false,productionReady:false},null,2)+'\n');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          NODE_PATH=/tmp/face-r9-browser/node_modules node /tmp/face-r9-browser/capture.cjs
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-contact-lowerface-r9-candidate
          path: visual-review-r9
          if-no-files-found: warn
          retention-days: 7
