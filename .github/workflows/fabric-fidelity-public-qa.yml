name: Fabric fidelity public browser QA
on:
  push:
    branches: ['preview/fabric-fidelity-r1-20261007']
    paths:
      - 'previews/fabric-fidelity-r1/**'
      - '.github/workflows/fabric-fidelity-public-qa.yml'
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: previews/fabric-fidelity-r1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: Verify public HTTPS rendering and interactions
        run: python previews/fabric-fidelity-r1/qa_public.py
      - name: Preserve actual browser screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-public-browser-evidence
          path: previews/fabric-fidelity-r1/qa-public/
          retention-days: 30
