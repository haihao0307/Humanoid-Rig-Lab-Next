name: Task integration checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'body/CrowdIntersectionCoordinator.js'
      - 'body/NaturalLocomotion.js'
      - 'control/NPCPopulation.js'
      - 'world/GridNavigation.js'
      - 'source/**'
      - 'tools/check-open-intersection.mjs'
      - 'tools/check-pure.mjs'
      - 'tools/build-pure.mjs'
      - 'tools/test-npc-*.mjs'
      - 'tools/traffic-recovery-fixture.json'
      - 'tools/test-grid-navigation-*.mjs'
      - 'tools/test-task-crowd-browser.mjs'
      - '.github/workflows/task-integration-file-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the audited generator/compressor version across build hosts.
          node-version: '24.14.0'
      - name: Verify generated entrypoint and source contracts only
        run: |
          node tools/build-pure.mjs --check
          node tools/check-pure.mjs
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Queue, resource and lease state regressions (mock task execution)
        run: |
          node tools/test-npc-persistent.mjs
          node tools/test-npc-traffic-lifecycle.mjs
          node tools/test-npc-intersection-escape.mjs
          node tools/test-npc-task-selection-bridge.mjs
          node tools/test-npc-target-reservations.mjs
          node tools/test-npc-resource-circulation.mjs
      - name: Real navigation and motion kernel regressions (no browser or GPU)
        run: |
          node tools/test-grid-navigation-batch.mjs
          node tools/test-grid-navigation-sweep.mjs
          node tools/test-npc-traffic-wait.mjs
          node tools/test-npc-four-way-crossing.mjs
          node tools/test-npc-four-way-crossing.mjs --pause-owner
          node tools/test-npc-four-way-crossing.mjs --review-cast
          node tools/test-npc-four-way-crossing.mjs --camp-layout
          node tools/test-npc-corridor-active-yield.mjs
          node tools/test-npc-corridor-active-yield.mjs --skew-clocks
          node tools/test-npc-corridor-active-yield.mjs --blocked-retreat
