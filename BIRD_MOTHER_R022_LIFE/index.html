<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Bird Mother R0.22｜海鸥生命活动工作台</title><style>html,body{height:100%;margin:0;background:#071117;color:#e7f1f1;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}section{max-width:720px;border:1px solid #31505a;background:#0d1d24;padding:24px;border-radius:14px}p{color:#a9bdc1;line-height:1.65}pre{white-space:pre-wrap;color:#ffaca3}</style></head><body><main><section><h1>Bird Mother R0.22 · 海鸥生命活动工作台</h1><p id="s">正在读取函数鸟体 1/6……</p><pre id="e" hidden></pre></section></main><script>(async()=>{const s=document.getElementById('s'),e=document.getElementById('e');try{if(!('DecompressionStream'in window))throw new Error('浏览器不支持 DecompressionStream，请使用新版 Chrome 或 Edge。');let b='';for(let i=0;i<6;i++){s.textContent=`正在读取函数鸟体 ${i+1}/6……`;const r=await fetch(`parts/part-${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});if(!r.ok)throw new Error(`数据缺失：${r.url} (${r.status})`);b+=(await r.text()).trim()}const x=atob(b),z=new Uint8Array(x.length);for(let i=0;i<x.length;i++)z[i]=x.charCodeAt(i);const d=[...new Uint8Array(await crypto.subtle.digest('SHA-256',z))].map(v=>v.toString(16).padStart(2,'0')).join('');if(d!=='9846e268e4b2f43bde2c70578e85d75f92524587c08f4dee60df90c71f57f856')throw new Error(`数据校验失败：${d}`);s.textContent='校验通过，正在启动……';const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(err){s.textContent='R0.22 启动失败';e.hidden=false;e.textContent=err&&err.stack?err.stack:String(err)}})();</script></body></html>
