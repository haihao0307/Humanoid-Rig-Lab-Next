<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bird Mother R0.22P</title><style>html,body{height:100%;margin:0;background:#071318;color:#eaf4f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}section{max-width:720px;padding:24px;border:1px solid #29505a;border-radius:14px;background:#0b1d24}h1{font-size:21px}p{line-height:1.6;color:#a9bec3}i{display:block;width:18%;height:6px;background:#69d8c2;border-radius:6px;animation:a 1s ease-in-out infinite alternate}.bar{background:#18343d;border-radius:6px;overflow:hidden}pre{white-space:pre-wrap;color:#ffb5a8}@keyframes a{to{transform:translateX(455%)}}</style></head><body><main><section><h1>海鸥生命活动工作台 R0.22P</h1><div class="bar"><i></i></div><p id="s">正在读取函数几何、表面曲线和生命动作……</p><pre id="e" hidden></pre></section></main><script>(async()=>{let s=document.getElementById('s'),e=document.getElementById('e');try{if(!('DecompressionStream'in window))throw Error('浏览器不支持 DecompressionStream，请使用新版 Chrome、Edge、Safari 或 Firefox。');let x='';for(let i=0;i<3;i++){s.textContent=`正在读取数据 ${i+1}/3……`;let r=await fetch(`payload/part-${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});if(!r.ok)throw Error(`数据分片缺失：${r.status}`);x+=await r.text()}let b=atob(x.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);let h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',u))].map(v=>v.toString(16).padStart(2,'0')).join('');if(h!=='07ba6ad3530cb6c219ab163ff13832ffc41647bc5161c606ccb61763e055b3a1')throw Error('压缩数据哈希不一致');s.textContent='校验通过，正在启动……';let html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text(),hh=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)))].map(v=>v.toString(16).padStart(2,'0')).join('');if(hh!=='d67b6610c81571c5ce4d4b77c26514cebe084c4d1c279a0f1d8285f47e910f6f')throw Error('工作台哈希不一致');document.open();document.write(html);document.close()}catch(err){s.textContent='启动失败';e.hidden=false;e.textContent=err&&err.stack?err.stack:String(err)}})();</script></body></html>
